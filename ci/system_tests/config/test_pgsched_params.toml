[tests]

  krb5_realm = "TEST.CTA"

  [tests.catalogue_schema_update]

    # Leave empty to have it checkout the destination version (tag needs to exist)
    # Set it to a commit if the tag has not been created yet
    schema_checkout_ref = ""

  [tests.gfal]

    file_count    = 2000
    file_size_kb  = 10
    process_count = 20

  [tests.stress]

    # Total number of files to archive.  num_dirs is derived automatically as
    # ceil(total_files / num_files_per_dir) so it stays within the EOS-safe 50 k
    # files/dir limit.  Override at CI trigger time via the num-stress-files input.
    # File size is kept at 16 bytes; the effective tape footprint is ~470 bytes/file
    # (data block + per-file tape header overhead), giving ~4.7 GB total on tape for the
    # full 10 M run — trivially small on the fast-ssd PVC backing the fake tape library.
    total_files       = 10000000
    num_files_per_dir = 50000
    # file size in bytes
    file_size = 16
    # number of parallel processes to be used for archival
    io_threads = 40
    # Files per batch when enqueueing work (beneficial for large file counts as it should reduce queue contention)
    batch_size = 200
    # Write files in 1MB chunks instead of a single write (useful for large files, several MBs)
    write_files_in_chunks      = false
    check_copy_interval_sec    = 20
    check_archive_interval_sec = 10
    # Stop waiting after this many consecutive 10-second intervals without progress.
    # 6 intervals (60 s) gives the retrieve pipeline enough startup time (queue
    # cache TTL 5 s + mount delay 5 s + first-file pipeline latency).
    max_no_progress_intervals = 6
    # Maximum acceptable file loss percentage before proceeding to retrieval
    max_acceptable_loss_percent = 5.0

    [tests.stress.prequeue]

      # If true, put drives down before archiving and only put them up after
      # prequeue_fraction × total_files files are created.  This gives the
      # scheduler a large backlog before the first tape mount so all drives
      # stay busy from the start.
      enabled = true

      # Fraction of total_files that must be queued before drives come up.
      # 0.9 → 9 M of 10 M files queued before drives start, last 1 M queued
      # while drives are already transferring.
      prequeue_fraction = 0.9

      # Expected EOS archive-queue throughput used to derive the drive-up
      # timeout: timeout = (prequeue_fraction × total_files / eos_queue_rate_hz)
      #                    × timeout_margin_factor
      eos_queue_rate_hz    = 1000
      timeout_margin_factor = 1.2

      # Check every 2 min so drives come up promptly once the threshold is crossed.
      check_interval_sec = 120

    # -----------------------------------------------------------------------
    # Virtual stress-drive mode (no mhvtl, no real SCSI hardware).
    # These settings are used by setup_stress_drives_test.py to prepare the
    # CTA catalogue and the shared tmpfs tape library.
    # They must be consistent with the drive list in the Helm preset
    # stress-stressdrives-pgsched-values.yaml.
    # -----------------------------------------------------------------------
    [tests.stress.drives]

      # Number of virtual tapes to register in the CTA catalogue.
      # Must match mediaTypes[].count in fake-tape-library/values.yaml.
      # With 50 MB tapes and 10 M files: ~94 tapes needed; 120 gives ample headroom.
      num_tapes = 120

      # VID prefix: tapes are named <vid_prefix><4-digit index>, e.g. ST0001..ST0020.
      # Must be at most 2 characters so that the full VID fits in the 6-character
      # ANSI tape label VSN field (VOL1).  HeaderChecker::checkVOL1() compares the
      # label VSN to the catalogue VID and throws if they differ.
      # Must be unique across all tape pools in the catalogue.
      vid_prefix = "ST"

      # Logical library name that stress drives and tapes are registered under.
      # Must match logicalLibraryName in the Helm preset drives list.
      logical_library = "stress-lib"

      # Shared tmpfs root directory mounted into every taped pod via hostPath.
      # The setup test creates tapes/ and drives/ subdirectories here.
      base_dir = "/dev/shm/cta-stress"

      # Simulated tape capacity in bytes reported to the CTA catalogue.
      # Must match capacityBytes in fake-tape-library/values.yaml.
      # Exact value: 80 (VOL1) + 5 × 20000 × 496 (bytes/file) = 49 600 080.
      # See capacityBytes in fake-tape-library/values.yaml for the derivation.
      tape_capacity_bytes = 49600080  # ≈49.6 MB, exact 5-batch boundary
