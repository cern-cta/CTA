# Preserve the endpoints used by CTA, Prometheus scraping and namespace cleanup.
prometheus:
  enabled: true
  extraScrapeConfigs: |
    - job_name: "otel-collector"
      static_configs:
        - targets:
          - otel-opentelemetry-collector:8889

  rbac:
    create: true

  alertmanager:
    enabled: false

  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    enabled: true

  # We want to get metrics on CPU/memory usage
  prometheus-node-exporter:
    fullnameOverride: prometheus-prometheus-node-exporter
    enabled: true

  prometheus-pushgateway:
    enabled: false

  server:
    fullnameOverride: prometheus-server
    global:
      scrape_interval: 15s
      scrape_timeout: 3s

    persistentVolume:
      enabled: false

otel:
  enabled: true
  fullnameOverride: otel-opentelemetry-collector
  image:
    repository: registry.cern.ch/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.129.1

  # Note that this is just for a simple single-node deployment
  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s

    exporters:
      prometheus:
        endpoint: ${env:MY_POD_IP}:8889
        # Ensures all resource-level attributes becomes metric-level attributes
        # We lose the service.instance.id during aggregation, so without doing
        # this we have no way to correlate the metric to the resource
        resource_to_telemetry_conversion:
          enabled: true

    service:
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - prometheus

      extensions:
        - health_check
  ports:
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
