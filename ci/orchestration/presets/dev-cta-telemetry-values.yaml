# These values can be combined with other values files.
# The frontends share one configuration; the tape-path services differ only in reader cadence.
frontend-wfe: &telemetry
  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 5000
            timeout: 4000
            exporter:
              otlp_http:
                endpoint: http://otel-opentelemetry-collector:4318/v1/metrics
                timeout: 1000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

frontend-admin: *telemetry

# Tape-path services keep the 2 s interval but need a workable reader timeout: at the frontends'
# 100 ms even a lightly loaded in-cluster collector is too slow, the export is dropped silently,
# and after a few minutes of drops the exporter expires the metric. This shows up as soon as taped
# runs many pods. 1.5 s leaves a sane window and still satisfies timeout < interval.
#
# Everything else - endpoint, encoding - is identical to the block above; see the note there on
# why it is repeated rather than referenced.
taped: &tapePathTelemetry
  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 2000
            timeout: 1500
            exporter:
              otlp_http:
                endpoint: http://otel-opentelemetry-collector:4318/v1/metrics
                timeout: 1000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

maintd: *tapePathTelemetry
rmcd: *tapePathTelemetry
