# These values can be combined with other values files.
# All five services share the same telemetry configuration.
frontend-wfe: &telemetry
  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 2000
            timeout: 100
            exporter:
              otlp_http:
                endpoint: http://otel-opentelemetry-collector:4318/v1/metrics
                timeout: 1000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

frontend-admin: *telemetry
maintd: *telemetry
rmcd: *telemetry
taped: *telemetry
