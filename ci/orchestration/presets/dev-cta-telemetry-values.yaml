# Note that this values can be used in combination with other values files
frontend-wfe: &frontend
  conf:
    telemetry:
      enabled: true
      retainInstanceIdOnRestart: false
      metrics:
        backend: "OTLP_HTTP"
        exportInterval: 1000
        exportTimeout: 500
        otlp:
          endpoint: "http://otel-opentelemetry-collector:4318/v1/metrics"

frontend-admin: *frontend

taped:
  conf:
    telemetry:
      enabled: true
      retainInstanceIdOnRestart: true
      metrics:
        backend: "OTLP_HTTP"
        exportInterval: 1000
        exportTimeout: 500
        otlp:
          endpoint: "http://otel-opentelemetry-collector:4318/v1/metrics"

maintd: &runtimeTelemetry
  # Once all the services support declarative config
  # this will be moved to a global config for all services
  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 2000
            # Under scale-test load the collector can take >100 ms to respond.
            # timeout must be < interval (2000 ms); 1500 ms leaves 500 ms margin.
            timeout: 1500
            exporter:
              otlp_http:
                endpoint: http://otel-opentelemetry-collector:4318/v1/metrics
                timeout: 1000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

rmcd: *runtimeTelemetry
