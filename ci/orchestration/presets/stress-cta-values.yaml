global:
  # Keep crash evidence in a pod volume for stress-run investigation; copy it before deleting the pod.
  extraVolumes:
    volumes:
      - name: coredumps
        emptyDir: {}
    volumeMounts:
      - name: coredumps
        mountPath: /var/log/tmp

frontend-admin:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"

frontend-wfe:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"

taped:
  conf:
    taped:
      # Avoid verbose tape-operation logs dominating the small-file workload.
      logMask: "WARNING"

maintd:
  logging:
    # Reduce routine logging overhead while retaining warnings and errors.
    level: "WARNING"
