global:
  # Keep crash evidence in a pod volume for stress-run investigation
  extraVolumes:
    volumes:
      - name: coredumps
        emptyDir: {}
    volumeMounts:
      - name: coredumps
        mountPath: /var/log/tmp

frontend-admin:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"
    schedulerdb:
      # Re-enable the scheduler caches, which the chart defaults disable for faster functional tests.
      tapeCacheMaxAgeSecs: 1
      retrieveQueueCacheMaxAgeSecs: 1

frontend-wfe:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"
    schedulerdb:
      # Re-enable the scheduler caches, which the chart defaults disable for faster functional tests.
      tapeCacheMaxAgeSecs: 1
      retrieveQueueCacheMaxAgeSecs: 1

taped:
  logging:
    # Avoid verbose tape-operation logs dominating the small-file workload.
    level: "WARNING"
  scheduler:
    # Re-enable the scheduler caches, which the chart defaults disable for faster functional tests.
    tapeCacheMaxAgeSecs: 1
    retrieveQueueCacheMaxAgeSecs: 1

maintd:
  logging:
    # Reduce routine logging overhead while retaining warnings and errors.
    level: "WARNING"
  scheduler:
    # Re-enable the scheduler caches, which the chart defaults disable for faster functional tests.
    tapeCacheMaxAgeSecs: 600
    retrieveQueueCacheMaxAgeSecs: 10
