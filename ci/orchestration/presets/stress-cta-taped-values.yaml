#
# Taped telemetry overlay for scale tests using virtual VtlDrives.
# Applied by create_instance.sh when --no-hardware-drives is combined with
# --local-telemetry or --publish-telemetry.
#
# Why exportInterval must be increased
# ------------------------------------
# With 100 taped pods each exporting every 1 s (CI default), the OTel collector
# (local) or the CERN MONIT endpoint (published) receives ~100 OTLP HTTP POSTs
# per second. Under this load, responses frequently exceed the 500 ms default
# exportTimeout, causing the OTel SDK to time out the export. The metric is
# dropped for that interval. If exports fail for a full Prometheus scrape cycle
# (15 s), Grafana shows a gap.
#
# Setting interval = 15 s (matching the Prometheus scrape cycle) reduces the
# collector load to ~7 req/s and ensures each scrape window contains exactly
# one fresh export per pod. No data is lost: OTel cumulative counters carry
# the full lifetime value, so a skipped 1-s sub-window is never missed.
#
# OTel declarative-config constraint: the periodic reader's timeout must be
# < interval. With interval 15000 we set timeout 13000, giving the endpoint
# up to 13 s to respond before the SDK gives up — far more lenient than the
# 500 ms default.
#
# Relationship with ci-cta-telemetry-values.yaml
# ----------------------------------------------
# That file sets interval/timeout to 1000/500 for short CI runs (main default).
# This file is applied AFTER it in extra_cta_chart_flags for virtual-drive
# tests, so its values win. Regular mhvtl stress (no --no-hardware-drives)
# keeps the 1 s / 500 ms CI default unchanged.

taped:
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 15000
            timeout: 13000
            exporter:
              otlp_http:
                endpoint: http://otel-opentelemetry-collector:4318/v1/metrics
                timeout: 10000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram
