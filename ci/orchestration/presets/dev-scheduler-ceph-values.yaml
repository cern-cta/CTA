global:
  scheduler:
    backend: ceph
    existingSecret: cta-ceph-scheduler-conf

maintd:
  routines:
    garbageCollect:
      replicas: 1
      sleepIntervalSecs: 1
    queueCleanup:
      replicas: 1
      sleepIntervalSecs: 1
      batchSize: 500
