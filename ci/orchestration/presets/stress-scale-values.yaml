#
# Overlay for stress tests using virtual VtlDrives instead of mhvtl/real hardware.
# Works with any scheduler backend (objectstore or pgsched).
#
# Prerequisites
# -------------
# Deploy the virtual-tape-library chart first to create the PVC and populate it:
#
#   helm upgrade --install virtual-tape-library \
#     ci/orchestration/helm/virtual-tape-library/ \
#     -f <your-library-values.yaml>
#
# Usage:
#
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-values.yaml \
#     -f presets/stress-scale-values.yaml
#
# What this preset does
# ---------------------
#   - Tunes taped for virtual drives: small buffer pool, single disk thread,
#     large fetch batches aligned to tape capacity, relaxed cache TTLs, and
#     underfill-driven dismount tuned for this test's batch size (see the
#     underfill block below for why disabling it outright is a real bug, not
#     a convenience).
#   - Disables rmcd (no StatefulSet deployed; taped never contacts it for
#     virtual drives, and /dev/smc does not exist on a node without mhvtl).
#
# Drive list and extraVolumes are generated dynamically by
# create_instance.sh --no-hardware-drives; do not define drives here.
#
# No node affinity or hostPath volume is required: the PVC is managed by the
# cluster storage class and can be accessed from any node. On single-node
# clusters (laptop, kind, k3s) the default ReadWriteOnce access mode is fine.
# For multi-node clusters use a ReadWriteMany storage class in the
# virtual-tape-library chart values.
#
# Config schema: this file uses the post-!1498 TOML-backed helm chart layout
# (transfers.*/scheduler.*/logging.*/rmcd.*). The pre-rebase branch used
# the old .conf-style `conf.taped.*` keys; those were translated as:
#   bufferCount                 -> transfers.bufferCount
#   nbDiskThreads               -> transfers.diskIoThreads
#   logMask                     -> logging.level
#   archiveFetchBytesFiles      -> transfers.archive.{fetchMaxBytes,fetchMaxFiles}
#   retrieveFetchBytesFiles     -> transfers.retrieve.{fetchMaxBytes,fetchMaxFiles}
#   archiveFlushBytesFiles      -> transfers.archive.{flushMaxBytes,flushMaxFiles}
#   tapeCacheMaxAgeSecs         -> scheduler.tapeCacheMaxAgeSecs
#   retrieveQueueCacheMaxAgeSecs-> scheduler.retrieveQueueCacheMaxAgeSecs
#   archiveDismountPolicy       -> transfers.archive.underfill.{watchPeriodSecs,
#                                   minimumSamples, startThresholdPercent,
#                                   recoveryThresholdPercent}

taped:
  logging:
    # Raised from WARNING to INFO for this debugging session: needed to see
    # ArchiveMount::reportJobsBatchTransferred()'s exception detail (logged at
    # ERR, already visible at WARNING - this is for broader INFO-level context
    # around the "move archive back to pending" / reportJobsBatchTransferred
    # burst investigation, e.g. per-flush timing/outcome logs). Revert to
    # WARNING once the investigation concludes - INFO is noticeably more
    # verbose across 100 drives.
    level: "INFO"

  # Scale-test OTel export stagger: each of the 100 taped pods sleeps a
  # deterministic fraction of 10 s (hash(hostname) % 10) in an initContainer
  # before the main container starts. This spreads OTel exporter boot times
  # evenly over 10 s, so subsequent export cycles at the 15 s interval set
  # above do not all hit the collector at the same wall-clock instant.
  # The stagger range stays below the export
  # interval, so every scrape window still contains at least one fresh export
  # from every pod.
  # Set to 0 in any overlay to disable.
  startup:
    staggerMaxSeconds: 10

  transfers:
    # Buffer pool. Costs bufferCount * bufferSizeBytes of RAM per taped pod: the pool is per
    # drive session (MigrationMemoryManager/RecallMemoryManager are instantiated inside the
    # data-transfer pipeline, not shared across drives).
    #
    # bufferSizeBytes CANNOT be reduced to match the stress tests' 16-byte files, tempting as it
    # looks. The tape block size is hardcoded to 256 KB in TapeWriteTask::openFileWriter() and
    # recorded in the UHL1 label; on retrieve, Payload::append() refuses to read a block into a
    # buffer smaller than the block size the label declares, so anything below 256 KB fails every
    # retrieve with a MemException. It is therefore pinned to the tape block size here, explicitly,
    # so that this is not rediscovered the hard way.
    #
    # That makes each in-flight file cost a full 256 KB buffer whatever its size, so bufferCount is
    # the only lever: 64 * 256 KB = 16 MB per drive, against 51 MB at the chart default of 200.
    # Depth needed is small - at 250 files/s per drive with diskIoThreads=1 a disk read completes
    # in 1-3 ms and a 16-byte file occupies exactly one buffer, so at most ~15 are in flight - and
    # 64 keeps a 4x margin over that. Worth trimming because the in-memory tape already costs
    # ~200 MB per pod at batchesPerTape: 10 and the taped pods have no memory limit.
    bufferCount: 64
    bufferSizeBytes: 262144
    # 1 disk-I/O thread per drive keeps XRootD connection count proportional
    # to drive count, keeping EOS lightly loaded
    # (T_query ~1 ms/file -> ~1000 files/sec/drive).
    diskIoThreads: 1

    archive:
      # fetchMaxFiles and the tape capacity are co-designed. The drive pipelines the next fetch
      # while writing the current batch and nothing limits a fetch to the tape's remaining
      # space, so when ENOSPC ends the session every job already fetched but not yet written is
      # re-queued - about one fetch batch per tape boundary, whatever the tape size. The
      # virtual-tape-library chart therefore DERIVES the capacity as
      #   vol1Bytes + batchesPerTape * batchFiles * logicalBytesPerFile
      # which keeps a tape an exact whole number of these batches; at its batchesPerTape: 10 the
      # re-queued tail is a tenth of a tape, and at 10 M files over 100 drives (~100 000 files
      # per drive, half a tape) most drives never reach a boundary at all.
      #
      # Keep batchFiles in virtual-tape-library/values.yaml equal to fetchMaxFiles here.
      fetchMaxBytes: 80000000000
      fetchMaxFiles: 20000
      # flushMaxFiles decoupled from fetchMaxFiles (debugging the 05:25-05:27 scheddb_stress
      # waiting bursts, which correlate with drives unmounting): suspected cause is
      # ArchiveMount::reportJobsBatchTransferred() reporting a 20 000-file batch to EOS's WFE in
      # one XRootD call - if that throws for ANY reason (one bad file is enough), every job in
      # the batch falls back to MigrationReportPacker's per-job path
      # (ArchiveRdbJob::failTransfer -> requeueJobToMount -> requeueFailedJob), each issuing its
      # own individual "move archive back to pending" query - turning one failure into up to
      # 20 000 single-row DB calls instead of 1 bulk call. A smaller flush bounds that worst case
      # without changing total throughput: at maxWriteRateHz=250/drive, flush size does not gate
      # the aggregate file-report rate (that is fixed by the write throttle at 100 x 250 =
      # 25 000 files/s regardless of flush size) - it only changes how that work is chunked into
      # EOS report calls. 2000 (10x smaller) means one call every 8 s per drive, 12.5 calls/s
      # aggregate across 100 drives, each covering 2000 files - still 25x above the 1 kHz floor,
      # and bounds a single EOS/catalogue failure to 2000 individual fallback queries instead of
      # 20 000. If EOS WFE is still the bottleneck at this size, halve it again rather than
      # chasing 1 - too small trades the opposite way (per-call overhead dominating).
      # fetchMaxFiles is unaffected: it is co-designed with the tape-capacity derivation above and
      # with G_max/ageForCollectionSecs further below, neither of which depend on flush size.
      flushMaxBytes: 80000000000
      flushMaxFiles: 2000
      # Underfill-driven dismount MUST stay enabled here. A mounted drive -
      # idle or not - counts toward the VO's writeMaxDrives cap
      # (Scheduler::getExistingAndNextMounts() counts any drive whose status is
      # in {Starting,Mounting,Transferring,Unloading,Unmounting,DrainingToDisk,
      # CleaningUp}; a drive waiting on an empty fetch queue stays Transferring,
      # so it still counts). With 100 drives sharing one VO at writeMaxDrives:
      # 100, a drive that keeps a tape mounted after it runs out of work to
      # write occupies a slot that a DIFFERENT drive - one that just dismounted
      # and has fresh work queued - cannot get: the mount decision refuses it
      # once existingMountsBasicTypeForThisVo >= maxDrives, even though the
      # occupying drive is doing nothing. startThresholdPercent: 0 (the
      # previous setting here) disables the mechanism entirely - every
      # fetch response satisfies "fillRatio >= 0" - so once the initial
      # backlog drains, idle drives never let go of their slot and new work
      # can only start when a drive happens to hit real ENOSPC. That produces
      # exactly the bursty, mostly-idle pattern this is meant to fix: a
      # handful of drives processing at a time while the other ~90 sit
      # mounted and idle, throughput collapsing to a fraction of 100 drives'
      # worth of work.
      #
      # 20% / 40% with the 300 s / 3-sample hysteresis below: a single
      # fetch returning fewer files than requested (normal when supply is
      # bursty) does not trigger a dismount by itself - only a fill ratio
      # below 20% sustained for 300 s across at least 3 fetch responses does,
      # which only happens when the queue has genuinely gone dry for minutes,
      # not during ordinary unevenness in upload rate. recoveryThresholdPercent
      # (40%) is deliberately well above the start threshold so a single
      # decent-sized fetch cancels the observation outright, rather than the
      # drive hovering near the boundary and dismounting on noise.
      underfill:
        watchPeriodSecs: 300
        minimumSamples: 3
        startThresholdPercent: 20
        recoveryThresholdPercent: 40

    retrieve:
      fetchMaxBytes: 80000000000
      fetchMaxFiles: 20000

  scheduler:
    # Drives refresh tape status at most once per 60 s. A tape switch
    # (ENOSPC -> new tape) clears the cache explicitly, so mount latency
    # after a tape boundary is unaffected.
    tapeCacheMaxAgeSecs: 60
    # 5 s guarantees drives discover the retrieve queue within 5 s of it
    # becoming non-empty (critical for retrieve test correctness).
    retrieveQueueCacheMaxAgeSecs: 5
    # Override of stress-cta-pgsched-values.yaml's numberOfConnections: 3, for this job only - the
    # non-scale stress test does not have enough drives for this to matter. At 100 drives, 3 each
    # means 300 scheduler-side client connections through pgbouncer, against a pgbouncer
    # default_pool_size of 100 backend connections in session pooling mode: only the first ~33
    # drives (100 / 3) can ever hold a connection, the rest queue in pgbouncer forever. 2 per drive
    # still exceeds the 100-connection budget (200 > 100) - this alone does not fix the exhaustion,
    # pgbouncer's pool_mode/default_pool_size needs fixing too - but it lowers the floor of what a
    # given pgbouncer capacity can serve, and reduces the DB-side connection count taped itself has
    # to hold open for a workload that is 1 archive-mount + 1 retrieve-mount per drive at a time.
    numberOfConnections: 2

  # NOTE: there used to be a catalogue.numberOfConnections override here. It was removed:
  # taped's catalogue connection count is hardcoded to 1 in C++ (taped/TapedApp.cpp:
  # `const uint64_t nbConns = 1;`), never read from config, and its [catalogue] TOML schema
  # (cta::runtime::CatalogueConfig = BasicCatalogueConfig<NoClientConfig>) has no
  # number_of_connections field at all. Rendering that field into cta-taped.toml made every
  # taped pod fail to start ("Unknown field 'number_of_connections'") - there is no config lever
  # here, taped always uses exactly 1 catalogue connection, regardless of drive count.

# cta_catalogue connection budget: taped (100 pods x 1, hardcoded, see the note above) + maintd
# (7 active routine pods x 1, also hardcoded - MaintdApp.cpp: `ConnectionOptions connections
# {1, 1};` - see the equivalent note under maintd's routines below) + frontend-wfe/frontend-admin
# (2 pods x 5, see below - this one IS a real, working override: both call
# service_resources::makeConnectionOptions(), which actually reads catalogue.client.
# number_of_connections, unlike taped/maintd) = 117, leaving 3 of this environment's
# 120-connection ceiling spare.
frontend-wfe:
  conf:
    catalogue:
      numberOfConnections: 5

frontend-admin:
  conf:
    catalogue:
      numberOfConnections: 5

# No tape library hardware present: disable rmcd entirely.
# /dev/smc does not exist on a node without mhvtl; deploying rmcd would fail.
rmcd:
  enabled: false

maintd:
  routines:
    # Reduced from 2 replicas / batchSize 8000 to 1 replica / batchSize 1500: the EOS MGM was
    # observed marking filesystems unavailable (fsid=3, fsid=5) under this test's load.
    # Scheduler::reportArchiveJobsBatch() (scheduler/Scheduler.cpp) fires EVERY job in a batch as
    # an unthrottled concurrent asyncReport() call in a tight loop, THEN waits on all of them -
    # batchSize is not just "rows fetched per DB round-trip", it is ALSO "simultaneous XrdCl RPCs
    # launched against the MGM at once". At the previous 8000 x 2 replicas, that was up to 16 000
    # concurrent report RPCs in a single burst every pass - a far more plausible cause of the FST
    # unavailability than anything on the taped/WFE side (see docs/content/dev/guides/testing/
    # stress-tests.md and this file's taped.catalogue comment for the ruled-out alternatives).
    # 1500 x 1 replica caps that burst at 1500, a >10x reduction.
    #
    # iterSleepMs=500ms paces the inner loop inside one execute() pass
    # (DiskReportArchiveRoutine.cpp): with sustained backlog, each pass is dominated by this
    # sleep (fetch+report time is small next to 500 ms), so one pod completes ~2 passes/sec.
    # At batchSize 1500: 1500 x 2 = 3000 files/s max per pod - with only 1 replica now, that IS
    # the aggregate, 3x the 1 kHz floor this job targets, with large margin to spare. (The
    # previous comment's "500 reports/s/pod x 2 replicas = 1 kHz" sizing assumed 2 replicas and a
    # much larger batch; both have changed, so that derivation no longer applies - this one
    # replaces it.)
    diskReportArchive:
      replicas: 1
      batchSize: 1500
      iterSleepMs: 500
    diskReportRetrieve:
      replicas: 1
      batchSize: 1500
      iterSleepMs: 500
    # Repack is not used in scale tests; disable to avoid unnecessary DB polls
    # and free scheduler connections for the active archive/retrieve workload.
    repackExpand:
      replicas: 0
    repackReport:
      replicas: 0
    # Repack is not exercised by the scale test either, so its queue cleanups have nothing to
    # collect: zero replicas rather than two pods polling empty REPACK_* tables.
    repackActiveQueueCleanup:
      replicas: 0
    repackPendingQueueCleanup:
      replicas: 0
    # The user queue cleanups stay enabled - they are what returns the jobs of a mount which
    # stopped fetching - with a cadence derived from this test's own mount cycle rather than from
    # the dev defaults.
    #
    # The timings this is aligned to (see virtual-tape-library/values.yaml and transfers.* above,
    # at the scale job's 250 files/s per drive):
    #   T_batch  = fetchMaxFiles / rate = 20 000 / 250        =  80 s  one fetch batch
    #   T_tape   = batchesPerTape x T_batch = 10 x 80 s        = 800 s  one tape
    #   T_change = mountDelayMaxMs (worst case, not average) ~  90 s  tape change at ENOSPC
    #   T_cycle  = T_tape + T_change                          ~ 890 s  mount to mount
    #   G_max    = T_batch + T_change                         ~ 170 s  longest gap between two
    #                                                                  fetches of a HEALTHY drive
    #
    # T_change uses the jitter's CEILING (mountDelayMaxMs), not its average: G_max is a bound a
    # healthy drive must never exceed, and a single real tape change can draw anywhere up to that
    # ceiling, not just the average case. Using the average here would intermittently misclassify
    # a healthy drive that happens to draw a long delay as dead. This was 40 s (close to this
    # file's old mountDelayMaxMsOverride-less [15 s, 60 s] average of 37.5 s, not its ceiling
    # either) before the mount-delay jitter was widened to [5 s, 90 s] elsewhere in this file -
    # recompute this block again if that range changes.
    #
    # ageForCollectionSecs is compared against MOUNT_QUEUE_LAST_FETCH.LAST_UPDATE_TIME, which a
    # drive refreshes on every fetch, so it must exceed G_max or a live mount is declared dead and
    # its jobs are taken away mid-session. It must also stay well inside T_cycle, or a drive whose
    # mount really did die keeps its work reserved for longer than writing a whole tape takes,
    # while the other 99 drives starve waiting for it.
    #
    # age = 2 x G_max = 340 s satisfies both: twice the headroom a healthy drive needs, and a
    # full turnaround (age + poll <= 400 s) well inside one mount cycle (890 s, a 2.2x margin).
    # The dev preset's 120 s pending age is below G_max at this write rate, and its 1800 s / 900 s
    # active settings fire roughly once per run, which is also why the active-queue cleanup is
    # near-invisible in the dashboards.
    #
    # G_max depends on the fetch batch, the write rate, and the mount-delay jitter ceiling - not
    # on the tape size or total_files - so recompute this only if STRESS_WRITE_RATE_HZ,
    # fetchMaxFiles, or the mount-delay jitter override changes: keep age >= 2 x G_max.
    #
    # The active-queue group also runs ResubmitInactiveReportingRoutine on the same age, so a
    # report batch left flagged IS_REPORTING by a failed attempt is retried within ~5 min instead
    # of the ~30-45 min the dev settings give it.
    #
    # batchSize is the LIMIT of one cleanup pass, and one pass runs per poll - the routine does
    # not loop internally. It has to exceed the number of rows a single dead mount leaves behind,
    # for a reason beyond throughput: handleInactiveMountActiveQueueRoutine() only calls
    # cleanMountLastFetchTimes() on a pass that moves ZERO rows, so a dead mount is retired from
    # MOUNT_QUEUE_LAST_FETCH only once its queue is fully drained. Undersized, the same dead
    # mounts are rescanned as candidates on every pass forever - which is exactly the symptom in
    # the dashboards: constant "update inactive mount in pending queue" traffic and no
    # "delete mount_last_fetch_times" at all.
    #
    # Rows left by one dead mount:
    #   MigrationTaskInjector fetches 2 x fetchMaxFiles on its first call, so the in-flight set
    #   in the ACTIVE queue is up to 2 x 20 000 = 40 000 rows. The PENDING queue can hold the same
    #   number for that mount: requeueJobBatch(keepMountId = true) returns a job that failed
    #   inside a mount to PENDING with its MOUNT_ID intact, so if every job of a batch fails they
    #   all land there under the dead mount.
    #
    # 50 000 covers that worst case with headroom while staying a sane single UPDATE (the
    # statement is an indexed UPDATE ... FROM (SELECT ... LIMIT n FOR UPDATE SKIP LOCKED)). One
    # pass then drains a dead mount and the next retires it. Throughput is 50 000 / 60 s ~ 833
    # rows/s per queue, so even the pathological case - all 100 drives dying at once with full
    # batches, ~4 M rows - is recovered in ~80 min rather than never. Raise the poll rate rather
    # than the batch if that ever needs to be faster: bigger single transactions compete with the
    # 100 drives hammering the same tables.
    userActiveQueueCleanup: &scaleCleanup
      replicas: 1
      sleepIntervalSecs: 60
      batchSize: 50000
      ageForCollectionSecs: 340
    userPendingQueueCleanup: *scaleCleanup

  # NOTE: there used to be a catalogue.numberOfConnections override here too. Also removed, same
  # reason as taped's above: maintd/MaintdApp.cpp hardcodes
  # `service_resources::ConnectionOptions connections {1, 1};` for every routine pod regardless of
  # config, and MaintdConfig's [catalogue] TOML schema has no number_of_connections field to
  # render into in the first place. No config lever here either - maintd always uses exactly 1
  # catalogue connection per pod.
