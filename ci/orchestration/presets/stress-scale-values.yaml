#
# Overlay for stress and scale tests using virtual StressDrives instead of
# mhvtl/real hardware.  Works with any scheduler backend (objectstore or pgsched).
#
# Why StressDrive instead of mhVTL
# ---------------------------------
#
#   Property             mhVTL                  StressDrive / VirtualDrive
#   Backend              SCSI target (kernel)   Filesystem directory (PVC)
#   Tiny-file latency    High (SCSI + driver)   Minimal (direct file I/O)
#   Drive count          Limited by SCSI tgts   Unlimited (in-process)
#   CI node setup        Kernel module needed   Zero (any k8s node)
#   Mount delay          Fixed, hardware-speed  Configurable / jittered
#   Suitable for         Hardware-fidelity       Metadata & scale tests
#
# Architecture
# ------------
# Virtual tapes are binary files (*.tape) on a PVC shared by all taped pods.
# The virtual-tape-library Helm chart pre-populates the PVC with the directory
# layout and library.toml configuration before taped starts.
#
# PVC layout (one PVC per logical library, mounted at /cta-stress-lib-{i}):
#
#   config/<lib>/library.toml             — library name, changer timeout, and
#                                           per-media-type properties
#   contents/<lib>/slots/VID.tape         — tape at rest (empty file = blank)
#   contents/<lib>/changer/VID.tape       — tape in transit (robot holds it)
#   contents/<lib>/changer/.lock          — robot-busy flag (O_CREAT|O_EXCL)
#   contents/<lib>/drives/<drv>/          — empty = no tape loaded
#   contents/<lib>/drives/<drv>/VID.tape  — tape mounted in this drive
#
# Mount sequence:
#   1. MediaChangerFacade renames VID.tape: slots/ → changer/ → drives/<drv>/
#      (serialised through .lock so only one tape moves at a time).
#   2. StressDrive::waitUntilReady() finds the *.tape file, reads the
#      per-media-type capacity and mountDelayMs from library.toml, sleeps a
#      jittered delay, then deserialises the binary block stream into RAM.
#   3. Transfers run entirely in-memory via VirtualDrive block I/O.
#   4. StressDrive::unloadTape() serialises the in-memory tape back to the
#      *.tape file (atomic tmp+rename), then marks the drive empty.
#   5. MediaChangerFacade renames VID.tape: drives/<drv>/ → changer/ → slots/.
#
# Prerequisites
# -------------
# Deploy the virtual-tape-library chart first to create and populate the PVC:
#
#   helm upgrade --install virtual-tape-library \
#     ci/orchestration/helm/virtual-tape-library/ \
#     -f <your-library-values.yaml>
#
# Usage
# -----
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-values.yaml \
#     -f presets/stress-scale-values.yaml
#
# What this preset does
# ---------------------
#   - Tunes taped for virtual drives: small buffer pool, single disk thread,
#     fetch batches co-designed with tape capacity to avoid partial-batch
#     requeues, relaxed cache TTLs, and disabled underfill-driven dismounting.
#   - Disables rmcd (/dev/smc does not exist without mhvtl).
#
# Drive list and extraVolumes are generated dynamically by
# create_instance.sh --no-hardware-drives; do not define drives here.
#
# No node affinity is required: the PVC is managed by the cluster storage class
# and accessible from any node.  On single-node clusters (laptop, kind, k3s)
# ReadWriteOnce is sufficient; multi-node clusters need a ReadWriteMany class.

taped:
  conf:
    taped:
      # bufferCount is per drive session (MigrationMemoryManager is instantiated
      # inside DataTransferSession, not shared across drives).  With bufferSizeBytes=262144
      # (256 KB helm default): 200 × 256 KB = 51.2 MB per drive, 5.1 GB for 100 drives.
      # 200 gives ample pipeline depth: at 1000 files/sec per drive, nbDiskThreads=1
      # reads complete in 1-3 ms each, so 5-15 buffers are in flight at any time.
      bufferCount: 200
      # DiskReadThreadPool is created per drive session (not shared across drives).
      # 1 thread per drive keeps XRootD connection count proportional to drive count,
      # keeping EOS lightly loaded (T_query ~1 ms/file -> ~1000 files/sec/drive).
      nbDiskThreads: 1
      logMask: "WARNING"

      # Batch size and tape capacity are co-designed to avoid partial-batch requeues.
      # logical_bytes_per_file = 6×80 + file_size; for file_size=16: 496 bytes/file.
      # capacityBytes (virtual-tape-library/values.yaml) = 80 (VOL1) + 3 × 20000 × 496
      #   = 29 760 080 bytes -> exactly 3 full batches/tape.
      # ENOSPC fires on HDR1 of the first file of batch 4 -> zero partial-batch requeue
      # at tape boundaries, so no files are unnecessarily re-queued to the scheduler.
      # If you change this batch size you MUST update capacityBytes in
      # virtual-tape-library/values.yaml to keep it an exact multiple of the new batch.
      archiveFetchBytesFiles: "80000000000, 20000"
      retrieveFetchBytesFiles: "80000000000, 20000"
      # Align flush granularity with the fetch batch so exactly one "update archive"
      # DB query fires per 20 000-file fetch batch instead of one per 200 files.
      archiveFlushBytesFiles: "80000000000, 20000"

      # tapeCacheMaxAgeSecs: drives refresh tape status at most once per 60 s.
      # A tape switch (ENOSPC -> new tape) clears the cache explicitly via
      # clearStatisticsCache(), so mount latency after a tape boundary is unaffected.
      tapeCacheMaxAgeSecs: 60
      # retrieveQueueCacheMaxAgeSecs: 5 s guarantees drives discover the retrieve
      # queue within 5 s of it becoming non-empty (critical for retrieve test correctness).
      retrieveQueueCacheMaxAgeSecs: 5

      # startThreshold=0 disables underfill-driven dismounting: in stress tests the
      # frontend queueing rate is the bottleneck, so drives always appear underfilled
      # between file batches.  Keeping drives mounted avoids unnecessary remount delays.
      # Format: "watchPeriodSecs, minSamples, startThreshold%, recoveryThreshold%"
      archiveDismountPolicy: "300, 3, 0, 1"

# No tape library hardware present: disable rmcd entirely.
# /dev/smc does not exist on a node without mhvtl; deploying rmcd would fail.
rmcd:
  enabled: false

maintd:
  routines:
    # Repack is not used in scale tests; disable to avoid unnecessary DB polls
    # and free scheduler connections for the active archive/retrieve workload.
    repackExpand:
      replicas: 0
    repackReport:
      replicas: 0
