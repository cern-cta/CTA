#
# Overlay for stress tests using virtual VtlDrives instead of mhvtl/real hardware.
# Works with any scheduler backend (objectstore or pgsched).
#
# Prerequisites
# -------------
# Deploy the virtual-tape-library chart first to create the PVC and populate it:
#
#   helm upgrade --install virtual-tape-library \
#     ci/orchestration/helm/virtual-tape-library/ \
#     -f <your-library-values.yaml>
#
# Usage:
#
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-values.yaml \
#     -f presets/stress-scale-values.yaml
#
# What this preset does
# ---------------------
#   - Tunes taped for virtual drives: small buffer pool, single disk thread,
#     large fetch batches aligned to tape capacity, relaxed cache TTLs, and
#     underfill-driven dismount tuned for this test's batch size (see the
#     underfill block below for why disabling it outright is a real bug, not
#     a convenience).
#   - Disables rmcd (no StatefulSet deployed; taped never contacts it for
#     virtual drives, and /dev/smc does not exist on a node without mhvtl).
#
# Drive list and extraVolumes are generated dynamically by
# create_instance.sh --no-hardware-drives; do not define drives here.
#
# No node affinity or hostPath volume is required: the PVC is managed by the
# cluster storage class and can be accessed from any node. On single-node
# clusters (laptop, kind, k3s) the default ReadWriteOnce access mode is fine.
# For multi-node clusters use a ReadWriteMany storage class in the
# virtual-tape-library chart values.
#
# Config schema: this file uses the post-!1498 TOML-backed helm chart layout
# (transfers.*/scheduler.*/logging.*/rmcd.*). The pre-rebase branch used
# the old .conf-style `conf.taped.*` keys; those were translated as:
#   bufferCount                 -> transfers.bufferCount
#   nbDiskThreads               -> transfers.diskIoThreads
#   logMask                     -> logging.level
#   archiveFetchBytesFiles      -> transfers.archive.{fetchMaxBytes,fetchMaxFiles}
#   retrieveFetchBytesFiles     -> transfers.retrieve.{fetchMaxBytes,fetchMaxFiles}
#   archiveFlushBytesFiles      -> transfers.archive.{flushMaxBytes,flushMaxFiles}
#   tapeCacheMaxAgeSecs         -> scheduler.tapeCacheMaxAgeSecs
#   retrieveQueueCacheMaxAgeSecs-> scheduler.retrieveQueueCacheMaxAgeSecs
#   archiveDismountPolicy       -> transfers.archive.underfill.{watchPeriodSecs,
#                                   minimumSamples, startThresholdPercent,
#                                   recoveryThresholdPercent}

taped:
  # Kubernetes DNS amplification (scale job only).
  #
  # Pods default to ndots:5. The MGM endpoint EOS hands CTA is
  # root://eos-mgm.<namespace>.svc.cluster.local//eos/... - four dots, FEWER than five - so glibc
  # treats it as a RELATIVE name and walks the search list before trying it literally:
  #     eos-mgm.<ns>.svc.cluster.local.<ns>.svc.cluster.local   NXDOMAIN
  #     eos-mgm.<ns>.svc.cluster.local.svc.cluster.local        NXDOMAIN
  #     eos-mgm.<ns>.svc.cluster.local.cluster.local            NXDOMAIN
  #     eos-mgm.<ns>.svc.cluster.local                          NOERROR
  # Four lookups, doubled to eight when A and AAAA are both asked, seven eighths of them wasted -
  # per resolution, from 100 taped pods plus the maintd reporters and the frontends. In the
  # 2026-11-06 run that showed up as XrdCl failing with "[FATAL] Invalid address code:101"
  # (errInvalidAddr - resolution failed before any connection was attempted) on archive source
  # files, and as CoreDNS so CPU-starved that its own loopback health probe timed out.
  #
  # ndots:1 makes any name with at least one dot be tried literally FIRST, so the FQDN costs one
  # lookup instead of four. It cannot break resolution: a name with no dots (cta-frontend-wfe) is
  # still searched and still hits on the first search entry, and a partially qualified name that
  # genuinely needs the search list still falls back to it after one extra query.
  #
  # Scoped to this preset on purpose - it is set per pod spec, and only the stress/scale jobs run
  # enough resolvers for the amplification to matter.
  pod:
    extraSpec:
      dnsConfig: &dnsNdots1
        options:
          - name: ndots
            value: "1"
          - name: attempts
            value: "2"

  logging:
    # Reverted to WARNING: the archive-failure investigation showed the fault is on the
    # EOS disk side (XRootD open failures / disk-report path), not in taped, so INFO-level
    # noise across 100 drives isn't buying anything here.
    level: "WARNING"

  # Scale-test OTel export stagger: each of the 100 taped pods sleeps a
  # deterministic fraction of 10 s (hash(hostname) % 10) in an initContainer
  # before the main container starts. This spreads OTel exporter boot times
  # evenly over 10 s, so subsequent export cycles at the 15 s interval set
  # above do not all hit the collector at the same wall-clock instant.
  # The stagger range stays below the export
  # interval, so every scrape window still contains at least one fresh export
  # from every pod.
  # Set to 0 in any overlay to disable.
  startup:
    staggerMaxSeconds: 10

  transfers:
    # Buffer pool. Costs bufferCount * bufferSizeBytes of RAM per taped pod: the pool is per
    # drive session (MigrationMemoryManager/RecallMemoryManager are instantiated inside the
    # data-transfer pipeline, not shared across drives).
    #
    # bufferSizeBytes CANNOT be reduced to match the stress tests' 16-byte files, tempting as it
    # looks. The tape block size is hardcoded to 256 KB in TapeWriteTask::openFileWriter() and
    # recorded in the UHL1 label; on retrieve, Payload::append() refuses to read a block into a
    # buffer smaller than the block size the label declares, so anything below 256 KB fails every
    # retrieve with a MemException. It is therefore pinned to the tape block size here, explicitly,
    # so that this is not rediscovered the hard way.
    #
    # That makes each in-flight file cost a full 256 KB buffer whatever its size, so bufferCount is
    # the only lever: 64 * 256 KB = 16 MB per drive, against 51 MB at the chart default of 200.
    # Depth needed is small - with diskIoThreads=1 one file is read at a time and a 16-byte file
    # occupies exactly one buffer, so the pool size is itself the ceiling on files in flight (64).
    # Supply, not depth, is what limits these drives: they achieve ~50 files/s each - the per-drive
    # share of the EOS MGM open rate with 100 drives competing, which is now also the configured
    # ceiling (maxWriteRateHz/maxReadRateHz: 50; previously a 250 Hz ceiling sat above the ~50 Hz
    # drives actually achieved) - i.e. ~20 ms per disk read, so the writer waits on EOS rather than
    # on buffers. Worth trimming because the in-memory tape already costs
    # ~50 MB per pod at overflowFraction: 0.05, batchFiles: 5000 and the taped pods have no memory limit.
    bufferCount: 64
    bufferSizeBytes: 262144
    # 1 disk-I/O thread per drive keeps XRootD connection count proportional
    # to drive count, keeping EOS lightly loaded
    # (T_query ~1 ms/file -> ~1000 files/sec/drive).
    diskIoThreads: 1

    archive:
      # fetchMaxFiles and the tape capacity are co-designed. The drive pipelines the next fetch
      # while writing the current batch and nothing limits a fetch to the tape's remaining
      # space, so when ENOSPC ends the session every job already fetched but not yet written is
      # re-queued - about one fetch batch per tape boundary, whatever the tape size. The
      # virtual-tape-library chart therefore DERIVES the capacity from overflowFraction, the target
      # fraction of a drive's files re-queued at each boundary: at its overflowFraction: 0.05 the
      # re-queued tail is a twentieth of a tape (see that chart's values.yaml for the current sizing
      # and the up-to-date boundary-crossing-frequency analysis at this test's actual scale).
      #
      # Keep batchFiles in virtual-tape-library/values.yaml equal to fetchMaxFiles here.
      fetchMaxBytes: 80000000000
      fetchMaxFiles: 5000
      # flushMaxFiles decoupled from fetchMaxFiles (debugging the 05:25-05:27 scheddb_stress
      # waiting bursts, which correlate with drives unmounting): suspected cause is
      # ArchiveMount::reportJobsBatchTransferred() reporting a 20 000-file batch to EOS's WFE in
      # one XRootD call - if that throws for ANY reason (one bad file is enough), every job in
      # the batch falls back to MigrationReportPacker's per-job path
      # (ArchiveRdbJob::failTransfer -> requeueJobToMount -> requeueFailedJob), each issuing its
      # own individual "move archive back to pending" query - turning one failure into up to
      # 20 000 single-row DB calls instead of 1 bulk call. A smaller flush bounds that worst case
      # without changing total throughput: flush size does not gate the aggregate file-report rate
      # (that is set by how fast the drives transfer, not by how their reports are chunked) - it
      # only changes how that work is split into EOS report calls. At the ~50 files/s per drive the
      # drives actually achieve - the per-drive share of the EOS MGM open rate with 100 drives
      # competing, not the configured maxWriteRateHz=250 ceiling - the aggregate is ~5 000 files/s:
      # 2000 (10x smaller) means one call every ~40 s per drive, ~2.5 calls/s aggregate across 100
      # drives, each covering 2000 files - still 5x above the 1 kHz floor this job targets,
      # and bounds a single EOS/catalogue failure to 2000 individual fallback queries instead of
      # 20 000. If EOS WFE is still the bottleneck at this size, halve it again rather than
      # chasing 1 - too small trades the opposite way (per-call overhead dominating).
      # fetchMaxFiles is unaffected: it is co-designed with the tape-capacity derivation above and
      # with G_max/ageForCollectionSecs further below, neither of which depend on flush size.
      flushMaxBytes: 80000000000
      flushMaxFiles: 2000
      # Underfill-driven dismount MUST stay enabled here. A mounted drive -
      # idle or not - counts toward the VO's writeMaxDrives cap
      # (Scheduler::getExistingAndNextMounts() counts any drive whose status is
      # in {Starting,Mounting,Transferring,Unloading,Unmounting,DrainingToDisk,
      # CleaningUp}; a drive waiting on an empty fetch queue stays Transferring,
      # so it still counts). With 100 drives sharing one VO at writeMaxDrives:
      # 100, a drive that keeps a tape mounted after it runs out of work to
      # write occupies a slot that a DIFFERENT drive - one that just dismounted
      # and has fresh work queued - cannot get: the mount decision refuses it
      # once existingMountsBasicTypeForThisVo >= maxDrives, even though the
      # occupying drive is doing nothing. startThresholdPercent: 0 (the
      # previous setting here) disables the mechanism entirely - every
      # fetch response satisfies "fillRatio >= 0" - so once the initial
      # backlog drains, idle drives never let go of their slot and new work
      # can only start when a drive happens to hit real ENOSPC. That produces
      # exactly the bursty, mostly-idle pattern this is meant to fix: a
      # handful of drives processing at a time while the other ~90 sit
      # mounted and idle, throughput collapsing to a fraction of 100 drives'
      # worth of work.
      #
      # 20% / 40% with the 300 s / 3-sample hysteresis below: a single
      # fetch returning fewer files than requested (normal when supply is
      # bursty) does not trigger a dismount by itself - only a fill ratio
      # below 20% sustained for 300 s across at least 3 fetch responses does,
      # which only happens when the queue has genuinely gone dry for minutes,
      # not during ordinary unevenness in upload rate. recoveryThresholdPercent
      # (40%) is deliberately well above the start threshold so a single
      # decent-sized fetch cancels the observation outright, rather than the
      # drive hovering near the boundary and dismounting on noise.
      underfill:
        watchPeriodSecs: 300
        minimumSamples: 3
        startThresholdPercent: 20
        recoveryThresholdPercent: 40

    retrieve:
      # Matched to archive.fetchMaxFiles rather than left at the chart's historical 20 000: this
      # value was never revisited when the drive rate/tape sizing below was redesigned for 50 Hz,
      # and at 20 000 it was quietly incoherent with that redesign in two ways.
      #
      # 1. T_batch = fetchMaxFiles / rate = 20 000 / 50 Hz = 400 s, so G_max (T_batch + T_change)
      #    = 490 s - against the SAME ageForCollectionSecs (scheduler.userActiveQueueCleanup
      #    below) used for archive's dead-mount detection. RoutineRunnerFactory.cpp spawns
      #    ArchiveInactiveMountActiveQueueRoutine AND RetrieveInactiveMountActiveQueueRoutine from
      #    that one age value, so it has to clear BOTH mount types' G_max, not just archive's. At
      #    5000 (matching archive), T_batch drops to 100 s and G_max to 190 s, giving the same
      #    healthy ~3x+ margin on both sides instead of a ~1.2x margin on retrieve alone.
      # 2. RecallTaskInjector fetches 2 x fetchMaxFiles on its first call, same as
      #    MigrationTaskInjector - at 20 000 that is up to 40 000 rows a dead retrieve mount leaves
      #    in RETRIEVE_ACTIVE_QUEUE, eating most of userActiveQueueCleanup's batchSize: 50000
      #    single-pass headroom. At 5000 it drops to 10 000, matching archive's worst case.
      #
      # Retrieve has no tape-capacity/ENOSPC co-design forcing a particular number the way archive
      # does (a retrieve mount reads a fixed, already-written tape, not a growing one), so there is
      # no reason for it to differ from archive's rate-matched cadence at all.
      fetchMaxBytes: 80000000000
      fetchMaxFiles: 5000

  scheduler:
    # Drives refresh tape status at most once per 60 s. A tape switch
    # (ENOSPC -> new tape) clears the cache explicitly, so mount latency
    # after a tape boundary is unaffected.
    tapeCacheMaxAgeSecs: 60
    # 5 s guarantees drives discover the retrieve queue within 5 s of it
    # becoming non-empty (critical for retrieve test correctness).
    retrieveQueueCacheMaxAgeSecs: 5
    # Override of stress-cta-pgsched-values.yaml's numberOfConnections: 3, for this job only - the
    # non-scale stress test does not have enough drives for this to matter. At 100 drives, 3 each
    # means 300 scheduler-side client connections through pgbouncer, against a pgbouncer
    # default_pool_size of 100 backend connections in session pooling mode: only the first ~33
    # drives (100 / 3) can ever hold a connection, the rest queue in pgbouncer forever. 2 per drive
    # still exceeds the 100-connection budget (200 > 100) - this alone does not fix the exhaustion,
    # pgbouncer's pool_mode/default_pool_size needs fixing too - but it lowers the floor of what a
    # given pgbouncer capacity can serve, and reduces the DB-side connection count taped itself has
    # to hold open for a workload that is 1 archive-mount + 1 retrieve-mount per drive at a time.
    numberOfConnections: 2

  # NOTE: there used to be a catalogue.numberOfConnections override here. It was removed:
  # taped's catalogue connection count is hardcoded to 1 in C++ (taped/TapedApp.cpp:
  # `const uint64_t nbConns = 1;`), never read from config, and its [catalogue] TOML schema
  # (cta::runtime::CatalogueConfig = BasicCatalogueConfig<NoClientConfig>) has no
  # number_of_connections field at all. Rendering that field into cta-taped.toml made every
  # taped pod fail to start ("Unknown field 'number_of_connections'") - there is no config lever
  # here, taped always uses exactly 1 catalogue connection, regardless of drive count.

# cta_catalogue connection budget: taped (100 pods x 1, hardcoded, see the note above) + maintd
# (9 active routine pods x 1, also hardcoded - MaintdApp.cpp: `ConnectionOptions connections
# {1, 1};` - see the equivalent note under maintd's routines below; 9 = diskReportArchive: 3 +
# diskReportRetrieve: 3 + userActiveQueueCleanup: 1 + userPendingQueueCleanup: 1 + 1 more active by
# chart default, not overridden here) + frontend-wfe/frontend-admin (2 pods x 5, see below - this
# one IS a real, working override: both call service_resources::makeConnectionOptions(), which
# actually reads catalogue.client.number_of_connections, unlike taped/maintd) = 119, leaving just 1
# of this environment's 120-connection ceiling spare - the next replica added anywhere in this file
# needs a connection freed elsewhere first. This is also effectively the drive-count ceiling:
# taped's 1-connection-per-pod is hardcoded with no config lever, so raising NUM_STRESS_DRIVES past
# ~101 (120 - 9 - 10) needs the catalogue's own max_connections raised first, not a change in this
# file.
frontend-wfe:
  pod:
    extraSpec:
      dnsConfig: *dnsNdots1
  conf:
    catalogue:
      numberOfConnections: 5

frontend-admin:
  pod:
    extraSpec:
      dnsConfig: *dnsNdots1
  conf:
    catalogue:
      numberOfConnections: 5

# No tape library hardware present: disable rmcd entirely.
# /dev/smc does not exist on a node without mhvtl; deploying rmcd would fail.
rmcd:
  enabled: false

maintd:
  pod:
    extraSpec:
      dnsConfig: *dnsNdots1

  routines:
    # batchSize is the MGM burst width, not just a DB page size.
    # Scheduler::reportArchiveJobsBatch() (scheduler/Scheduler.cpp) fires EVERY job in the batch as
    # a concurrent asyncReport() in a tight loop and only THEN waits on all of them, and each job
    # gets its own EOSReporter holding its own XrdCl::FileSystem (disk/EOSReporter.cpp), so
    # batchSize is simultaneously "rows per DB round-trip" and "simultaneous XrdCl queries against
    # the MGM". The EOS MGM was observed marking filesystems unavailable (fsid=3, fsid=5) under
    # this test's load at the original 8000 x 2 replicas - up to 16 000 concurrent report RPCs per
    # burst - which is a far more plausible cause than anything on the taped/WFE side (see
    # docs/content/dev/guides/testing/stress-tests.md and this file's taped.catalogue comment for
    # the ruled-out alternatives). 1500 x 1 replica cut that to 1500; 400 x 2 replicas cuts it to
    # 800, ~20x below where the FST unavailability was seen and below the 1500 a single pod already
    # ran without it.
    #
    # What that costs, deliberately. Per pass the routine does: one flagReportingJobsByStatus
    # transaction, the launch loop, the wait loop, one bulk setArchiveJobBatchReported, then
    # iterSleepMs. So
    #     rate = n / (F + n/R + S) = 1 / (F/n + 1/R + S/n)
    # with F the fixed per-pass DB cost, R the reports/s the MGM actually serves for ONE pod's
    # stream, S the sleep. The 1/R term shrinks with neither n nor S, so a single replica cannot
    # exceed R whatever these two are set to. Calibrating R from the observed run (1 replica,
    # n=1500, S=500 ms -> ~500 files/s, i.e. ~2.5 s of non-sleep work per pass) gives R ~ 610/s per
    # pod, and therefore:
    # (per pod; multiply by replicas for the aggregate, and see the replicas note below for why the
    # aggregate may or may not actually scale)
    #     n=1500, S=500 ms  ~500/s per pod, burst 1500   (what was measured, at 1 replica)
    #     n=1000, S=200 ms  ~531/s per pod, burst 1000
    #     n=400,  S=100 ms  ~498/s per pod, burst  400    (this setting, x2 replicas)
    #     n=300,  S=200 ms  ~405/s per pod, burst  300
    # n=400/S=100 ms beats both of the smaller-burst alternatives it replaces: ~23% more throughput
    # than n=300/S=200 ms AND slightly fewer fetch transactions (1.24/s against 1.35/s), because a
    # bigger batch amortises F and the sleep over more rows. Small batches are the wrong lever for
    # protecting the DB - the sleep is the right one, and the row rate is identical either way since
    # it just equals the throughput.
    #
    # iterSleepMs must stay NON-ZERO under pgsched whatever else changes here. The chart default of
    # 0 is an objectstore-era default: here the fetch is a WRITE transaction on ARCHIVE_ACTIVE_QUEUE
    # - the table 100 drives are already writing - and a pass keeps looping for the whole
    # softTimeoutSecs (30 s, inherited from the chart), so S=0 means issuing those back to back for
    # 30 s at a stretch. At S=100 ms the DB sees one fetch per ~800 ms, and the sleep is 12% of the
    # cycle. Idle polling is NOT governed by this knob: an empty fetch breaks out of the pass before
    # the sleep is reached, and sleepIntervalSecs (1 s, inherited) takes over.
    #
    # Note the arithmetic that does NOT apply: "batchSize x passes/s" (400 x 10 = 4000/s) assumes
    # the report work itself is free, which the measured 2.5 s/pass says it is not. The comment this
    # block replaced claimed 3000 files/s per pod on exactly that reasoning, while 500 files/s was
    # being observed.
    #
    # Two things to re-measure before tuning this again, both from data the routine already logs
    # (getArchiveJobsToReportTime, asyncReportLaunchTime, reportCompletionTime,
    # reportRecordInSchedDbTime, one INFO line per pass):
    #   - F and R exactly, instead of the F=50 ms guess this calibration assumes.
    #   - R after ndots:1 (set at the top of this file). Every report is an eosQuery:// to
    #     eos-mgm.<ns>.svc.cluster.local with one XrdCl::FileSystem per job, so these pods are among
    #     the heaviest DNS resolvers in the deployment and R may rise on its own.
    #
    # Replicas: 2 per routine, because reporting - not transferring - is the long pole of the run.
    # The drives move 4 M files in ~13 min (100 x ~50 files/s); reporting them at one pod's ~500/s
    # takes ~2.2 h, with ARCHIVE_ACTIVE_QUEUE carrying the ToReport backlog throughout. Only
    # replicas can lift the aggregate past R.
    #
    # Whether they actually do is the open question, and this is the cheap way to answer it. R may
    # be a global MGM ceiling - the measured run already had 1500 reports in flight and the MGM
    # served them at only ~610/s, which looks like server-side queueing - or it may be a per-client
    # limit, since all 1500 came from ONE process and XrdCl multiplexes over few streams per server.
    # Global: the second pod adds nothing but its idle poll and the run still shortens a little.
    # Per-client: the aggregate roughly doubles to ~1 kHz and the run halves to ~1.1 h.
    # reportCompletionTime per pass distinguishes them in a single run - ~0.65 s per 400-file batch
    # means per-client, ~1.3 s means the MGM is the wall.
    #
    # The burst this costs is bounded and below what has already been survived: 2 x 400 = 800
    # simultaneous report RPCs only when both pods happen to launch together, against 1500 from the
    # single pod that ran without FST trouble and 16 000 at the point FST unavailability appeared.
    # Each pod still fetches only once per ~800 ms, and concurrent pods are safe by construction:
    # flagReportingJobsByStatus selects FOR UPDATE SKIP LOCKED and sets IS_REPORTING, so the two
    # pods take disjoint row sets.
    #
    # The two routines drain DIFFERENT queues, so their replicas never add up: during the archive
    # phase diskReportRetrieve has nothing to do (empty fetch, immediate break, 1 s cycle sleep), so
    # the archive-phase rate is whatever diskReportArchive alone delivers.
    #
    # replicas: 3 / batchSize: 300 (from 2 / 400), applied to BOTH routines below: the 2x400
    # archive measurement confirmed R (~500-610/s) is a PER-CLIENT ceiling, not a global MGM one -
    # each pod's XrdCl client defaults to SubStreamsPerChannel=1 and WorkerThreads=3
    # (XrdClConstants.hh; nothing in this codebase overrides either), which is the more likely
    # explanation for a flat per-pod ceiling regardless of batchSize than the MGM itself. Nothing
    # about that ceiling is archive-specific - diskReportRetrieve reports through the same
    # EOSReporter/XrdCl path - so the same change applies here, even though the two routines never
    # run concurrently at load (archive phase vs retrieve phase, per the note above). Per the same
    # rate = n/(F + n/R + S) model: n=300, S=100ms, F~50ms, R~610/s gives ~467/s per pod; 3 pods
    # ~1.4 kHz, against 2x400's ~992/s measured - a real increase. Dropping to 300 when adding the
    # 3rd pod also keeps the concurrent-RPC burst from growing with it: 3x300=900 is BELOW 2x400's
    # 800... only barely, intentionally - the point is to add a pod without pushing the burst past
    # where 2x400 already proved safe (see the burst-safety numbers above: 1500 survived at 1
    # replica, 16 000 is where FST unavailability was seen). Costs one more catalogue connection
    # PER ROUTINE (117 -> 119/120 for both, see the budget note above taped's routines are
    # rendered - only 1 connection spare left). Re-measure getArchiveJobsToReportTime/
    # reportCompletionTime before going further: if SubStreamsPerChannel/WorkerThreads turn out to
    # be the real ceiling, raising those (via XRD_SUBSTREAMSPERCHANNEL/XRD_WORKERTHREADS on the
    # maintd pods) may lift the per-pod rate directly, without paying another connection for a 4th
    # replica.
    diskReportArchive:
      replicas: 3
      batchSize: 300
      iterSleepMs: 100
    diskReportRetrieve:
      replicas: 3
      batchSize: 300
      iterSleepMs: 100
    # Repack is not used in scale tests; disable to avoid unnecessary DB polls
    # and free scheduler connections for the active archive/retrieve workload.
    repackExpand:
      replicas: 0
    repackReport:
      replicas: 0
    # Repack is not exercised by the scale test either, so its queue cleanups have nothing to
    # collect: zero replicas rather than two pods polling empty REPACK_* tables.
    repackActiveQueueCleanup:
      replicas: 0
    repackPendingQueueCleanup:
      replicas: 0
    # The user queue cleanups stay enabled - they are what returns the jobs of a mount which
    # stopped fetching - with a cadence derived from this test's own mount cycle rather than from
    # the dev defaults.
    #
    # ageForCollectionSecs is the SECOND of two guards, not the only one. RelationalDB::
    # getDeadMounts() first takes the mounts whose MOUNT_QUEUE_LAST_FETCH.LAST_UPDATE_TIME is older
    # than this age, and then erases every mount id the catalogue still reports for any drive
    # (SELECT DRIVE_NAME, SESSION_ID FROM DRIVE_STATE, all drives, no state filter - SESSION_ID is
    # the mount id, see SchedulerDatabase::ArchiveMount::MountInfo::makeTapeSessionReport()). A live
    # mount is therefore normally protected by the drive state however stale its last-fetch row is,
    # and the two guards cover each other: at mount start the drive state may not be published yet
    # but the fetch has just refreshed the age row, and mid-session the age row goes stale while the
    # drive state names the mount.
    #
    # The age still matters because both updateMountQueueLastFetch() and reportDriveState() failures
    # are swallowed with a WARNING, so a mount whose drive state never made it to the catalogue has
    # nothing but the age protecting it. What it must then exceed is the real interval between two
    # fetches of a HEALTHY drive. RoutineRunnerFactory.cpp spawns BOTH
    # ArchiveInactiveMountActiveQueueRoutine and RetrieveInactiveMountActiveQueueRoutine from this
    # one age value, so it has to clear both mount types' G_max, not just archive's - which is
    # exactly why transfers.retrieve.fetchMaxFiles above is kept equal to transfers.archive's:
    #   T_batch  = fetchMaxFiles / rate                       one fetch batch, same for archive
    #              5 000 / 50 Hz = 100 s                       and retrieve now that their
    #                                                          fetchMaxFiles match (see above)
    #   T_change = mountDelayMaxMs (worst case, not average) ~  90 s  tape change at ENOSPC
    #   G_max    = T_batch + T_change                        ~ 190 s  longest healthy fetch gap
    #
    # T_change uses the jitter's CEILING, not its average: a single real tape change can draw
    # anywhere up to it, and using the average would intermittently misclassify a healthy drive that
    # happens to draw a long delay. Recompute if the [5 s, 90 s] override elsewhere in this file
    # changes.
    #
    # age = 600 s is a ~3.2x margin over G_max (190 s) and 60% of one mount cycle (a tape is
    # 50 000 files, 1 000 s / 16.7 min at 50 Hz - see virtual-tape-library/values.yaml; a retrieve
    # mount pulling a full tape's worth back is the same order of magnitude), so a mount that really
    # did die does not keep its work reserved for anything like as long as a healthy mount takes.
    # Do NOT chase a bigger margin by raising age further without re-checking this fraction: at,
    # say, 900 s it would be 90% of the mount cycle - comfortably clearing G_max is not enough on
    # its own if it also stops being "far inside" the cycle, which is the other half of what this
    # guard is for. T_batch/G_max are rule-of-thumb estimates of the achieved per-drive rate, not a
    # guaranteed figure, which is why 600 s was kept at its pre-rate-change value (a healthy
    # multiple of G_max) rather than tuned down to the tightest value that still clears it - but the
    # mount-cycle ceiling means that slack cannot be spent by raising age indefinitely; it is spent
    # by keeping G_max itself small (i.e. keeping fetchMaxFiles aligned across archive and retrieve,
    # as above).
    #
    # Recompute if STRESS_WRITE_RATE_HZ, either fetchMaxFiles, the mount-delay jitter override, or
    # the achieved per-drive rate changes: keep age comfortably above G_max at the ACHIEVED rate for
    # BOTH mount types, and re-check it is still a healthy fraction of the mount cycle above.
    #
    # The active-queue group also runs ResubmitInactiveReportingRoutine on the same age, so a report
    # batch left flagged IS_REPORTING by a reporter that died mid-batch is retried within ~11 min
    # (600 s age + 60 s poll) instead of the ~30-45 min the dev settings give it. Up to three
    # diskReportArchive pods and two diskReportRetrieve pods can die holding up to batchSize flagged
    # rows each - still a far smaller exposure than the dev default, but worth knowing when a run
    # shows rows stuck in IS_REPORTING.
    #
    # batchSize is the LIMIT of one cleanup pass, and one pass runs per poll - the routine does
    # not loop internally. It has to exceed the number of rows a single dead mount leaves behind,
    # for a reason beyond throughput: handleInactiveMountActiveQueueRoutine() only calls
    # cleanMountLastFetchTimes() on a pass that moves ZERO rows, so a dead mount is retired from
    # MOUNT_QUEUE_LAST_FETCH only once its queue is fully drained. Undersized, the same dead
    # mounts are rescanned as candidates on every pass forever - which is exactly the symptom in
    # the dashboards: constant "update inactive mount in pending queue" traffic and no
    # "delete mount_last_fetch_times" at all.
    #
    # Rows left by one dead mount:
    #   MigrationTaskInjector (archive) and RecallTaskInjector (retrieve) both fetch
    #   2 x fetchMaxFiles on their first call, so the in-flight set in the ACTIVE queue is up to
    #   2 x 5 000 = 10 000 rows for either mount type now that their fetchMaxFiles match (see
    #   transfers.retrieve above - at the old retrieve fetchMaxFiles of 20 000 this would have been
    #   40 000, leaving far less headroom below). The PENDING queue can hold the same number for
    #   that mount: requeueJobBatch(keepMountId = true) returns a job that failed inside a mount to
    #   PENDING with its MOUNT_ID intact, so if every job of a batch fails they all land there under
    #   the dead mount.
    #
    # 50 000 covers that worst case with headroom (10 000 vs the old 40 000 - even more now) while
    # staying a sane single UPDATE (the statement is an indexed UPDATE ... FROM (SELECT ... LIMIT n
    # FOR UPDATE SKIP LOCKED)). One pass then drains a dead mount and the next retires it.
    # Throughput is 50 000 / 60 s ~ 833 rows/s per queue, so even the pathological case - all 100
    # drives dying at once with full batches, ~1 M rows - is recovered in ~20 min rather than never.
    # Raise the poll rate rather than the batch if that ever needs to be faster: bigger single
    # transactions compete with the 100 drives hammering the same tables.
    userActiveQueueCleanup: &scaleCleanup
      replicas: 1
      sleepIntervalSecs: 60
      batchSize: 50000
      ageForCollectionSecs: 600
    userPendingQueueCleanup: *scaleCleanup

  # NOTE: there used to be a catalogue.numberOfConnections override here too. Also removed, same
  # reason as taped's above: maintd/MaintdApp.cpp hardcodes
  # `service_resources::ConnectionOptions connections {1, 1};` for every routine pod regardless of
  # config, and MaintdConfig's [catalogue] TOML schema has no number_of_connections field to
  # render into in the first place. No config lever here either - maintd always uses exactly 1
  # catalogue connection per pod.

# The cli pod belongs to the same umbrella chart and resolves the MGM endpoint for every command
# the test harness runs through it, so it gets the same ndots treatment (see taped.pod above).
cli:
  pod:
    extraSpec:
      dnsConfig: *dnsNdots1
