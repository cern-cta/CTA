#
# Overlay for stress tests using virtual StressDrives instead of mhvtl/real hardware.
#
# Usage (combine with the base stress preset and a scheduler preset):
#
#   helm upgrade --install cta . \
#     -f presets/stress-cta-pgsched-values.yaml \
#     -f presets/stress-stressdrives-pgsched-values.yaml
#
# What this preset does:
#   - Enables StressMode in taped: bypasses SCSI device scanning and rmcd calls.
#   - Mounts the host's /dev/shm/cta-stress into every taped pod via hostPath so
#     all pods share a single in-memory tape library regardless of how many pods run.
#   - Defines N virtual drives (STRESS0000..STRESSnnnn) pointing to "stress://"
#     instead of real /dev/nstX device paths.
#   - Disables rmcd (no StatefulSet deployed; taped will never contact it).
#
# The number of drives is set by the drives list below.  Add or remove entries
# to scale up or down.  The matching number of tapes must be registered in the
# CTA catalogue by setup_stress_drives_test.py (see ci/system_tests/tests/setup/).
#
# Tape VIDs are generated by setup_stress_drives_test.py using the pattern
# configured in test_params.toml [tests.stress.drives].
# VIDs must be <= 6 characters to fit the ANSI tape label VSN field (VOL1);
# the default prefix "ST" + 4-digit index gives e.g. ST0001..ST0020.

taped:
  conf:
    taped:
      # Activate the virtual-drive code path.
      stressMode: true
      stressBaseDir: "/dev/shm/cta-stress"
      # Set to a non-zero value to simulate realistic mount latency (ms).
      stressMountDelayMs: 0

      # Performance tuning inherited from the standard stress preset; override
      # here if the stress-drive workload needs different values.
      bufferCount: 10000
      logMask: "WARNING"
      schedulerNumberOfConnections: 3

  # Node affinity: all stress-drive pods MUST land on the same Kubernetes node.
  #
  # StressDrive uses a hostPath volume (/dev/shm/cta-stress) as a shared
  # in-memory tape library.  hostPath is node-local: if two taped pods end up
  # on different nodes they each see an independent copy of the directory and
  # cannot exchange tape state — a drive on node A cannot read a tape written
  # by a drive on node B.  The affinity rule below prevents this by forcing
  # the scheduler to co-locate every stress-drive pod on a node labelled
  # cta-stress-node=true.  Label exactly one CI node with that key before
  # deploying.  For multi-node scale-out, replace the hostPath volume with an
  # RWX PersistentVolumeClaim (NFS, CephFS, …) and remove this affinity rule.
  pod:
    extraSpec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cta-stress-node
                    operator: In
                    values:
                      - "true"

  # Mount the host's /dev/shm/cta-stress into every taped pod so that all pods
  # share a single in-memory tape library.  Adjust type to NFS or a PVC for
  # multi-node setups (and remove the node affinity above).
  extraVolumes:
    volumes:
      - name: stress-tmpfs
        hostPath:
          path: /dev/shm/cta-stress
          # DirectoryOrCreate: Kubernetes creates the directory if absent; the
          # setup test then creates the tapes/ and drives/ subdirectories inside it.
          type: DirectoryOrCreate
    volumeMounts:
      - name: stress-tmpfs
        mountPath: /dev/shm/cta-stress

  # Virtual drives: each entry produces one taped StatefulSet pod.
  # DriveDevice = "stress://" triggers StressDrive creation in DataTransferSession::findDrive().
  # DriveControlPath is unused in stress mode but must be present for the template.
  drives:
    - name: "STRESS0000"
      device: "stress://"
      logicalLibraryName: "stress-lib"
      controlPath: "smc0"
    - name: "STRESS0001"
      device: "stress://"
      logicalLibraryName: "stress-lib"
      controlPath: "smc0"
    - name: "STRESS0002"
      device: "stress://"
      logicalLibraryName: "stress-lib"
      controlPath: "smc0"
    - name: "STRESS0003"
      device: "stress://"
      logicalLibraryName: "stress-lib"
      controlPath: "smc0"
