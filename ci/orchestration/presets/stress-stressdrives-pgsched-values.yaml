#
# pgsched-specific overlay for StressDrive stress tests.
# Apply after stress-stressdrives-values.yaml (which covers all scheduler backends).
#
# Usage:
#
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-pgsched-values.yaml \
#     -f presets/stress-stressdrives-values.yaml \
#     -f presets/stress-stressdrives-pgsched-values.yaml

taped:
  conf:
    taped:
      # Per-drive scheduler DB connection pool.  Each DriveHandler creates its own
      # SchedulerDBInit with this many connections.  With N drives: N × 2 consumed.
      # 50 drives/library × 2 libraries -> 100 × 2 = 200; see connection budget in
      # stress-cta-pgsched-values.yaml.
      schedulerNumberOfConnections: 2
