#
# Overlay for stress tests using virtual StressDrives instead of mhvtl/real hardware.
#
# Prerequisites
# -------------
# Deploy the fake-tape-library chart first to create the PVC and populate it:
#
#   helm upgrade --install fake-tape-library \
#     ci/orchestration/helm/fake-tape-library/ \
#     -f <your-library-values.yaml>
#
# Usage (combine with the base stress preset and a scheduler preset):
#
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-pgsched-values.yaml \
#     -f presets/stress-stressdrives-pgsched-values.yaml
#
# What this preset does
# ---------------------
#   - Mounts the fake-tape-library PVC into every taped pod so all pods share
#     a single on-disk tape library regardless of which node they run on.
#   - Defines N virtual drives (STRESS0000..STRESSnnnn) with DriveDevice =
#     "virtual:///cta-stress-lib"; the URI prefix activates StressDrive +
#     NullMediaChangerFacade, and the path is the shared library root.
#   - No StressMode/StressBaseDir config keys are needed — both are derived
#     from the device URI set by create_instance.sh --no-hardware-drives.
#   - Disables rmcd (no StatefulSet deployed; taped never contacts it for virtual drives).
#
# No node affinity or hostPath volume is required: the PVC is managed by the
# cluster's storage class and can be accessed from any node.  On single-node
# clusters (laptop, kind, k3s) the default ReadWriteOnce access mode is fine.
# For multi-node clusters use a ReadWriteMany storage class in the
# fake-tape-library chart values.
#
# The matching number of tapes must be registered in the CTA catalogue by
# setup_stress_drives_test.py (see ci/system_tests/tests/setup/).
# VIDs must be <= 6 characters; the default prefix "ST" + 4-digit index gives
# ST0001..ST0100.  Count and prefix come from library.toml in the fake-tape-library chart.

taped:
  conf:
    taped:
      # Performance tuning inherited from the standard stress preset; override
      # here if the stress-drive workload needs different values.
      #
      # bufferCount is per drive session (MigrationMemoryManager is instantiated
      # inside DataTransferSession, not shared across drives).  With bufferSizeBytes=262144
      # (256 KB helm default): 500 × 256 KB = 128 MB per drive, 3.8 GB for 30 drives.
      # The 10000 inherited from stress-cta-pgsched-values.yaml would cost 76.8 GB.
      # 500 gives ample pipeline depth: at 1000 files/sec per drive, nbDiskThreads=5
      # reads complete in 1-3 ms each, so 5–15 buffers are in flight at any time.
      bufferCount: 500
      # DiskReadThreadPool is created per drive session (not shared across drives).
      # 1 thread per drive keeps EOS load minimal: 30 drives × 1 = 30 concurrent
      # XRootD connections, well within EOS capacity.  The tape thread blocks until
      # the single disk thread delivers each file, so the effective per-drive rate
      # is bounded by EOS read latency (~1–5 ms/file → ~200–1000 files/sec/drive).
      # The adaptive mirror in StressDrive mirrors this arrival gap, so the drive
      # never appears idle in monitoring.
      # A higher value (e.g. 5) would allow pre-fetching N+1..N+4 while writing N,
      # but at the cost of 30 × 5 = 150 concurrent EOS connections that saturate
      # the MGM and cause maintd archive-report queries to time out (code 206).
      nbDiskThreads: 1
      logMask: "WARNING"
      # This is a per-drive pool: each DriveHandler creates its own SchedulerDBInit
      # with this many connections.  With N drives: N × 2 connections consumed.
      # 10 drives → 20, 20 drives → 40, 30 drives → 60; see connection budget in stress-cta-pgsched-values.yaml.
      schedulerNumberOfConnections: 2

      # Batch sized so that the tape capacity is an exact integer multiple of one batch.
      # bytes_per_file = HDR1+HDR2+UHL1+data+EOF1+EOF2+UTL1 = 80×6 + 16 = 496 (file marks = 0).
      # capacityBytes = 80 (VOL1) + 5 × 20000 × 496 = 49 600 080 → exactly 5 batches/tape.
      # ENOSPC fires on HDR1 of the first file of batch 6 → zero partial-batch requeue.
      archiveFetchBytesFiles: "80000000000, 20000"
      retrieveFetchBytesFiles: "80000000000, 20000"

      # Tape-status and retrieve-queue cache TTLs.
      #
      # The helm default is 1 s for both, which causes taped to re-query the
      # catalogue once per second per drive for tape status (mount decisions) and
      # retrieve-queue statistics.  With 30 drives that is 30 catalogue queries/sec
      # just for background polling — pointless overhead in an archive-only stress
      # test where tapes change status rarely and retrieves never happen.
      #
      # tapeCacheMaxAgeSecs: drives refresh tape status at most once per 60 s
      # instead of once per second.  A tape switch (ENOSPC → new tape) clears the
      # cache explicitly via clearStatisticsCache(), so mount latency after a tape
      # boundary is unaffected by a longer TTL.
      #
      # retrieveQueueCacheMaxAgeSecs: set to 5 s (vs helm default 1 s).
      # During the archive phase (30 drives, archive-only) this contributes
      # 30 × (1/5 s) = 6 queries/sec — acceptable overhead.
      # The short TTL is critical for the retrieve phase that follows: the
      # test's wait_for_retrieval_in_directory gives up after 3 consecutive
      # 10-second intervals with no progress (30 s total).  With a 30 s TTL
      # a drive that just finished archiving might not poll the retrieve queue
      # until AFTER the test has already timed out.  A 5 s TTL guarantees
      # drives discover the retrieve queue within 5 s of it becoming non-empty.
      tapeCacheMaxAgeSecs: 60
      retrieveQueueCacheMaxAgeSecs: 5

      # Disable underfill-driven dismounting for stress tests.
      #
      # In production, ArchiveDismountPolicy frees a drive whose queue is
      # persistently below the fill threshold — a sign the tape pool is
      # over-provisioned for the current load.  In stress tests the bottleneck
      # is the frontend queueing rate (~200 Hz), not the drive (8 kHz), so
      # drives will always appear "underfilled" once the initial burst drains.
      # Setting startThreshold=0 keeps drives mounted and processing the
      # continuous trickle without cycling through unnecessary dismounts.
      # Normal end-of-session (empty queue + lastCall) is unaffected.
      #
      # Format: "watchPeriodSecs, minSamples, startThreshold%, recoveryThreshold%"
      # startThreshold=0 → effectiveFillRatio >= 0.0 is always true → underfill period
      # never starts → dismounting disabled.  recoveryThreshold=1 satisfies the
      # validator constraint (startThreshold < recoveryThreshold).
      archiveDismountPolicy: "300, 3, 0, 1"

  # Mount the fake-tape-library PVC into every taped pod.
  # The PVC name must match the pvc.name in the fake-tape-library chart values
  # (default: cta-fake-tape-library).
  extraVolumes:
    volumes:
      - name: fake-tape-library
        persistentVolumeClaim:
          claimName: cta-fake-tape-library
    volumeMounts:
      - name: fake-tape-library
        mountPath: /cta-stress-lib

# Drive list is generated dynamically by create_instance.sh --no-hardware-drives
# based on the --max-drives argument (default 20, named STRESS0000..STRESS{N-1}).
# Do not define drives here; the generated values file is merged after this preset.

# No tape library hardware present: disable rmcd entirely.
# taped in stress mode never contacts rmcd; deploying it would fail because
# /dev/smc does not exist on a node without mhvtl.
rmcd:
  enabled: false
