#
# Overlay for stress tests using virtual StressDrives instead of mhvtl/real hardware.
#
# Prerequisites
# -------------
# Deploy the fake-tape-library chart first to create the PVC and populate it:
#
#   helm upgrade --install fake-tape-library \
#     ci/orchestration/helm/fake-tape-library/ \
#     -f <your-library-values.yaml>
#
# Usage (combine with the base stress preset and a scheduler preset):
#
#   helm upgrade --install cta ci/orchestration/helm/cta/ \
#     -f presets/stress-cta-pgsched-values.yaml \
#     -f presets/stress-stressdrives-pgsched-values.yaml
#
# What this preset does
# ---------------------
#   - Enables StressMode in taped: bypasses SCSI device scanning and rmcd calls.
#   - Mounts the fake-tape-library PVC into every taped pod so all pods share
#     a single on-disk tape library regardless of which node they run on.
#   - Defines N virtual drives (STRESS0000..STRESSnnnn) pointing to "stress://"
#     instead of real /dev/nstX device paths.
#   - Disables rmcd (no StatefulSet deployed; taped never contacts it in stress mode).
#
# No node affinity or hostPath volume is required: the PVC is managed by the
# cluster's storage class and can be accessed from any node.  On single-node
# clusters (laptop, kind, k3s) the default ReadWriteOnce access mode is fine.
# For multi-node clusters use a ReadWriteMany storage class in the
# fake-tape-library chart values.
#
# The matching number of tapes must be registered in the CTA catalogue by
# setup_stress_drives_test.py (see ci/system_tests/tests/setup/).
# VIDs must be <= 6 characters; the default prefix "ST" + 4-digit index gives
# ST0001..ST0100.  Count and prefix come from library.toml in the fake-tape-library chart.

taped:
  conf:
    taped:
      # Activate the virtual-drive code path.
      stressMode: true
      # Must match the mountPath of the fake-tape-library PVC below.
      stressBaseDir: "/cta-stress-lib"

      # Performance tuning inherited from the standard stress preset; override
      # here if the stress-drive workload needs different values.
      bufferCount: 10000
      logMask: "WARNING"
      # This is a per-drive pool: each DriveHandler creates its own SchedulerDBInit
      # with this many connections.  With N drives: N × 2 connections consumed.
      # 10 drives → 20, 20 drives → 40; see connection budget in stress-cta-pgsched-values.yaml.
      schedulerNumberOfConnections: 2

      # Fetch up to 100k files per advisory-lock trip.  StressDrive processes
      # files at memory speed so the default 4k-file batch causes constant lock
      # churn during the initial burst; a larger batch amortises lock overhead.
      archiveFetchBytesFiles: "80000000000, 100000"
      retrieveFetchBytesFiles: "80000000000, 100000"

      # Disable underfill-driven dismounting for stress tests.
      #
      # In production, ArchiveDismountPolicy frees a drive whose queue is
      # persistently below the fill threshold — a sign the tape pool is
      # over-provisioned for the current load.  In stress tests the bottleneck
      # is the frontend queueing rate (~200 Hz), not the drive (8 kHz), so
      # drives will always appear "underfilled" once the initial burst drains.
      # Setting startThreshold=0 keeps drives mounted and processing the
      # continuous trickle without cycling through unnecessary dismounts.
      # Normal end-of-session (empty queue + lastCall) is unaffected.
      #
      # Format: "watchPeriodSecs, minSamples, startThreshold%, recoveryThreshold%"
      # startThreshold=0 → effectiveFillRatio >= 0.0 is always true → underfill period
      # never starts → dismounting disabled.  recoveryThreshold=1 satisfies the
      # validator constraint (startThreshold < recoveryThreshold).
      archiveDismountPolicy: "300, 3, 0, 1"

  # Mount the fake-tape-library PVC into every taped pod.
  # The PVC name must match the pvc.name in the fake-tape-library chart values
  # (default: cta-fake-tape-library).
  extraVolumes:
    volumes:
      - name: fake-tape-library
        persistentVolumeClaim:
          claimName: cta-fake-tape-library
    volumeMounts:
      - name: fake-tape-library
        mountPath: /cta-stress-lib

  # Drive list is generated dynamically by create_instance.sh --no-hardware-drives
  # based on the --max-drives argument (default 20, named STRESS0000..STRESS{N-1}).
  # Do not define drives here; the generated values file is merged after this preset.

# No tape library hardware present: disable rmcd entirely.
# taped in stress mode never contacts rmcd; deploying it would fail because
# /dev/smc does not exist on a node without mhvtl.
rmcd:
  enabled: false
