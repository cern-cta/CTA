global:
  scheduler:
    backend: vfs
    existingSecret: cta-scheduler-conf
    existingClaim: scheduler-vfs-pvc

maintd:
  routines:
    # Disable the other backend routines when composing scheduler overrides.
    userActiveQueueCleanup:
      replicas: 0
    repackActiveQueueCleanup:
      replicas: 0
    userPendingQueueCleanup:
      replicas: 0
    repackPendingQueueCleanup:
      replicas: 0
    schedulerMaintenanceCleanup:
      replicas: 0
    garbageCollect:
      replicas: 1
      sleepIntervalSecs: 1
    queueCleanup:
      replicas: 1
      sleepIntervalSecs: 1
      batchSize: 500
