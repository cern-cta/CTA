#
# Failure-scenario overlay for the stress-scale-fail-test CI job. Applied ON TOP OF
# stress-scale-values.yaml (both files go in STRESS_CTA_VALUES_CHAIN, same as every other preset
# combination in this directory) - it only contains what differs for deliberately exercising
# CTA's failure-recovery paths at scale, not a duplicate of the base scale-test tuning.
#
# What this test is for
# ----------------------
# stress-scale-test proves CTA can sustain a target throughput. This test proves CTA RECOVERS
# from a representative mix of failures without losing any file, by deliberately engineering
# three independent failure classes into the same run. Classes 1 and 2 are OFF by default (the
# stress-scale-fail-test CI job's STRESS_OVERFLOW_FRACTION/STRESS_TRANSFER_FAILURE_RATE/
# STRESS_RETRIEVE_FAILURE_RATE all default to "no injection") - set them explicitly via "Play
# with variables" to exercise them; class 3 (mid-run pod kills) always runs:
#
#   1. Tape-boundary overflow (end-of-tape re-queues). Driven by STRESS_OVERFLOW_FRACTION on the
#      CI job (NOT set here - it computes library.filesPerTapeOverride on create_instance.sh,
#      targeting the virtual-tape-library chart, not this cta-chart overlay): tape capacity is
#      set to (1 - STRESS_OVERFLOW_FRACTION/100) x each drive's fair share of total_files, so a
#      drive getting exactly its fair share is guaranteed to need a second tape. This path is
#      RETRY-NEUTRAL: ArchiveJobQueueRow::requeueJobBatch() copies RETRIES_WITHIN_MOUNT/
#      TOTAL_RETRIES unchanged, so an ENOSPC-driven re-queue costs a file nothing against its
#      retry budget - it is purely a re-fetch on the next tape.
#
#   2. Genuine transfer/retrieve faults, injected by VtlDrive itself (see
#      taped/drive/VtlDrive.hpp's MediaTypeInfo::transferFailureRate/retrieveFailureRate),
#      likewise driven by CLI flags on create_instance.sh, not set here. Unlike (1), this DOES
#      consume one of a file's limited retry attempts (ArchiveRequest::TOTAL_RETRIES /
#      REPORT_RETRIES = 2, i.e. 3 total attempts) - but VtlDrive guarantees AT MOST ONE such fault
#      per file for its entire lifetime (see maybeInjectFault()'s one-time, atomic marker), so a
#      file always has at least 2 attempts left after it. Combined with (1) costing nothing, no
#      file can ever exhaust its retry budget from these two mechanisms alone.
#
#   3. Deliberate mid-run disruption: the test harness itself kills up to 10 taped pods mid-mount
#      and 2 diskReportArchive/diskReportRetrieve pods mid-batch, all roughly at once (see
#      NUM_MOUNTS_TO_DISRUPT/NUM_REPORT_BATCHES_TO_DISRUPT in tests/stress_scale_fail_test.py and
#      the stress-scale-fail-test CI job's pytest invocation), to prove the maintd cleanup
#      routines (Archive/RetrieveInactiveMountActiveQueueRoutine, ResubmitInactiveReportingRoutine)
#      actually recover that work under multiple simultaneous losses, not just the job's own
#      graceful-shutdown path.
#
# The test's final assertions are that archival/retrieval loss stays within the same
# max_acceptable_loss_percent tolerance as stress-scale-test, AND that zero rows are left behind
# in any *_FAILED_QUEUE or stuck IS_REPORTING - i.e. that the cleanup routines did their job even
# for whatever (if anything) the tolerance above allowed to be lost. See
# tests/stress_scale_fail_test.py.
#
# What is intentionally UNCHANGED from stress-scale-values.yaml
# ---------------------------------------------------------------
# transfers.archive/retrieve.fetchMaxFiles and rate: whatever that preset sets, this file does
# not override them. Tape capacity here is NOT overflowFraction-derived from batchFiles (that
# path is only the chart's fallback, unused by this job) - it comes from the CI job's own
# STRESS_OVERFLOW_FRACTION -> filesPerTapeOverride computation (see
# tests-kubernetes.gitlab-ci.yml's comment), sized from total_files/drive-count, independent of
# fetchMaxFiles/batchFiles entirely.
#
# What DOES change here
# ----------------------
# Only maintd's dead-mount-reclaim age/batch/poll below. ageForCollectionSecs has NO code-level
# link to tape capacity (they are configured independently, in different components - maintd's
# RelationalDB::getDeadMounts() vs. the virtual-tape-library chart/VtlDrive::setCapacity()) - the
# only relationship is a TUNING one: this age must stay comfortably below whatever mount cycle
# (filesPerTape / rate) a given run's capacity produces, which depends on
# STRESS_OVERFLOW_FRACTION/STRESS_TOTAL_FILES/NUM_STRESS_DRIVES/STRESS_WRITE_RATE_HZ actually used
# - the CI job itself WARNS at render time if that run's values push this age past 80% of the
# resulting cycle (see FAIL_AGE_FOR_COLLECTION_SECS there - keep it equal to the value below).

maintd:
  routines:
    # A thinner margin here (240 s) was tried and proven unsafe: stacking the deliberate
    # taped/report-pod disruptions (tests/stress_scale_fail_test.py's
    # test_disrupt_archive_mount/test_disrupt_report_batch) adds a real DB-contention spike,
    # long enough to push even a STILL-HEALTHY mount's apparent last-fetch age past a thin
    # threshold - triggering ArchiveInactiveMountActiveQueueRoutine to reclaim that live mount's
    # ARCHIVE_ACTIVE_QUEUE rows out from under it mid-batch. The mount then finds its own
    # in-flight jobs no longer match the DB state when it tries to report them, has nothing left
    # to do, and ends - triggering an immediate remount: frequent archive mount/unmount churn and
    # near-zero net throughput, not file loss. (It also risks a file being written and reported
    # twice if a reclaimed job keeps running to completion in the original mount's session - see
    # scheduler/rdbms/ArchiveMount.cpp's refreshMountLivenessHeartbeat(), which closes the
    # equivalent race for mounts busy REPORTING, but not for one still mid-fetch/mid-write with
    # no reportable batch yet.)
    #
    # 900 s / batchSize 30000 / poll 30 s are current values - re-check the CI job's own warning
    # for whatever STRESS_OVERFLOW_FRACTION/STRESS_TOTAL_FILES/NUM_STRESS_DRIVES/
    # STRESS_WRITE_RATE_HZ a given run actually uses before trusting it near 80%+ of the cycle.
    userActiveQueueCleanup: &failCleanup
      replicas: 1
      sleepIntervalSecs: 30
      batchSize: 30000
      ageForCollectionSecs: 900
    userPendingQueueCleanup: *failCleanup
