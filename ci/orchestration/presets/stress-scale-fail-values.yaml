#
# Failure-scenario overlay for the stress-scale-fail-test CI job. Applied ON TOP OF
# stress-scale-values.yaml (both files go in STRESS_CTA_VALUES_CHAIN, same as every other preset
# combination in this directory) - it only contains what differs for deliberately exercising
# CTA's failure-recovery paths at scale, not a duplicate of the base scale-test tuning.
#
# What this test is for
# ----------------------
# stress-scale-test proves CTA can sustain a target throughput. This test proves CTA RECOVERS
# from a representative mix of failures without losing any file, by deliberately engineering
# three independent failure classes into the same run. Classes 1 and 2 are OFF by default (the
# stress-scale-fail-test CI job's STRESS_OVERFLOW_FRACTION/STRESS_TRANSFER_FAILURE_RATE/
# STRESS_RETRIEVE_FAILURE_RATE all default to "no injection") - set them explicitly via "Play
# with variables" to exercise them; class 3 (mid-run pod kills) always runs:
#
#   1. Tape-boundary overflow (end-of-tape re-queues). Driven by
#      --stress-overflow-fraction on create_instance.sh (NOT set here - it targets the
#      virtual-tape-library chart, not this cta-chart overlay). This path is RETRY-NEUTRAL:
#      ArchiveJobQueueRow::requeueJobBatch() copies RETRIES_WITHIN_MOUNT/TOTAL_RETRIES unchanged,
#      so an ENOSPC-driven re-queue costs a file nothing against its retry budget - it is purely
#      a re-fetch on the next tape. See the stress-scale-fail-test CI job for the actual value.
#
#   2. Genuine transfer/retrieve faults, injected by VtlDrive itself (see
#      taped/drive/VtlDrive.hpp's MediaTypeInfo::transferFailureRate/retrieveFailureRate),
#      likewise driven by CLI flags on create_instance.sh, not set here. Unlike (1), this DOES
#      consume one of a file's limited retry attempts (ArchiveRequest::TOTAL_RETRIES /
#      REPORT_RETRIES = 2, i.e. 3 total attempts) - but VtlDrive guarantees AT MOST ONE such fault
#      per file for its entire lifetime (see maybeInjectFault()'s one-time, atomic marker), so a
#      file always has at least 2 attempts left after it. Combined with (1) costing nothing, no
#      file can ever exhaust its retry budget from these two mechanisms alone.
#
#   3. Deliberate mid-run disruption: the test harness itself kills up to 10 taped pods mid-mount
#      and 2 diskReportArchive/diskReportRetrieve pods mid-batch, all roughly at once (see
#      NUM_MOUNTS_TO_DISRUPT/NUM_REPORT_BATCHES_TO_DISRUPT in tests/stress_scale_fail_test.py and
#      the stress-scale-fail-test CI job's pytest invocation), to prove the maintd cleanup
#      routines (Archive/RetrieveInactiveMountActiveQueueRoutine, ResubmitInactiveReportingRoutine)
#      actually recover that work under multiple simultaneous losses, not just the job's own
#      graceful-shutdown path.
#
# The test's final assertions are that archival/retrieval loss stays within the same
# max_acceptable_loss_percent tolerance as stress-scale-test, AND that zero rows are left behind
# in any *_FAILED_QUEUE or stuck IS_REPORTING - i.e. that the cleanup routines did their job even
# for whatever (if anything) the tolerance above allowed to be lost. See
# tests/stress_scale_fail_test.py.
#
# What is intentionally UNCHANGED from stress-scale-values.yaml
# ---------------------------------------------------------------
# transfers.archive/retrieve.fetchMaxFiles stay at 5000: overflowFraction only changes the
# DERIVED TAPE CAPACITY (filesPerTape = batchFiles / (2 * overflowFraction)), not batchFiles
# itself, so T_batch = fetchMaxFiles / rate is unaffected and the existing
# maintd.routines.userActiveQueueCleanup.ageForCollectionSecs margin over G_max (see that
# preset's comment) still holds unchanged.
#
# What DOES change here
# ----------------------
# The mount cycle shortens (more frequent tape-fill boundaries by design), so
# ageForCollectionSecs's margin over the MOUNT CYCLE (not over G_max, which is unaffected) is
# recomputed below for the higher overflowFraction the CI job actually uses.

maintd:
  routines:
    # At the stress-scale-fail-test CI job's overflow fraction (0.20, see that job's
    # --stress-overflow-fraction), filesPerTape = 5000 / (2 x 0.20) = 12 500, so the mount cycle
    # shortens from stress-scale-values.yaml's ~16.7 min to ~4.2 min (12 500 / 50 Hz = 250 s).
    # G_max (T_batch + T_change ~ 190 s, see stress-scale-values.yaml's derivation - unaffected,
    # since it depends on fetchMaxFiles/rate and mountDelayMaxMs, neither of which changed here)
    # is now 76% of the mount cycle itself, where at the base preset's 0.05 it was only 19%.
    #
    # A thinner-than-base-preset margin was tried here (240 s, ~1.26x G_max, 96% of the mount
    # cycle) on the reasoning that neither failure class this test injects (end-of-tape overflow,
    # VtlDrive's one-time fault injection) can ever exhaust a file's retry budget regardless of how
    # long reclaim takes, so a slower reclaim should only cost wall-clock time, never a lost file.
    # In practice that margin was too thin: stacking the deliberate taped/report-pod disruptions
    # (tests/stress_scale_fail_test.py's test_disrupt_archive_mount/test_disrupt_report_batch) adds
    # a real DB-contention spike on top of it, long enough to push even a STILL-HEALTHY mount's
    # apparent last-fetch age past 240 s - triggering ArchiveInactiveMountActiveQueueRoutine to
    # reclaim that live mount's ARCHIVE_ACTIVE_QUEUE rows out from under it mid-batch. The mount
    # then finds its own in-flight jobs no longer match the DB state when it tries to report them,
    # has nothing left to do, and ends - triggering an immediate remount - which is what showed up
    # as frequent archive mount/unmount churn and near-zero net throughput in practice, not file
    # loss. (It also risks a file being written and reported twice if a reclaimed job keeps running
    # to completion in the original mount's session - see scheduler/rdbms/ArchiveMount.cpp's
    # refreshMountLivenessHeartbeat(), which closes the equivalent race for mounts busy reporting,
    # but not for one simply busy writing when reclaim fires.)
    #
    # 600 s restores the base preset's own value, same margin discipline it uses elsewhere, chosen
    # over keeping 240 s now that the disruption tests are paced with real recovery windows
    # (MIN_SECS_SINCE_DRIVES_UP/MIN_SECS_SINCE_PREVIOUS_DISRUPTION in stress_scale_fail_test.py) -
    # false-positive reclaim of a healthy mount is worse for this test's actual goal (proving clean
    # recovery from each disruption) than a slower genuine reclaim. Do not reuse 240 s (or re-derive
    # a different thin value) as a general template without accounting for the disruption tests'
    # own DB load, not just the steady-state G_max/cycle relationship at the overflowFraction in use.
    userActiveQueueCleanup: &failCleanup
      replicas: 1
      sleepIntervalSecs: 30
      batchSize: 30000
      ageForCollectionSecs: 900
    userPendingQueueCleanup: *failCleanup
