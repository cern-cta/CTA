#
# Failure-scenario overlay for the stress-scale-fail-test CI job. Applied ON TOP OF
# stress-scale-values.yaml (both files go in STRESS_CTA_VALUES_CHAIN, same as every other preset
# combination in this directory) - it only contains what differs for deliberately exercising
# CTA's failure-recovery paths at scale, not a duplicate of the base scale-test tuning.
#
# What this test is for
# ----------------------
# stress-scale-test proves CTA can sustain a target throughput. This test proves CTA RECOVERS
# from a representative mix of failures without losing any file, by deliberately engineering
# three independent failure classes into the same run:
#
#   1. Tape-boundary overflow (end-of-tape re-queues). Driven by
#      --stress-overflow-fraction on create_instance.sh (NOT set here - it targets the
#      virtual-tape-library chart, not this cta-chart overlay). This path is RETRY-NEUTRAL:
#      ArchiveJobQueueRow::requeueJobBatch() copies RETRIES_WITHIN_MOUNT/TOTAL_RETRIES unchanged,
#      so an ENOSPC-driven re-queue costs a file nothing against its retry budget - it is purely
#      a re-fetch on the next tape. See the stress-scale-fail-test CI job for the actual value.
#
#   2. Genuine transfer/retrieve faults, injected by VtlDrive itself (see
#      taped/drive/VtlDrive.hpp's MediaTypeInfo::transferFailureRate/retrieveFailureRate),
#      likewise driven by CLI flags on create_instance.sh, not set here. Unlike (1), this DOES
#      consume one of a file's limited retry attempts (ArchiveRequest::TOTAL_RETRIES /
#      REPORT_RETRIES = 2, i.e. 3 total attempts) - but VtlDrive guarantees AT MOST ONE such fault
#      per file for its entire lifetime (see maybeInjectFault()'s one-time, atomic marker), so a
#      file always has at least 2 attempts left after it. Combined with (1) costing nothing, no
#      file can ever exhaust its retry budget from these two mechanisms alone.
#
#   3. Deliberate mid-run disruption: the test harness itself kills a taped pod mid-mount and a
#      diskReportArchive/diskReportRetrieve pod mid-batch (see the stress-scale-fail-test CI
#      job's pytest invocation), to prove the maintd cleanup routines
#      (Archive/RetrieveInactiveMountActiveQueueRoutine, ResubmitInactiveReportingRoutine) are
#      what actually recovers that work, not just the job's own graceful-shutdown path.
#
# The test's final assertion is that every one of total_files ends up visible in the catalogue
# with zero rows left behind in any *_FAILED_QUEUE or stuck IS_REPORTING - i.e. that the retry
# budget was never exhausted and the cleanup routines did their job. See
# tests/stress_scale_fail_test.py.
#
# What is intentionally UNCHANGED from stress-scale-values.yaml
# ---------------------------------------------------------------
# transfers.archive/retrieve.fetchMaxFiles/flushMaxFiles: inherited as-is (4000/8000). This job
# still derives tape capacity from overflowFraction (via --stress-overflow-fraction, NOT set
# here - it targets the virtual-tape-library chart, not this cta-chart overlay), unlike
# stress-scale-test, which now sizes capacity directly via filesPerTapeOverride instead - the two
# jobs deliberately use different, mutually-exclusive capacity mechanisms (see that chart's
# values.yaml), so fetchMaxFiles changing on the base preset does not couple to this file's own
# tape-boundary math below.
#
# What DOES change here
# ----------------------
# ageForCollectionSecs only, and only to stay in sync with the stress-scale-fail-test CI job's own
# FAIL_AGE_FOR_COLLECTION_SECS bash variable (tests-kubernetes.gitlab-ci.yml), which that job
# computes its own margin-safety WARNING against for whatever STRESS_OVERFLOW_FRACTION a run
# actually uses - the two must be kept equal by hand, bash cannot read this YAML. batchSize and
# sleepIntervalSecs are left at the base preset's defaults.

maintd:
  routines:
    # ageForCollectionSecs here tracks tests-kubernetes.gitlab-ci.yml's FAIL_AGE_FOR_COLLECTION_SECS
    # (keep the two equal by hand) rather than being derived from this file's own overflow fraction:
    # STRESS_OVERFLOW_FRACTION is meant to be varied per run via "Play with variables", so a single
    # value baked in here could not stay valid across runs anyway - that CI job instead WARNS at
    # render time if the age is unsafely close (>80%) to the mount cycle a given run's actual
    # fraction/total_files/drive-count/rate produce: too close, and a still-healthy mount's last-fetch
    # age can be mistaken for a dead one mid-batch. See that job's comment for the full computation.
    userActiveQueueCleanup: &failCleanup
      replicas: 1
      sleepIntervalSecs: 60
      batchSize: 50000
      ageForCollectionSecs: 900
    userPendingQueueCleanup: *failCleanup
