# Keep telemetry resources in the deployment namespace; scraping needs no Kubernetes discovery.
prometheus:
  enabled: true
  # Remove the upstream API-server, kubelet and cluster discovery jobs.
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
  extraScrapeConfigs: |
    - job_name: "prometheus"
      static_configs:
        - targets: ["localhost:9090"]
    {{- if index .Values "kube-state-metrics" "enabled" }}
    - job_name: "kube-state-metrics"
      static_configs:
        - targets: ["prometheus-kube-state-metrics:8080"]
    {{- end }}
    {{- if index .Values "prometheus-node-exporter" "enabled" }}
    - job_name: "node-exporter"
      static_configs:
        - targets: ["prometheus-prometheus-node-exporter:9100"]
    {{- end }}
    - job_name: "otel-collector"
      static_configs:
        - targets:
          - otel-opentelemetry-collector:8889

  rbac:
    create: false

  alertmanager:
    enabled: false

  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    enabled: true
    rbac:
      useClusterRole: false
    releaseNamespace: true
    # Only namespaced workload and storage state; no node or cluster inventory.
    collectors:
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - jobs
      - cronjobs
      - persistentvolumeclaims

  # Host CPU/memory metrics; this does not provide per-container cAdvisor metrics.
  prometheus-node-exporter:
    fullnameOverride: prometheus-prometheus-node-exporter
    enabled: true

  prometheus-pushgateway:
    enabled: false

  server:
    fullnameOverride: prometheus-server
    automountServiceAccountToken: false
    global:
      scrape_interval: 15s
      scrape_timeout: 3s

    persistentVolume:
      enabled: false

otel:
  enabled: true
  fullnameOverride: otel-opentelemetry-collector
  clusterRole:
    create: false
  image:
    repository: registry.cern.ch/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.129.1

  # Note that this is just for a simple single-node deployment
  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s

    exporters:
      prometheus:
        endpoint: ${env:MY_POD_IP}:8889
        # Ensures all resource-level attributes becomes metric-level attributes
        # We lose the service.instance.id during aggregation, so without doing
        # this we have no way to correlate the metric to the resource
        resource_to_telemetry_conversion:
          enabled: true

    service:
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - prometheus

      extensions:
        - health_check
  ports:
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
