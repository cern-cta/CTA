#
# Performance overlay for PostgreSQL-scheduler stress tests (10 M small files, 30 drives).
#
# ---------------------------------------------------------------------------
# Pipeline
# ---------------------------------------------------------------------------
#
#   Test script
#     → EOS FSTs (5 replicas)        file creation & workflow trigger
#     → EOS MGM / frontend-wfe       workflow event → pgsched archive INSERT
#     → pgsched archive queue
#     → taped (30 StressDrives)      fetch → EOS disk read → virtual tape write
#     → pgsched disk report queue
#     → maintd diskReportArchive     batch drain → EOS catalogue update
#
# ---------------------------------------------------------------------------
# Observed throughput ceiling
# ---------------------------------------------------------------------------
#
# Historically the end-to-end archive queuing rate has been observed at
# ~1.3 kHz (files/sec from EOS workflow event to pgsched).  The bottleneck
# appears to be the EOS MGM / frontend-wfe path rather than the CTA side.
# Whether a 5th FST or other changes push this higher is to be determined
# empirically — the CTA components below are sized to not be the bottleneck
# up to at least 5 kHz, so the limiting factor should remain on the EOS side.
#
# At 1.3 kHz: 10 M files take ~2 h 8 min end-to-end.
#
# ---------------------------------------------------------------------------
# Parameter sizing rationale
# ---------------------------------------------------------------------------
#
# frontend-wfe schedulerdb.numberOfConnections = 15
#   Each WFE connection is held for the duration of one pgsched INSERT
#   (~5–10 ms with opportunistic batching).  At 1.3 kHz with 10 ms batching
#   window: ~13 files/batch, ~100 INSERT batches/sec.  One connection handles
#   100 batches/sec × 10 ms = 1 batch at a time → 2 connections would suffice,
#   but 15 gives ample headroom for bursts and latency spikes.
#
# opportunisticBatchingWindowMs = 10 ms
#   At 1.3 kHz: ~13 files accumulate per 10 ms window → each INSERT covers
#   ~13 files, reducing DB round-trips by ~13×.  Increasing the window trades
#   latency for fewer INSERTs; 10 ms is a good balance.
#
# taped nbDiskThreads = 40 (mhvtl/real-hardware), overridden to 5 for StressDrives
#   DiskReadThreadPool is instantiated per drive session (not shared).  For
#   mhvtl tests with few drives, 40 threads/drive is fine.  For StressDrive
#   tests with 30 drives, 40×30 = 1200 concurrent XRootD connections saturate
#   the EOS FSTs (5 × 256 = 1280 threads), stalling reads to seconds and
#   causing the adaptive mirror to sleep equally long per block.  The
#   stress-stressdrives-pgsched-values.yaml preset overrides this to 5:
#   30 × 5 = 150 connections, adequate pipeline depth (reads ~1–3 ms,
#   drive writes one file per ~1 ms at maxWriteRateHz=1000).
#
# taped archiveFetchBytesFiles = 40 000 files
#   Each drive fetches up to 40 k files per pgsched poll.  At 43 files/s/drive
#   one batch lasts ~930 s (~15 min), so DB poll frequency is very low.
#   Tape capacity is ~320 k files (150 MB / 470 B), so a batch covers about
#   1/8 of a tape session — minimal requeue churn at ENOSPC boundaries.
#
# taped schedulerNumberOfConnections = 2 per drive (60 total for 30 drives)
#   See scheduler DB connection budget below.
#
# taped archiveDismountPolicy = "300, 3, 0, 1"
#   startThreshold = 0 disables underfill-driven dismounts.  In stress tests
#   the queue arrival rate is the bottleneck, not the drives, so drives will
#   always appear "underfilled" between file batches.  Keeping drives mounted
#   avoids unnecessary 5 s remount delays during queue draining.
#
# maintd diskReportArchive replicas = 4, batchSize = 20 000, sleep = 1 s
#   Capacity = 4 × 20 000 / 1 s = 80 k files/s >> observed 1.3 kHz queue
#   rate.  1 s sleep keeps EOS catalogue updates within 1 s of tape write
#   confirmation.  softTimeoutSecs = 30 >> 20 000 / 1300 ≈ 15 s/batch.
#
# ---------------------------------------------------------------------------
# PostgreSQL scheduler DB connection budget (max 150 connections)
# (repeated in table form below for quick reference)
# ---------------------------------------------------------------------------

global:
  # Keep crash evidence in a pod volume for stress-run investigation
  extraVolumes:
    volumes:
      - name: coredumps
        emptyDir: {}
    volumeMounts:
      - name: coredumps
        mountPath: /var/log/tmp

frontend-admin:
  conf:
    catalogue:
      # Admin/repack commands are low-frequency; 10 connections is ample.
      numberOfConnections: 10
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"

frontend-wfe:
  conf:
    catalogue:
      numberOfConnections: 10
    schedulerdb:
      # Each WFE workflow event holds a schedulerdb connection for the archive INSERT (~5 ms).
      # With 3 connections: throughput cap = 3 / 0.005 = ~600 files/sec — the observed 762 Hz
      # ceiling.  With 5 FSTs and 1-2 kHz expected: 15 connections → ~3 kHz cap gives
      # ample headroom; see connection budget below.
      numberOfConnections: 15
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"
    schedulerdb:
      # Tuning only, applied whether or not batching ends up enabled: does NOT itself turn batching
      # on. That is controlled solely by the enable-opportunistic-batching pipeline input, via
      # presets/pgsched-opportunistic-batching-values.yaml -- this file used to also hardcode
      # opportunisticBatchingEnabled: true here, which always won (later file in the values chain)
      # over that input, making the input a no-op for stress tests.
      opportunisticBatchingWindowMs: 10
      # A safety ceiling on single-round batch size, not a target: real workloads should virtually
      # never hit it (the window ends most rounds first), so it mainly guards against a pathological
      # burst producing one unreasonably large bulk INSERT rather than shaping normal throughput.
      opportunisticBatchingMaxBatchSize: 1000

# ---------------------------------------------------------------------------
# PostgreSQL catalogue DB connection budget (max_connections on target postgres)
# catalogue connections: nbConns is hardcoded to 1 in taped and maintd.
# ---------------------------------------------------------------------------
# Pod                              replicas  conn/pod  subtotal
# frontend-admin (catalogue)            1       10        10
# frontend-wfe   (catalogue)            1       10        10
# maintd diskReportArchive              4        1         4
# maintd diskReportRetrieve             4        1         4
# maintd repackExpand                   1        1         1
# maintd repackReport                   1        1         1
# taped  20 drives × 1 conn/drive                        20
# taped  30 drives × 1 conn/drive                        30
# ---------------------------------------------------------------------------
# Total (20 drives):                                      50
# Total (30 drives):                                      60
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PostgreSQL scheduler DB connection budget (max 150 connections)
# ---------------------------------------------------------------------------
# schedulerNumberOfConnections in taped is a PER-DRIVE pool: each DriveHandler
# creates its own SchedulerDBInit.  Budget for taped = drives × conn/drive.
# ---------------------------------------------------------------------------
# Pod                              replicas  conn/pod  subtotal
# frontend-wfe (schedulerdb)            1       15        15
# frontend-admin (schedulerdb)          1        3         3
# maintd diskReportArchive              4        3        12
# maintd diskReportRetrieve             4        3        12
# maintd repackExpand                   1        3         3
# maintd repackReport                   1        3         3
# taped  10 drives × 2 conn/drive                        20
# taped  20 drives × 2 conn/drive                        40
# taped  30 drives × 2 conn/drive                        60
# ---------------------------------------------------------------------------
# Total (10 drives):                                      68   (budget: 150)
# Total (20 drives):                                      88   (budget: 150)
# Total (30 drives):                                     108   (budget: 150)
# max drives at budget: (150 - 48 fixed) / 2 = 51
# ---------------------------------------------------------------------------

taped:
  conf:
    taped:
      # Keep enough files in flight to support the larger scheduler/reporting batches below.
      bufferCount: 10000
      # Avoid verbose tape-operation logs dominating the small-file workload.
      logMask: "WARNING"
      schedulerNumberOfConnections: 3

maintd:
  logging:
    # Reduce routine logging overhead while retaining warnings and errors.
    level: "WARNING"
  routines:
    # Note that the snake_case version of all these options (including the names)
    # should match the corresponding names in the maintd conf file
    # So diskReportArchive:softTimeout will map to cta.routines.disk_report_archive.soft_timeout
    # To disable a routine, set replicas to 0
    # Sizing rationale: with 5 FSTs the archive queue runs at ~3.8 kHz.
    # 4 reporters × 20 k batch / 1 s sleep = 80 k files/sec capacity, well
    # above EOS capacity.  1 s sleep keeps reporting latency ≤ 1 s so EOS
    # file status is updated promptly throughout the run.
    # softTimeoutSecs = 30 s >> 20 k / 3.8 kHz ≈ 5 s/batch — ample margin.
    diskReportArchive:
      replicas: 4
      sleepIntervalSecs: 1
      batchSize: 20000
      softTimeoutSecs: 30
    diskReportRetrieve:
      replicas: 4
      sleepIntervalSecs: 1
      batchSize: 20000
      softTimeoutSecs: 30
    # Repack is not used in archive-only stress tests: zero replicas avoids
    # unnecessary DB polls and frees scheduler connections for the active workload.
    repackExpand:
      replicas: 0
      sleepIntervalSecs: 10
      maxToExpand: 2
    repackReport:
      replicas: 0
      sleepIntervalSecs: 10
      softTimeoutSecs: 30
