global:
  # Keep crash evidence in a pod volume for stress-run investigation; copy it before deleting the pod.
  extraVolumes:
    volumes:
      - name: coredumps
        emptyDir: {}
    volumeMounts:
      - name: coredumps
        mountPath: /var/log/tmp

frontend-admin:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"

frontend-wfe:
  conf:
    catalogue:
      # Allow concurrent requests without a small catalogue connection pool limiting throughput.
      numberOfConnections: 50
    logger:
      # Reduce per-request logging overhead during sustained load.
      logLevel: "WARNING"

taped:
  conf:
    taped:
      # Keep enough files in flight to support the larger scheduler/reporting batches below.
      bufferCount: 10000
      # Avoid verbose tape-operation logs dominating the small-file workload.
      logMask: "WARNING"
      # Bound per-tape-daemon database concurrency; total connections scale with the drive count.
      schedulerNumberOfConnections: 3

maintd:
  logging:
    # Reduce routine logging overhead while retaining warnings and errors.
    level: "WARNING"
  routines:
    # Note that the snake_case version of all these options (including the names)
    # should match the corresponding names in the maintd conf file
    # So diskReportArchive:softTimeout will map to cta.routines.disk_report_archive.soft_timeout
    # To disable a routine, set replicas to 0
    # Parallel reporters and larger batches keep archive completion reporting from backing up.
    diskReportArchive:
      replicas: 2
      # Poll frequently to drain completed work; batch size and worker count are not a rate guarantee.
      sleepIntervalSecs: 5
      # Amortize database and reporting overhead across many small files.
      batchSize: 4000
      # Bound a reporting pass so workers can return to other queued work.
      softTimeoutSecs: 30
    # Apply the same reporting capacity to completed retrievals.
    diskReportRetrieve:
      replicas: 2
      # Poll frequently to drain completed work; batch size and worker count are not a rate guarantee.
      sleepIntervalSecs: 5
      # Amortize database and reporting overhead across many small files.
      batchSize: 4000
      # Bound a reporting pass so workers can return to other queued work.
      softTimeoutSecs: 30
    # Keep repack expansion bounded rather than adding many concurrent requests.
    repackExpand:
      replicas: 1
      sleepIntervalSecs: 10
      maxToExpand: 2
    # Retain a single periodic worker for repack reporting.
    repackReport:
      replicas: 1
      sleepIntervalSecs: 10
      softTimeoutSecs: 30
