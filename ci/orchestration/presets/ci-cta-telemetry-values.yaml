# See https://monit.docs.cern.ch/other/metrics/

# These values can be combined with other values files.
# The frontends share one configuration; the tape-path services differ only in reader cadence.
frontend-wfe: &telemetry
  extraEnv:
    - name: OTEL_EXPORTER_CREDENTIALS
      valueFrom:
        secretKeyRef:
          name: monit-it-sd-tab-ci-credentials
          key: credentials

  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 5000
            timeout: 4000
            exporter:
              otlp_http:
                endpoint: https://monit-otlp.cern.ch:4319/v1/metrics
                headers_list: "Authorization=Basic ${OTEL_EXPORTER_CREDENTIALS}"
                compression: gzip
                timeout: 1000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

frontend-admin: *telemetry

# Tape-path services need a slower reader than the frontends: taped runs one pod per drive, so a
# 100-drive scale test puts ~100 OTLP POSTs/s on this endpoint at the frontends' 1 s cadence, and
# the 500 ms reader timeout is then exceeded routinely. The SDK drops such an export silently, and
# once exports fail for longer than the metric expiry the series vanishes - the holes in the taped
# and maintd dashboards. 15 s matches the Prometheus scrape cycle, so every scrape window still
# gets exactly one fresh export per pod, and 13 s satisfies the declarative-config constraint
# timeout < interval while leaving a lenient window. Exporting less often loses no data: OTel
# cumulative counters always carry the full lifetime value.
#
# Everything else - endpoint, credentials, encoding - is identical to the block above. It is
# repeated rather than referenced because telemetryConfig reaches the services verbatim, so there
# is no way to override only the cadence; keeping both blocks in this one file is what stops a
# copy elsewhere from drifting and sending metrics to the wrong endpoint.
taped: &tapePathTelemetry
  extraEnv:
    - name: OTEL_EXPORTER_CREDENTIALS
      valueFrom:
        secretKeyRef:
          name: monit-it-sd-tab-ci-credentials
          key: credentials

  # The structure below follows the OpenTelemetry Declarative config format
  telemetryConfig: |
    file_format: "1.1"
    disabled: false
    resource:
      attributes:
        - name: service.namespace
          value: {{ .Release.Namespace }}
          type: string
      attributes_list: "${CTA_OTEL_RESOURCE_ATTRIBUTES}"
      schema_url: https://opentelemetry.io/schemas/1.16.0

    meter_provider:
      readers:
        - periodic:
            interval: 15000
            timeout: 13000
            exporter:
              otlp_http:
                endpoint: https://monit-otlp.cern.ch:4319/v1/metrics
                headers_list: "Authorization=Basic ${OTEL_EXPORTER_CREDENTIALS}"
                compression: gzip
                timeout: 10000
                encoding: protobuf
                temporality_preference: cumulative
                default_histogram_aggregation: explicit_bucket_histogram

maintd: *tapePathTelemetry
rmcd: *tapePathTelemetry
