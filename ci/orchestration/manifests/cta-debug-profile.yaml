# Mount saved cores and logs in an ephemeral debugger using kubectl debug --custom.

securityContext:
  runAsUser: 0
  capabilities:
    add:
      - SYS_PTRACE
volumeMounts:
  - name: coredumps
    mountPath: /var/log/tmp
  - name: log-dir
    mountPath: /var/log/cta
