{{- $schedulerConfig := $.Values.global.scheduler -}}
{{- $allRoutines := include "maintd.routines" . | fromYaml -}}
{{- range $routineName, $routineConf := $allRoutines }}
{{- $routineNameSlug := include "common.slugify" $routineName }}
{{- $podName := printf "%s-%s-%s" $.Release.Name "rt" $routineNameSlug | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
spec:
  replicas: {{ $routineConf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $podName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $podName }}
        {{- include "common.labels.withoutname" $ | nindent 8 }}
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      imagePullSecrets:
      {{- include "maintd.imagePullSecrets" $ | nindent 6 }}
      {{- if $.Values.pod.extraSpec }}
      {{ $.Values.pod.extraSpec | toYaml | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000 # cta
        runAsGroup: 1000 # cta
        fsGroup: 1000 # cta
      containers:
      - name: cta-maintd
        image: {{ include "maintd.image" $ }}
        imagePullPolicy: {{ include "maintd.imagePullPolicy" $ }}
        stdin: true
        command: ["/scripts/maintd.sh"]
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 60
          failureThreshold: 100  # For now we don't want the pod to restart in CI
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" $ }}
          privileged: {{ include "common.securityContext.privileged" $ }}
        env:
        - name: TERM
          value: "xterm"
        {{- with $.Values.extraEnv }}
        {{- include "common.extraEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: cta-maintd-config
          mountPath: /etc/cta/cta-maintd.toml
          subPath: cta-maintd.toml
        - name: opentelemetry-config
          mountPath: /etc/cta/cta-otel.yaml
          subPath: cta-otel.yaml
        - name: catalogue-config
          mountPath: /etc/cta/cta-catalogue.conf
          subPath: cta-catalogue.conf
        - name: maintd-sss-keytab
          mountPath: /etc/cta/cta-maintd.sss.keytab.grp # note the .grp to make it group readable
          subPath: {{ $.Values.keytab.subPath }}
        {{- include "common.scheduler.mounts" $schedulerConfig | nindent 8 }}

        - name: log-dir
          mountPath: /var/log/cta
        {{ include "common.extraVolumeMounts" $ | nindent 8 }}
      volumes:
      - name: scripts-volume
        configMap:
          name: scripts-maintd
          defaultMode: 0777
      - name: catalogue-config
        secret:
          secretName: {{ $.Values.global.catalogue.existingSecret }}
      {{- include "common.scheduler.volumes" $schedulerConfig | nindent 6 }}
      - name: cta-maintd-config
        configMap:
          name: cta-maintd-{{ $routineNameSlug }}-conf
      - name: opentelemetry-config
        configMap:
          name: cta-maintd-otel-conf
      - name: log-dir
        emptyDir: {}
      - name: maintd-sss-keytab
        secret:
          secretName: {{ $.Values.keytab.secretName }}
          defaultMode: 0400
      {{ include "common.extraVolumes" $ | nindent 6 }}
---
{{- end }}
