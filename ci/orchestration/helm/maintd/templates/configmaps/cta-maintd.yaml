{{- $schedulerConfig := include "scheduler.config" . | fromYaml -}}
{{- $allRoutines := .Values.routines -}}
{{- /* Routines without a settings section in cta-maintd.toml */ -}}
{{- $routinesWithoutSettings := list "garbageCollect" "mountDecisionLoop" -}}
{{- range $routineName, $routineConf := $allRoutines }}
{{- $routineNameSlug := include "common.slugify" $routineName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cta-maintd-{{ $routineNameSlug }}-conf
  labels:
    {{-  include "common.labels.standard" $ | nindent 4 }}
data:
  cta-maintd.toml: |-
    enabled_features = ["health_server"]
    enabled_experimental_features = ["telemetry"]

    [catalogue]
      config_file = "/etc/cta/cta-catalogue.conf"

    [mount_decision]
      config_file = "/etc/cta/cta-mount-decision.conf"
      number_of_connections = {{ $.Values.mountDecision.numberOfConnections }}

    [scheduler]
      backend_name = {{ $schedulerConfig.backend | quote }}

      config_file = "/etc/cta/cta-scheduler.conf"
      {{- if eq $schedulerConfig.backend "postgres" }}
      number_of_connections = {{ $.Values.scheduler.numberOfConnections }}
      {{- end }}
      tape_cache_max_age_secs = {{ $.Values.scheduler.tapeCacheMaxAgeSecs }}
      retrieve_queue_cache_max_age_secs = {{ $.Values.scheduler.retrieveQueueCacheMaxAgeSecs }}

    [logging]
      level = {{ $.Values.logging.level | quote }}
      format = "json"
      [logging.attributes]
        instance = {{ $.Release.Namespace | quote }}
        sched_backend = {{ $schedulerConfig.backend | quote }}

    [telemetry]
      config_file = "/etc/cta/cta-otel.yaml"
      on_init_failure = "fatal"

    [health_server]
      transport = "tcp"
    [health_server.tcp]
      host = "0.0.0.0"
      port = 8080

    [xrootd]
      # Overrides XrdSecPROTOCOL
      security_protocol = "sss"
      # Overrides XrdSecSSSKT
      sss_keytab_path = "/etc/cta/cta-maintd.sss.keytab.grp"

    [routines]
      cycle_sleep_interval_secs = {{ int64 $routineConf.sleepIntervalSecs | toString }}
      max_cycle_duration_secs = 900


      enabled_routines = [{{ include "common.toSnakeCase" $routineName | quote }}]
      {{- if not (has $routineName $routinesWithoutSettings) }}
      [routines.{{ include "common.toSnakeCase" $routineName }}]
      {{- range $k, $v := (omit $routineConf "replicas" "sleepIntervalSecs") }}
      {{ include "common.toSnakeCase" $k }} = {{ include "common.stringOrNumber" $v }}
      {{- end }}
      {{- end }}

---
{{- end }}
