image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-maintd
  tag: latest

# Note that by default this chart does not enable any routines for the objectstore/scheduler cleanup
# To do this, enable these explicitly by passing in another values file (see e.g. presets/dev-cta-maintd-*-values.yaml)
routines:
  # Note that the snake_case version of all these options (including the names)
  # should match the corresponding names in the maintd conf file
  # So diskReportArchive:softTimeoutSecs will map to cta.routines.disk_report_archive.soft_timeout_secs
  # To disable a routine, set replicas to 0
  diskReportArchive:
    replicas: 2
    sleepIntervalSecs: 1
    batchSize: 500
    softTimeoutSecs: 30
    iterSleepMs: 0
  diskReportRetrieve:
    replicas: 2
    sleepIntervalSecs: 1
    batchSize: 500
    softTimeoutSecs: 30
    iterSleepMs: 0
  repackExpand:
    replicas: 1
    sleepIntervalSecs: 1
    maxToExpand: 2
  repackReport:
    replicas: 1
    sleepIntervalSecs: 1
    softTimeoutSecs: 30
  mountDecisionLoop:
    replicas: 1
    sleepIntervalSecs: 1

logging:
  level: "INFO"

scheduler:
  # Disable the tape cache so tests see tape-state changes at once. A short retrieve-queue cache avoids
  # recomputing queue statistics under a shared lock for every request.
  tapeCacheMaxAgeSecs: 0
  retrieveQueueCacheMaxAgeSecs: 1
  numberOfConnections: 3

mountDecision:
  numberOfConnections: 1

# OpenTelemetry is entirely configured through declarative configuration
# Simply put the config verbatim here under telemetryConfig:
telemetryConfig: |
  file_format: "1.1"
  disabled: true

# SSS keytab to communicate to the disk buffer
keytab:
  secretName: eos-keytab
  subPath: eos.keytab

pod:
  extraSpec:
    terminationGracePeriodSeconds: 60

extraEnv: null

extraVolumes:
  volumes: null
  volumeMounts: null
