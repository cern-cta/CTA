image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-maintd
  tag: latest

# Routines for both scheduler backends are listed; only those matching global.scheduler.backend are deployed.
routines:
  # Note that the snake_case version of all these options (including the names)
  # should match the corresponding names in the maintd conf file
  # So diskReportArchive:softTimeoutSecs will map to cta.routines.disk_report_archive.soft_timeout_secs
  # To disable a routine, set replicas to 0
  diskReportArchive:
    replicas: 2
    sleepIntervalSecs: 1
    batchSize: 500
    softTimeoutSecs: 30
    iterSleepMs: 0
  diskReportRetrieve:
    replicas: 2
    sleepIntervalSecs: 1
    batchSize: 500
    softTimeoutSecs: 30
    iterSleepMs: 0
  repackExpand:
    replicas: 1
    sleepIntervalSecs: 1
    maxToExpand: 2
  repackReport:
    replicas: 1
    sleepIntervalSecs: 1
    softTimeoutSecs: 30
  # Objectstore scheduler (vfs and ceph) only.
  garbageCollect:
    replicas: 1
    sleepIntervalSecs: 1
  queueCleanup:
    replicas: 1
    sleepIntervalSecs: 1
    batchSize: 500
  # PostgreSQL scheduler only.
  userActiveQueueCleanup:
    replicas: 1
    sleepIntervalSecs: 900
    batchSize: 1000
    ageForCollectionSecs: 1800
  repackActiveQueueCleanup:
    replicas: 1
    sleepIntervalSecs: 900
    batchSize: 1000
    ageForCollectionSecs: 1800
  userPendingQueueCleanup:
    replicas: 1
    sleepIntervalSecs: 60
    batchSize: 1000
    ageForCollectionSecs: 120
  repackPendingQueueCleanup:
    replicas: 1
    sleepIntervalSecs: 60
    batchSize: 1000
    ageForCollectionSecs: 120
  # Also deletes elapsed disk system sleep entries; mount decisions already ignore expired entries,
  # so this daily cadence only affects how long those rows linger.
  schedulerMaintenanceCleanup:
    replicas: 1
    sleepIntervalSecs: 86400
    batchSize: 1000
    ageForDeletionSecs: 1209600

logging:
  level: "INFO"

scheduler:
  # Disable the tape cache so tests see tape-state changes at once. A short retrieve-queue cache avoids
  # recomputing queue statistics under a shared lock for every request.
  tapeCacheMaxAgeSecs: 0
  retrieveQueueCacheMaxAgeSecs: 1
  numberOfConnections: 3

# OpenTelemetry is entirely configured through declarative configuration
# Simply put the config verbatim here under telemetryConfig:
telemetryConfig: |
  file_format: "1.1"
  disabled: true

# SSS keytab to communicate to the disk buffer
keytab:
  secretName: eos-keytab
  subPath: eos.keytab

pod:
  extraSpec:
    terminationGracePeriodSeconds: 60

extraEnv: null

extraVolumes:
  volumes: null
  volumeMounts: null
