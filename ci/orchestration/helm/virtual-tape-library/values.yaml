#
# Configuration for one or more virtual (in-memory/on-disk) tape libraries used by
# VtlDrive scale tests.
#
# This chart creates:
#   1. libraryCount PersistentVolumeClaims (one per library).
#   2. A ConfigMap with one library.toml per library.
#   3. libraryCount pre-population Jobs that write directory layouts into each PVC.
#
# Library names and VID prefixes are auto-derived from the library index:
#   name      = "stress-lib-{i}"   (matches logicalLibraryName in create_instance.sh)
#   vidPrefix = "S{i}"             (e.g. S0 → S00001..S00180, S1 → S10001..S10180)
# VIDs are 6 chars: 2-char prefix + 4-digit index fits the ANSI tape label VSN field.
#
# After this chart is deployed, create_instance.sh --no-hardware-drives mounts
# each library PVC into every taped pod via generated extraVolumes, with
# mountPath = "/cta-stress-lib-{i}".
#
# Consistency requirements
# ------------------------
# setup_stress_drives_test.py reads each library.toml directly from the taped pod
# and derives all catalogue registration parameters from it.
# In CI, create_instance.sh always passes --set libraryCount=${num_libs} so this
# default is overridden automatically; it only applies to manual helm invocations.

# ---------------------------------------------------------------------------
# Number of independent logical libraries to create.
# Each library gets its own PVC, library.toml, and pre-population Job.
# Drives are split across libraries by create_instance.sh --num-stress-libraries.
# ---------------------------------------------------------------------------
libraryCount: 2

# ---------------------------------------------------------------------------
# Shared library configuration (applied to every library).
# Library name and vidPrefix are auto-derived from the index; do not set them here.
# ---------------------------------------------------------------------------
library:
  # Maximum milliseconds to wait for the single changer robot to become free.
  changerTimeoutMs: 30000

  # Per-drive transfer-rate ceilings in files/s, applied to every media type when set, overriding
  # their own maxWriteRateHz / maxReadRateHz. This is how create_instance.sh
  # --stress-write-rate-hz and --stress-read-rate-hz reach the chart: a --set on
  # library.mediaTypes[0].maxWriteRateHz would replace the whole list element and drop the media
  # type's name and capacity inputs with it.
  #
  # The empty string "" here is the ONLY "not set" value: the template
  # (library-conf-configmap.yaml) checks the override's KIND, not its truthiness, so an explicit
  # --set ...Override=0 (or 0.0, or false for persistOnFlushOverride) is honoured as that literal
  # value rather than silently falling back to the media type's own value - only leaving this at
  # "" (the default below) actually leaves the media type's own value in place.
  maxWriteRateHzOverride: ""
  maxReadRateHzOverride: ""
  # Same override mechanism, for the floor and ceiling of the mount-delay jitter window (see
  # mountDelayMs on each media type below); mountDelayMaxMsOverride alone (floor left unset) still
  # falls back to 2x whatever floor is in effect, override or not.
  mountDelayMsOverride: ""
  mountDelayMaxMsOverride: ""
  # Same override mechanism again, for VtlDrive's failure-scenario fault injection and its
  # eager-persist option (see the media type fields below and taped/drive/VtlDrive.hpp). These
  # stay at "" (unset) for every normal deployment and test, and are set only by the dedicated
  # failure-scenario test job - which defaults them to 0/false too unless explicitly overridden
  # via "Play with variables", since 0/0.0/false are themselves valid, safe values for these three
  # (unlike overflowFractionOverride below, 0 here just means "no injection", not a division).
  persistOnFlushOverride: ""
  transferFailureRateOverride: ""
  retrieveFailureRateOverride: ""
  # Same override mechanism, for the derived-capacity re-queue-fraction target (see
  # mediaTypes[].overflowFraction below and the template's derivation comment). Only meaningful
  # when the media type does not set an explicit capacityBytes AND filesPerTapeOverride (below) is
  # unset - both bypass this derivation entirely.
  #
  # UNLIKE the other overrides above, 0 is never a valid explicit value here: filesPerTape =
  # batchFiles / (2 * overflowFraction) divides by it, so an explicit --set
  # library.overflowFractionOverride=0 is now caught by the template's own validation and fails
  # the chart render with a clear message, rather than either silently falling back (the old bug)
  # or dividing by zero. Leave this at "" (unset) to use the media type's own overflowFraction -
  # that is the correct way to express "no deliberate tape-boundary stress", not an explicit 0.
  #
  # Deliberately exercised by stress-scale-fail-test ONLY (via --stress-overflow-fraction), to
  # make tape-boundary re-queuing frequent on purpose. stress-scale-test instead sizes capacity
  # directly from filesPerTapeOverride below, which is immune to the divide-by-zero concern and
  # is what actually eliminates overflow there - see that field's own comment.
  overflowFractionOverride: ""
  # Directly sets how many files a tape can hold, bypassing the overflowFraction derivation (and
  # its batchFiles/overflowFraction/logicalBytesPerFile inputs) entirely - same effect as setting
  # an explicit capacityBytes on the media type, but expressed in FILES, the unit the
  # overflowFraction math already reasons in, rather than bytes. This is how
  # create_instance.sh --stress-files-per-tape reaches the chart.
  #
  # stress-scale-test derives its own default for this from batchFiles (fetchMaxFiles) and a
  # target re-queue fraction ALONE - deliberately not from drive count or total_files, which have
  # no bearing on what fraction of a FULL tape's files get re-queued at a boundary (see that
  # job's own comment in tests-kubernetes.gitlab-ci.yml for the exact formula). Leave this at ""
  # (unset) for the normal overflowFraction-derived capacity instead (e.g. stress-scale-fail-test,
  # which never sets this).
  #
  # 0 is a valid explicit value here (immediately fails every mount with ENOSPC - not useful, but
  # not a division, so it renders rather than erroring): unlike overflowFractionOverride, this
  # field is a file COUNT, not a fraction in a divisor.
  #
  # A LARGE value here costs nothing extra in RAM or PVC I/O by itself: VtlDrive's in-memory tape
  # (InMemoryTape, taped/drive/InMemoryTape.cpp) grows its block vector only as files are
  # ACTUALLY written (writeBlock resizes on demand) and saveTape()/loadTape() only ever touch
  # written blocks - never the nominal capacity. A filesPerTapeOverride far larger than any drive
  # will realistically write during a run is exactly the point (see stress-scale-test's comment):
  # it is a ceiling nothing reaches, not a pre-allocated cost.
  filesPerTapeOverride: ""

  # Media type definitions — shared across all libraries.
  # setup_stress_drives_test.py reads these and registers them in the CTA catalogue.
  mediaTypes:
    - name: STRESSTAPE
      # Capacity is DERIVED from overflowFraction below ONLY as a fallback - every job that cares
      # about its actual capacity sets an explicit override instead (see library.*Override above):
      # stress-scale-test sets filesPerTapeOverride (derived from batchFiles and a target re-queue
      # fraction alone - see that job's own comment), stress-scale-fail-test sets
      # overflowFractionOverride (deliberately, to make re-queuing frequent). batchFiles/
      # overflowFraction below therefore only matter for a caller that sets neither override - see
      # the template's own comment for the exact overflowFraction formula.
      #
      # Why tape-boundary overflow matters at all
      # ------------------------------------------
      # A drive fetches work in batches of transfers.archive.fetchMaxFiles and pipelines the next
      # fetch while writing the current one; nothing limits a fetch to the tape's remaining space.
      # When the tape fills, ENOSPC ends the session and every job already fetched but not yet
      # written goes back to the queue. Those jobs are not failures - they are re-queued, and
      # re-queueing costs a scheduler round trip per job, bounded to about one fetch batch's worth
      # per boundary - a FRACTION of a FULL tape's files, batchFiles/(2 x filesPerTape), entirely
      # independent of drive count or total_files. Making that fraction negligible (stress-scale-
      # test's filesPerTapeOverride, ~0.01%) keeps crossings rare to the point of practical
      # elimination; making it large on purpose (stress-scale-fail-test's overflowFractionOverride,
      # 20%) makes them frequent, to exercise that recovery path and the cleanup routines.
      #
      # Raising capacity costs NOTHING extra in RAM or PVC I/O by itself: VtlDrive's in-memory
      # tape (taped/drive/InMemoryTape.cpp) grows its block vector only as files are ACTUALLY
      # written, and saveTape()/loadTape() only ever touch written blocks - never the nominal
      # capacity. What costs memory is files actually transferred to a given tape during a mount,
      # which is bounded by the run's real workload (total_files split across drives), not by how
      # large capacityBytes/filesPerTape nominally is. A capacity far beyond what any drive will
      # realistically write is a safe, free ceiling - that is exactly what makes overflow
      # avoidance (stress-scale-test) possible without any cost trade-off.
      #
      # batchFiles MUST equal transfers.archive.fetchMaxFiles in stress-scale-values.yaml -
      # relevant only to the overflowFraction fallback path above, not to filesPerTapeOverride.
      # logicalBytesPerFile is the tape footprint of one file: 6 ANSI label blocks of 80 bytes
      # plus the payload (16 bytes in the stress tests, see test_pgsched_params.toml). File marks
      # consume no capacity. vol1Bytes is the single 80-byte VOL1 label at the start of the tape.
      batchFiles: 5000
      overflowFraction: 0.01
      logicalBytesPerFile: 496
      vol1Bytes: 80
      mountDelayMs: 15000
      # Per-drive file-rate ceilings, in files/s. The per-file interval is 1/rate seconds and the
      # drive sleeps whatever is left of it since the previous file, so files are spaced at
      # max(arrival gap, interval): the ceiling binds when work is already queued and otherwise
      # the drive just mirrors the rate work arrives at. 0 disables the throttle, which
      # means transferring at RAM speed - fine for correctness tests, but it makes a mount last
      # seconds, so scale runs set both (see create_instance.sh --stress-{write,read}-rate-hz).
      maxWriteRateHz: 1000
      maxReadRateHz: 1000
      # Off by default: see MediaTypeInfo::persistOnFlush in taped/drive/VtlDrive.hpp.
      persistOnFlush: false
      # Fault injection for failure-scenario testing, off by default: see
      # MediaTypeInfo::transferFailureRate/retrieveFailureRate in taped/drive/VtlDrive.hpp. Set
      # non-zero only in a dedicated failure-scenario preset, e.g. stress-scale-fail-values.yaml.
      transferFailureRate: 0.0
      retrieveFailureRate: 0.0
      # Tapes per library. At this fallback capacity (250 000 files), a 4 000 000-file run needs
      # ~16 tapes in total (~4 per library with 4 libraries) at minimum; count: 100 gives generous
      # headroom and ensures every drive in a library can always find a free tape slot regardless
      # of which capacity override (if any) is actually in effect for a given job - stress-scale-
      # test's filesPerTapeOverride (25 000 000 at its own defaults) needs far FEWER tapes in
      # total for the same total_files, not more, so 100/library stays comfortably above the
      # minimum either way. Recompute only if total_files or drive count changes enough to matter
      # for the FALLBACK capacity path specifically. Tapes are only materialised on the PVC as
      # they are written, so the unused ones cost nothing.
      count: 100

# ---------------------------------------------------------------------------
# PersistentVolumeClaim (one created per library, named <namePrefix>-{i})
# ---------------------------------------------------------------------------
pvc:
  # Prefix for PVC names: cta-virtual-tape-library-0, cta-virtual-tape-library-1, ...
  namePrefix: cta-virtual-tape-library

  # Storage class. "" = cluster default, "-" = no storageClassName, any string = explicit.
  storageClass: ""

  # Optional: bind each PVC to a named PV. Set by create_instance.sh when fast-ssd
  # PVs are available. volumeNames[i] binds PVC i to that PV.
  volumeNames: []

  size: 50Gi

  accessModes:
    - ReadWriteOnce

# ---------------------------------------------------------------------------
# Pre-population Job image
# ---------------------------------------------------------------------------
image:
  repository: registry.cern.ch/docker.io/almalinux/9-minimal
  tag: "9.7"
  pullPolicy: IfNotPresent
