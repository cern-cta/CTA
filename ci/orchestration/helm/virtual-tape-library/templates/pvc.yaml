{{- range $i := until (int .Values.libraryCount) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Values.pvc.namePrefix }}-{{ $i }}
spec:
  accessModes:
    {{- range $.Values.pvc.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ $.Values.pvc.size | quote }}
  {{- if eq "-" $.Values.pvc.storageClass }}
  storageClassName: ""
  {{- else if $.Values.pvc.storageClass }}
  storageClassName: {{ $.Values.pvc.storageClass | quote }}
  {{- end }}
  {{- if gt (len $.Values.pvc.volumeNames) $i }}
  {{- with index $.Values.pvc.volumeNames $i }}
  volumeName: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
