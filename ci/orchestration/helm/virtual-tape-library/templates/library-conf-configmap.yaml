apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-library-conf
data:
{{- range $i := until (int .Values.libraryCount) }}
  library-{{ $i }}.toml: |
    [library]
    name             = "stress-lib-{{ $i }}"
    changerTimeoutMs = {{ $.Values.library.changerTimeoutMs }}
    {{- range $.Values.library.mediaTypes }}
    {{- /* overflowFraction derives a tape's capacity from the fraction of a drive's files
           expected to be re-queued at each tape-fill boundary: a drive fetches fixed-size
           batches of batchFiles regardless of remaining space, so at ENOSPC whatever was
           fetched but not yet written (up to one batch) goes back to the queue. Averaged over
           where the boundary falls, overflowFraction = (batchFiles/2) / filesPerTape, i.e.
           filesPerTape = batchFiles / (2 * overflowFraction). An estimate, not a guarantee -
           treat the actually observed re-queue rate as ground truth. */}}
    {{- /* Every *Override field is resolved with "ne (kindOf X) string", not Sprig's `default`:
           `default` treats ANY zero value (0, 0.0, false) as "not set", so an explicit
           --set ...Override=0 would be silently ignored. Each *Override field defaults to the
           string "" here, and --set always produces a non-string for a real override, so
           checking the KIND instead correctly honours an explicit 0/0.0/false. */}}
    {{- /* Capacity, in priority order: (1) the media type's own capacityBytes - wins outright.
           (2) library.filesPerTapeOverride - a direct file count, bypassing overflowFraction
           entirely (stress-scale-test: 1.1x each drive's fair share, computed by the CI job -
           see tests-kubernetes.gitlab-ci.yml). (3) the overflowFraction derivation above, the
           default for any caller setting neither (stress-scale-fail-test: 20%, deliberately). */}}
    {{- $capacityBytes := .capacityBytes }}
    {{- if not $capacityBytes }}
      {{- if ne (kindOf $.Values.library.filesPerTapeOverride) "string" }}
        {{- if not .logicalBytesPerFile }}
          {{- fail (printf "media type %s needs logicalBytesPerFile to use library.filesPerTapeOverride" .name) }}
        {{- end }}
        {{- $capacityBytes = add (default 80 .vol1Bytes) (mul (int64 $.Values.library.filesPerTapeOverride) .logicalBytesPerFile) }}
      {{- else }}
        {{- $overflowFraction := .overflowFraction }}
        {{- if ne (kindOf $.Values.library.overflowFractionOverride) "string" }}
          {{- $overflowFraction = $.Values.library.overflowFractionOverride }}
        {{- end }}
        {{- if or (not .batchFiles) (not $overflowFraction) (not .logicalBytesPerFile) }}
          {{- fail (printf "media type %s needs either capacityBytes, filesPerTapeOverride, or batchFiles + logicalBytesPerFile + a non-zero overflowFraction (0 is not a valid fraction - it would divide by zero deriving the tape's capacity; omit the override to use the media type's own overflowFraction instead, or set an explicit capacityBytes/filesPerTapeOverride to bypass the derivation entirely)" .name) }}
        {{- end }}
        {{- /* Go template pipe semantics append the piped value as the FINAL argument, so
               round's (value, precision) signature must be called directly rather than piped
               into - "X | round 0" would call round(0, X), the wrong argument order. */}}
        {{- $filesPerTapeFloat := divf (float64 .batchFiles) (mulf 2.0 $overflowFraction) }}
        {{- $filesPerTape := round $filesPerTapeFloat 0 | int64 }}
        {{- $capacityBytes = add (default 80 .vol1Bytes) (mul $filesPerTape .logicalBytesPerFile) }}
      {{- end }}
    {{- end }}

    [[library.mediaTypes]]
    name           = {{ .name | quote }}
    {{- /* int64, or Helm renders a large number in scientific notation (1e+06). VtlDrive reads
           this with toml value<uint64_t>(), which does not accept a TOML float: the capacity
           would silently fall back to its unlimited default and the tape would never fill. */}}
    capacityBytes  = {{ int64 $capacityBytes }}
    vidPrefix      = "S{{ $i }}"
    {{- /* Every optional number ends in "| default 0": a media type that omits the key AND whose
           override is unset would otherwise render "key = " and the TOML would not parse, which
           VtlDrive only discovers at drive startup. This last-resort `default` is safe precisely
           because it only ever sees .mountDelayMs/.maxWriteRateHz/etc (the media type's own
           field), never the *Override value - the override itself was already resolved above/
           below by kind, not by truthiness. */}}
    {{- $mountDelayMs := .mountDelayMs }}
    {{- if ne (kindOf $.Values.library.mountDelayMsOverride) "string" }}
      {{- $mountDelayMs = $.Values.library.mountDelayMsOverride }}
    {{- end }}
    mountDelayMs   = {{ $mountDelayMs | default 0 }}
    {{- $mountDelayMaxMs := .mountDelayMaxMs }}
    {{- if ne (kindOf $.Values.library.mountDelayMaxMsOverride) "string" }}
      {{- $mountDelayMaxMs = $.Values.library.mountDelayMaxMsOverride }}
    {{- end }}
    mountDelayMaxMs = {{ $mountDelayMaxMs | default 0 }}
    {{- /* library.max{Write,Read}RateHzOverride, persistOnFlushOverride and
           {transfer,retrieve}FailureRateOverride all apply to every media type, for the same
           reason: --set library.mediaTypes[0].maxWriteRateHz=N cannot be used, since Helm
           replaces a list element instead of merging into it, silently dropping the media type's
           name and capacity inputs. */}}
    {{- $maxWriteRateHz := .maxWriteRateHz }}
    {{- if ne (kindOf $.Values.library.maxWriteRateHzOverride) "string" }}
      {{- $maxWriteRateHz = $.Values.library.maxWriteRateHzOverride }}
    {{- end }}
    maxWriteRateHz = {{ $maxWriteRateHz | default 0 }}
    {{- $maxReadRateHz := .maxReadRateHz }}
    {{- if ne (kindOf $.Values.library.maxReadRateHzOverride) "string" }}
      {{- $maxReadRateHz = $.Values.library.maxReadRateHzOverride }}
    {{- end }}
    maxReadRateHz  = {{ $maxReadRateHz | default 0 }}
    {{- $persistOnFlush := .persistOnFlush }}
    {{- if ne (kindOf $.Values.library.persistOnFlushOverride) "string" }}
      {{- $persistOnFlush = $.Values.library.persistOnFlushOverride }}
    {{- end }}
    persistOnFlush = {{ $persistOnFlush | default false }}
    {{- $transferFailureRate := .transferFailureRate }}
    {{- if ne (kindOf $.Values.library.transferFailureRateOverride) "string" }}
      {{- $transferFailureRate = $.Values.library.transferFailureRateOverride }}
    {{- end }}
    transferFailureRate = {{ $transferFailureRate | default 0.0 }}
    {{- $retrieveFailureRate := .retrieveFailureRate }}
    {{- if ne (kindOf $.Values.library.retrieveFailureRateOverride) "string" }}
      {{- $retrieveFailureRate = $.Values.library.retrieveFailureRateOverride }}
    {{- end }}
    retrieveFailureRate = {{ $retrieveFailureRate | default 0.0 }}
    count          = {{ .count }}
    {{- end }}
{{- end }}
