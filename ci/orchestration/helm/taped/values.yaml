image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-taped
  tag: latest

conf:
  taped:
    bufferSizeBytes: 262144
    bufferCount: 200
    mountCriteria: "2000000, 100"
    archiveFetchBytesFiles: "80000000000, 4000"
    retrieveFetchBytesFiles: "80000000000, 4000"
    archiveDismountPolicy: "300, 3, 40, 60"
    watchdogIdleSessionTimer: 1  # Make tape servers more responsive, thus improving CI test speed
    logMask: "INFO"
    useEncryption: "no"
    # Reduce number of threads to reduce contention
    nbDiskThreads: 4
    # Decrease schedulerDB cache timeout for tests
    tapeCacheMaxAgeSecs: 1
    retrieveQueueCacheMaxAgeSecs: 1
    externalFreeDiskSpaceScript: "/usr/bin/cta-eosdf.sh"
    rmcHost: "cta-rmcd" # override with localhost if using hostnetwork
    schedulerNumberOfConnections: 3
    # Stress-test mode: set to true to bypass real SCSI hardware and mhvtl.
    # Drives must be registered in the CTA catalogue with DriveDevice = "stress://".
    # All taped pods must share stressBaseDir (use a hostPath volume in Kubernetes).
    stressMode: false
    stressBaseDir: "/dev/shm/cta-stress"
  telemetry:
    enabled: false
    retainInstanceIdOnRestart: false
    metrics:
      backend: "NOOP"
      exportInterval: 1000
      exportTimeout: 500
      otlp:
        endpoint: ""
        auth:
          basic:
            username: ""
            passwordSecret: ""
      file:
        endpoint: ""


# SSS keytab to communicate to the disk buffer
keytab:
  secretName: eos-keytab
  subPath: eos.keytab

# The following is an example format of drives
#
# drives:
#   - name: "VDSTK01"
#     device: "/dev/nst2"
#     logicalLibraryName: lib1
#     controlPath smc0
#   - name: "VDSTK02"
#     device: "/dev/nst0"
#     logicalLibraryName: lib2
#     controlPath smc1
drives: []

securityContext:
  privileged: true # To get access to /dev/

pod:
  extraSpec:
    terminationGracePeriodSeconds: 1

extraEnv:

extraVolumes:
  volumes:
  volumeMounts:
