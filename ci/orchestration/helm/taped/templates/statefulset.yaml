{{- $schedulerConfig := .Values.global.scheduler -}}
{{ range .Values.drives -}}
{{- $driveNameSlug := include "common.slugify" .name }}
{{- $tapedName := printf "%s-%s-%s" $.Release.Name "taped" $driveNameSlug | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: StatefulSet # StatefulSets enforce at most x pods semantics (in our case x=1)
metadata:
  name: {{ $tapedName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
spec:
  serviceName: {{ $tapedName }}  # Ensure a headless service exists with this name; allows for stable DNS entries
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $tapedName }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $tapedName }}
        {{- include "common.labels.withoutname" $ | nindent 8 }}
    spec:
      imagePullSecrets:
      {{- include "taped.imagePullSecrets" $ | nindent 6 }}
      {{- if $.Values.pod.extraSpec }}
      {{ $.Values.pod.extraSpec | toYaml | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000 # cta
        runAsGroup: 1000 # cta
        fsGroup: 1000 # cta
        supplementalGroups: {{ $.Values.pod.supplementalGroups | toJson }}
      containers:
      - name: cta-taped
        image: {{ include "taped.image" $ }}
        imagePullPolicy: {{ include "taped.imagePullPolicy" $ }}
        stdin: true
        command: ["/scripts/taped.sh"]
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 60
          failureThreshold: 100 # For now we don't want the pod to restart in CI
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" $ }}
          privileged: {{ include "common.securityContext.privileged" $ }}
          capabilities:
            add:
              - SYS_RAWIO
        env:
        - name: TERM
          value: "xterm"
        - name: DRIVE_NAME
          value: {{ .name }}
        - name: LOGICAL_LIBRARY_NAME
          value: {{ .logicalLibraryName }}
        - name: DRIVE_DEVICE
          value: {{ .device }}
        - name: DRIVE_CONTROL_PATH
          value: {{ .controlPath }}
        {{- with $.Values.extraEnv }}
        {{- include "common.extraEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: cta-taped-config
          mountPath: /etc/cta/cta-taped.toml
          subPath: cta-taped.toml
        - name: catalogue-config
          mountPath: /etc/cta/cta-catalogue.conf
          subPath: cta-catalogue.conf
        {{- include "common.scheduler.mounts" $schedulerConfig | nindent 8 }}
        - name: taped-sss-keytab
          mountPath: /etc/cta/cta-taped.sss.keytab.grp # note the .grp to make it group readable
          subPath: {{ $.Values.keytab.subPath }}
        - name: opentelemetry-config
          mountPath: /etc/cta/cta-otel.yaml
          subPath: cta-otel.yaml
        - name: log-dir
          mountPath: /var/log/cta
        {{ include "common.extraVolumeMounts" $ | nindent 8 }}
      volumes:
      - name: scripts-volume
        configMap:
          name: scripts-taped
          defaultMode: 0777
      - name: catalogue-config
        secret:
          secretName: {{ $.Values.global.catalogue.existingSecret }}
      {{- include "common.scheduler.volumes" $schedulerConfig | nindent 6 }}
      - name: cta-taped-config
        configMap:
          name: cta-taped-{{ $driveNameSlug }}-conf
      - name: taped-sss-keytab
        secret:
          secretName: {{ $.Values.keytab.secretName }}
          defaultMode: 0400
      - name: opentelemetry-config
        configMap:
          name: cta-taped-otel-conf
      - name: log-dir
        emptyDir: {}
      {{ include "common.extraVolumes" $ | nindent 6 }}
---
{{- end }}
