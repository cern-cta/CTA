{{- if .Values.client.enabled }}
{{- $name := printf "%s-client" .Release.Name }}
{{- $client := .Values.client }}
{{- $image := printf "%s:%s" $client.image.repository $client.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dcache-client
    app.kubernetes.io/part-of: dcache
spec:
  replicas: {{ $client.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: client
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dcache-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dcache-client
        app.kubernetes.io/part-of: dcache
    spec:
      automountServiceAccountToken: false
      {{- with $client.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $client.pod.extraSpec }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: client
        image: {{ $image | quote }}
        imagePullPolicy: {{ $client.image.pullPolicy }}
        stdin: true
        # Exit promptly on pod deletion while keeping the client available for kubectl exec.
        command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
        securityContext:
          {{- toYaml $client.securityContext | nindent 10 }}
        {{- with $client.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: MY_NAME
          value: {{ $name }}
        - name: MY_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: INSTANCE_NAME
          value: {{ .Release.Namespace | quote }}
        - name: TERM
          value: xterm
        {{- with $client.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $client.extraVolumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with $client.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
