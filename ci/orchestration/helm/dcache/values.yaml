# Values for the upstream dCache dependency.
dcache:
  # Run ZooKeeper in the door instead of a separate service.
  zookeeper:
    embedded: true

  dcache:
    # CTA tests do not use Kafka event export.
    configExtra: |
      dcache.enable.kafka = false
      dcache.billing.enable.kafka = false

    plugins:
      cta:
        enabled: true
        endpoint: "cta-frontend-wfe:10956"
        user: dcacheuser
        group: dcacheusers
        instance: dcache
        useTls: mtls
        caChain: /etc/grpc-certs/ca.crt.pem
        tlsCert: /etc/grpc-certs/dcache.crt.pem
        tlsKey: /etc/grpc-certs/dcache.key.pem

    pools:
      - a

    hsm:
      enabled: true

  services:
    srm:
      enabled: false

  extraVolumeMounts:
    - name: grpc-ca
      mountPath: /etc/grpc-certs/ca.crt.pem
      subPath: ca.crt.pem
      readOnly: true
    - name: dcache-client-crt
      mountPath: /etc/grpc-certs/dcache.crt.pem
      subPath: dcache-self-signed.crt.pem
      readOnly: true
    - name: dcache-client-key
      mountPath: /etc/grpc-certs/dcache.key.pem
      subPath: dcache-self-signed.key.pem
      readOnly: true

  extraVolumes:
    - name: grpc-ca
      secret:
        secretName: ca-crt-pem
    - name: dcache-client-crt
      secret:
        secretName: dcache-self-signed-crt-pem
    - name: dcache-client-key
      secret:
        secretName: dcache-self-signed-key-pem

# The disk client belongs to this backend, independently of the CTA tools image.
client:
  enabled: true
  replicas: 1
  image:
    # Reuse the CERN AlmaLinux base image used by the CI build and test images.
    repository: gitlab-registry.cern.ch/linuxsupport/alma9-base
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
  pod:
    extraSpec:
      terminationGracePeriodSeconds: 1
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
