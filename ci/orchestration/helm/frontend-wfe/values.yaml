image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-workflow-api
  tag: latest

# Take care with increasing this number, as CTA has not been tested with multiple frontend replicas
# Increasing this will most likely not work as expected
replicas: 1
enabled: true
port: 10956

conf:
  numberOfThreads: 512

  catalogue:
    numberOfConnections: 10

  frontend:
    zeroLengthFilesForbidden: true
    zeroLengthFilesForbiddenVoExceptionList: ""
    # repackBufferUrl

  schedulerdb:
    numberOfConnections: 3
    numberOfThreads: 500
    threadStackSizeMb: 1
    disableRepackRequests: false
    disableUserRequests: false
    # Disable the tape cache so tests see tape-state changes at once. A short retrieve-queue cache avoids
    # recomputing queue statistics under a shared lock for every request. The stress presets set their own ages.
    tapeCacheMaxAgeSecs: 0
    retrieveQueueCacheMaxAgeSecs: 2
    # Only takes effect with the postgres scheduler (pgsched); ignored by the objectstore
    # scheduler, which always queues one request at a time regardless of these values.
    opportunisticBatching:
      # Experimental: selects opportunistic_batching in the root enabled_experimental_features list.
      enabled: false
      # Only meaningful when enabled is true: see cta-workflow-api.pg.example.toml.
      windowMs: 10
      maxBatchSize: 1000

  logger:
    logLevel: "DEBUG"
    logFormat: json
    ssiLogLevel: "warning"

  tls:
    serverKey: /etc/grpc-certs/key/server-wfe.key.pem
    serverCert: /etc/grpc-certs/cert/server-wfe.crt.pem
    caCert: /etc/grpc-certs/ca/ca.crt.pem

  auth:
    method: jwt
    config:
      jwt:
        expectedIssuer: "cta"
        expectedAudience: "cta-wfe"
      mtls:
        aliases:
          ctaeos:
            - "eos-mgm.biglab"
            - "eos-mgm.biglab.ch"
          dcache:
            - "dcache"

# OpenTelemetry is entirely configured through declarative configuration
# Simply put the config verbatim here under telemetryConfig:
telemetryConfig: |
  file_format: "1.1"
  disabled: true

pod:
  extraSpec:
    terminationGracePeriodSeconds: 1

extraEnv: null

extraVolumes:
  volumes: null
  volumeMounts: null
