{{- if .Values.client.enabled }}

{{- $name := include "cta-admin-tools.client.fullname" . }}
{{- $labels := include "common.labels.withoutname" (dict "Values" (dict "component" "cli") "Release" .Release "Chart" .Chart) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- $labels | nindent 8 }}
    spec:
      imagePullSecrets:
      {{ include "cta-admin-tools.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.client.pod.extraSpec }}
      {{ .Values.client.pod.extraSpec | toYaml | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      initContainers:
      - name: init1-get-krb5-keytab
        image: {{ include "cta-admin-tools.image" . }}
        imagePullPolicy: {{ include "cta-admin-tools.imagePullPolicy" . }}
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" . }}
        command: ["/bin/bash", "-ec"]
        args:
        - |
          sukadmin() { printf '%s\n' {{ .Values.global.kerberos.adminPrinc.password | squote }} | kadmin -r {{ .Values.global.kerberos.defaultRealm | upper | quote }} -p {{ printf "%s/admin" .Values.global.kerberos.adminPrinc.name | quote }} "$@"; }
          # Wait for KDC startup without triggering init-container restart backoff.
          until sukadmin getprivs >/dev/null 2>&1; do
            echo "Waiting for Kerberos administration service..."
            sleep 1
          done
          sukadmin addprinc -randkey {{ .Values.client.krb5PrincName }};
          sukadmin ktadd -k /root/{{ .Values.client.krb5PrincName }}_keytab/output/{{ .Values.client.krb5PrincName }}.keytab {{ .Values.client.krb5PrincName }};
        volumeMounts:
        - name: krb5-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: "{{ .Values.client.krb5PrincName }}-keytab"
          mountPath: /root/{{ .Values.client.krb5PrincName }}_keytab/output
      containers:
      - name: cta-cli
        image: {{ include "cta-admin-tools.image" . }}
        imagePullPolicy: {{ include "cta-admin-tools.imagePullPolicy" . }}
        stdin: true
        command: ["/bin/bash", "/scripts/ctacli.sh"]
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" . }}
          privileged: {{ include "common.securityContext.privileged" . }}
        {{- if $.Values.client.resources }}
        resources:
          {{-  toYaml $.Values.client.resources | nindent 10 }}
        {{- end }}
        env:
        - name: TERM
          value: "xterm"
        {{- with .Values.client.extraEnv }}
        {{- include "common.extraEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: cta-conf-volume
          mountPath: /etc/cta/cta-cli.conf
          subPath: cta-cli.conf
        - name: ctaadmin1-jwt
          mountPath: /etc/cta/ctaadmin1.jwt
          subPath: ctaadmin1.jwt
        - name: "{{ .Values.client.krb5PrincName }}-keytab"
          mountPath: /root/{{ .Values.client.krb5PrincName }}.keytab
          subPath: "{{ .Values.client.krb5PrincName }}.keytab"
        - name: krb5-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        {{ include "common.extraVolumeMounts" (dict "Values" (merge (dict "global" .Values.global) .Values.client)) | nindent 8 }}
      volumes:
      - name: scripts-volume
        configMap:
          name: scripts-ctacli
          defaultMode: 0777
      - name: ctaadmin1-jwt
        secret:
          secretName: ctaadmin1-jwt
      - name: cta-conf-volume
        configMap:
          name: etc-cta-ctacli
      - name: "{{ .Values.client.krb5PrincName }}-keytab"
        emptyDir: {}
      - name: krb5-conf
        configMap:
          name: {{ .Values.global.kerberos.clientConfig.configMap }}
      {{ include "common.extraVolumes" (dict "Values" (merge (dict "global" .Values.global) .Values.client)) | nindent 6 }}


{{- end }}
