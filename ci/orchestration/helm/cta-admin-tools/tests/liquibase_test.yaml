suite: Explicit Liquibase maintenance
templates:
  - templates/liquibase-pod.yaml
tests:
  - it: does not start Liquibase by default
    asserts:
      - hasDocuments:
          count: 0
  - it: starts Liquibase for the selected external catalogue when requested
    set:
      liquibase.enabled: true
      global.catalogue.existingSecret: ci-catalogue
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.volumes[0].secret.secretName
          value: ci-catalogue
