suite: Database reset lifecycle
release:
  name: check
templates:
  - templates/database-reset-jobs.yaml
tests:
  - it: does not reset databases by default
    asserts:
      - hasDocuments:
          count: 0
  - it: resets only the explicitly requested catalogue
    set:
      reset.catalogue: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: check-reset-catalogue
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
  - it: resets only the explicitly requested external scheduler
    set:
      reset.scheduler: true
      global.scheduler.backend: postgres
      global.scheduler.existingSecret: ci-scheduler
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: check-reset-scheduler
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: ci-scheduler
  - it: resets the explicitly requested external catalogue
    set:
      reset.catalogue: true
      global.catalogue.existingSecret: ci-catalogue
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: ci-catalogue
  - it: resets both connections when explicitly requested
    set:
      reset.catalogue: true
      reset.scheduler: true
    asserts:
      - hasDocuments:
          count: 2
  - it: selecting external connections does not request resets
    set:
      global.catalogue.existingSecret: ci-catalogue
      global.scheduler.existingSecret: ci-scheduler
      global.scheduler.backend: postgres
    asserts:
      - hasDocuments:
          count: 0
