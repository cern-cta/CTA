suite: Database reset lifecycle
release:
  name: check
templates:
  - templates/database-reset-jobs.yaml
tests:
  - it: does not reset databases by default
    asserts:
      - hasDocuments:
          count: 0
  - it: resets only the explicitly requested catalogue
    set:
      reset.catalogue: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: check-reset-catalogue
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
  - it: bootstraps both unprotected connections
    set:
      reset.unprotected: true
    asserts:
      - hasDocuments:
          count: 2
  - it: bootstrap skips the protected catalogue
    set:
      reset.unprotected: true
      global.catalogue.protected: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: check-reset-scheduler
  - it: bootstrap skips the protected scheduler
    set:
      reset.unprotected: true
      global.scheduler.protected: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: check-reset-catalogue
  - it: bootstrap leaves both protected connections untouched
    set:
      reset.unprotected: true
      global.catalogue.protected: true
      global.scheduler.protected: true
    asserts:
      - hasDocuments:
          count: 0
