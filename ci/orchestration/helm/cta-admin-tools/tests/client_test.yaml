suite: API client isolation
templates:
  - templates/client-statefulset.yaml
tests:
  - it: uses the overridden name consistently without database access
    set:
      client.enabled: true
      client.fullnameOverride: custom-client
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: custom-client
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: custom-client
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: catalogue-config
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: scheduler-config
          any: true
