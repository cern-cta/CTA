image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-frontend
  tag: latest

# Take care with increasing this number, as CTA has not been tested with multiple frontend replicas
# Increasing this will most likely not work as expected
replicas: 1
enabled: true
port: 10956

conf:
  numberOfThreads: 512

  catalogue:
    numberOfConnections: 10
    # Reduced value for test environment
    missingFileCopiesMinAgeSecs: 5
    recycleLogQuarantineSecs: 2678400

  frontend:
    archiveFileMaxSizeGb: 1000
    zeroLengthFilesForbidden: true
    zeroLengthFilesForbiddenVoExceptionList: ""
    # repackBufferUrl

  schedulerdb:
    numberOfConnections: 3
    numberOfThreads: 500
    threadStackSizeMb: 1
    disableRepackRequests: false
    disableUserRequests: false
    tapeCacheMaxAgeSecs: 1
    retrieveQueueCacheMaxAgeSecs: 1

  logger:
    logLevel: "INFO"
    logFormat: json
    ssiLogLevel: "warning"

  tls:
    serverKey: /etc/grpc-certs/key/server-admin.key.pem
    serverCert: /etc/grpc-certs/cert/server-admin.crt.pem
    caCert: /etc/grpc-certs/ca/ca.crt.pem

  auth:
    methods:
      - kerberos
      - jwt
    config:
      jwt:
        expectedIssuer: "cta"
        expectedAudience: "cta-admin"
        revokedTokens:
          - jti: a7d2099c-68f8-43fa-83c5-28a810f835fa
            reason: just a revoked token which may come handy for testing
            revokedAt: 2026-08-25T10:00:00Z

      kerberos:
        secretName: cta-frontend-keytab
        subPath: cta-frontend.keytab
        keytab: /etc/cta/cta-frontend.krb5.keytab
        servicePrincipal: "cta/cta-frontend-admin@TEST.CTA"

  telemetry:
    enabled: false
    retainInstanceIdOnRestart: false
    metrics:
      backend: "NOOP"
      exportInterval: 10000
      exportTimeout: 8000
      otlp:
        endpoint: ""
        auth:
          basic:
            username: ""
            passwordSecret: ""
      file:
        endpoint: ""

pod:
  extraSpec:
    terminationGracePeriodSeconds: 1

extraEnv:

extraVolumes:
  volumes:
  volumeMounts:
