{{- if and .Values.enabled }}
{{- $name := include "ctafrontend.fullname" . }}
{{- $schedulerConfig := .Values.global.scheduler -}}
{{- $jwtRevokeListPath := include "ctafrontend.jwtRevokeList" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "common.labels.withoutname" . | nindent 8 }}
    spec:
      imagePullSecrets:
      {{ include "ctafrontend.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.pod.extraSpec }}
      {{ .Values.pod.extraSpec | toYaml | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000 # cta
        runAsGroup: 1000 # cta
        fsGroup: 1000 # cta
      {{- if has "kerberos" .Values.conf.auth.methods }}
      initContainers:
      - name: init1-get-krb5-keytab
        image: {{ include "ctafrontend.image" . }}
        imagePullPolicy: {{ include "ctafrontend.imagePullPolicy" . }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          sukadmin() { echo {{ .Values.global.kerberos.adminPrinc.password }} | kadmin -r {{ .Values.global.kerberos.defaultRealm | upper }} -p {{ .Values.global.kerberos.adminPrinc.name }}/admin $@; };
          sukadmin addprinc -randkey cta/{{ $name }};
          sukadmin ktadd -k /tmp/ctafrontend_keytab/output/cta-frontend.krb5.keytab cta/{{ $name }};
        volumeMounts:
        - name: krb5-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: cta-frontend-krb5-keytab
          mountPath: /tmp/ctafrontend_keytab/output
      {{- end }}
      containers:
      - name: cta-frontend
        image: {{ include "ctafrontend.image" . }}
        imagePullPolicy: {{ include "ctafrontend.imagePullPolicy" . }}
        stdin: true
        command: ["/scripts/cta-admin-api.sh"]
        readinessProbe:
          exec:
            command:
              - /usr/local/bin/grpc-health-probe
              - -addr=localhost:{{ .Values.port }}
              - -tls
              - -tls-ca-cert={{ .Values.conf.tls.caCert }}
              - -tls-server-name={{ $name }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" . }}
          privileged: {{ include "common.securityContext.privileged" . }}
        env:
        - name: TERM
          value: "xterm"
        {{- with .Values.extraEnv }}
        {{- include "common.extraEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: catalogue-config
          mountPath: /etc/cta/cta-catalogue.conf
          subPath: cta-catalogue.conf
        {{- include "common.scheduler.mounts" $schedulerConfig | nindent 8 }}

        - name: frontend-config
          mountPath: /etc/cta/cta-admin-api.toml
          subPath: cta-admin-api.toml
        {{- if has "jwt" .Values.conf.auth.methods }}
        - name: jwks-json
          mountPath: /etc/cta/jwks.json
          subPath: jwks.json
        - name: jwks-revoke-list-toml
          mountPath: {{ $jwtRevokeListPath }}
          subPath: {{ base $jwtRevokeListPath }}
        {{- end }}
        - name: grpc-server-crt
          mountPath: /etc/grpc-certs/cert
        - name: grpc-server-key
          mountPath: /etc/grpc-certs/key
        - name: grpc-ca-crt
          mountPath: /etc/grpc-certs/ca
        {{- if has "kerberos" .Values.conf.auth.methods }}
        - name: cta-frontend-krb5-keytab
          mountPath: /etc/cta/cta-frontend.krb5.keytab
          subPath: cta-frontend.krb5.keytab
        - name: krb5-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        {{- end }}
        - name: frontend-config
          mountPath: /etc/cta/cta-otel.yaml
          subPath: cta-otel.yaml
        - name: log-dir
          mountPath: /var/log/cta
        {{- include "common.extraVolumeMounts" . | nindent 8 }}
      volumes:
      - name: scripts-volume
        configMap:
          name: cta-frontend-admin-scripts
          defaultMode: 0777
      - name: catalogue-config
        secret:
          secretName: {{ $.Values.global.catalogue.existingSecret }}
      {{- include "common.scheduler.volumes" $schedulerConfig | nindent 6 }}
      - name: frontend-config
        configMap:
          name: cta-frontend-admin-conf
      {{- if has "jwt" .Values.conf.auth.methods }}
      - name: jwks-revoke-list-toml
        configMap:
          name: cta-frontend-admin-conf
      - name: jwks-json
        secret:
          secretName: jwks-json
      {{- end }}
      - name: grpc-server-crt
        secret:
          secretName: server-admin-crt-pem
      - name: grpc-server-key
        secret:
          secretName: server-admin-key-pem
      - name: grpc-ca-crt
        secret:
          secretName: ca-crt-pem
      {{- if has "kerberos" .Values.conf.auth.methods }}
      - name: cta-frontend-krb5-keytab
        emptyDir: {}
      - name: krb5-conf
        configMap:
          name: {{ .Values.global.kerberos.clientConfig.configMap }}
      {{- end }}
      - name: log-dir
        emptyDir: {}
      {{ include "common.extraVolumes" . | nindent 6 }}
{{- end }}
