{{- $schedulerConfig := include "scheduler.config" . | fromYaml -}}
{{- $name := include "ctafrontend.fullname" . }}
{{- $jwtRevokeListPath := include "ctafrontend.jwtRevokeList" . }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: cta-frontend-admin-conf
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
data:
  cta-admin-api.toml: |-
    instance_name = {{ .Release.Namespace | quote }}

    [catalogue]
      config_file = "/etc/cta/cta-catalogue.conf"

    [catalogue.client]
      number_of_connections = {{ .Values.conf.catalogue.numberOfConnections | int }}


    [scheduler]
      backend_name = {{ $schedulerConfig.backend | quote }}
      config_file = "/etc/cta/cta-scheduler.conf"
      tape_cache_max_age_secs = {{ .Values.conf.schedulerdb.tapeCacheMaxAgeSecs | int }}
      retrieve_queue_cache_max_age_secs = {{ .Values.conf.schedulerdb.retrieveQueueCacheMaxAgeSecs | int }}
      {{- if eq $schedulerConfig.backend "postgres" }}
      number_of_connections = {{ .Values.conf.schedulerdb.numberOfConnections | int }}
      {{- else }}

    # Only used by the objectstore scheduler backend
    [scheduler.client]
      number_of_threads = {{ .Values.conf.schedulerdb.numberOfThreads | int }}
      thread_stack_size_mb = {{ .Values.conf.schedulerdb.threadStackSizeMb | int }}
      {{- end }}


    [policies]
      admin_mode = "all"

    [policies.tapes]
      # Minimum age of missing tape file copies before they are reported (prevents false flagging of
      # multi-copy files still being archived)
      missing_file_copies_min_age_secs = {{ .Values.conf.catalogue.missingFileCopiesMinAgeSecs | int }}
      # Recycle-log quarantine period before a tape can be reclaimed
      recycle_log_quarantine_secs = {{ .Values.conf.catalogue.recycleLogQuarantineSecs | int }}


    [defaults.archive]
      # Default maximum size (GB) of an archived file when adding a virtual organisation
      max_file_size_gb = {{ .Values.conf.frontend.archiveFileMaxSizeGb | int }}


    [logging]
      level = {{ .Values.conf.logger.logLevel | quote }}
      format = {{ .Values.conf.logger.logFormat | quote }}


    [experimental]
      telemetry_enabled = {{ .Values.conf.telemetry.enabled }}
    {{- if .Values.conf.telemetry.enabled }}


    [telemetry]
      config_file = "/etc/cta/cta-otel.yaml"
      on_init_failure = "fatal"
    {{- end }}


    [grpc]
      port = {{ .Values.port | int }}
      number_of_threads = {{ .Values.conf.numberOfThreads | int }}

    [grpc.tls]
      server_key_path = {{ .Values.conf.tls.serverKey | quote }}
      server_cert_path = {{ .Values.conf.tls.serverCert | quote }}
      {{- if .Values.conf.tls.caCert }}
      chain_cert_path = {{ .Values.conf.tls.caCert | quote }}
      {{- end }}


    {{- if has "jwt" .Values.conf.auth.methods }}
    [auth.jwt]
      enabled = true
      jwks_uri = "file:///etc/cta/jwks.json"
      expected_issuer = {{ .Values.conf.auth.config.jwt.expectedIssuer | quote }}
      expected_audience = {{ .Values.conf.auth.config.jwt.expectedAudience | quote }}
      revoke_list_path = {{ $jwtRevokeListPath | quote }}
    {{- end }}

    {{- if has "kerberos" .Values.conf.auth.methods }}
      [auth.kerberos]
        enabled = true
        keytab_path = {{ .Values.conf.auth.config.kerberos.keytab | quote }}
        service_principal = {{ .Values.conf.auth.config.kerberos.servicePrincipal | quote }}
    {{- end }}

  {{ base $jwtRevokeListPath }}: |-
    {{- range .Values.conf.auth.config.jwt.revokedTokens }}
    [[revoked_tokens]]
      jti = {{ .jti | quote }}
      reason = {{ .reason | quote }}
      revoked_at = {{ .revokedAt }}
    {{- end }}
  {{- if .Values.conf.telemetry.enabled }}
  cta-otel.yaml: |-
{{ tpl .Values.telemetryConfig . | nindent 4 }}
  {{- end }}
