apiVersion: v2
name: ci-infra
description: Disposable databases, authentication, storage and optional telemetry for CTA integration tests.
type: application
version: 0.1.0
dependencies:
  - name: prometheus
    version: 29.37.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: opentelemetry-collector
    alias: otel
    version: 0.128.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otel.enabled
