{{- range $name, $instance := .Values.postgres.instances }}
{{- $db := mergeOverwrite (dict "database" $name "username" $name "password" $.Values.postgres.password
      "secretName" (printf "%s-credentials" $name)) (deepCopy $instance) }}
{{- $_ := set $db "host" $name }}
{{- $_ := set $db "uri" (printf "postgresql://%s:%s@%s/%s"
      ($db.username | urlquery | replace "+" "%20") ($db.password | urlquery | replace "+" "%20")
      $name ($db.database | urlquery | replace "+" "%20")) }}
{{- $context := merge (dict "connection" $db) $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.secretName }}
type: Opaque
stringData:
  PGHOST: {{ $name | quote }}
  POSTGRES_USER: {{ $db.username | quote }}
  POSTGRES_PASSWORD: {{ $db.password | quote }}
  POSTGRES_DB: {{ $db.database | quote }}
  {{- range $key, $value := $db.extraSecretData }}
  {{- if has $key (list "PGHOST" "POSTGRES_USER" "POSTGRES_PASSWORD" "POSTGRES_DB") }}
  {{- fail (printf "postgres.instances.%s.extraSecretData cannot override %s" $name $key) }}
  {{- end }}
  {{ $key | quote }}: {{ tpl $value $context | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
          env:
            {{- range $key := list "POSTGRES_USER" "POSTGRES_PASSWORD" "POSTGRES_DB" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secretName }}
                  key: {{ $key }}
            {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --no-locale --encoding=UTF8
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
