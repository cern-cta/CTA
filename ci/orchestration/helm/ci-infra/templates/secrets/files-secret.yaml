{{- range $name, $files := .Values.secretFiles }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  {{- range $key, $value := $files }}
  {{ tpl $key $ | quote }}: {{ tpl $value $ | quote }}
  {{- end }}
{{- end }}
