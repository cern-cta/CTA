secrets:
  image: registry.cern.ch/docker.io/python:3.15.2-slim

kerberos:
  image: gitlab-registry.cern.ch/linuxsupport/alma9-base:9.7
  defaultRealm: TEST.CTA
  adminPrinc:
    name: root
    password: "defaultcipassword"

# Default behaviour: spawn a Postgres catalogue and Postgres Scheduler
postgres:
  image: registry.cern.ch/docker.io/postgres:14.15
  databases:
    - name: cta-catalogue-db
      # Secret to generate the connection string into
      secretName: cta-catalogue-conf
      secretKey: cta-catalogue.conf
    - name: cta-scheduler-db
      # Secret to generate the connection string into
      secretName: cta-scheduler-conf
      secretKey: cta-scheduler.conf

catalogueReset:
  enabled: true
  schemaVersion: "latest"
  connection:
    secretName: cta-catalogue-conf
    secretKey: cta-catalogue.conf
  image:
    registry: gitlab-registry.cern.ch
    repository: cta/ctageneric/cta-tools
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets:
      - reg-ctageneric

schedulerReset:
  enabled: true
  connection:
    secretName: cta-scheduler-conf
    secretKey: cta-scheduler.conf
  image:
    registry: gitlab-registry.cern.ch
    repository: cta/ctageneric/cta-tools
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets:
      - reg-ctageneric

# Can be removed once the objectstore is removed
objectstore:
  enabled: false
  backend: "" # Options: vfs, ceph
  vfs:
    storageClassName: local-path
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}
  # Only used if the backend is ceph
  ceph:
    mon: ""
    monport: ""
    pool: ""
    namespace: ""
    id: ""
    key: ""

#
# Define extra arbitrary Kubernetes objects (secrets, configmaps, static PVs, etc.) as items in a list.
#   Example:
#   extraObjects:
#     - |
#       apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: {{ .Release.Name }}-extra
#       data:
#         speed: fast
extraObjects: []
