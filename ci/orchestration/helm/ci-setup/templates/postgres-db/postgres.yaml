{{- range .Values.postgres.databases }}
{{- if not (and $.Values.objectstore.enabled (eq .secretName $.Values.schedulerReset.connection.secretName)) }}
{{- $name := default (printf "%s-%s" $.Release.Name .name) .serviceName }}
{{- $database := default .name .database }}
{{- $username := default "postgres" .username }}

---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ if eq .secretName $.Values.schedulerReset.connection.secretName }}cta-scheduler-postgres-db{{ else }}cta-catalogue-postgres-db{{ end }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: {{ if eq .secretName $.Values.schedulerReset.connection.secretName }}cta-scheduler-postgres{{ else }}cta-catalogue-postgres{{ end }}
      image: {{ $.Values.postgres.image }}
      securityContext:
        allowPrivilegeEscalation: false
      env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: POSTGRES_DB
          value: {{ $database }}
        - name: POSTGRES_USER
          value: {{ $username | quote }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - pg_isready -U {{ $username }} -d {{ $database }} -h 127.0.0.1 -p 5432
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 20

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace | quote }}
type: Opaque
stringData:
  # CTA expects <db-type>:<connection-string>, hence the double postgresql:
  {{ .secretKey }}: postgresql:postgresql://{{ $username }}@{{ $name }}:5432/{{ $database }}

{{- end }}
{{- end }}
