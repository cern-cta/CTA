{{- if and .Values.objectstore.enabled (eq .Values.objectstore.backend "vfs") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduler-vfs-pvc
  {{- with .Values.objectstore.vfs.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.objectstore.vfs.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.objectstore.vfs.size }}
  storageClassName: {{ .Values.objectstore.vfs.storageClassName | quote }}
{{- end }}
