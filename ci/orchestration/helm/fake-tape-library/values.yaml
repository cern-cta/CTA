#
# Configuration for a single fake (in-memory/on-disk) tape library used by
# StressDrive scale tests.
#
# This chart creates:
#   1. A PersistentVolumeClaim to hold the virtual tape library on disk.
#   2. A library.toml file (via ConfigMap) that StressDrive reads at runtime.
#   3. A pre-population Job that writes library.toml and creates the required
#      directory layout inside the PVC.
#
# After this chart is deployed, mount the PVC in every taped pod via the
# taped chart's extraVolumes / extraVolumeMounts values, and set:
#   taped.conf.taped.stressMode:    true
#   taped.conf.taped.stressBaseDir: <mountPath>   # must match volumeMount.mountPath
#
# Consistency requirements
# ------------------------
# This file is the single source of truth for the virtual library.
# setup_stress_drives_test.py reads library.toml directly from the taped pod
# and derives all catalogue registration parameters from it — no manual sync
# with test_params.toml is required.  The only manual consistency constraint is:
#   library.name  ↔  logicalLibraryName in the generated taped drive list
#   (create_instance.sh --no-hardware-drives uses "stress-lib" by default).
# mediaTypes[].count must be >= the number of drives (--max-drives) so every
# drive can be kept busy simultaneously.
#
# Extendability: multiple libraries
# ----------------------------------
# This chart currently supports a single logical library (one library: block).
# To add a second library with a different drive set:
#   - Change library: to libraries: [...] (array of library objects)
#   - Update the ConfigMap and Job templates to iterate over the array
#   - Each taped pod in a different library would still share the same PVC
#     because each library lives under a separate contents/<lib>/ subtree;
#     changer/ directories are per-library so there is no cross-library
#     lock contention.
#   - Register each library's drives and tapes in the CTA catalogue with the
#     corresponding logicalLibraryName.

# ---------------------------------------------------------------------------
# Library configuration
# ---------------------------------------------------------------------------
library:
  # Name of the logical library — must match the logicalLibraryName used when
  # registering drives and tapes in the CTA catalogue, and the hardcoded value
  # in generate_stress_drive_values() in create_instance.sh.
  name: stress-lib

  # Maximum milliseconds to wait for the single changer robot to become free.
  # If another mount/dismount holds the robot lock longer than this, the
  # waiting drive throws.  Increase for very slow storage backends.
  changerTimeoutMs: 30000

  # Media type definitions.  Each entry maps to a block of mediatype lines in
  # library.toml.  Multiple entries are supported (one per media type).
  # setup_stress_drives_test.py reads all entries and registers them in the
  # CTA catalogue automatically — no manual updates needed.
  mediaTypes:
    - name: STRESS50MB
      # Capacity enforced by StressDrive: ENOSPC is signalled once the tape's
      # block stream reaches this size.
      #
      # Exact sizing so ENOSPC fires at a batch boundary (zero partial-batch requeue):
      #   C = 80 (VOL1) + k × batch_size × bytes_per_file
      #   bytes_per_file = HDR1(80) + HDR2(80) + UHL1(80) + data(16) + EOF1(80) + EOF2(80) + UTL1(80) = 496
      #   k=5, batch_size=20000 (see archiveFetchBytesFiles in stress-stressdrives-pgsched-values.yaml):
      #   C = 80 + 5 × 20000 × 496 = 49 600 080 bytes ≈ 49.6 MB
      #   → 100 000 files/tape, exactly 5 full batches, ENOSPC on HDR1 of batch 6 file 1.
      # At 100 files/sec/drive → ~17 min/tape.  10 M files: 100 tapes out of 120 available.
      # A 500 k-file CI run fills ~5 tapes, exercising mount/dismount cycles visibly.
      capacityBytes: 49600080
      # VID prefix used to derive the media type from a VID at mount time
      # (longest-prefix match).  Keep <= 2 chars so VIDs fit the 6-char ANSI
      # tape label VSN field (e.g. ST + 4-digit index = ST0001..ST0120).
      vidPrefix: ST
      # Milliseconds to sleep in StressDrive::waitUntilReady() after the
      # changer delivers the tape, simulating mechanical tape-load latency.
      # 30 s produces a clear, unambiguous throughput dip on any 1-minute
      # monitoring graph (~17% overhead per 18-min tape session), making
      # mount/dismount cycles easy to identify and time from dashboards.
      mountDelayMs: 30000
      # Adaptive-mirror mode: natural drive speed in files/sec.
      # The sleep fires once per file (at the HDR1 label block), so this value
      # is the direct file-rate ceiling — no block-count divisor needed.
      # 1 000 files/sec per drive × 30 drives = 30 000 files/sec total, well
      # above the observed frontend ceiling of ~1.3 kHz, so drives are always
      # in the queue-limited regime.
      # In queue-limited regime the drive mirrors the arrival rate: it sleeps
      # for the inter-file arrival interval so it appears continuously writing
      # and never shows as idle/starving on monitoring.  When the queue feeds
      # faster than maxWriteRateHz, the drive caps at its natural speed.
      # Set to 0 to disable adaptive mode and write at RAM speed.
      maxWriteRateHz: 1000
      # Number of virtual tapes pre-created in slots/ by the Job.
      # 120 tapes × 49.6 MB ≈ 5.9 GB on the fast-ssd PVC.
      # 10 M-file run needs 100 tapes (10 M / 100 k files/tape); 120 gives ample headroom.
      # Must be >= the number of drives (--max-drives).
      count: 120

# ---------------------------------------------------------------------------
# PersistentVolumeClaim
# ---------------------------------------------------------------------------
pvc:
  # Name referenced by taped extraVolumes and the pre-population Job.
  name: cta-fake-tape-library

  # Storage class for the PVC.
  #   ""   — use the cluster's default storage class (works with rancher
  #           local-path-provisioner, kind, k3s, etc. on a single node)
  #   "-"  — disable storageClassName (bind to a manually created PV)
  #   any  — explicit storage class name
  #
  # Note: ReadWriteOnce is sufficient for single-node clusters (all pods on
  # the same node share the volume).  For multi-node clusters, use a
  # ReadWriteMany storage class (NFS, CephFS, …) and update accessModes.
  storageClass: ""

  # Optional: bind directly to a named PV, bypassing WaitForFirstConsumer.
  # Set by create_instance.sh when fast-ssd is available to avoid the
  # scheduler delay that causes the prepopulate Job to time out.
  volumeName: ""

  # Worst-case disk usage: 120 tapes × 49.6 MB ≈ 5.9 GB.  50 Gi gives generous
  # headroom for the tmp files written during atomic tape saves.
  size: 50Gi

  accessModes:
    - ReadWriteOnce

# ---------------------------------------------------------------------------
# Pre-population Job image
# ---------------------------------------------------------------------------
image:
  repository: registry.cern.ch/docker.io/almalinux/9-minimal
  tag: "9.7"
  pullPolicy: IfNotPresent
