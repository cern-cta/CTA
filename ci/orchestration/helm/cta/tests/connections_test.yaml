suite: Umbrella connection wiring
templates:
  - charts/frontend-admin/templates/statefulset.yaml
tests:
  - it: passes external connections and postgres storage to the frontend
    set:
      global.catalogue.existingSecret: external-catalogue
      global.scheduler.existingSecret: external-scheduler
      global.scheduler.backend: postgres
      global.scheduler.existingClaim: external-vfs
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogue-config
            secret:
              secretName: external-catalogue
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scheduler-config
            secret:
              secretName: external-scheduler
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: vfs-storage-volume
          any: true
  - it: passes external connections and vfs storage to the frontend
    set:
      global.catalogue.existingSecret: external-catalogue
      global.scheduler.existingSecret: external-scheduler
      global.scheduler.backend: vfs
      global.scheduler.existingClaim: external-vfs
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogue-config
            secret:
              secretName: external-catalogue
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scheduler-config
            secret:
              secretName: external-scheduler
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vfs-storage-volume
            persistentVolumeClaim:
              claimName: external-vfs
  - it: passes external connections and ceph storage to the frontend
    set:
      global.catalogue.existingSecret: external-catalogue
      global.scheduler.existingSecret: external-scheduler
      global.scheduler.backend: ceph
      global.scheduler.existingClaim: external-vfs
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogue-config
            secret:
              secretName: external-catalogue
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scheduler-config
            secret:
              secretName: external-scheduler
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: vfs-storage-volume
          any: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scheduler-config
            mountPath: /etc/ceph
            readOnly: true
  - it: rejects global.scheduler.backend with an unusable value
    set:
      global.scheduler.backend: invalid
    asserts:
      - failedTemplate:
          errorMessage: global.scheduler.backend must be postgres, ceph or vfs
  - it: rejects global.scheduler.existingSecret with an unusable value
    set:
      global.scheduler.existingSecret: ''
    asserts:
      - failedTemplate:
          errorMessage: global.scheduler.existingSecret is required
  - it: rejects VFS storage without an existing claim
    set:
      global.scheduler.backend: vfs
      global.scheduler.existingClaim: ''
    asserts:
      - failedTemplate:
          errorMessage: global.scheduler.existingClaim is required for vfs
