# These settings are available to all the subcharts
global:
  catalogue:
    existingSecret: cta-catalogue-connection-string
  scheduler:
    backend: vfs
    existingSecret: cta-scheduler-connection-string
    existingClaim: scheduler-vfs-pvc
  image:
    registry: gitlab-registry.cern.ch
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets:
      - reg-ctageneric

  #
  # Define extra arbitrary Kubernetes objects (secrets, configmaps, static PVs, etc.) as items in a list.
  #   Example:
  #   extraObjects:
  #     - |
  #       apiVersion: v1
  #       kind: ConfigMap
  #       metadata:
  #         name: {{ .Release.Name }}-extra
  #       data:
  #         speed: fast
  extraObjects: []

  # Must match the authentication chart
  kerberos:
    clientConfig:
      configMap: krb5-conf
    defaultRealm: TEST.CTA
    adminPrinc:
      name: root
      password: "defaultcipassword"

  extraVolumes:
    volumes:
      - name: coredumps
        emptyDir: {}
    volumeMounts:
      - name: coredumps
        mountPath: /var/log/tmp

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
