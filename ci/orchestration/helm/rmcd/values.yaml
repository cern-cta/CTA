image:
  registry: gitlab-registry.cern.ch
  repository: cta/ctageneric/cta-rmcd
  tag: latest

# We need to be privileged to handle the tape drives
securityContext:
  privileged: true
  allowPrivilegeEscalation: true

libraryDevice: /dev/smc
listenScope: any # set to localhost or any other string to ensure it listens on localhost only

logging:
  level: "INFO"

# OpenTelemetry is entirely configured through declarative configuration
# Simply put the config verbatim here under telemetryConfig:
telemetryConfig: |
  file_format: "1.1"
  disabled: true

server:
  port: 5014

service:
  enabled: true # Set to false if relying on hostnetwork/localhost

pod:
  extraSpec:
    terminationGracePeriodSeconds: 60

extraEnv:

extraVolumes:
  volumes:
  volumeMounts:
