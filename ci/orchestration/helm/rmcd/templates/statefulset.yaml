# TODO: we need to think about how we eventually want to deploy rmcd
# Because this current implementation has the following limitations:
# - a single deployment of the chart cannot handle multiple mediumchangers on a single node
# - Doesn't work on multiple nodes (would need either auto-discovery or some fancy node-label, device combo)
{{- $rmcdName := printf "%s-%s" $.Release.Name "rmcd" | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $rmcdName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  serviceName: {{ $rmcdName }}  # Ensure a headless service exists with this name; allows for stable DNS entries
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $rmcdName }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $rmcdName }}
        {{- include "common.labels.withoutname" . | nindent 8 }}
    spec:
      imagePullSecrets:
      {{- include "rmcd.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.pod.extraSpec }}
      {{ .Values.pod.extraSpec | toYaml | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000 # cta
        runAsGroup: 33 # tape
        fsGroup: 33
      containers:
      - name: cta-rmcd
        image: {{ include "rmcd.image" . }}
        imagePullPolicy: {{ include "rmcd.imagePullPolicy" . }}
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 60
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: {{ include "common.securityContext.allowPrivilegeEscalation" . }}
          privileged: {{ include "common.securityContext.privileged" . }}
          capabilities:
            add:
              - SYS_RAWIO
        stdin: true
        command: ["/bin/bash", "-c"]
        args: ["{{- if .Values.preRun.enabled }}/scripts/pre_run.sh;{{- end }} /scripts/rmcd.sh; {{- if .Values.postRun.enabled }}/scripts/post_run.sh;{{- end }}"]
        env:
        - name: MY_NAME
          value: {{ $rmcdName }}
        - name: MY_NAMESPACE
          value: {{ $.Release.Namespace | quote }}
        - name: INSTANCE_NAME
          value: {{ $.Release.Namespace | quote }}
        - name: LIBRARY_DEVICE
          value: {{ .Values.libraryDevice | quote }}
        - name: MY_CONTAINER
          value: "cta-rmcd"
        - name: TERM
          value: "xterm"
        {{- with .Values.extraEnv }}
        {{- include "common.extraEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: cta-rmcd-config
          mountPath: /etc/cta/cta-rmcd.toml
          subPath: cta-rmcd.toml
        - name: smcdev
          mountPath: /dev/smc
        - name: log-dir
          mountPath: /var/log/cta
        {{ include "common.extraVolumeMounts" . | nindent 8 }}
      volumes:
      - name: smcdev
        hostPath:
          path: {{ .Values.libraryDevice }}
          type: CharDevice
      - name: scripts-volume
        configMap:
          name: scripts-rmcd
          defaultMode: 0777
      - name: cta-rmcd-config
        configMap:
          name: cta-rmcd-conf
      - name: log-dir
        emptyDir: {}
      {{ include "common.extraVolumes" . | nindent 6 }}
---
