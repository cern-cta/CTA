name: Sonar Source Analysis

on:
  schedule:
    # Every day at 3 am
    - cron: '0 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # Use the same base image as the GitLab CI for building
  # We grab the tag from .gitlab-ci.yml
  build-image:
    name: Resolve GitLab build image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Read shared image version and platform
        id: image
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          config = Path('.gitlab-ci.yml').read_text()
          versions = re.findall(r'^  PIPELINE_IMAGE_VERSION: "([^"]+)"$', config, re.MULTILINE)
          if len(versions) != 1:
              raise SystemExit('Expected exactly one PIPELINE_IMAGE_VERSION in .gitlab-ci.yml')
          platform = json.loads(Path('project.json').read_text())['dev']['defaultPlatform']
          image = f'gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-build:{versions[0]}.{platform}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'image={image}', file=output)

  build:
    name: Sonar Source Analysis
    needs: build-image
    runs-on: ubuntu-latest
    container:
      # Use the image we just found
      image: ${{ needs.build-image.outputs.image }}

    defaults:
      run:
        shell: bash

    env:
      # GitHub overrides HOME; use the toolchain installed in the build image.
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      SCHEDULER_TYPE: objectstore
      ENABLE_ORACLE_SUPPORT: "TRUE"
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory  # Directory where build-wrapper output will be placed

    steps:
      - name: Install analysis dependencies
        run: |
          dnf -y install jq unzip nodejs
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Download CTA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v7

      - name: Install CTA dependencies
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV
          CTA_BUILD_ID="${GITHUB_RUN_ID}git${GITHUB_SHA:0:8}"
          PLATFORM=$(jq -r .dev.defaultPlatform project.json)
          echo "PLATFORM=${PLATFORM}" >> "$GITHUB_ENV"
          cp -f ci/docker/cta/${PLATFORM}/etc/yum.repos.d-public/*.repo /etc/yum.repos.d/
          ./ci/project-json/generate_versionlock.py --platform "${PLATFORM}" > /etc/yum/pluginconf.d/versionlock.list
          source ci/utils/cta_version.sh
          CTA_MAJOR_VERSION=$(read_cta_major_version project.json)
          version_input="${CTA_MAJOR_VERSION}-${CTA_BUILD_ID}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_input="$GITHUB_REF_NAME"
            # Release tags determine the scheduler and Oracle configuration.
            SCHEDULER_TYPE=objectstore
            ENABLE_ORACLE_SUPPORT=true
            case "${GITHUB_REF_NAME##*.}" in
              pgsched) SCHEDULER_TYPE=pgsched ;;
              pgcat) ENABLE_ORACLE_SUPPORT=false ;;
              pgall) SCHEDULER_TYPE=pgsched; ENABLE_ORACLE_SUPPORT=false ;;
            esac
          fi
          CTA_VERSION=$(resolve_cta_version "$version_input" "$PLATFORM" "$SCHEDULER_TYPE" "$ENABLE_ORACLE_SUPPORT")
          CTA_USE_PGSCHED=OFF
          [[ "$SCHEDULER_TYPE" == "pgsched" ]] && CTA_USE_PGSCHED=ON
          CTA_WITH_ORACLE=OFF
          [[ "${ENABLE_ORACLE_SUPPORT,,}" == "true" ]] && CTA_WITH_ORACLE=ON
          echo "CTA_VERSION=${CTA_VERSION}" >> "$GITHUB_ENV"
          echo "CTA_USE_PGSCHED=${CTA_USE_PGSCHED}" >> "$GITHUB_ENV"
          echo "CTA_WITH_ORACLE=${CTA_WITH_ORACLE}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
          cmake -S . -B "build/${PLATFORM}" \
            -DCTA_BUILD_MODE:STRING=source-package \
            -DCTA_VERSION:STRING="${CTA_VERSION}" \
            -DCTA_USE_PGSCHED:BOOL="${CTA_USE_PGSCHED}" \
            -DCTA_WITH_ORACLE:BOOL="${CTA_WITH_ORACLE}" \
            -DCTA_RUN_UNIT_TESTS:BOOL=OFF
          cmake --build "build/${PLATFORM}" --target cta_srpm

      - name: Run build-wrapper
        run: |
          XROOTD_SSI_PROTOBUF_INTERFACE_VERSION=$(git -C lib/protobuf/external/xrootd-ssi-protobuf-interface describe --tags --abbrev=0)
          dnf config-manager --set-enabled crb
          dnf builddep --nogpgcheck -y build/${PLATFORM}/RPM/SRPMS/*
          cmake -S . -B "build/${PLATFORM}" \
            -DCTA_BUILD_MODE:STRING=compile \
            -DCTA_VERSION:STRING="${CTA_VERSION}" \
            -DXROOTD_SSI_PROTOBUF_INTERFACE_VERSION:STRING="${XROOTD_SSI_PROTOBUF_INTERFACE_VERSION}" \
            -DCTA_USE_PGSCHED:BOOL="${CTA_USE_PGSCHED}" \
            -DCTA_WITH_ORACLE:BOOL="${CTA_WITH_ORACLE}" \
            -DCTA_RUN_UNIT_TESTS:BOOL=OFF
          build-wrapper-linux-x86-64 --out-dir "$GITHUB_WORKSPACE/${BUILD_WRAPPER_OUT_DIR}" \
            cmake --build "build/${PLATFORM}" --parallel "$(nproc)"

      - name: Run sonar-scanner
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            "-Dsonar.qualitygate.wait=true"
            "-Dsonar.branch.name=${{ github.ref_name }}"
            "-Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
