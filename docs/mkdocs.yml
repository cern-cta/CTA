# SPDX-FileCopyrightText: 2026 CERN
# SPDX-License-Identifier: GPL-3.0-or-later

docs_dir: content
site_dir: ../build/docs/site
strict: true

watch:
  - ../CHANGELOG.md
  - includes
  - ../tools
  - ../catalogue
  - ../frontend/grpc
  - ../taped
  - ../maintd
  - ../mediachanger/rmcd
  - ../lib/telemetry

site_name: CTA Documentation
site_description: Operator and developer documentation for the CERN Tape Archive (CTA) system
site_author: CERN Tape Archive Team
site_url: https://cta.docs.cern.ch

repo_name: cta/CTA
repo_url: https://gitlab.cern.ch/cta/CTA


markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: "#"

hooks:
  - hooks.py

plugins:
  - search

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/cta-logo.png
  icon:
    admonition:
      terminal: octicons/command-palette-16
  favicon: assets/images/favicon.ico
  font: false
  features:
    - content.action.repo
    - content.code.copy
    - content.code.select
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - navigation.prune
    - announce.dismiss
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-3
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    alias: true

copyright: Copyright &copy; 2026 CERN

# Navigation scopes guide content placement; cross-link shared topics instead of duplicating them.
nav:
  # Orient readers and route them by audience; detailed guides belong in the sections below.
  - 'Home': index.md
  # Explain CTA roles, terminology, and behaviour; commands belong in Operations, code in Development.
  - 'Concepts':
      - 'Introduction': concepts/index.md
      # Explain component responsibilities and connections; deployment settings belong in Operations.
      - 'Components':
          - 'Overview': concepts/components/index.md
          # Explain identities and trust boundaries; credential configuration and rotation belong in Operations.
          - 'Authentication': concepts/components/authentication.md
          # Describe API and daemon roles; exclude config files, startup commands, and implementation walkthroughs.
          - 'Services':
              - 'Workflow Frontend': concepts/components/workflow-api.md
              - 'Admin Frontend': concepts/components/admin-api.md
              - 'Tape Daemon': concepts/components/tape-daemon.md
              - 'Maintenance Daemon': concepts/components/maintenance-daemon.md
              - 'Media Changer Daemon': concepts/components/media-changer-daemon.md
          # Explain persistent metadata versus scheduled work; provisioning and schemas belong elsewhere.
          - 'Databases & Backends':
              - 'Catalogue': concepts/components/catalogue.md
              - 'Scheduler': concepts/components/scheduler.md
          # Explain external namespace and disk-copy responsibilities; vendor setup belongs in Disk Buffer Integration.
          - 'Disk Buffer': concepts/components/disk-buffer.md
      # Explain placement, scheduling, and file workflows; policy changes and recovery recipes belong in Operations.
      - 'Data Management':
          - 'Storage Model': concepts/data-management/storage-model.md
          - 'File Workflows': concepts/data-management/index.md
          - 'Archival': concepts/data-management/archival.md
          - 'Retrieval': concepts/data-management/retrieval.md
          - 'Scheduling': concepts/data-management/scheduling.md
          - 'Deletion': concepts/data-management/deletion.md
          - 'Repack': concepts/data-management/repack.md
          - 'Recycle Bin': concepts/data-management/recycle-bin.md
          - 'Data Integrity': concepts/data-management/data-integrity.md
      # Explain media, hardware roles, tape states, formats, and positioning behaviour.
      # Host/device setup belongs in Operations > Installation & Deployment; labelling, mounts,
      # state changes, replacement, and recovery procedures belong in Operations > Administration.
      - 'Tape Infrastructure':
          # Introduce media properties; labelling and verification commands belong in Operations.
          - 'Tape Media': concepts/tape/media/index.md
          # Explain drive capabilities and their role; device discovery and tuning belong in Operations.
          - 'Tape Drives': concepts/tape/drives.md
          # Explain robotics, slots, and physical/logical libraries; registration and media moves belong in Operations.
          - 'Tape Libraries': concepts/tape/libraries.md
          # Explain the host-to-drive relationship; HBA, OS, device, and permission setup belongs in Tape Server Setup.
          - 'Tape Servers': concepts/tape/servers.md
          # Explain states and allowed transitions; commands, follow-up intervals, and incident responses belong in Operations.
          - 'Tape Lifecycle': concepts/tape/lifecycle.md
          # Explain retrieval ordering and tape geometry; enablement belongs in Configuration, algorithms in Development.
          - 'Recommended Access Order': concepts/tape/rao.md
          # Keep recorded structures and label reference details after the hardware introduction.
          - 'Tape Formats':
              - 'Tape Labels': concepts/tape/media/labels.md
              - 'CTA Tape Format': concepts/tape/media/format.md
      - 'Glossary': concepts/glossary.md
  # Help operators deploy and run CTA; keep conceptual background and implementation details in their own sections.
  - 'Operations':
      - 'Introduction': ops/index.md
      - 'Deploy & Configure':
          # Plan, install, and commission a deployment; recurring tasks belong in Administration.
          - 'Installation & Deployment':
              - 'Planning & Prerequisites': ops/deploy-and-configure/deployment/planning.md
              # Explain acquiring and installing each distribution; share configuration and commissioning guides.
              - 'Installation Methods':
                  - 'Overview': ops/deploy-and-configure/deployment/installation/index.md
                  - 'RPM Packages': ops/deploy-and-configure/deployment/installation/rpm-packages.md
                  - 'Docker Images': ops/deploy-and-configure/deployment/installation/docker-images.md
              # Prepare hosts, HBAs, devices, and permissions; hardware roles belong in Concepts.
              - 'Tape Server Setup': ops/deploy-and-configure/deployment/tape-servers.md
              # Bind stable hardware identities to non-rewinding paths; runtime settings belong in Configuration.
              - 'Stable Drive Identities & udev': ops/deploy-and-configure/deployment/udev-rules.md
              - 'Initialisation & Verification': ops/deploy-and-configure/deployment/initialisation.md
          # Explain settings, prerequisites, and examples; managing live resources belongs in Administration.
          - 'Configuration':
              - 'Service Runtime': ops/deploy-and-configure/configuration/service-runtime.md
              - 'Authentication': ops/deploy-and-configure/configuration/authentication.md
              # Configure each API or daemon; service lifecycle actions belong in Administration.
              - 'Services':
                  - 'Workflow Frontend': ops/deploy-and-configure/configuration/workflow-api.md
                  - 'Admin Frontend': ops/deploy-and-configure/configuration/admin-api.md
                  - 'Tape Daemon': ops/deploy-and-configure/configuration/tape-daemon.md
                  - 'Maintenance Daemon': ops/deploy-and-configure/configuration/maintenance-daemon.md
                  - 'Media Changer Daemon': ops/deploy-and-configure/configuration/media-changer-daemon.md
              # Provision and connect backend stores; version migrations belong in Upgrades.
              - 'Databases & Backends':
                  - 'Catalogue': ops/deploy-and-configure/configuration/catalogue.md
                  - 'Scheduler': ops/deploy-and-configure/configuration/scheduler.md
          # Keep disk-system-specific setup and operations here; core CTA guides must not assume EOS or dCache.
          - 'Disk Buffer Integration':
              - 'Introduction': ops/deploy-and-configure/integrations/index.md
              # Document EOS integration, namespace, replicas, and repair; link to shared CTA procedures.
              - 'EOS':
                  - 'Installation': ops/deploy-and-configure/integrations/eos/installation.md
                  - 'Configuration': ops/deploy-and-configure/integrations/eos/configuration.md
                  - 'Tape REST API': ops/deploy-and-configure/integrations/eos/tape-rest-api.md
                  - 'File Attributes': ops/deploy-and-configure/integrations/eos/file-attributes.md
                  - 'Performance & Disk Layout': ops/deploy-and-configure/integrations/eos/performance.md
                  - 'Buffer Cleanup': ops/deploy-and-configure/integrations/eos/buffer-cleanup.md
                  - 'Operator Utilities': ops/deploy-and-configure/integrations/eos/tools.md
                  - 'Troubleshooting & Repair': ops/deploy-and-configure/integrations/eos/troubleshooting.md
                  - 'Metadata Consistency & Recovery': ops/deploy-and-configure/integrations/eos/metadata-recovery.md
              - 'dCache': ops/deploy-and-configure/integrations/dcache.md
      - 'Run & Maintain':
          # Manage running services, resources, and requests; explain actions and checks, not component internals.
          - 'Administration':
              - 'Introduction': ops/run-and-maintain/administration/index.md
              - 'Services': ops/run-and-maintain/administration/services.md
              # Commission, label, mount, drain, and replace resources; hardware theory belongs in Concepts.
              - 'Tapes, Drives & Libraries': ops/run-and-maintain/administration/tapes-and-drives.md
              # Prepare, register, and label media for use; format details belong in Concepts.
              - 'Media Initialisation': ops/run-and-maintain/administration/media-initialisation.md
              - 'Storage Policies': ops/run-and-maintain/administration/storage-policies.md
              - 'Scheduling & Queues': ops/run-and-maintain/administration/requests.md
              - 'Repacking Tapes': ops/run-and-maintain/administration/repack.md
              # Measure and tune core CTA throughput and capacity; disk-system tuning stays in its integration guide.
              - 'Performance & Capacity': ops/run-and-maintain/administration/performance.md
          # Collect and interpret health, logs, metrics, and statistics; intervention belongs in Administration.
          - 'Monitoring':
              - 'Health Checks & Alerts': ops/run-and-maintain/monitoring/health-and-alerts.md
              - 'Logging': ops/run-and-maintain/monitoring/logging.md
              - 'Metrics': ops/run-and-maintain/monitoring/metrics.md
              - 'Catalogue Statistics': ops/run-and-maintain/monitoring/catalogue-statistics.md
          # Transition installed software and schemas; developing migrations belongs in Development.
          - 'Upgrades':
              - 'Upgrading CTA': ops/run-and-maintain/upgrades/cta.md
              # Run and verify catalogue migrations; schema design and script authorship belong in Development.
              - 'Upgrading CTA Catalogue schema':
                  - 'Introduction': ops/run-and-maintain/upgrades/catalogue-schema/index.md
                  - 'Automated procedure': ops/run-and-maintain/upgrades/catalogue-schema/automated.md
                  - 'Manual procedure': ops/run-and-maintain/upgrades/catalogue-schema/manual.md
              - 'Scheduler Schema Upgrades': ops/run-and-maintain/upgrades/scheduler-schema.md
              - 'Upgrading EOS': ops/run-and-maintain/upgrades/eos.md
      # Diagnose failures and restore service or data; disk-system-specific remedies stay in their integration guides.
      - 'Troubleshooting & Recovery':
          - 'Troubleshooting': ops/troubleshooting-and-recovery/troubleshooting.md
          # Protect and restore deployment state; individual deleted-file recovery has its own guide.
          - 'Backup & Recovery': ops/troubleshooting-and-recovery/backup-and-recovery.md
          - 'Recycle Bin & File Recovery': ops/troubleshooting-and-recovery/file-recovery.md
      # Provide command lookup, syntax, and tool-specific usage; link to end-to-end operational procedures.
      - 'Tools & Reference':
          - 'Tool Index': ops/tools/index.md
          # Install separately packaged tools and configure shared runtime settings; library APIs belong upstream.
          - 'Installation & Shared Configuration': ops/tools/installation-and-configuration.md
          # Reference general management commands; put task sequences in Administration.
          - 'Administration':
              - 'cta-admin': ops/tools/cta-admin.md
              - 'cta-ops-admin': ops/tools/cta-ops-admin.md
              - 'cta-versionlock': ops/tools/cta-versionlock.md
          # Reference database tools and their effects; distinguish creation/deletion from supported upgrades.
          - 'Database & Schema Management':
              - 'cta-catalogue-admin-user-create': ops/tools/cta-catalogue-admin-user-create.md
              - 'cta-catalogue-schema-create': ops/tools/cta-catalogue-schema-create.md
              - 'cta-database-poll': ops/tools/cta-database-poll.md
              - 'cta-scheduler-schema-create': ops/tools/cta-scheduler-schema-create.md
              - 'cta-scheduler-schema-drop': ops/tools/cta-scheduler-schema-drop.md
              - 'cta-catalogue-schema-set-production': ops/tools/cta-catalogue-schema-set-production.md
              - 'cta-catalogue-schema-verify': ops/tools/cta-catalogue-schema-verify.md
              - 'cta-catalogue-schema-drop': ops/tools/cta-catalogue-schema-drop.md
          # Reference hardware and tape-work tools; concepts and multi-step procedures belong in their own guides.
          - 'Tape Operations':
              - 'cta-readtp': ops/tools/cta-readtp.md
              - 'cta-tape-label': ops/tools/cta-tape-label.md
              - 'cta-smc': ops/tools/cta-smc.md
              - 'cta-ops-repack (ATRESYS)': ops/tools/repack-automation.md
              - 'cta-ops-drive-config-generate': ops/tools/cta-ops-drive-config-generate.md
              - 'cta-ops-pool-supply': ops/tools/cta-ops-pool-supply.md
              - 'cta-ops-tape-verify': ops/tools/tape-verification.md
          # Reference collection and accounting tools; monitoring design and interpretation belong in Monitoring.
          - 'Monitoring & Statistics':
              - 'cta-statistics-save': ops/tools/cta-statistics-save.md
              - 'cta-statistics-update': ops/tools/cta-statistics-update.md
              - 'cta-ops-drive-environmentals': ops/tools/cta-ops-drive-environmentals.md
              - 'cta-ops-data-monitoring': ops/tools/cta-ops-data-monitoring.md
          # Reference backend inspection and repair tools; distinguish read-only commands from destructive changes.
          - 'Scheduler Management & Diagnostics':
              - 'cta-objectstore-collect-orphaned-object': ops/tools/cta-objectstore-collect-orphaned-object.md
              - 'cta-objectstore-create-missing-repack-index': ops/tools/cta-objectstore-create-missing-repack-index.md
              - 'cta-objectstore-dereference-removed-queues': ops/tools/cta-objectstore-dereference-removed-queues.md
              - 'cta-objectstore-initialize': ops/tools/cta-objectstore-initialize.md
              - 'cta-objectstore-list': ops/tools/cta-objectstore-list.md
              - 'cta-objectstore-reset': ops/tools/cta-objectstore-reset.md
              - 'cta-objectstore-dump-object': ops/tools/cta-objectstore-dump-object.md
          # Include source-backed daemon option references; configuration guides own examples and setup advice.
          - 'Service Manuals':
              - 'cta-frontend': ops/tools/service-manuals/cta-frontend.md
              - 'cta-taped': ops/tools/service-manuals/cta-taped.md
              - 'cta-maintd': ops/tools/service-manuals/cta-maintd.md
              - 'cta-rmcd': ops/tools/service-manuals/cta-rmcd.md
  # Orient contributors, explain contribution procedures, then provide technical reference.
  - 'Development':
      - 'Introduction': dev/index.md
      # Follow this sequence for first-time orientation; ongoing tool usage belongs in Technical Reference.
      - 'Getting Started':
          - 'Prerequisites & Access': dev/getting-started/prerequisites.md
          - 'Project Structure': dev/getting-started/project-structure.md
          - 'Environment Setup': dev/getting-started/environment-setup.md
          - 'Archive & Retrieve Walkthrough': dev/getting-started/archive-retrieve-walkthrough.md
          - 'Your First Change': dev/getting-started/first-change.md
      # Explain proposing, submitting, and reviewing changes; specialized stewardship comes last.
      - 'Contributing':
          - 'Overview': dev/contributing/index.md
          - 'Through CERN GitLab': dev/contributing/gitlab.md
          - 'Through GitHub': dev/contributing/github.md
          - 'Changelog Entries': dev/contributing/changelog.md
          - 'Documentation Changes': dev/contributing/documentation.md
          - 'For Maintainers':
              - 'Overview': dev/contributing/maintainers/index.md
              - 'Importing GitHub Contributions': dev/contributing/maintainers/github-contributions.md
              - 'Release Procedure': dev/contributing/maintainers/releases.md
              # Coordinate and publish schema releases; authoring and testing migrations belongs in Schema Development.
              - 'Catalogue Schema Releases': dev/contributing/maintainers/catalogue-schema-releases.md
              - 'Documentation Site': dev/contributing/maintainers/documentation-site.md
              - 'CI Maintenance': dev/contributing/maintainers/ci-maintenance.md
              - 'Repository Administration': dev/contributing/maintainers/repository-administration.md
      # Task guides, conventions, and implementation reference; read according to the change being made.
      - 'Technical Reference':
          - 'Overview': dev/reference/index.md
          # Tool reference, environment structure, hardware emulation, inspection, and diagnosis.
          - 'Development Tools & Environment':
              - 'cta-dev Reference': dev/reference/tools-and-environment/cta-dev.md
              - 'Development & Test Environment': dev/reference/tools-and-environment/environment.md
              - 'Virtual Tape Library': dev/reference/tools-and-environment/virtual-tape-library.md
              - 'Working with Development Pods': dev/reference/tools-and-environment/development-pods.md
              - 'Debugging': dev/reference/tools-and-environment/debugging.md
              - 'Pre-commit Hooks': dev/reference/tools-and-environment/pre-commit.md
              - 'Building Images & Packages': dev/reference/tools-and-environment/building-images-and-packages.md
          # Select, write, and run tests before learning pipeline mechanics; CI administration belongs to maintainers.
          - 'Testing & CI':
              - 'Testing CTA': dev/reference/testing/index.md
              - 'Unit Tests': dev/reference/testing/unit-tests.md
              - 'System Tests': dev/reference/testing/system-tests.md
              - 'Stress Tests': dev/reference/testing/stress-tests.md
              - 'CI Overview': dev/reference/testing/ci/index.md
              - 'CI Pipelines': dev/reference/testing/ci/pipelines.md
          # Define rules for code, packaging, and CI changes; task walkthroughs belong in the guides above.
          - 'Conventions':
              - 'Overview': dev/reference/conventions/index.md
              # Specify source style and language rules; avoid general language tutorials or implementation descriptions.
              - 'Coding Conventions':
                  - 'General': dev/reference/conventions/coding/general.md
                  - 'C++': dev/reference/conventions/coding/cpp.md
                  - 'Python': dev/reference/conventions/coding/python.md
                  - 'Bash': dev/reference/conventions/coding/bash.md
                  - 'Copyright': dev/reference/conventions/coding/copyright.md
              - 'RPM Packaging': dev/reference/conventions/rpm-packaging.md
              - 'Versioning': dev/reference/conventions/versioning.md
              # Specify how CI jobs, images, and orchestration are written; running them belongs in Testing & CI.
              - 'GitLab CI': dev/reference/conventions/gitlab.md
              - 'Container Images': dev/reference/conventions/container-images.md
              - 'Helm & Orchestration': dev/reference/conventions/orchestration.md
          # Explain implementation and data structures; system roles belong in Concepts.
          - 'Implementation Internals':
              - 'Overview': dev/reference/internals/index.md
              - 'Interfaces & Protocols': dev/reference/internals/interfaces.md
              - 'Workflow Frontend': dev/reference/internals/workflow-api.md
              - 'Admin Frontend': dev/reference/internals/admin-api.md
              # Explain catalogue implementation and schema changes; database operation belongs in Operations.
              - 'Catalogue':
                  - 'Overview': dev/reference/internals/catalogue/index.md
                  # Create and test compatible schema changes and migrations; publishing belongs in For Maintainers.
                  - 'Schema Development':
                      - 'Overview': dev/reference/internals/catalogue/schema-development/index.md
                      - 'New Schema Version': dev/reference/internals/catalogue/schema-development/new-version.md
                      - 'Naming': dev/reference/internals/catalogue/schema-development/naming.md
                      - 'Compatible Changes': dev/reference/internals/catalogue/schema-development/compatible-changes.md
                      - 'Incompatible Changes': dev/reference/internals/catalogue/schema-development/incompatible-changes.md
                      - 'Migration Scripts': dev/reference/internals/catalogue/schema-development/migration-scripts.md
                      - 'Testing Migrations': dev/reference/internals/catalogue/schema-development/testing.md
              # Explain backend storage, coordination, and algorithms; scheduling principles belong in Concepts.
              - 'Scheduler':
                  - 'Overview': dev/reference/internals/scheduler/index.md
                  # Explain objects, ownership, locking, and cleanup; repair commands belong in Operations.
                  - 'Objectstore Backend': dev/reference/internals/scheduler/objectstore.md
                  # Explain SQL schema and backend routines; build/test setup belongs in Getting Started or Testing & CI.
                  - 'PostgreSQL Backend':
                      - 'Overview': dev/reference/internals/scheduler/postgresql/index.md
                      - 'Backend Schema': dev/reference/internals/scheduler/postgresql/schema.md
                      - 'Workflow Integration': dev/reference/internals/scheduler/postgresql/workflow.md
                      - 'Opportunistic Batching': dev/reference/internals/scheduler/postgresql/opportunistic-batching.md
                      - 'Garbage Collection Routines': dev/reference/internals/scheduler/postgresql/garbage-collection.md
              # Explain transfer, drive interaction, and RAO implementation; hardware operation belongs in Operations.
              - 'Tape Daemon':
                  - 'Overview': dev/reference/internals/tape-daemon/index.md
                  - 'Recommended Access Order': dev/reference/internals/tape-daemon/rao.md
              - 'Maintenance Daemon': dev/reference/internals/maintenance-daemon.md
              - 'Media Changer Daemon': dev/reference/internals/media-changer-daemon.md
              # Trace requests through code and state changes; lifecycle explanations belong in Concepts.
              - 'Workflow Implementation':
                  - 'Overview': dev/reference/internals/workflows/index.md
                  - 'Archival': dev/reference/internals/workflows/archival.md
                  - 'Retrieval': dev/reference/internals/workflows/retrieval.md
                  - 'Scheduling': dev/reference/internals/workflows/scheduling.md
                  - 'Deletion': dev/reference/internals/workflows/deletion.md
                  - 'Repack': dev/reference/internals/workflows/repack.md
                  - 'Recycle Bin': dev/reference/internals/workflows/recycle-bin.md
              - 'Shared Libraries': dev/reference/internals/shared-libraries.md
          # Explain adapter development; deployed-system setup belongs in Operations.
          - 'Disk Buffer Integrations':
              - 'Overview': dev/reference/integrations/index.md
              - 'Developing with EOS': dev/reference/integrations/eos/environment-setup.md
              - 'Developing with dCache': dev/reference/integrations/dcache.md
          # Produce and test telemetry; collection and alerting belong in Operations.
          - 'Instrumentation':
              - 'Overview': dev/reference/instrumentation/index.md
              - 'Logging': dev/reference/instrumentation/logging.md
              - 'Metrics': dev/reference/instrumentation/metrics.md
              - 'Readiness & Liveness': dev/reference/instrumentation/health-checks.md
              - 'Telemetry Semantic Conventions': dev/reference/instrumentation/semantic-conventions.md
              - 'Testing': dev/reference/instrumentation/testing.md
  # Render the release history from CHANGELOG.md; upgrade instructions belong in Operations > Upgrades.
  - 'Changelog': changelog.md
