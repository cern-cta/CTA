[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "ctaops-sdk"
authors = [{ name = "CERN", email = "tape-operations@cern.ch" }]
description = "PYTHON CTA Operations Tape Server Library"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
keywords = ["CTA", "tape", "CERN"]

dynamic = ["version"]

dependencies = ["pyudev"]

[project.urls]
Source = "https://gitlab.cern.ch/cta/CTA/"
Documentation = "https://ctaops.docs.cern.ch/"
"CTA Documentation" = "https://cta.docs.cern.ch/"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../../.."
# Scheduler/catalogue variants share the same Python package version.
tag_regex = '^v?(?P<version>[0-9]+(?:\.[0-9]+)*(?:-[0-9]+)?)(?:\.(?:pgsched|pgcat|pgall))?$'

[tool.hatch.build.targets.wheel]
packages = ["src/ctaops"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml", "src/**", "tests/**"]

[tool.hatch.build.targets.sdist.force-include]
"../../../LICENSES/GPL-3.0-or-later.txt" = "LICENSE"
