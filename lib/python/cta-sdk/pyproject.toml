[build-system]
  # Hatch reads release tags or local development identifiers through the shared version helper.
  # Keep the generator aligned with the runtime minimums below, including builds outside uv.
  requires      = ["hatchling>=1.27.0", "grpcio-tools==1.84.1"]
  build-backend = "hatchling.build"

[project]
  name = "cta-sdk"
  authors = [{ name = "CERN", email = "tape-operations@cern.ch" }]
  description = "PYTHON CTA SDK"
  readme = "README.md"
  requires-python = ">=3.15"
  license = "GPL-3.0-or-later"
  license-files = ["LICENSE"]
  classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
  ]
  keywords = ["CTA", "tape", "CERN"]

  dynamic      = ["version"]
  dependencies = ["grpcio>=1.84.1", "protobuf>=7.35.1,<8"]

  [project.urls]
    Source              = "https://gitlab.cern.ch/cta/CTA/"
    Documentation       = "https://cta.docs.cern.ch/latest/dev/guides/python/cta-sdk/"
    "CTA Documentation" = "https://cta.docs.cern.ch/"

[dependency-groups]
  dev = ["cattrs", "grpcio-tools==1.84.1"]

[tool.hatch.version]
  source     = "code"
  path       = "../../../ci/build/cta_version.py"
  expression = "package_version()"

[tool.hatch.build]
  ignore-vcs = true

  [tool.hatch.build.targets.wheel]
    packages = ["src/cta"]

  [tool.hatch.build.targets.sdist]
    include = [
      "README.md",
      "pyproject.toml",
      "hatch_build.py",
      "scripts/gen_proto.py",
      "src/**",
      "tests/**",
    ]
    exclude = ["src/external/**"]

  [tool.hatch.build.hooks.custom]
    path = "hatch_build.py"

    [tool.hatch.build.targets.sdist.force-include]
      "../../../LICENSES/GPL-3.0-or-later.txt" = "LICENSE"
