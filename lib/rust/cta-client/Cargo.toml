[package]
  name                    = "cta-client"
  description             = "High-level client library for the CTA frontend gRPC API"
  version.workspace       = true
  edition.workspace       = true
  authors.workspace       = true
  license.workspace       = true
  repository.workspace    = true
  homepage.workspace      = true
  documentation.workspace = true
  keywords.workspace      = true
  categories.workspace    = true
  publish.workspace       = true

[lints]
  workspace = true

[dependencies]
  bon          = { workspace = true }
  cta-grpc-common = { workspace = true }
  chrono       = { workspace = true, features = ["serde"] }
  cta-protobuf = { workspace = true }
  tonic        = { workspace = true, features = ["tls-native-roots", "tls-ring"] }
  tokio-stream = { workspace = true }
  thiserror    = { workspace = true }
  serde        = { workspace = true, features = ["derive"] }
  serde_json   = { workspace = true }
  url          = { workspace = true }
  strum        = { workspace = true, features = ["derive"] }

[build-dependencies]
  serde_json = { workspace = true }

[dev-dependencies]
  # server traits for the mock frontends of the tests
  cta-protobuf   = { workspace = true, features = ["server"] }
  tokio          = { workspace = true, features = ["macros", "rt", "net"] }
  tokio-stream   = { workspace = true, features = ["net"] }
