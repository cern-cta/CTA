[package]
  name                    = "cta-lib"
  description             = "High-level client library for the CTA frontend and EOS namespace gRPC APIs"
  version.workspace       = true
  edition.workspace       = true
  authors.workspace       = true
  license.workspace       = true
  repository.workspace    = true
  homepage.workspace      = true
  documentation.workspace = true
  keywords.workspace      = true
  categories.workspace    = true
  publish.workspace       = true

[lints]
  workspace = true

[dependencies]
  cta-protobuf = { workspace = true }
  eos-protobuf = { workspace = true }
  tonic        = { workspace = true, features = ["tls-native-roots", "tls-ring"] }
  tokio-stream = { workspace = true }
  thiserror    = { workspace = true }
  log          = { workspace = true }
  nix          = { workspace = true, features = ["fs"] }
  url          = { workspace = true }

# Only needed by `src/test_support.rs`, which builds gRPC responses without a
# server (see that module for why no third-party mock harness is used).
[dev-dependencies]
  tokio          = { workspace = true, features = ["macros", "rt"] }
  prost          = { workspace = true }
  tonic-prost    = { workspace = true }
  bytes          = { workspace = true }
  http-body      = { workspace = true }
  http-body-util = { workspace = true }
