[package]
  name                    = "cta-client-macros"
  description             = "Procedural macros of cta-client, defining the typed admin commands"
  version.workspace       = true
  edition.workspace       = true
  authors.workspace       = true
  license.workspace       = true
  repository.workspace    = true
  homepage.workspace      = true
  documentation.workspace = true
  keywords.workspace      = true
  categories.workspace    = true
  publish.workspace       = true

[lib]
  proc-macro = true

[lints]
  workspace = true

[dependencies]
  proc-macro2 = { workspace = true }
  quote       = { workspace = true }
  syn         = { workspace = true, features = ["full"] }

[dev-dependencies]
  # the doc tests use the macro through `cta-client`, as its users do
  cta-client   = { workspace = true }
  cta-protobuf = { workspace = true }
