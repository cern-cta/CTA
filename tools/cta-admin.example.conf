#
# CTA admin client options
#

# CTA Frontend hostname (FQDN) and TCP port for gRPC connections
cta.endpoint ctafrontend.cern.ch:50051

#
# gRPC-specific options
#

# Path to the CA certificate chain file for TLS connections.
# Note that if left blank, grpc will try to load the default root certificates.
# It can also be overridden by setting grpc's environment variable GRPC_DEFAULT_SSL_ROOTS_FILE_PATH.
# grpc.tls.chain_cert_path /etc/grid-security/certificates/ca-chain.pem

# Authentication method for cta-admin. Must be either "jwt" or "krb5".
# Can be overridden by setting the CTA_ADMIN_GRPC_AUTH_METHOD environment variable.
# Default: krb5
# grpc.cta_admin_auth_method krb5

# Path to the JWT token file for JWT-based authentication. Required when authentication method is "jwt".
# grpc.jwt_token_path /etc/grid-security/jwt-token-grpc
