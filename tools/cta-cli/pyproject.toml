[build-system]
    # Hatch reads release tags or local development identifiers through the shared version helper.
    requires      = ["hatchling>=1.27.0"]
    build-backend = "hatchling.build"

[project]
    name = "cta-cli"
    authors = [{ name = "CERN", email = "tape-operations@cern.ch" }]
    description = "Main CLI to interact with CTA"
    readme = "README.md"
    requires-python = ">=3.9"
    license = "GPL-3.0-or-later"
    license-files = ["LICENSE"]
    classifiers = [
        "Programming Language :: Python :: 3",
        "Operating System :: POSIX :: Linux",
    ]
    keywords = ["CTA", "tape", "CERN"]

    dynamic = ["version"]
    dependencies = [
        "typing-extensions>=4.4.0",
        "cta-common",
        "cta-sdk",
        "click",
        "rich",
        "pyjwt>=2.14.0",
        "cryptography>=47.0.0",
        "grpcio-health-checking>=1.80.0",
    ]

    [project.urls]
        Source              = "https://gitlab.cern.ch/cta/CTA/"
        Documentation       = "https://cta.docs.cern.ch/latest/ops/tools/cta/"
        "CTA Documentation" = "https://cta.docs.cern.ch/"

    [project.scripts]
        cta = "cta.cli.main:main"

[tool.uv.sources]
    cta-common = { workspace = true }
    cta-sdk      = { workspace = true }
    cta-tapeserver-sdk   = { workspace = true }

[tool.hatch.version]
    source     = "code"
    path       = "../../ci/utils/cta_version.py"
    expression = "package_version()"

[tool.hatch.build]
    ignore-vcs = true

    [tool.hatch.build.targets.wheel]
        packages = ["src/cta"]

        [tool.hatch.build.targets.wheel.force-include]
            "src/cta/cli/cta-cli.example.toml" = "cta/cli/cta-cli.example.toml"
            "src/cta/cli/py.typed"             = "cta/cli/py.typed"

    [tool.hatch.build.targets.sdist]
        include = ["README.md", "pyproject.toml", "src/cta/**", "tests/**"]

        [tool.hatch.build.targets.sdist.force-include]
            "../../LICENSES/GPL-3.0-or-later.txt" = "LICENSE"

    [project.optional-dependencies]
        tapeserver = ["cta-tapeserver-sdk"]
        workflow   = ["cta-sdk"]
