# CTA Taped Service Configuration

# Recommended starting configuration. Replace deployment-specific values before use.
# With --config-strict, set values explicitly rather than relying on defaults.

# Optional features to enable. Remove a feature and its section to disable it.
# Type: array of strings; default: [].
# Allowed: "health_server" (no duplicates).
enabled_features = ["health_server"]

# Experimental features to enable. These may change or be removed in future releases.
# Type: array of strings; default: [].
# Allowed: "telemetry" (no duplicates).
enabled_experimental_features = ["telemetry"]

[drive]
  # CTA name of the drive. It is included in log records, tooling and must uniquely identify the drive in CTA.
  # Type: string; default: none; required.
  name = "example-drive"

  # Path to the non-rewinding character device used to access the tape drive, for example /dev/nst0.
  # Use a persistent device symlink, such as one under /dev/tape/by-id, to avoid device-name changes across
  # reboots. Site-specific udev rules may provide other persistent paths, such as /dev/tape/by-name/<drive-name>
  # as populated by cta-udev.
  # Type: string; default: none; required.
  device = "/dev/tape/by-id/example-drive"

  # SCSI media-changer address associated with the drive. It is normally "smc" followed by the drive
  # ordinal reported by `cta-smc -q D`, for example "smc0".
  # Type: string; default: none; required.
  control_path = "smc0"

  # CTA logical-library name to which this drive belongs. It must match an existing logical library in
  # the catalogue.
  # Type: string; default: none; required.
  logical_library_name = "example-library"

  [drive.lifecycle]
    # Automatically eject any cartridge in the drive when the drive transitions from Down to Up.
    # When false, only empty drives are allowed to go Up. The drive will put itself Down if it finds a cartridge
    # in the drive, requiring an operator to eject the cartridge and put the drive Up again.
    # Type: boolean; default: false.
    eject_on_up = false

    # First registration means that no catalogue entry exists for this drive name.
    [drive.lifecycle.registration]
      # Set the desired state to Up when this drive is first registered.
      # When false, set the desired state to Down and wait for an operator Up request.
      # Existing drives follow drive.lifecycle.startup instead, even if their entries are recreated.
      # Type: boolean; default: false.
      desired_up = false

    # These options select which existing drives may start automatically when cta-taped starts.
    # They inspect the desired state saved in the catalogue.
    [drive.lifecycle.startup]
      # When the desired state is Up, preserve it and attempt to bring the drive Up.
      # This can resume operation after a crash or honour an Up request made before startup.
      # When false, set the drive Down and require a new operator Up request.
      # Starting a drive that contains a cartridge also requires drive.lifecycle.eject_on_up = true.
      # Type: boolean; default: false.
      preserve_desired_up = false

      # Automatically request Up for eligible existing Down drives when cta-taped starts.
      # Only drives recorded as Down because the daemon was stopping are eligible.
      # Drives marked Down by an operator or failure remain Down.
      # Drive preparation must succeed before tape work begins.
      # Type: boolean; default: false.
      auto_up = false

# Connection to the Remote Media Changer Daemon (cta-rmcd) used for physical mount and unmount operations.
[rmcd]
  # Hostname or IP address of the RMCD. Use "localhost" when the RMCD runs on the same host as cta-taped.
  # Note that cta-rmcd traffic is not encrypted and/or authenticated, so it is not recommended to change
  # this setting.
  # Type: string; default: "localhost".
  host = "localhost"

  # TCP port on which the RMCD accepts requests.
  # Type: integer; default: 5014.
  port = 5014

  # Timeout in seconds for network reads and writes to RMCD.
  # Expiry makes the current RMCD operation fail: a mount error enters normal cleanup, while an unmount
  # error puts the drive Down.
  # Type: integer; default: 600.
  request_timeout_secs = 600

  # Maximum attempts for a retriable RMC request. Network errors, protocol errors and timeouts are not retried.
  # More attempts tolerate longer temporary RMCD failures but delay reporting a final failure.
  # Type: integer; default: 10.
  request_attempts = 10

# Controls when cta-taped requests work from the scheduler and how long the physical mount may take.
# Session timeout checks affect liveness only; they do not terminate or recover sessions.
# Controller operations are not checked by these session timeouts.
[mounts]
  # Queued bytes needed to start a tape mount. Reaching either this threshold or minimum_queued_files is enough.
  # Catalogue mount-rule timeouts can allow smaller mounts. Higher thresholds favour fuller mounts but add latency.
  # Type: integer; default: 500000000000.
  minimum_queued_bytes = 500000000000

  # Queued files needed to start a tape mount. Reaching either this threshold or minimum_queued_bytes is enough.
  # Higher thresholds favour fuller mounts of small files but may add latency.
  # Type: integer; default: 10000.
  minimum_queued_files = 10000

  # Maximum time, in seconds, allowed for selecting the next mount. On expiry, the request logs a warning
  # and is retried.
  # Type: integer; default: 900.
  get_next_mount_timeout_secs = 900

  # Delay, in seconds, before retrying when no mount is available or scheduling fails.
  # Also applied after a failed tape session if the drive remains reusable; successful sessions do not wait.
  # Lower values react faster to new work but increase scheduler polling; higher values reduce polling but
  # may add mount-start latency.
  # Type: integer; default: 10.
  idle_scheduling_interval_secs = 10

  # Delay, in seconds, before polling the catalogue for the desired drive state again while the drive is Down.
  # Lower values make cta-taped react faster when an operator sets the drive Up but increase catalogue polling.
  # Type: integer; default: 5.
  drive_state_poll_interval_secs = 5

  # Delay in seconds before checking again for a logical library that does not yet exist.
  # Type: integer; default: 5.
  logical_library_poll_interval_secs = 5

  # Maximum seconds spent mounting before the health endpoint reports the session as unhealthy.
  # Type: integer; default: 900.
  mount_timeout_secs = 900

  # Maximum seconds spent loading before the health endpoint reports the session as unhealthy.
  # Also limits loading readiness polling; expiry starts session cleanup, which does not repeat this wait.
  # Initialize new LTO-9 media before scheduling ordinary work, or allow for first-use media optimization.
  # IBM documents that this can take up to two hours (LTO SCSI reference, Appendix E.3):
  # https://www.ibm.com/support/pages/system/files/inline-files/LTO%20SCSI%20Reference%20GA32-0928-09.pdf
  # Type: integer; default: 900.
  tape_load_timeout_secs = 900

  # Maximum time, in seconds, in Unloading before liveness becomes unhealthy. Must be positive.
  # Covers drive acquisition, readiness probing, configuration reset, rewind, label reading and unload.
  # This health limit does not cancel blocking kernel operations.
  # Type: integer; default: 900.
  tape_unload_timeout_secs = 900

  # Maximum seconds spent unmounting before the health endpoint reports the session as unhealthy.
  # Type: integer; default: 900.
  unmount_timeout_secs = 900

  # Maximum time, in seconds, in Preparing before liveness becomes unhealthy. Must be positive.
  # Applies to transfer sessions and drive cleanup.
  # Type: integer; default: 900.
  preparing_timeout_secs = 900

  # Maximum seconds spent finalising before the health endpoint reports the session as unhealthy.
  # Includes final statistics publication. Must be positive.
  # Type: integer; default: 900.
  finalizing_timeout_secs = 900

# Controls resources and inactivity limits shared by archive and retrieve data-transfer sessions.
[transfers]
  # Enable encryption; include [transfers.encryption] only when true.
  # Type: boolean; default: false.
  encryption_enabled = true

  # Number of in-memory buffers allocated to the drive's data-transfer pipeline. Total buffer memory is
  # approximately buffer_count multiplied by buffer_size_bytes. Increasing it can smooth I/O but consumes
  # more RAM.
  # Type: integer; default: 5000.
  buffer_count = 5000

  # Size, in bytes, of each in-memory transfer buffer. Together with buffer_count this determines the
  # approximate transfer-cache memory consumption.
  # Type: integer; default: 5000000.
  buffer_size_bytes = 5000000

  # Number of disk I/O worker threads and therefore the maximum number of file transfers that can perform
  # disk I/O concurrently. Increasing it may improve parallelism but raises disk, network, and CPU load.
  # Type: integer; default: 10.
  disk_io_threads = 10

  # Interval, in seconds, between periodic tape-session statistics reports. Must be greater than zero.
  # Final statistics are also reported when the session finishes.
  # Type: integer; default: 15.
  stats_report_interval_secs = 15

  # Maximum inactivity, in seconds, in Transferring before liveness becomes unhealthy.
  # Measured from the later of state entry and last block movement; reporter activity does not count.
  # Also controls how often warnings are logged for a stuck file.
  # Type: integer; default: 1800.
  no_block_move_timeout_secs = 1800

  # Batch fetching and tape-flush behaviour for disk-to-tape archive sessions.
  [transfers.archive]
    # Maximum total bytes requested from the scheduler in one archive batch. The batch is limited when
    # either this value or fetch_max_files is reached. Larger batches can keep the drive busier but consume
    # more scheduler and transfer resources.
    # Type: integer; default: 100000000000.
    fetch_max_bytes = 100000000000

    # Maximum number of files requested in one archive batch. The batch is limited when either this value
    # or fetch_max_bytes is reached.
    # Type: integer; default: 5000.
    fetch_max_files = 5000

    # Maximum bytes written between flushes to tape using a synchronised tape mark. A flush occurs only on
    # a file boundary, so the actual byte count can exceed this value. More frequent flushes improve recovery
    # granularity but may reduce throughput.
    # Type: integer; default: 32000000000.
    flush_max_bytes = 32000000000

    # Maximum files written between flushes to tape. A flush is triggered when either this value or
    # flush_max_bytes is reached.
    # Type: integer; default: 200.
    flush_max_files = 200

    # Ends archive sessions whose scheduler batches remain too small to use the drive efficiently. The effective
    # fill percentage is max(files fetched / fetch_max_files, bytes fetched / fetch_max_bytes). An observation
    # begins below start_threshold_percent and resets at or above recovery_threshold_percent. The session ends
    # only after both watch_period_secs and minimum_samples are satisfied.
    [transfers.archive.underfill]
      # Minimum duration, in seconds, for which archive batches must remain underfilled before an unmount can be
      # requested. Increasing it tolerates slow producers longer.
      # Type: integer; default: 300.
      watch_period_secs = 300

      # Minimum number of underfilled archive batches required during the observation period before an unmount
      # can be requested. This prevents a single small batch from ending a session.
      # Type: integer; default: 3.
      minimum_samples = 3

      # Fill percentage below which an underfill observation begins. Valid values are 0 through 100 and this
      # should be lower than recovery_threshold_percent.
      # Type: integer; default: 40.
      start_threshold_percent = 40

      # Fill percentage at or above which an underfill observation is cancelled. Valid values are 0 through 100
      # and this should be higher than start_threshold_percent to provide hysteresis.
      # Type: integer; default: 60.
      recovery_threshold_percent = 60

  # Batch fetching, disk-space checks, and disk draining for tape-to-disk retrieve sessions.
  [transfers.retrieve]
    # Enable recommended access order (RAO); include [transfers.retrieve.rao] only when true.
    # Type: boolean; default: false.
    rao_enabled = true

    # Maximum total bytes requested from the scheduler in one retrieve batch. The batch is limited when
    # either this value or fetch_max_files is reached.
    # Type: integer; default: 100000000000.
    fetch_max_bytes = 100000000000

    # Maximum number of files requested in one retrieve batch. The batch is limited when either this value
    # or fetch_max_bytes is reached.
    # Type: integer; default: 5000.
    fetch_max_files = 5000

    # Maximum time, in seconds, in DrainingToDisk before liveness becomes unhealthy.
    # Type: integer; default: 1800.
    drain_to_disk_timeout_secs = 1800

    # Path to the operator-provided executable that reports free space in the retrieve destination.
    # Leave empty to disable disk-space backpressure. If cta-eosdf is installed, set this path to
    # "/usr/bin/cta-eosdf.sh".
    # Type: string; default: "".
    external_free_disk_space_script = ""

    # Recommended access order (RAO): optional and enabled in this example to reduce tape positioning.
    [transfers.retrieve.rao]
      # Enables hardware or software RAO on supported drives. Unsupported drives continue without RAO.
      # When hardware RAO is available, it is preferred over software RAO.

      # Software RAO algorithm for LTO-8 drives. Valid values are
      # - "random": Retrieve files in randomised order
      # - "linear": Order files by fseq
      # - "sltf": Shortest Locate Time First. Order by always picking the nearest (lowest cost) neighbour
      # For production, "sltf" is recommended. For "sltf" to work, the columns NB_WRAPS, MIN_LPOS, and MAX_LPOS
      # columns of the corresponding media type must be populated in the catalogue.
      # This option is ignored when hardware RAO is available on the drive.
      # Type: string; default: "sltf".
      # Allowed: "linear", "random", "sltf".
      lto_algorithm = "sltf"

  # Tape encryption: optional and enabled in this example; requires tape or tape-pool key configuration.
  [transfers.encryption]
    # Enables use of tape-drive hardware encryption when a key is configured for the tape or tape pool.
    # This does not encrypt tapes lacking valid key configuration.

    # Path to the operator-provided executable used to obtain encryption keys. It must be executable by
    # cta-taped and return the protocol expected by EncryptionControl.
    # Type: string; default: "/usr/local/bin/cta-get-encryption-key.sh".
    external_key_script = "/usr/local/bin/cta-get-encryption-key.sh"

[catalogue]
  # Path to the file containing the catalogue database connection string.
  # Examples:
  #   postgresql:postgresql://username:password@hostname/database
  #   oracle:username/password@database
  # See /etc/cta/cta-catalogue.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-catalogue.conf".
  config_file = "/etc/cta/cta-catalogue.conf"

[scheduler]
  # Name identifying this scheduler backend in logs and scheduler resources, such as "cephUser" or "postgresUser".
  # Type: string; default: none; required.
  backend_name = "cephUser"

  # Path to the file containing the scheduler backend connection string.
  # Examples:
  #   rados://user@pool:namespace
  #   file:///path/to/objectstore
  # See /etc/cta/cta-scheduler.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-scheduler.conf".
  config_file = "/etc/cta/cta-scheduler.conf"

  # Number of connections to the scheduler database.
  # Type: integer; default: 3.
  number_of_connections = 3

  # Maximum age, in seconds, of cached tape statistics used when deciding whether work warrants a mount.
  # Lower values reflect scheduler changes sooner but increase backend queries; 0 disables the cache.
  # Type: integer; default: 600.
  tape_cache_max_age_secs = 600

  # Maximum age, in seconds, of cached retrieve-queue statistics. Lower values reflect newly queued
  # retrieves sooner but increase backend queries; 0 disables the cache.
  # Type: integer; default: 10.
  retrieve_queue_cache_max_age_secs = 10

[xrootd]
  # Overrides the XrdSecPROTOCOL environment variable used for connections to the disk system.
  # Valid values depend on the installed XRootD security plugins.
  # Type: string; default: "sss".
  security_protocol = "sss"

  # Overrides the XrdSecSSSKT environment variable with the path to the XRootD SSS keytab. The file must
  # be readable by cta-taped when the "sss" protocol is selected.
  # Type: string; default: "etc/cta/sss.keytab".
  sss_keytab_path = "/etc/cta/cta.sss.keytab"

[logging]
  # Lowest severity to log. DEBUG produces the most output.
  # Type: string; default: "INFO".
  # Allowed: "EMERG", "ALERT", "CRIT", "ERR", "WARNING", "NOTICE", "USERERR", "INFO", "DEBUG".
  level = "INFO"

  # Log format: structured JSON or key-value pairs.
  # Type: string; default: "json".
  # Allowed: "json", "kv".
  format = "json"

  # Custom string labels added to every log line for filtering and monitoring.
  # Keys are freely chosen and optional; they do not change service behaviour.
  # Type: table of strings; default: {}.
  [logging.attributes]
    # CTA catalogue instance served by this process, for example "production" or "preproduction".
    # Use the same label across services sharing that catalogue; omit it if unused.
    instance = "production"

# Telemetry (experimental). Recommended for monitoring.
[telemetry]
  # Path to the OpenTelemetry SDK declarative configuration file.
  # Type: string; default: none; required.
  config_file = "/etc/cta/cta-otel.yaml"

  # What to do if telemetry cannot start.
  # Type: string; default: "warn".
  # Allowed: "warn" (continue without telemetry), "fatal" (abort startup).
  on_init_failure = "warn"

# Health endpoints. Recommended for monitoring.
[health_server]
  # Use "unix" for <runtime-dir>/health.sock; start the service with --runtime-dir.
  # For Unix sockets, remove the entire [health_server.tcp] section.
  # Type: string; default: "tcp".
  # Allowed: "tcp", "unix".
  transport = "tcp"

  [health_server.tcp]
    # Use 127.0.0.1 for local probes, or 0.0.0.0 to listen on all IPv4 interfaces.
    # Type: string; default: "127.0.0.1".
    host = "127.0.0.1"

    # TCP port for the health endpoints.
    # Type: integer; default: 8080.
    port = 8080
