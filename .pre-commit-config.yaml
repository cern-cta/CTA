repos:
  - repo: local
    hooks:
      - id: reuse-lint-file
        name: REUSE lint-file
        entry: uv run --locked --only-group source-checks reuse lint-file
        language: system
      - id: detect-secrets
        name: Detect secrets
        entry: uv run --locked --only-group source-checks detect-secrets-hook
        language: system
        args: ['--baseline', '.secrets.baseline']
      - id: clang-format
        name: clang-format
        entry: uv run --locked --only-group source-checks clang-format -i
        language: system
        args: ['-style=file']
        files: \.(c|h|cc|cpp|cxx|hpp|hh|json)$
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group lint ruff check --force-exclude
        language: system
        args: [--fix]
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: yamllint
        name: yamllint
        entry: uv run --locked --only-group source-checks yamllint
        language: system
        types: [file, yaml]
      - id: taplo
        name: taplo fmt
        entry: taplo fmt
        language: system
        types: [toml]
      - id: gitlab-ci
        name: GitLab CI check
        entry: >-
          uv run --locked --only-group source-checks bash -c 'python3 ci/checks/check_gitlab_ci_before_script_guard.py .gitlab-ci.yml .gitlab/ci/
          && python3 ci/checks/check_gitlab_ci_key_order.py .gitlab/
          && python3 ci/checks/check_gitlab_ci_single_stage.py .gitlab/ci/'
        language: system
        files: '(^|/).*gitlab-ci\.yml$'
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: >-
          cargo clippy --no-deps --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
