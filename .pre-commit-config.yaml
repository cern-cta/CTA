# Latest versions can be found in the respective repos if an update is desired
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 182152eb8c5ce1cf5299b956b04392c86bd8a126  # frozen: v20.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cc|cpp|cxx|hpp|hh|json)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: d96cc7adddf7d15b77f99dbd5d20e037dfd1b29c  # frozen: v0.14.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7  # frozen: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/fsfe/reuse-tool
    rev: 634a1823f9a9a234f79510e8fade22aea5306f85  # frozen: v5.1.0
    hooks:
      - id: reuse-lint-file
  - repo: local
    hooks:
      - id: gitlab-ci
        name: GitLab CI check
        entry: >-
          bash -c 'python3 ci/checks/check_gitlab_ci_before_script_guard.py .gitlab-ci.yml .gitlab/ci/
          && python3 ci/checks/check_gitlab_ci_key_order.py .gitlab/
          && python3 ci/checks/check_gitlab_ci_single_stage.py .gitlab/ci/'
        language: python
        additional_dependencies: [PyYAML==6.0.2]
        files: '(^|/).*gitlab-ci\.yml$'
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: >-
          cargo clippy --no-deps --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
