spec:
  inputs:
    platform:
      type: string
    enable-internal-repos:
      type: boolean
    analysis:
      description: "C/C++ analysis mode: Valgrind or compiler sanitizers."
      type: string
      options: ["none", "valgrind", "address", "undefined", "address,undefined", "thread"]
      default: "none"
---

.setup-cta-install: &setup-cta-install
  - mkdir -p ${CTAREPODIR}
  - cp -r build/$[[ inputs.platform ]]/RPM ${CTAREPODIR}
  - createrepo ${CTAREPODIR}
  - echo -e "[cta-local-testing]\nname=CTA artifacts\nbaseurl=file://${CTAREPODIR}\ngpgcheck=0\nenabled=1\npriority=2" > /etc/yum.repos.d/cta-local-testing.repo
  - dnf -y --nogpgcheck install cta-release
  - cta-versionlock apply
  - |
    if $[[ inputs.enable-internal-repos ]]; then
      cp -f ci/docker/cta/$[[ inputs.platform ]]/etc/yum.repos.d-internal/*.repo /etc/yum.repos.d/
    fi
  - dnf -y --nogpgcheck install cta-tests cta-tests-debuginfo

.cpp-test:
  before_script:
    - !reference [.merge-train-guard, before_script]
    - *setup-cta-install
    - mkdir -p test-results test-logs
    - |
      # Load targeted suppressions and include both stacks for potential deadlocks.
      if [[ "$[[ inputs.analysis ]]" == "thread" ]]; then
        export TSAN_OPTIONS="${TSAN_OPTIONS:+${TSAN_OPTIONS}:}second_deadlock_stack=1:suppressions=${CI_PROJECT_DIR}/tests/tsan.suppr"
      fi
    - |
      set -o pipefail
      test_status=0
      # Record failures without skipping later tests or database cleanup.
      run_cpp_test() {
        local name="$1"
        shift
        GTEST_OUTPUT="xml:${CI_PROJECT_DIR}/test-results/${name}.xml" \
          "$@" 2>&1 | tee "test-logs/${name}.log" || test_status=1
      }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/
      - test-logs/
    reports:
      junit: test-results/*.xml

unit-test-python:
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - changes:
        - "**/*.py"
        - '**/*requirements.txt'
        - ci/docs/**/*
        - ci/docker/pipeline/default.Dockerfile
        - '.gitlab/ci/*.gitlab-ci.yml'
        - .gitlab-ci.yml
      when: on_success
  image:
    name: $IMAGE_DEFAULT
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  before_script:
    - !reference [.merge-train-guard, before_script]
    # The suite includes real mike/MkDocs publication tests.
    - source ci/docs/prepare-environment.sh
    - uv pip install --python "$(command -v python)" pytest
  script:
    - python -m pytest ci --ignore=ci/system_tests --junitxml=python-ci-unit-tests.xml
  artifacts:
    when: always
    reports:
      junit: python-ci-unit-tests.xml

unit-test-rust:
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
      when: on_success
  image:
    name: $IMAGE_LINT # At a future point in time this should reference a better scoped image
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "recursive"
  before_script:
    - !reference [.merge-train-guard, before_script]
  script:
    - |
      cargo llvm-cov nextest --config-file .cargo/nextest.toml --profile ci --cobertura --output-path cobertura.xml &&
      cargo llvm-cov report --summary-only
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
  coverage: '/^TOTAL.*\s(\d+\.\d+)%/'

test-cta-valgrind:
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: '"$[[ inputs.analysis ]]" != "none" && "$[[ inputs.analysis ]]" != "valgrind"'
      when: never
    - if: '"$[[ inputs.analysis ]]" == "valgrind"'
      when: on_success
    - when: manual
      allow_failure: true
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
  before_script:
    - !reference [.merge-train-guard, before_script]
    - *setup-cta-install
  script:
    - /usr/bin/cta-unit-and-integration-tests.sh

integration-test-cta:
  extends: .cpp-test
  # Sometimes flaky due to "resource unavailable" error
  retry: 1
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    # CLI invocation checks assert exact stderr and exit codes; run them without compiler sanitizers.
    - if: '"$[[ inputs.analysis ]]" != "none" && "$[[ inputs.analysis ]]" != "valgrind"'
      when: never
    - when: on_success
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
  script:
    - run_cpp_test cta-integration-tests /usr/bin/cta-integration-tests
    - exit "$test_status"

unit-test-cta:
  extends: .cpp-test
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - when: on_success
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
  script:
    - run_cpp_test cta-unit-tests-multiprocess /usr/bin/cta-unit-tests-multiprocess
    - run_cpp_test cta-unit-tests /usr/bin/cta-unit-tests
    - exit "$test_status"

unit-test-postgresql:
  extends: .cpp-test
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - when: on_success
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
  script:
    - dnf -y install cta-catalogue-utils
    - POSTGRESQL_DATA_DIR=/usr/local/cta_test_pgsql_data
    - POSTGRESQL_LOG_DIR=/var/log/postgres
    - echo POSTGRESQL_DATA_DIR=${POSTGRESQL_DATA_DIR}
    - echo POSTGRESQL_LOG_DIR=${POSTGRESQL_LOG_DIR}
    - mkdir -p ${POSTGRESQL_DATA_DIR}
    - chown -R postgres:postgres ${POSTGRESQL_DATA_DIR}
    - mkdir -p ${POSTGRESQL_LOG_DIR}
    - chown -R postgres:postgres ${POSTGRESQL_LOG_DIR}
    - mkdir /var/run/postgresql
    - chown -R postgres:postgres /var/run/postgresql/
    - runuser -u postgres -- initdb -D ${POSTGRESQL_DATA_DIR}
    - runuser -u postgres -- pg_ctl start -w -t 10 -D ${POSTGRESQL_DATA_DIR} -l ${POSTGRESQL_LOG_DIR}/cta_test_postgres.log
    - runuser -u postgres -- createuser -E cta
    # Database ownership permits schema creation with PostgreSQL 15+ defaults.
    - runuser -u postgres -- createdb --owner=cta cta
    - CTA_CATALOGUE_CONF=$(mktemp)
    - echo CTA_CATALOGUE_CONF=${CTA_CATALOGUE_CONF}
    - echo 'postgresql:postgresql://cta@localhost/cta' > ${CTA_CATALOGUE_CONF}
    - /usr/bin/cta-catalogue-schema-create ${CTA_CATALOGUE_CONF}
    - |
      if [[ "$[[ inputs.analysis ]]" == "valgrind" ]]; then
        run_cpp_test cta-unit-tests-rdbms valgrind /usr/bin/cta-unit-tests-rdbms "${CTA_CATALOGUE_CONF}"
      else
        run_cpp_test cta-unit-tests-rdbms /usr/bin/cta-unit-tests-rdbms "${CTA_CATALOGUE_CONF}"
      fi
    - runuser -u postgres -- pg_ctl stop -D ${POSTGRESQL_DATA_DIR}
    - exit "$test_status"

unit-test-oracle:
  extends: .cpp-test
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - if: '$ENABLE_ORACLE_SUPPORT == "false"'
      when: never
    - when: on_success
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
    ORACLE_USERNAME: cta_dev04
    ORACLE_PASSWORD: $CI_ORACLE_UNIT_TEST_DB_PASSWORD
    # Note that this expects the full url; not a shortname relying on tnsnames
    ORACLE_DATABASE: $CI_ORACLE_UNIT_TEST_DB_DATABASE
  script:
    - dnf -y install cta-catalogue-utils
    - CTA_CATALOGUE_CONF=$(mktemp)
    - echo CTA_CATALOGUE_CONF=${CTA_CATALOGUE_CONF}
    - echo oracle:${ORACLE_USERNAME}/${ORACLE_PASSWORD}@${ORACLE_DATABASE} > ${CTA_CATALOGUE_CONF}
    - echo yes | cta-catalogue-schema-drop ${CTA_CATALOGUE_CONF}
    - /usr/bin/cta-catalogue-schema-create ${CTA_CATALOGUE_CONF}
    - |
      if [[ "$[[ inputs.analysis ]]" == "valgrind" ]]; then
        run_cpp_test cta-unit-tests-rdbms valgrind /usr/bin/cta-unit-tests-rdbms "${CTA_CATALOGUE_CONF}"
      else
        run_cpp_test cta-unit-tests-rdbms /usr/bin/cta-unit-tests-rdbms "${CTA_CATALOGUE_CONF}"
      fi
    - exit "$test_status"
  # Adding this resource group ensures only a single instance of this job can run at any given time
  # This is necessary as the job uses a single account on a centralized database.
  resource_group: oracle-centralized-db-cta-dev04

test-cta-rpm-install:
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - tools/cta-release/**/*
        - project.json
        - packaging/**/*
        - "**/CMakeLists.txt"
        - cmake/**/*
        - ci/checks/check_installed_layout.sh
        - .gitlab/ci/tests.gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
    CTAREPODIR: /tmp/repo
  script:
    - mkdir -p ${CTAREPODIR}
    - cp -r build/$[[ inputs.platform ]]/RPM ${CTAREPODIR}
    - createrepo ${CTAREPODIR}
    - echo -e "[cta-local-testing]\nname=CTA artifacts\nbaseurl=file://${CTAREPODIR}\ngpgcheck=0\nenabled=1\npriority=2" > /etc/yum.repos.d/cta-local-testing.repo
    - dnf install --nogpgcheck -y cta-release
    - cta-versionlock apply
    - dnf install --nogpgcheck -y cta-admin
                                  cta-catalogue-utils
                                  cta-scheduler-utils
                                  cta-admin-api
                                  cta-workflow-api
                                  cta-maintd
                                  cta-taped
                                  cta-tape-label
                                  cta-readtp
                                  cta-rmcd
                                  cta-smc
                                  cta-tools-rs
                                  eos-server
                                  eos-client
    - |
      if $ENABLE_ORACLE_SUPPORT; then
        dnf install --nogpgcheck -y cta-lib-catalogue-occi
      fi
    # Check that everything was installed properly
    - cta-versionlock --json check-installed > checkpkg-output.json
    - bash ci/checks/check_installed_layout.sh rpm
  artifacts:
    when: always
    paths:
      - checkpkg-output.json
    reports:
      metrics: metrics.txt


test-cta-debian-install:
  stage: test
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: build-cta
      artifacts: true
  rules:
    - if: '"$[[ inputs.platform ]]" != "debian13" || $CUSTOM_CTA_IMAGE_TAG != ""'
      when: never
    - when: on_success
  image: $IMAGE_TEST
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      shopt -s nullglob
      packages=(./build/$[[ inputs.platform ]]/DEB/*.deb ./build/$[[ inputs.platform ]]/DEB/*.ddeb)
      if (( ${#packages[@]} == 0 )); then
        echo "No Debian binary packages found in build/$[[ inputs.platform ]]/DEB" >&2
        exit 1
      fi
      # Install local artifacts and resolve their dependencies from the configured repositories.
      apt-get update
      apt-get install -y "${packages[@]}"
      apt-get check
      for package in "${packages[@]}"; do
        name=$(dpkg-deb --field "$package" Package)
        version=$(dpkg-deb --field "$package" Version)
        test "$(dpkg-query --show --showformat='${Status} ${Version}' "$name")" = "install ok installed $version"
      done
    - bash ci/checks/check_installed_layout.sh deb


# Uses lintian to test Debian package compliance
test-cta-debian-compliance:
  stage: test
  needs:
    - job: build-cta
      artifacts: true
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '"$[[ inputs.platform ]]" != "debian13" || $CUSTOM_CTA_IMAGE_TAG != ""'
      when: never
    - when: on_success
  image: $IMAGE_LINTIAN
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - |
      set -o pipefail
      shopt -s nullglob
      packages=(build/$[[ inputs.platform ]]/DEB/*.deb build/$[[ inputs.platform ]]/DEB/*.ddeb)
      if (( ${#packages[@]} == 0 )); then
        echo "No Debian binary packages found in build/$[[ inputs.platform ]]/DEB" >&2
        exit 1
      fi
      # Report warnings without failing while packaging improvements are in progress.
      lintian --allow-root --fail-on error --color never "${packages[@]}" 2>&1 | tee lintian.log
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lintian.log
