spec:
  inputs:
    platform:
      type: string
---

# =========================================================================
#  Publish RPMs
# =========================================================================

internal-release-cta:
  stage: release
  needs:
    - job: prepare-cta-version
      artifacts: true
    - build-cta-rpms
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  image: $IMAGE_RELEASE
  before_script:
    - !reference [.merge-train-guard, before_script]
  script:
    - echo "Publishing to internal CTA repository"
    - EOS_ACCOUNT_PASSWORD=${DOCKER_LOGIN_PASSWORD}
      ./ci/release/upload_to_eos.sh --eos-username ${DOCKER_LOGIN_USERNAME}
                                    --local-source-dir build/$[[ inputs.platform ]]/RPM/RPMS/x86_64
                                    --eos-target-dir /eos/user/c/ctareg/www/cta-repo/RPMS/x86_64
                                    --cta-version "${CTA_VERSION:?Missing CTA_VERSION}"
  after_script:
    - |
      case "$CI_JOB_STATUS" in
        success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) published the RPMs to the internal CTA repository." ;;
        failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed to publish the RPMs to the internal CTA repository." ;;
        *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
      esac
      python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"
  resource_group: cta-rpm-publication

.public-release-cta:
  stage: release
  needs:
    - job: prepare-cta-version
      artifacts: true
    - internal-release-cta
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  image: $IMAGE_RELEASE
  before_script:
    - !reference [.merge-train-guard, before_script]
  script:
    - REPOSITORY_PATH="${RELEASE_CHANNEL}/cta-${CTA_MAJOR_VERSION:?Missing CTA_MAJOR_VERSION}/$[[ inputs.platform ]]/cta/x86_64"
    - echo "Publishing CTA version ${CTA_VERSION} to the ${RELEASE_CHANNEL} CTA repository"
    - EOS_ACCOUNT_PASSWORD=${DOCKER_LOGIN_PASSWORD}
      ./ci/release/upload_to_eos.sh --eos-username ${DOCKER_LOGIN_USERNAME}
                                    --eos-source-dir /eos/user/c/ctareg/www/cta-repo/RPMS
                                    --eos-target-dir /eos/user/c/ctareg/www/public/cta-public-repo/${REPOSITORY_PATH}
                                    --cta-version "${CTA_VERSION:?Missing CTA_VERSION}"
    - REPO_URL="https://cta-public-repo.web.cern.ch/${REPOSITORY_PATH}"
    - ./ci/release/check_rpm_available.sh --repository-url "$REPO_URL" --package "cta-taped" --version "${CTA_VERSION}"
  after_script:
    - |
      case "$CI_JOB_STATUS" in
        success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) published and verified the RPMs in the ${RELEASE_CHANNEL} repository." ;;
        failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed to publish or verify the RPMs in the ${RELEASE_CHANNEL} repository." ;;
        *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
      esac
      python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"
  resource_group: cta-rpm-publication

public-release-cta-unstable:
  extends: .public-release-cta
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  variables:
    RELEASE_CHANNEL: unstable

public-release-cta-testing:
  extends: .public-release-cta
  variables:
    RELEASE_CHANNEL: testing

public-release-cta-stable:
  extends: .public-release-cta
  needs:
    - job: prepare-cta-version
      artifacts: true
    - internal-release-cta
    # Anything in stable must also be in unstable
    - public-release-cta-unstable
  variables:
    RELEASE_CHANNEL: stable


# =========================================================================
#  Publish Images
# =========================================================================

.cta-image-targets: &cta-image-targets
  - cta-taped
  - cta-rmcd
  - cta-maintd
  - cta-frontend
  - cta-tools
  - cta-debug

.publish-image:
  stage: release
  needs:
    - job: prepare-cta-version
      artifacts: true
    - job: internal-release-cta
    - job: build-cta-images
      parallel:
        matrix:
          - TARGET_NAME: ['$[[ matrix.TARGET_NAME ]]']
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  image:
    name: $IMAGE_DOCKER_IMAGE_BUILDER
    entrypoint: [""]
  variables:
    DEST_REGISTRY_AUTH_FILE: "${CI_PROJECT_DIR}/.buildah-destination-auth.json"
    DEST_REGISTRY_PASSWORD: ""
    DEST_REGISTRY_USERNAME: ""
    SOURCE_REGISTRY_AUTH_FILE: "${CI_PROJECT_DIR}/.buildah-source-auth.json"
    SOURCE_REGISTRY_PASSWORD: ""
    SOURCE_REGISTRY_USERNAME: ""
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - !reference [.merge-train-guard, before_script]
    - |
      if [[ -z "$SOURCE_REGISTRY_USERNAME" || -z "$SOURCE_REGISTRY_PASSWORD" ]]; then
        echo "Source registry credentials are not configured"
        exit 1
      fi
      if [[ -z "$DEST_REGISTRY_USERNAME" || -z "$DEST_REGISTRY_PASSWORD" ]]; then
        echo "Destination registry credentials are not configured"
        exit 1
      fi
    - rm -f "$SOURCE_REGISTRY_AUTH_FILE" "$DEST_REGISTRY_AUTH_FILE"
    - echo "$SOURCE_REGISTRY_PASSWORD" | buildah login
        --authfile "$SOURCE_REGISTRY_AUTH_FILE"
        -u "$SOURCE_REGISTRY_USERNAME"
        --password-stdin
        "$DOCKER_IMAGE_REGISTRY"
    - echo "$DEST_REGISTRY_PASSWORD" | buildah login
        --authfile "$DEST_REGISTRY_AUTH_FILE"
        -u "$DEST_REGISTRY_USERNAME"
        --password-stdin
        "$DEST_REGISTRY"
  script:
    - SRC_IMAGE="${DOCKER_IMAGE_REGISTRY}/${DOCKER_PIPELINE_REGISTRY_PREFIX}/${TARGET_NAME}:${CTA_VERSION:?Missing CTA_VERSION}"
    - DST_IMAGE="${DEST_REGISTRY}/${DEST_IMAGE_PREFIX}/${TARGET_NAME}:${CTA_VERSION:?Missing CTA_VERSION}"
    - echo "Publishing ${SRC_IMAGE} -> ${DST_IMAGE}"
    - buildah pull --authfile "$SOURCE_REGISTRY_AUTH_FILE" "$SRC_IMAGE"
    - buildah tag "$SRC_IMAGE" "$DST_IMAGE"
    - buildah push --authfile "$DEST_REGISTRY_AUTH_FILE" "$DST_IMAGE"
  after_script:
    - rm -f "$SOURCE_REGISTRY_AUTH_FILE" "$DEST_REGISTRY_AUTH_FILE"
    - |
      if [[ -z "${CI_COMMIT_TAG:-}" ]]; then exit 0; fi
      case "$CI_JOB_STATUS" in
        success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) published ${TARGET_NAME} to ${DEST_REGISTRY}/${DEST_IMAGE_PREFIX}." ;;
        failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed to publish ${TARGET_NAME} to ${DEST_REGISTRY}/${DEST_IMAGE_PREFIX}." ;;
        *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
      esac
      python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"

publish-images-private:
  extends: .publish-image
  needs:
    - job: prepare-cta-version
      artifacts: true
    - job: internal-release-cta
      optional: true  # Present on tags; branch publication does not publish RPMs.
    - job: build-cta-images
      parallel:
        matrix:
          - TARGET_NAME: ['$[[ matrix.TARGET_NAME ]]']
  rules:
    - if: '$CUSTOM_CTA_IMAGE_TAG != "" || $PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    DEST_REGISTRY: $DOCKER_IMAGE_REGISTRY
    DEST_IMAGE_PREFIX: $DOCKER_RELEASE_REGISTRY_PREFIX

    SOURCE_REGISTRY_USERNAME: $DOCKER_PIPELINE_LOGIN_USERNAME
    SOURCE_REGISTRY_PASSWORD: $DOCKER_PIPELINE_LOGIN_PASSWORD

    DEST_REGISTRY_USERNAME: $DOCKER_RELEASE_LOGIN_USERNAME
    DEST_REGISTRY_PASSWORD: $DOCKER_RELEASE_LOGIN_PASSWORD
  parallel:
    matrix:
      - TARGET_NAME: *cta-image-targets

publish-images-public:
  extends: .publish-image
  rules:
    - if: '$ENABLE_ORACLE_SUPPORT == "true"'
      when: never
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  variables:
    DEST_REGISTRY: $DOCKER_IMAGE_REGISTRY
    DEST_IMAGE_PREFIX: $DOCKER_PUBLIC_REGISTRY_PREFIX

    SOURCE_REGISTRY_USERNAME: $DOCKER_PIPELINE_LOGIN_USERNAME
    SOURCE_REGISTRY_PASSWORD: $DOCKER_PIPELINE_LOGIN_PASSWORD

    DEST_REGISTRY_USERNAME: $DOCKER_PUBLIC_LOGIN_USERNAME
    DEST_REGISTRY_PASSWORD: $DOCKER_PUBLIC_LOGIN_PASSWORD
  before_script:
    - |
      if $ENABLE_ORACLE_SUPPORT; then
        echo "Oracle-enabled images cannot be published publicly."
        exit 1
      fi
    - !reference [.publish-image, before_script]
  parallel:
    matrix:
      - TARGET_NAME: *cta-image-targets

# Publish validated documentation independently of RPM and image publication.
publish-docs:
  interruptible: false
  stage: release
  needs:
    - job: build-docs
      artifacts: false
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT" || $CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  image: $IMAGE_DEFAULT
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_TERMINAL_PROMPT: "0"
  before_script:
    - !reference [.merge-train-guard, before_script]
    - source ci/docs/prepare-environment.sh
  script:
    - test -n "$CI_JOB_TOKEN"
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - git remote set-url origin "$CI_REPOSITORY_URL"
    - python ci/docs/publish.py --tag "$CI_COMMIT_TAG"
  resource_group: cta-docs-publication
  artifacts:
    paths:
      - build/docs/public/
    expire_in: 7 days
  pages:
    publish: build/docs/public
    expire_in: never
