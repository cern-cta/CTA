spec:
  inputs:
    custom-cta-image-tag:
      type: string
    custom-xrootd-version:
      type: string
    platform:
      type: string
---

check-merge-train-duplicate:
  stage: .pre
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
  inherit:
    default: false
  image: $IMAGE_DEFAULT
  variables:
    GIT_SUBMODULE_STRATEGY: none
    MERGE_TRAIN_DOTENV: merge-train.env
  script:
    - python3 ci/checks/merge_train_guard.py
  artifacts:
    reports:
      dotenv: merge-train.env

# Resolve the image and matching Git tag at runtime for the API-based dispatcher. These dotenv values are suitable for
# scripts, but cannot reliably populate declarative trigger fields because GitLab evaluates those before jobs run.
prepare-cta-version-regression:
  stage: .pre
  needs: []
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
  variables:
    GIT_STRATEGY: none
    # Automatic version regressions currently follow the canonical EL9 unstable release stream.
    CTA_REPO_URL: "https://cta-public-repo.web.cern.ch/unstable/cta-${CTA_MAJOR_VERSION}/el9/cta/x86_64/"
  script:
    - requested_image_tag="$[[ inputs.custom-cta-image-tag ]]"
    - requested_image_tag="$(echo "$requested_image_tag" | xargs)"
    # An explicit tag reproduces a particular release. Otherwise, select the latest canonical unstable RPM.
    - |
      if [[ -n "$requested_image_tag" ]]; then
        resolved_image_tag="$requested_image_tag"
      else
        echo "No CTA image tag provided. Looking for the latest canonical release in $CTA_REPO_URL"
        canonical_versions="$(
          dnf -q --repofrompath=cta-unstable,"$CTA_REPO_URL" --repo=cta-unstable \
            repoquery --qf '%{version}-%{release}' cta-taped |
            grep -E '^[0-9]+(\.[0-9]+){3}-[0-9]+\.el9$' |
            sort -Vu
        )"
        resolved_version="$(echo "$canonical_versions" | tail -n 1)"

        if [[ -z "$resolved_version" ]]; then
          echo "No canonical CTA release was found in $CTA_REPO_URL" >&2
          exit 1
        fi

        resolved_image_tag="v${resolved_version}"
      fi
    # Qualified releases such as rc and pgsched deliberately do not match the canonical image format.
    - |
      if [[ ! "$resolved_image_tag" =~ ^v[0-9]+(\.[0-9]+){3}-[0-9]+\.[[:alnum:]_-]+$ ]]; then
        echo "CTA image tag must be a canonical release in the form vX.Y.Z.R-N.PLATFORM: $resolved_image_tag" >&2
        exit 1
      fi
    - resolved_git_tag="${resolved_image_tag%.*}"
    # Validate the ref without cloning the repository.
    - |
      if ! git ls-remote --exit-code --tags "$CI_REPOSITORY_URL" "refs/tags/${resolved_git_tag}" >/dev/null; then
        echo "CTA Git tag does not exist: $resolved_git_tag" >&2
        exit 1
      fi
    - echo "Resolved CTA image tag $resolved_image_tag to Git tag $resolved_git_tag"
    - echo "RESOLVED_CTA_IMAGE_TAG=$resolved_image_tag" > regression.env
    - echo "RESOLVED_CTA_GIT_TAG=$resolved_git_tag" >> regression.env
  artifacts:
    reports:
      dotenv: regression.env

modify-project-json:
  stage: .pre
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_BRANCH"'
  variables:
    CUSTOM_XROOTD_VERSION_INPUT: "$[[ inputs.custom-xrootd-version ]]"
  script:
    - project_json_file="project.json"
    - touch pipeline.env
    # Replace XRootD
    - trimmed_xrootd_version=$(echo "$CUSTOM_XROOTD_VERSION_INPUT" | xargs)
    - |
      if [[ -n "$trimmed_xrootd_version" ]]; then
        echo "Updating XRootD version to: $trimmed_xrootd_version."
        tmp_file=$(mktemp)
        jq --arg new_xrd_version "$trimmed_xrootd_version" \
          --arg platform "$[[ inputs.platform ]]" \
          '.platforms[$platform].versionlock["group-xrootd"] = $new_xrd_version' \
          "$project_json_file" > "$tmp_file" && mv "$tmp_file" "$project_json_file"
      else
        echo "CUSTOM_XROOTD_VERSION is not provided. Skipping XRootD version replacement."
      fi
    # Replace EOS image tag
    - trimmed_eos_image_tag=$(echo "$CUSTOM_EOS_IMAGE_TAG" | xargs)
    # Grab the latest stable EOS release if not provided
    # Note that EOS uses "el-9" instead of "el9" for the repository >:(, so we just hardcode the platform instead of relying on $PLATFORM
    - |
      if [[ -z "$trimmed_eos_image_tag" ]]; then
        EOS_REPO_URL="https://storage-ci.web.cern.ch/storage-ci/eos/diopside/tag/testing/el-9/x86_64/"
        echo "No CUSTOM_EOS_IMAGE_TAG provided. Getting latest release from: $EOS_REPO_URL"
        trimmed_eos_image_tag="$(dnf -q --repofrompath=temprepo,$EOS_REPO_URL --repo=temprepo repoquery --latest-limit=1 --qf "%{version}" eos-server).$[[ inputs.platform ]]"
        echo "Using latest stable release: $trimmed_eos_image_tag"
      fi
    - echo "Updating EOS image tag to $trimmed_eos_image_tag"
    - tmp_file=$(mktemp)
    - jq --arg new_eos_image_tag "$trimmed_eos_image_tag"
          '.dev.eosImageTag = $new_eos_image_tag'
          "$project_json_file" > "$tmp_file" && mv "$tmp_file" "$project_json_file"
    # Done
    - echo "File content after replacement"
    - cat "${project_json_file}" | jq
  artifacts:
    paths:
      - project.json
    reports:
      dotenv: pipeline.env


generate-pipeline-images-tag:
  stage: .pre
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
  image: $IMAGE_DEFAULT
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    # A distinct name is required because dotenv values cannot override root pipeline variables.
    - NEW_PIPELINE_IMAGE_VERSION="$(date -u +%Y-%m-%d)-${CI_PIPELINE_ID}"
    - echo "Preparing pipeline image release ${NEW_PIPELINE_IMAGE_VERSION}"
    - echo "NEW_PIPELINE_IMAGE_VERSION=${NEW_PIPELINE_IMAGE_VERSION}" > pipeline-images.env
  artifacts:
    reports:
      dotenv: pipeline-images.env
