spec:
  inputs:
    custom-cta-image-tag:
      type: string
    custom-eos-image-tag:
      type: string
    custom-xrootd-version:
      type: string
    platform:
      type: string
    scheduler-type:
      type: string
    enable-oracle-support:
      type: boolean
    workflow-api-authentication:
      type: string
    enable-dcache-tests:
      type: boolean
    keep-stress-test-namespace:
      type: boolean
---

# A version regression starts on the branch selected by the external project, but its tests and deployment files must
# come from the same Git tag as the CTA image. This job resolves that pair and generates a child-pipeline configuration
# which imports the tagged CI definition. The child also checks out the tag explicitly because child pipelines otherwise
# inherit the parent pipeline's commit.
resolve-cta-version-regression:
  stage: .pre
  needs: []
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
  variables:
    GIT_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: "none"
    CTA_REPO_URL: "https://cta-public-repo.web.cern.ch/unstable/cta-5/$[[ inputs.platform ]]/cta/x86_64/"
  script:
    # An explicit tag reproduces a particular release.
    # Otherwise, select the latest canonical unstable RPM.
    - requested_image_tag="$[[ inputs.custom-cta-image-tag ]]"
    - requested_image_tag="$(echo "$requested_image_tag" | xargs)"
    - |
      if [[ -n "$requested_image_tag" ]]; then
        resolved_image_tag="$requested_image_tag"
      else
        echo "No CTA image tag provided. Looking for the latest canonical release in $CTA_REPO_URL"
        canonical_versions="$(
          dnf -q --repofrompath=cta-unstable,"$CTA_REPO_URL" --repo=cta-unstable \
            repoquery --qf '%{version}-%{release}' cta-taped |
            grep -E '^[0-9]+(\.[0-9]+){3}-[0-9]+\.el9$' |
            sort -Vu
        )"
        resolved_version="$(echo "$canonical_versions" | tail -n 1)"
        if [[ -z "$resolved_version" ]]; then
          echo "No canonical CTA release was found in $CTA_REPO_URL" >&2
          exit 1
        fi
        resolved_image_tag="v${resolved_version}"
      fi
    # Qualified releases such as rc and pgsched deliberately do not match this canonical image format.
    - |
      if [[ ! "$resolved_image_tag" =~ ^v[0-9]+(\.[0-9]+){3}-[0-9]+\.el9$ ]]; then
        echo "CTA image tag must be a canonical release in the form vX.Y.Z.R-N.el9: $resolved_image_tag" >&2
        exit 1
      fi
    - resolved_git_tag="${resolved_image_tag%.el9}"
    # Fail in the dispatcher instead of creating a child pipeline that cannot load the tagged CI configuration.
    - |
      if ! git ls-remote --exit-code --tags origin "refs/tags/${resolved_git_tag}" >/dev/null; then
        echo "CTA Git tag does not exist: $resolved_git_tag" >&2
        exit 1
      fi
    - git fetch --quiet --depth 1 origin "refs/tags/${resolved_git_tag}"
    - git show FETCH_HEAD:.gitlab-ci.yml > selected-gitlab-ci.yml
    - git show FETCH_HEAD:.gitlab/ci/build.gitlab-ci.yml > selected-build-gitlab-ci.yml
    - git show FETCH_HEAD:.gitlab/ci/build-image.gitlab-ci.yml > selected-build-image-gitlab-ci.yml
    - |
      for required_input in pipeline-type custom-cta-image-tag custom-eos-image-tag custom-xrootd-version; do
        if ! grep -Eq "^[[:space:]]+${required_input}:" selected-gitlab-ci.yml; then
          echo "CTA Git tag $resolved_git_tag does not support the required '$required_input' pipeline input" >&2
          exit 1
        fi
      done
    # Do not adapt old releases: the selected tag must natively support branch regressions with an existing image.
    - |
      if ! grep -Fq 'CUSTOM_CTA_IMAGE_TAG != ""' selected-build-gitlab-ci.yml ||
         ! grep -Fq 'CUSTOM_CTA_IMAGE_TAG != ""' selected-build-image-gitlab-ci.yml; then
        echo "CTA Git tag $resolved_git_tag predates existing-image support for branch regressions" >&2
        exit 1
      fi
    # RPM publication and image publication are separate, so verify every image needed by the system tests.
    - echo "$DOCKER_PRIVATE_LOGIN_PASSWORD" | podman login
        --username "$DOCKER_PRIVATE_LOGIN_USERNAME"
        --password-stdin
        "$DOCKER_IMAGE_REGISTRY"
    - |
      for image_name in cta-taped cta-rmcd cta-maintd cta-frontend cta-tools; do
        image_ref="${DOCKER_IMAGE_REGISTRY}/${DOCKER_PRIVATE_REGISTRY_PREFIX}/${image_name}:${resolved_image_tag}"
        if ! podman manifest inspect "$image_ref" >/dev/null; then
          echo "Required CTA image does not exist: $image_ref" >&2
          exit 1
        fi
      done
    - echo "Resolved CTA image tag $resolved_image_tag to Git tag $resolved_git_tag"
    # Generate JSON because JSON is valid YAML and avoids quoting user-provided input values into a YAML template.
    - |
      jq -n \
        --arg project "$CI_PROJECT_PATH" \
        --arg ref "$resolved_git_tag" \
        --arg cta_image "$resolved_image_tag" \
        --arg eos_image "$[[ inputs.custom-eos-image-tag ]]" \
        --arg xrootd_version "$[[ inputs.custom-xrootd-version ]]" \
        --arg platform "$[[ inputs.platform ]]" \
        --arg scheduler "$[[ inputs.scheduler-type ]]" \
        --arg workflow_auth "$[[ inputs.workflow-api-authentication ]]" \
        --argjson oracle "$[[ inputs.enable-oracle-support ]]" \
        --argjson dcache "$[[ inputs.enable-dcache-tests ]]" \
        --argjson keep_namespace "$[[ inputs.keep-stress-test-namespace ]]" \
        '{
          include: [{
            project: $project,
            ref: $ref,
            file: ".gitlab-ci.yml",
            inputs: {
              "pipeline-type": "REGR_AGAINST_CTA_BRANCH",
              "custom-cta-image-tag": $cta_image,
              "custom-eos-image-tag": $eos_image,
              "custom-xrootd-version": $xrootd_version,
              platform: $platform,
              "scheduler-type": $scheduler,
              "enable-oracle-support": $oracle,
              "workflow-api-authentication": $workflow_auth,
              "enable-dcache-tests": $dcache,
              "keep-stress-test-namespace": $keep_namespace
            }
          }],
          variables: {
            GIT_STRATEGY: "none",
            GIT_SUBMODULE_STRATEGY: "none"
          },
          default: {
            image: "$IMAGE_DEFAULT",
            interruptible: true,
            hooks: {
              pre_get_sources_script: [
                "git init \"$CI_PROJECT_DIR\"",
                "git -C \"$CI_PROJECT_DIR\" remote remove origin >/dev/null 2>&1 || true",
                "git -C \"$CI_PROJECT_DIR\" remote add origin \"$CI_REPOSITORY_URL\"",
                "git -C \"$CI_PROJECT_DIR\" fetch --depth 1 origin \"refs/tags/$CI_CONFIG_REF\"",
                "git -C \"$CI_PROJECT_DIR\" checkout --force FETCH_HEAD",
                "git -C \"$CI_PROJECT_DIR\" clean -ffdx",
                "git -C \"$CI_PROJECT_DIR\" submodule sync --recursive",
                "git -C \"$CI_PROJECT_DIR\" submodule update --init --recursive --depth 1"
              ]
            }
          }
        } |
        .variables.CI_CONFIG_REF = $ref' > regression-child.json
  artifacts:
    paths:
      - regression-child.json

modify-project-json:
  stage: .pre
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_BRANCH"'
  variables:
    CUSTOM_XROOTD_VERSION_INPUT: "$[[ inputs.custom-xrootd-version ]]"
  script:
    - project_json_file="project.json"
    - touch pipeline.env
    # Replace XRootD
    - trimmed_xrootd_version=$(echo "$CUSTOM_XROOTD_VERSION_INPUT" | xargs)
    - |
      if [[ -n "$trimmed_xrootd_version" ]]; then
        echo "Updating XRootD version to: $trimmed_xrootd_version."
        tmp_file=$(mktemp)
        jq --arg new_xrd_version "$trimmed_xrootd_version" \
          --arg platform "$[[ inputs.platform ]]" \
          '.platforms[$platform].versionlock["group-xrootd"] = $new_xrd_version' \
          "$project_json_file" > "$tmp_file" && mv "$tmp_file" "$project_json_file"
      else
        echo "CUSTOM_XROOTD_VERSION is not provided. Skipping XRootD version replacement."
      fi
    # Replace EOS image tag
    - trimmed_eos_image_tag=$(echo "$CUSTOM_EOS_IMAGE_TAG" | xargs)
    # Grab the latest stable EOS release if not provided
    # Note that EOS uses "el-9" instead of "el9" for the repository >:(, so we just hardcode the platform instead of relying on $PLATFORM
    - |
      if [[ -z "$trimmed_eos_image_tag" ]]; then
        EOS_REPO_URL="https://storage-ci.web.cern.ch/storage-ci/eos/diopside/tag/testing/el-9/x86_64/"
        echo "No CUSTOM_EOS_IMAGE_TAG provided. Getting latest release from: $EOS_REPO_URL"
        trimmed_eos_image_tag="$(dnf -q --repofrompath=temprepo,$EOS_REPO_URL --repo=temprepo repoquery --latest-limit=1 --qf "%{version}" eos-server).el9"
        echo "Using latest stable release: $trimmed_eos_image_tag"
      fi
    - echo "Updating EOS image tag to $trimmed_eos_image_tag"
    - tmp_file=$(mktemp)
    - jq --arg new_eos_image_tag "$trimmed_eos_image_tag"
          '.dev.eosImageTag = $new_eos_image_tag'
          "$project_json_file" > "$tmp_file" && mv "$tmp_file" "$project_json_file"
    # Done
    - echo "File content after replacement"
    - cat "${project_json_file}" | jq
  artifacts:
    paths:
      - project.json
    reports:
      dotenv: pipeline.env


generate-pipeline-images-tag:
  stage: .pre
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
  image: $IMAGE_DEFAULT
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    # A distinct name is required because dotenv values cannot override root pipeline variables.
    - NEW_PIPELINE_IMAGE_VERSION="$(date -u +%Y-%m-%d)-${CI_PIPELINE_ID}"
    - echo "Preparing pipeline image release ${NEW_PIPELINE_IMAGE_VERSION}"
    - echo "NEW_PIPELINE_IMAGE_VERSION=${NEW_PIPELINE_IMAGE_VERSION}" > pipeline-images.env
  artifacts:
    reports:
      dotenv: pipeline-images.env
