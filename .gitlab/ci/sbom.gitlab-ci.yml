spec:
  inputs:
    enable-sbom-generation:
      type: boolean
---

.sbom-rules:
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT" && $PIPELINE_TYPE != "REGR_AGAINST_CTA_BRANCH"'
      when: never
    - if: '"$[[ inputs.enable-sbom-generation ]]" == "true"'
      when: on_success
    - when: never

enrich-sboms-cern-info:
  extends: .sbom-rules
  stage: sbom
  needs:
    - job: build-cta-images
      artifacts: true
      parallel:
        matrix:
          - TARGET_NAME: ['$[[ matrix.TARGET_NAME ]]']
  image: $IMAGE_SBOM_HELPER
  variables:
    CTA_BUILD_ID: ${CI_PIPELINE_ID}git${CI_COMMIT_SHORT_SHA}
  script:
    - mkdir -p sboms
    - |
      export SERVICE_ELEMENT="CTA for Physics"
      export UNIT="IT-SD-TAB"
      export CONTACT="$GITLAB_USER_EMAIL"
      export ANNOTATOR="$GITLAB_USER_NAME"
      export URL="$CI_PROJECT_URL"
      export APP_NAME="$TARGET_NAME"

      input="sboms/raw/${TARGET_NAME}.cdx.json"
      output="sboms/${TARGET_NAME}.cdx.json"

      if [[ ! -f "$input" ]]; then
        echo "Missing raw SBOM for ${TARGET_NAME}: ${input}" >&2
        exit 1
      fi

      python /app/src/sbom-helper/main.py --env -i "$input"
      python ci/sbom/augment_sbom_metadata.py \
        --in "sboms-output/${input}" \
        --out "$output" \
        --component-name "$TARGET_NAME" \
        --component-version "$CTA_BUILD_ID" \
        --author-name "$GITLAB_USER_NAME" \
        --author-email "$GITLAB_USER_EMAIL" \
        --project-url "$CI_PROJECT_URL"
  artifacts:
    expire_in: 30 days
    paths:
      - sboms/${TARGET_NAME}.cdx.json
  parallel:
    matrix:
      - TARGET_NAME: [cta-taped, cta-rmcd, cta-maintd, cta-frontend, cta-tools]

score-sboms:
  extends: .sbom-rules
  stage: sbom
  needs:
    - job: enrich-sboms-cern-info
      artifacts: true
      parallel:
        matrix:
          - TARGET_NAME: ['$[[ matrix.TARGET_NAME ]]']
  image: $IMAGE_SBOMQS
  variables:
    # Gate on the NTIA minimum elements instead of fields such as signatures and
    # package artifact hashes that are not produced by a rootfs inventory.
    SBOM_MINIMUM_SCORE: "9.0"
    SBOM_QUALITY_PROFILE: "ntia"
  script:
    - |
      sbom="sboms/${TARGET_NAME}.cdx.json"
      if report="$(/app/sbomqs score --profile "$SBOM_QUALITY_PROFILE" "$sbom" 2>&1)"; then
        status=0
      else
        status=$?
      fi
      echo "$report"

      if [[ $status -ne 0 ]]; then
        echo "Failed to score ${sbom}" >&2
        exit 1
      fi

      score="$(printf '%s\n' "$report" | sed -nE 's/.*[Ss]core:[[:space:]]*([0-9]+([.][0-9]+)?).*/\1/p' | head -n 1)"
      if [[ -z "$score" ]]; then
        echo "Could not extract the overall score for ${sbom}" >&2
        exit 1
      fi

      if ! awk -v score="$score" -v minimum="$SBOM_MINIMUM_SCORE" 'BEGIN { exit !(score >= minimum) }'; then
        echo "${sbom} scored ${score}, below the required ${SBOM_MINIMUM_SCORE}" >&2
        exit 1
      fi
  artifacts:
    expire_in: 30 days
    paths:
      - sboms/${TARGET_NAME}.cdx.json
    reports:
      cyclonedx:
        - sboms/${TARGET_NAME}.cdx.json
  parallel:
    matrix:
      - TARGET_NAME: [cta-taped, cta-rmcd, cta-maintd, cta-frontend, cta-tools]
