spec:
  inputs:
    platform:
      type: string
    enable-internal-repos:
      type: boolean
---

# =========================================================================
#  Image build / publish configuration
# =========================================================================

.cta-image-targets: &cta-image-targets
  - cta-taped
  - cta-rmcd
  - cta-maintd
  - cta-frontend
  - cta-tools
  - cta-debug

.build-image:
  image:
    name: $IMAGE_DOCKER_IMAGE_BUILDER
    entrypoint: [""]
  variables:
    CONTAINER_STORAGE: "/builds/container-storage"
    DEST_REGISTRY_PASSWORD: ""
    DEST_REGISTRY_USERNAME: ""
    GIT_SUBMODULE_STRATEGY: "none"
    REGISTRIES_CONFIG_PATH: "${CI_PROJECT_DIR}/ci/docker/registries.conf"
    # If necessary, add additional whitelisted (private!) registries for images containing Oracle RPMs here, separated by spaces
    ORACLE_RPM_REGISTRY_WHITELIST: ""
  before_script:
    # Configure storage. See https://gitlab.cern.ch/gitlabci-examples/build_docker_image/-/blob/fce98393aab8f3ffca3b8449036ccb02275c8a46/.gitlab-ci.yml#L19
    - mkdir -p "${CONTAINER_STORAGE}" ~/.config/containers
    - |
      cat > ~/.config/containers/storage.conf << EOF
      [storage]
       driver = "overlay"
       runroot = "${CONTAINER_STORAGE}/run/containers/storage"
       graphroot = "${CONTAINER_STORAGE}/.local/share/containers/storage"
       rootless_storage_path = "${CONTAINER_STORAGE}/.local/share/containers/storage"

       [storage.options]
       pull_options = {enable_partial_images = "true", use_hard_links = "false", ostree_repos=""}

       [storage.options.overlay]
      EOF
    - cp ~/.config/containers/storage.conf /etc/containers/storage.conf || true
    - |
      if [[ -z "$DEST_REGISTRY_USERNAME" || -z "$DEST_REGISTRY_PASSWORD" ]]; then
        echo "Destination registry credentials are not configured"
        exit 1
      fi
    - echo "$DEST_REGISTRY_PASSWORD" | buildah login
        -u "$DEST_REGISTRY_USERNAME"
        --password-stdin
        "$DOCKER_IMAGE_REGISTRY"
    # Oracle RPMs are not allowed in public images. This function checks for Oracle RPMs in the image and refuses to publish it if any are found
    - |
      check_oracle_rpms_for_public_image() {
        local image_ref="$1"
        local private_prefix="${DOCKER_IMAGE_REGISTRY}/${DOCKER_PRIVATE_REGISTRY_PREFIX}/"
        local allowed_prefix
        for allowed_prefix in "$private_prefix" $ORACLE_RPM_REGISTRY_WHITELIST; do
          if [[ "$image_ref" == "$allowed_prefix"* ]]; then
            echo "Skipping Oracle RPM check for whitelisted image destination: ${image_ref}"
            return
          fi
        done

        local check_container installed_rpms oracle_rpms
        check_container="$(buildah from "$image_ref")"
        installed_rpms="$(buildah run "$check_container" -- rpm -qa)"
        buildah rm "$check_container"
        if oracle_rpms="$(grep -Ei '(oracle|occi)' <<< "$installed_rpms")"; then
          echo "Refusing to publish an image containing Oracle-related RPMs:"
          echo "$oracle_rpms"
          return 1
        fi
      }

# =========================================================================
#  Build CTA Images
# =========================================================================

.build-cta-image:
  extends: .build-image
  stage: build:image
  needs:
    - job: build-cta-rpms
      optional: true  # The job is not included in UPDATE_PIPELINE_IMAGES pipelines.
    - job: modify-project-json
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT" && $PIPELINE_TYPE != "REGR_AGAINST_CTA_BRANCH"'
      when: never
      # Debug is manual by default as it's quite large. However, build automatically for tags
    - if: '$TARGET_NAME == "cta-debug" && $CI_COMMIT_TAG == null'
      when: manual
      allow_failure: true
    - when: on_success
  variables:
    CTA_BUILD_ID: ${CI_PIPELINE_ID}git${CI_COMMIT_SHORT_SHA}
    DOCKERFILE: ci/docker/cta/$[[ inputs.platform ]]/prod.Dockerfile
    IMAGE_REF: ${DOCKER_IMAGE_REGISTRY}/${DOCKER_PRIVATE_REGISTRY_PREFIX}/${TARGET_NAME}:${CTA_BUILD_ID}
    RPM_CONTEXT: ${CI_PROJECT_DIR}/build_rpm/RPM/RPMS/x86_64
    EXTRA_BUILD_ARGS: ""
    SBOM_RAW_PATH: ${CI_PROJECT_DIR}/sboms/raw/${TARGET_NAME}.cdx.json
    DEST_REGISTRY_PASSWORD: $DOCKER_PRIVATE_LOGIN_PASSWORD
    DEST_REGISTRY_USERNAME: $DOCKER_PRIVATE_LOGIN_USERNAME
  script:
    - echo "Building ${TARGET_NAME}"
    - cd "$(dirname "${DOCKERFILE}")"
    - DOCKERFILE_NAME="$(basename "${DOCKERFILE}")"
    - |
      BUILDAH_ARGS=(
        --target "${TARGET_NAME}"
        --file "${DOCKERFILE_NAME}"
        --tag "${IMAGE_REF}"
        --build-context rpm_context="${RPM_CONTEXT}"
        --build-arg ENABLE_INTERNAL_REPOS="$[[ inputs.enable-internal-repos ]]"
        --build-arg ENABLE_ORACLE_SUPPORT="${ENABLE_ORACLE_SUPPORT}"
      )
    - |
      if [[ -n "$EXTRA_BUILD_ARGS" ]]; then
        BUILDAH_ARGS+=($EXTRA_BUILD_ARGS)
      fi
    - |
      if [[ "$ENABLE_SBOM_GENERATION" == "true" && "$TARGET_NAME" != "cta-debug" ]]; then
        mkdir -p "$(dirname "$SBOM_RAW_PATH")"
        BUILDAH_ARGS+=(
          --sbom-scanner-image "$IMAGE_TRIVY"
          --sbom-scanner-command 'trivy filesystem --pkg-types os --format cyclonedx --disable-telemetry --output {OUTPUT} {ROOTFS}'
          --sbom-merge-strategy merge-cyclonedx-by-component-name-and-version
          --sbom-output "$SBOM_RAW_PATH"
        )
      fi
    - buildah bud "${BUILDAH_ARGS[@]}" .
    - check_oracle_rpms_for_public_image "$IMAGE_REF"
    - buildah push "${IMAGE_REF}"
  artifacts:
    expire_in: 3 hours
    paths:
      - sboms/raw/*.cdx.json

build-cta-images:
  extends: .build-cta-image
  parallel:
    matrix:
      - TARGET_NAME: *cta-image-targets

# =========================================================================
#  Build Pipeline Images
# =========================================================================

build-pipeline-images:
  extends: .build-image
  stage: build:image
  needs:
    - job: generate-pipeline-images-tag
      artifacts: true
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
  variables:
    DEST_REGISTRY_PASSWORD: $DOCKER_PUBLIC_LOGIN_PASSWORD
    DEST_REGISTRY_USERNAME: $DOCKER_PUBLIC_LOGIN_USERNAME
  script:
    - |
      case "$IMAGE_SCOPE" in
        shared)
          DOCKERFILE="ci/docker/pipeline/${IMAGE_KIND}.Dockerfile"
          IMAGE_TAG="${NEW_PIPELINE_IMAGE_VERSION}"
          ;;
        platform)
          DOCKERFILE="ci/docker/cta/${PLATFORM}/${IMAGE_KIND}.Dockerfile"
          IMAGE_TAG="${NEW_PIPELINE_IMAGE_VERSION}.${PLATFORM}"
          ;;
        *)
          echo "Unsupported pipeline image scope: ${IMAGE_SCOPE}"
          exit 1
          ;;
      esac
    - IMAGE_NAME="cta-ci-${IMAGE_KIND}"
    - IMAGE_REF="${DOCKER_IMAGE_REGISTRY}/${DOCKER_PUBLIC_REGISTRY_PREFIX}/container_registry/${IMAGE_NAME}:${IMAGE_TAG}"
    - |
      case "$IMAGE_REF" in
        gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-*:* ) ;;
        *)
          echo "Refusing to push pipeline image to non-whitelisted registry: ${IMAGE_REF}"
          exit 1
          ;;
      esac
    - echo "Building ${IMAGE_REF} from ${DOCKERFILE}"
    - buildah bud --file "${DOCKERFILE}" --tag "${IMAGE_REF}" "$CI_PROJECT_DIR"
    - if [[ "$IMAGE_SCOPE" == "platform" ]]; then check_oracle_rpms_for_public_image "$IMAGE_REF"; fi
    - buildah push "$IMAGE_REF"
  parallel:
    matrix:
      - IMAGE_SCOPE: "shared"
        IMAGE_KIND: ["default", "lint", "release", "danger"]
      # Add one platform entry and its ci/docker/cta/<platform>/{build,test}.Dockerfiles per supported platform.
      - IMAGE_SCOPE: "platform"
        PLATFORM: ["el9"]
        IMAGE_KIND: ["build", "test"]
