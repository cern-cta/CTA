spec:
  inputs:
    custom-xrootd-version:
      type: string
    platform:
      type: string
---

validate-catalogue-schema-version:
  stage: validate
  needs: []  # Ensure no artifacts are downloaded
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    # For pivot CTA releases: vX.Y.0
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^.*\.0\.[0-9]+-[^-]*$/
      when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: "-p -t"
    # For non-pivot CTA releases
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^.*\.0\.[0-9]+-[^-]*$/
      when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: "-n -t"
    # Any run on main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: "-t"
    # For all other scenarios, manual run only
    - when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: ""
  script:
    - ./ci/checks/check_catalogue_schema_version.sh ${CATALOGUE_SCHEMA_CHECK_PARAMS} .

validate-custom-dependency-inputs:
  stage: validate
  needs:
    - job: modify-project-json
      optional: true
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    - when: on_success
  variables:
    CUSTOM_XROOTD_VERSION_INPUT: "$[[ inputs.custom-xrootd-version ]]"
    GIT_SUBMODULE_STRATEGY: "none" # Don't need submodules for this job
  script:
    - python3 ./ci/checks/validate_custom_dependency_inputs.py
      --custom-eos-image-tag "$CUSTOM_EOS_IMAGE_TAG"
      --custom-xrootd-version "$CUSTOM_XROOTD_VERSION_INPUT"
      --platform "$[[ inputs.platform ]]"

validate-project-json:
  stage: validate
  needs:
    - job: modify-project-json
      optional: true
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    - when: on_success
  script:
    - python3 ./ci/project-json/validate_project_json.py
