    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.yaml"
        - "**/*.yml"
        - "ci/checks/check_gitlab_ci_before_script_guard.py"
        - "ci/checks/test_check_gitlab_ci_before_script_guard.py"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/lint.gitlab-ci.yml"
        - ".python-version"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_SOURCE_CHECKS
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
  before_script:
    - !reference [.source-checks, before_script]
  script:
    - uv run --no-sync python3 ci/checks/check_gitlab_ci_before_script_guard.py .gitlab-ci.yml .gitlab/ci/
    - uv run --no-sync python3 ci/checks/check_gitlab_ci_key_order.py .gitlab/
    - uv run --no-sync python3 ci/checks/check_gitlab_ci_single_stage.py .gitlab/ci/
    - uv run --no-sync yamllint .

