.source-checks:
  before_script:
    - !reference [.merge-train-guard, before_script]
    - uv sync --locked --only-group source-checks

lint-cpp:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.c"
        - "**/*.h"
        - "**/*.cpp"
        - "**/*.hpp"
        - ".gitlab-ci.yml"  # For changes in the image
        - ".gitlab/ci/lint.gitlab-ci.yml"
        - ".python-version"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_SOURCE_CHECKS
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
  before_script:
    - !reference [.source-checks, before_script]
  script:
    - |
      cppcheck \
        --xml \
        --force \
        --enable=warning,performance \
        --inline-suppr \
        --check-level=exhaustive \
        --suppressions-list=.cppcheck-suppressions.txt \
        . 2> cppcheck_out.xml
    - uv run --no-sync cppcheck-codequality --input-file=cppcheck_out.xml --output-file=cppcheck.json
    - |
      if cat cppcheck_out.xml | grep -q "<error\s"; then
        echo "cppcheck detected errors. cppcheck-codequality output:"
        cat cppcheck.json | jq -C
        exit 1
      fi
    - echo "Done. No errors detected by cppcheck"
  artifacts:
    expire_in: 7 days
    reports:
      codequality: cppcheck.json

lint-bash:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.sh"
        - ".gitlab-ci.yml"  # For changes in the image
        - ".gitlab/ci/lint.gitlab-ci.yml"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_SOURCE_CHECKS
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
  script:
    - all_shell_scripts=( **/*.sh )
    - if [ ${#all_shell_scripts[@]} -eq 0 ]; then echo "No shell scripts"; exit 0; fi
    - shellcheck "${all_shell_scripts[@]}" --format json --severity warning | tee shellcheck.json | jq -C
  artifacts:
    expire_in: 7 days
    reports:
      codequality: shellcheck.json

lint-python:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - !reference [.python-workspace, rules]
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_AUTOMATION
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for this job
  before_script:
    - !reference [.merge-train-guard, before_script]
    - uv sync --locked --only-group lint
  script:
    - uv run --no-sync ruff check --output-format gitlab > ruff.json
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      codequality: ruff.json

# general code quality (using clippy)
lint-rust:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.rs"
        - ".gitlab-ci.yml"  # For changes in the image
        - ".gitlab/ci/lint.gitlab-ci.yml"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_RUST
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "recursive" # we need the proto defs
  before_script:
    - !reference [.merge-train-guard, before_script]
    - set -o pipefail
  script:
    - |
      set +e
      cargo clippy --all-targets --all-features --message-format=json > clippy-output.json
      CARGO_EXIT_CODE=$?
      set -e

      # Fail if cargo itself failed (a genuine build error), or if any clippy diagnostic is present at warning/error level.
      # We deliberately don't pass -D warnings to cargo clippy here: doing so promotes every warning to an "error" diagnostic
      # before cargo-sonar ever sees it, which makes everything show up as "critical" in the GitLab code quality report.
      if [ "$CARGO_EXIT_CODE" -ne 0 ] || jq -e 'select(.reason == "compiler-message") | select(.message.level == "warning" or .message.level == "error")' clippy-output.json > /dev/null; then
        echo "Clippy detected errors:"
        cat clippy-output.json | jq -C
        echo "📎 Everyone makes mistakes - it's how we learn and grow."
        CLIPPY_EXIT_CODE=1
      else
        CLIPPY_EXIT_CODE=0
      fi

      # convert to code climate format (readable by GitLab)
      cargo codeclimate --clippy --clippy-path clippy-output.json --codeclimate-path cargo-clippy.json

      exit $CLIPPY_EXIT_CODE
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      codequality: cargo-clippy.json

# check for security advisories, bans, licenses and package sources
deny-rust:
  allow_failure: true
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: always
      allow_failure: false  # Keep dependency checks mandatory for releases.
    - changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "**/deny.toml"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/lint.gitlab-ci.yml"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image:
    name: $IMAGE_RUST
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - cargo deny --config .cargo/deny.toml check

