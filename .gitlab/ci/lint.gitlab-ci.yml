  script:
    - find ci/docker -type f -name '*Dockerfile' -exec hadolint --failure-threshold warning {} +

# Generic format check job template
# The idea is to extend this, fill in the FORMAT_DIFF variable
# And then add a before_script: section that populates this FORMAT_DIFF file
.format-report:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - when: always
  image: $IMAGE_SOURCE_CHECKS
  variables:
    GIT_SUBMODULE_STRATEGY: "none"  # Don't need submodules for these job
    FORMAT_DIFF: ""
  before_script:
    - !reference [.merge-train-guard, before_script]
    - exit 1  # The jobs that extend this job should override this
  script:
    - |
      if [[ ! -f "$FORMAT_DIFF" ]]; then
        echo "FORMAT_DIFF file not found: $FORMAT_DIFF"
        exit 1
      fi
    - |
      if [[ $(wc -l < $FORMAT_DIFF) -le 1 ]]; then
        echo "No formatting issues found"
        exit 0
      fi
    - |
      if [[ $(wc -l < $FORMAT_DIFF) -le 1000 ]]; then
        bat --style=plain --color=always $FORMAT_DIFF
      else
        echo "Format diff too large. Please check job artifacts"
      fi
    - exit 1  # format checks failed, so the job should fail
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - $FORMAT_DIFF

format-cpp:
  extends:
    - .format-report
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.c"
        - "**/*.h"
        - "**/*.cc"
        - "**/*.cpp"
        - "**/*.cxx"
        - "**/*.hh"
        - "**/*.hpp"
        - "**/*.json"
        - ".clang-format"
        - ".clang-format-ignore"
        - ".gitlab-ci.yml"  # For changes in the image
        - ".gitlab/ci/lint.gitlab-ci.yml"
        - ".python-version"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  variables:
    FORMAT_DIFF: artifacts/clang-format.diff
  before_script:
    - !reference [.source-checks, before_script]
    - mkdir -p artifacts
    - echo "Running clang-format on all C/C++ and JSON files"
    - |
      find . -type d \( -name .git -o -name .venv \) -prune -o -type f \( \
        -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o \
        -name '*.cxx' -o -name '*.hpp' -o -name '*.hh' -o -name '*.json' \
      \) -exec uv run --no-sync clang-format -i {} +
    - git diff --no-ext-diff > "$FORMAT_DIFF"

format-python:
  extends:
    - .format-report
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - !reference [.python-workspace, rules]
    - when: manual
      allow_failure: true
  image: $IMAGE_AUTOMATION
  variables:
    FORMAT_DIFF: artifacts/ruff.diff
  before_script:
    - !reference [.merge-train-guard, before_script]
    - uv sync --locked --only-group lint
    - mkdir -p artifacts
    - echo "Running ruff on all Python files"
    # The inherited report script handles formatting differences; preserve tool failures.
    - |
      status=0
      uv run --no-sync ruff format . --check --diff > "$FORMAT_DIFF" || status=$?
      if [[ "$status" -gt 1 ]]; then exit "$status"; fi

format-toml:
  extends:
    - .format-report
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.toml"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/lint.gitlab-ci.yml"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image: $IMAGE_RUST
  variables:
    FORMAT_DIFF: artifacts/taplo.diff
  before_script:
    - !reference [.merge-train-guard, before_script]
    # Temporary until Taplo is included in the published Rust image.
    - cargo install taplo-cli --version 0.10.0 --locked
    - mkdir -p artifacts
    - echo "Running Taplo on all TOML files"
    - taplo fmt
    - git diff --no-ext-diff > "$FORMAT_DIFF"

format-rust:
  extends:
    - .format-report
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - changes:
        - "**/*.rs"
        - ".gitlab-ci.yml"  # For changes in the image
        - ".gitlab/ci/lint.gitlab-ci.yml"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  image: $IMAGE_RUST
  variables:
    FORMAT_DIFF: artifacts/cargo-fmt.diff
  before_script:
    - !reference [.merge-train-guard, before_script]
    - mkdir -p artifacts
    - echo "Running cargo fmt on all Rust files"
    - cargo fmt --all -- --check > "$FORMAT_DIFF" 2>&1 || true

type-check-python:
  extends: .python-workspace
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - !reference [.python-workspace, rules]
    - when: manual
      allow_failure: true
  variables:
    FORCE_COLOR: "3"
  script:
    - uv sync --locked --all-packages --all-extras --no-default-groups --group type-check
    - uv run --no-sync pyright --pythonpath .venv/bin/python .
    - UV_PROJECT_ENVIRONMENT=docs/.venv uv sync --locked --only-group docs --python 3.12
    - uv run --no-sync pyright --project docs/pyrightconfig.json --pythonpath docs/.venv/bin/python

validate-catalogue-schema-version:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    # Tags and the default branch require the catalogue schema submodule commit to be tagged.
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: "-t"
    # Other pipelines validate the schema versions without requiring a submodule tag.
    - when: on_success
      variables:
        CATALOGUE_SCHEMA_CHECK_PARAMS: ""
  script:
    - ./ci/checks/check_catalogue_schema_version.sh ${CATALOGUE_SCHEMA_CHECK_PARAMS}

validate-project-json:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
  rules:
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - uv run --locked --only-group scripts python ci/project-json/validate_project_json.py

validate-python-lock:
  stage: lint
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - !reference [.python-workspace, rules]
  image: $IMAGE_AUTOMATION
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  before_script:
    - !reference [.merge-train-guard, before_script]
  script:
    - uv lock --check --verbose
