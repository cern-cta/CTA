spec:
  inputs:
    scheduler-type:
      type: string
      options: ["pgsched", "objectstore"]
    enable-oracle-support:
      type: boolean
---
# Child variants can still forward their effective backend settings as pipeline variables.
variables:
  SCHEDULER_TYPE: "$[[ inputs.scheduler-type ]]"
  ENABLE_ORACLE_SUPPORT: "$[[ inputs.enable-oracle-support ]]"
