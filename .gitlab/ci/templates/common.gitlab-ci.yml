# Package downloads fail as script_failure, just like build and test errors.
# Opt in only where one full job retry is an acceptable tradeoff.
.retry-script-failure:
  retry:
    max: 1
    # Job retry settings replace the default, so retain the runner failure reasons.
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - script_failure

# Package-install commands use "|| exit 75" to request one GitLab job retry.
# Test commands keep their ordinary exit status and are not retried.
.retry-package-install:
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
    exit_codes: 75

.python-version:
  before_script:
    - !reference [.merge-train-guard, before_script]
    # Use the bootstrap interpreter only to read the configured workspace version.
    - UV_PYTHON=$(python3 -c 'import json; print(json.load(open("project.json"))["dev"]["pythonVersion"])')
    - export UV_PYTHON
    - uv --version

.python-workspace:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - changes:
        - "**/*.py"
        - "**/pyproject.toml"
        - "**/requirements.txt"
        - "**/{ruff,.ruff}.toml"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**/*.gitlab-ci.yml"
        - ".gitmodules"
        - ".pre-commit-config.yaml"
        - "LICENSES/GPL-3.0-or-later.txt"
        - "ci/docker/pipeline/**/*"
        - "ci/docs/**/*"
        - "ci/project-json/schema.json"
        - "lib/protobuf/external/xrootd-ssi-protobuf-interface"
        - "lib/python/**/*"
        - "project.json"
        - "tools/{cta-cli,cta-udev}/**/*"
        - "uv.lock"
      when: on_success
  image:
    name: $IMAGE_DEFAULT
    entrypoint: ["/usr/bin/env"]
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  before_script:
    - !reference [.python-version, before_script]
    - git submodule update --init lib/protobuf/external/xrootd-ssi-protobuf-interface
