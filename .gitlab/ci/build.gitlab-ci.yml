spec:
  inputs:
    platform:
      type: string
    enable-internal-repos:
      type: boolean
    build-generator:
      type: string
    cmake-build-type:
      type: string
    analysis:
      description: "C/C++ analysis mode: Valgrind or compiler sanitizers."
      type: string
      options: ["none", "valgrind", "address", "undefined", "address,undefined", "thread"]
      default: "none"
    compile-with-extra-telemetry:
      type: boolean
---

build-cta:
  stage: build
  needs:
    - job: prepare-cta-version
      artifacts: true
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
  rules:
    - if: '$CUSTOM_CTA_IMAGE_TAG != "" || $PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    # Build for any non-documentation change, including new source directories (GitLab 19.2+).
    # Match each path independently so mixed documentation/code changes still build.
    - changes:
        regexp: '(?m)\A(?!docs/|ci/docs/|.*\.(?i:md|markdown)\z)'
      when: on_success
    # Keep the build available manually for MRs without matching changes.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true  # Ensures the pipeline counts as "passed" instead of "blocked"
    # Ensure we cover any other cases that might trigger this
    - when: on_success
  image: $IMAGE_BUILD
  variables:
    # These inputs are available as variables as certain jobs below override them
    CMAKE_BUILD_TYPE: "$[[ inputs.cmake-build-type ]]"
    COMPILE_WITH_EXTRA_TELEMETRY: "$[[ inputs.compile-with-extra-telemetry ]]"
    XRD_SSI_PATH: "lib/protobuf/external/xrootd-ssi-protobuf-interface"
    DNF_CACHE_DIR: "$CI_PROJECT_DIR/.dnf_cache"
    # Keep downloaded Rust dependencies inside the cacheable project directory.
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    # Share compiler results across C, C++, and Rust builds.
    SCCACHE_DIR: "$CI_PROJECT_DIR/.sccache"
    SCCACHE_CACHE_SIZE: "2G"
    # Keep statistics available until after_script, even during long builds.
    SCCACHE_IDLE_TIMEOUT: "0"
  before_script:
    - !reference [.merge-train-guard, before_script]
    - 'echo "CTA version: ${CTA_VERSION:?Missing CTA_VERSION}"'
    - git -C "$XRD_SSI_PATH" fetch --tags
    - export XRD_SSI_VERSION=$(git --git-dir=$XRD_SSI_PATH/.git --work-tree=$XRD_SSI_PATH describe --tags --abbrev=0)
    - |
      if [[ -z "$XRD_SSI_VERSION" ]]; then
        echo "Error: failed to find tag for submodule $XRD_SSI_PATH"
        exit 1
      fi
    - |
      if [[ "$ENABLE_SCCACHE" == "true" ]]; then
        sccache --start-server
        sccache --zero-stats
      fi
    - echo "Sccache enabled ${ENABLE_SCCACHE}"
    - echo "Sccache policy ${BUILD_CACHE_POLICY}"
  script:
    - |
      # Valgrind runs against an ordinary, uninstrumented build.
      sanitizers="$[[ inputs.analysis ]]"
      if [[ "$sanitizers" == "valgrind" ]]; then sanitizers=none; fi
      BUILD_OPTIONS=" --sanitizers ${sanitizers}"

    - |
      if [[ "$ENABLE_SCCACHE" == "true" ]]; then
        BUILD_OPTIONS+=" --enable-sccache"
      fi
    - if $[[ inputs.enable-internal-repos ]]; then BUILD_OPTIONS+=" --enable-internal-repos"; fi
    - |
      if $[[ inputs.compile-with-extra-telemetry ]]; then
        BUILD_OPTIONS+=" --extra-telemetry"
      fi
    - |
      if [[ "$ENABLE_SBOM_GENERATION" == "true" ]]; then
        BUILD_OPTIONS+=" --sbom-path ${CI_PROJECT_DIR}/sboms"
      fi
    - ./ci/build/build_packages.sh all --build-dir build
                                      --build-generator "$[[ inputs.build-generator ]]"
                                      --create-build-dir
                                      --cta-version "${CTA_VERSION}"
                                      --xrootd-ssi-version ${XRD_SSI_VERSION}
                                      --scheduler-type ${SCHEDULER_TYPE}
                                      --oracle-support ${ENABLE_ORACLE_SUPPORT}
                                      --cmake-build-type "${CMAKE_BUILD_TYPE}"
                                      --jobs "$(nproc)"
                                      --skip-unit-tests
                                      ${BUILD_OPTIONS}
  after_script:
    - if [[ "$ENABLE_SCCACHE" == "true" ]]; then sccache --stop-server; fi
  artifacts:
    expire_in: 30 days
    paths:
      # Collect native packages without the Debian unpacked source tree.
      - build/$[[ inputs.platform ]]/RPM/RPMS
      - build/$[[ inputs.platform ]]/DEB/*.deb
      - build/$[[ inputs.platform ]]/DEB/*.ddeb
      - build/$[[ inputs.platform ]]/DEB/*.dsc
      - build/$[[ inputs.platform ]]/DEB/*.tar.*
      - build/$[[ inputs.platform ]]/DEB/*.changes
      - build/$[[ inputs.platform ]]/DEB/*.buildinfo
      - sboms
    reports:
      cyclonedx:
        - sboms/*.cdx.json

  cache:
    - &dnf-cache
      key: "dnf-cache-$[[ inputs.platform ]]-${CACHE_BRANCH}"
      fallback_keys:
        - "dnf-cache-$[[ inputs.platform ]]-${CI_DEFAULT_BRANCH}"
      policy: $BUILD_CACHE_POLICY
      paths:
        - .dnf_cache/
    - &sccache
      key: "sccache-$[[ inputs.platform ]]-${CMAKE_BUILD_TYPE}-${CACHE_BRANCH}"
      fallback_keys:
        - "sccache-$[[ inputs.platform ]]-${CMAKE_BUILD_TYPE}-${CI_DEFAULT_BRANCH}"
      policy: $BUILD_CACHE_POLICY
      paths:
        - .sccache/
    - &cargo-cache
      key: "cargo-$[[ inputs.platform ]]-${CACHE_BRANCH}"
      fallback_keys:
        - "cargo-$[[ inputs.platform ]]-${CI_DEFAULT_BRANCH}"
      policy: $BUILD_CACHE_POLICY
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/db/

# These build jobs are not (and ideally should not) be used further down the pipeline; just compilation checks
# All builds below disable sccache as they are not on the critical path and may pollute it.
# They continue to use the DNF cache.

# Specifically build CTA without sccache and with debug packages enabled
build-cta-no-sccache:
  extends:
    - build-cta
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - !reference [build-cta, rules]
  variables:
    ENABLE_SCCACHE: "false"
    ENABLE_DEBUG_INFO: "FALSE"
  cache:
    - *dnf-cache


build-cta-pgsched:
  extends:
    - build-cta
  rules:
    - if: '"$[[ inputs.platform ]]" == "debian13"'  # Debian is pgsched by default
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    # Prevent too many duplicate pipelines. Only in merge requests do we want to double check that what we do doesn't break
    # For the main branch, we'll rely on the nightly pipelines
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - !reference [build-cta, rules]
  variables:
    # We don't have a way of separating what the user entered and what the actual value is,
    # so this will always run, even if the pipeline type was already postgres
    SCHEDULER_TYPE: "pgsched"
    ENABLE_SCCACHE: "false"
  before_script:
    - !reference [.merge-train-guard, before_script]
    # This compilation check deliberately differs from the primary pipeline variant.
    - source ci/utils/cta_version.sh
    - CTA_VERSION=$(resolve_cta_version "${CTA_VERSION_BASE:?Missing CTA_VERSION_BASE}" "$[[ inputs.platform ]]" "$SCHEDULER_TYPE" "$ENABLE_ORACLE_SUPPORT")
    - export CTA_VERSION
    - !reference [build-cta, before_script]
  # Disable artifacts
  artifacts:
    paths: []
    reports:
      metrics: []
  cache:
    - *dnf-cache

reset-sccache:
  allow_failure: true
  stage: build
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  image: $IMAGE_BUILD
  variables:
    CMAKE_BUILD_TYPE: "$[[ inputs.cmake-build-type ]]"
    GIT_STRATEGY: none  # We don't need the repo clone here
    BUILD_CACHE_POLICY: push
    CACHE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - rm -rf .sccache
    - mkdir -p .sccache
    # upload an empty cache
    - touch .sccache/.keep
  cache:
    - *sccache


build-docs:
  stage: build
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE != "DEFAULT" || $CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
  image: $IMAGE_LINT
  variables:
    GIT_SUBMODULE_STRATEGY: "recursive"
  before_script:
    - !reference [.merge-train-guard, before_script]
    - source ci/docs/prepare-environment.sh
  script:
    - python -m unittest discover --start-directory ci/docs --pattern 'test_*.py'
    - mkdocs build --strict --config-file docs/mkdocs.yml
  artifacts:
    paths:
      - build/docs/site/
    expire_in: 7 days
