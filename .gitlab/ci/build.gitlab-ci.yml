spec:
  inputs:
    platform:
      type: string
    enable-internal-repos:
      type: boolean
    build-generator:
      type: string
    cmake-build-type:
      type: string
    enable-address-sanitizer:
      type: boolean
    compile-with-extra-telemetry:
      type: boolean
---

build-cta-rpms:
  stage: build
  needs:
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
  rules:
    - if: '$CUSTOM_CTA_IMAGE_TAG != "" || $PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    # These rules serve to prevent the rest of the pipeline from triggering when only trivial files such as the CHANGELOG have been modified
    # GitLab only allows a whitelist and not a blacklist, so we have to list all file changes that should trigger the build job
    - changes:
        - .dockerignore
        - .gitlab-ci.yml
        - CMakeLists.txt
        - cta.spec.in
        - project.json
        - version.hpp.in
        - xrootd-ssi-protobuf-interface
        # To be safe, all files in all sub-directories
        # Once we have a src/ directory, we can be a bit more specific without having to specify a long list here
        - '*/**/*'
      when: on_success
    # If only "trivial" changes were done and we are in a MR, set this job to manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true  # Ensures the pipeline counts as "passed" instead of "blocked"
    # Ensure we cover any other cases that might trigger this
    - when: on_success
  image: $IMAGE_BUILD
  variables:
    # These inputs are available as variables as certain jobs below override them
    CMAKE_BUILD_TYPE: "$[[ inputs.cmake-build-type ]]"
    COMPILE_WITH_EXTRA_TELEMETRY: "$[[ inputs.compile-with-extra-telemetry ]]"
    BUILD_PATH: "build_rpm/RPM/RPMS"
    XRD_SSI_PATH: "xrootd-ssi-protobuf-interface"
    DNF_CACHE_DIR: "$CI_PROJECT_DIR/.dnf_cache"
    # Will only be used if ccache is enabled
    CCACHE_BASEDIR: "/builds/cta"
    CCACHE_NOHASHDIR: "true"
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_COMPRESS: "true"
    CCACHE_MAXSIZE: "2G"
  before_script:
    - !reference [.merge-train-guard, before_script]
  # TODO: make CTA_VERSION and CTA_VERSION_SUFFIX one variable, then we can just either build_id or commit_tag everywhere easily (including the images)
    - |
      if [[ -z "${CI_COMMIT_TAG}" ]]; then
        export CTA_VERSION=$BUILD_CTA_VERSION
        export CTA_VERSION_SUFFIX=$CTA_BUILD_ID
      else
        export CTA_VERSION=$(echo ${CI_COMMIT_TAG} | awk -F '[v-]' '{print $2}')
        export CTA_VERSION_SUFFIX=$(echo ${CI_COMMIT_TAG} | awk -F '-' '{if(NF>1) print $2; else print 0}')
      fi
    - echo "Building package CTA_VERSION=${CTA_VERSION} - CTA_VERSION_SUFFIX=${CTA_VERSION_SUFFIX}"
    - git -C "$XRD_SSI_PATH" fetch --tags
    - export XRD_SSI_VERSION=$(git --git-dir=$XRD_SSI_PATH/.git --work-tree=$XRD_SSI_PATH describe --tags --abbrev=0)
    - |
      if [[ -z "$XRD_SSI_VERSION" ]]; then
        echo "Error: failed to find tag for submodule $XRD_SSI_PATH"
        exit 1
      fi
    - ccache --zero-stats
    - echo "CCache enabled ${ENABLE_CCACHE}"
    - echo "CCache policy ${BUILD_CACHE_POLICY}"
  script:
    # SRPMS
    - ./ci/build/build_srpm.sh --build-dir build_srpm
                               --build-generator "$[[ inputs.build-generator ]]"
                               --create-build-dir
                               --cta-version ${CTA_VERSION}
                               --cta-version-suffix ${CTA_VERSION_SUFFIX}
                               --scheduler-type ${SCHEDULER_TYPE}
                               --oracle-support ${ENABLE_ORACLE_SUPPORT}
                               --cmake-build-type "${CMAKE_BUILD_TYPE}"
                               --jobs $(nproc --ignore=1)
    # RPMS
    - BUILD_OPTIONS=""
    - |
      if [[ "$ENABLE_CCACHE" == "true" ]]; then
        BUILD_OPTIONS+=" --enable-ccache"
        # Necessary to ensure builds in different jobs don't cause all kinds of cache misses
        CXXFLAGS="-fdebug-prefix-map=/builds/cta=. -ffile-prefix-map=/builds/cta=."
        # debugsource packages are not happy with the cxxflags above, so skip for now
        RPMDEFS="--define '_debugsource_packages 0'"
      fi
    - if $[[ inputs.enable-internal-repos ]]; then BUILD_OPTIONS+=" --enable-internal-repos"; fi
    - if $[[ inputs.enable-address-sanitizer ]]; then BUILD_OPTIONS+=" --enable-address-sanitizer"; fi
    - |
      if $[[ inputs.compile-with-extra-telemetry ]]; then
        BUILD_OPTIONS+=" --extra-telemetry"
      fi
    - ./ci/build/build_rpm.sh --build-dir build_rpm
                              --build-generator "$[[ inputs.build-generator ]]"
                              --create-build-dir
                              --srpm-dir build_srpm/RPM/SRPMS
                              --cta-version ${CTA_VERSION}
                              --cta-version-suffix ${CTA_VERSION_SUFFIX}
                              --xrootd-ssi-version ${XRD_SSI_VERSION}
                              --scheduler-type ${SCHEDULER_TYPE}
                              --oracle-support ${ENABLE_ORACLE_SUPPORT}
                              --cmake-build-type "${CMAKE_BUILD_TYPE}"
                              --jobs $(nproc --ignore=1)
                              --install-srpms
                              --platform $[[ inputs.platform ]]
                              --skip-unit-tests
                              ${BUILD_OPTIONS}
  after_script:
    - if [[ "$ENABLE_CCACHE" == "true" ]]; then ccache --show-stats --verbose; fi
  artifacts:
    expire_in: 30 days
    paths:
      - ${BUILD_PATH}

  cache:
    - key: "build-cache-$[[ inputs.platform ]]-${CACHE_BRANCH}"
      fallback_keys:
        - "build-cache-$[[ inputs.platform ]]-${CI_DEFAULT_BRANCH}"
      policy: $BUILD_CACHE_POLICY
      paths:
        - .ccache/
        - .dnf_cache/

# These build jobs are not (and ideally should not) be used further down the pipeline; just compilation checks
# All builds below don't use the cache as they are not on the critical part anyway (and they may pollute the cache)

# Specifically to build CTA without ccache and with debug packages enabled
build-cta-rpms-no-cache:
  extends:
    - build-cta-rpms
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - !reference [build-cta-rpms, rules]
  variables:
    ENABLE_CCACHE: "false"
    ENABLE_DEBUG_INFO: "FALSE"
  cache: [] # Explicitly disable the cache


build-cta-rpms-pgsched:
  extends:
    - build-cta-rpms
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Prevent too many duplicate pipelines. Only in merge requests do we want to double check that what we do doesn't break
    # For the main branch, we'll rely on the nightly pipelines
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - !reference [build-cta-rpms, rules]
  variables:
    # We don't have a way of separating what the user entered and what the actual value is,
    # so this will always run, even if the pipeline type was already postgres
    SCHEDULER_TYPE: "pgsched"
    ENABLE_CCACHE: "false"
  # Disable artifacts
  artifacts:
    paths: []
    reports:
      metrics: []
  cache: [] # Explicitly disable the cache

build-cta-rpms-debug:
  extends:
    - build-cta-rpms
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Debug builds are not really expected to break when the RelWithDebInfo build passes, so only run this in main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    # Only run in default pipelines
    - if: $PIPELINE_TYPE != "DEFAULT"
      when: never
    - !reference [build-cta-rpms, rules]
  variables:
    CMAKE_BUILD_TYPE: "Debug"
    ENABLE_CCACHE: "false"
  # Disable artifacts
  artifacts:
    paths: []
    reports:
      metrics: []
  cache: [] # Explicitly disable the cache

reset-ccache:
  allow_failure: true
  stage: build
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  image: $IMAGE_BUILD
  variables:
    GIT_STRATEGY: none  # We don't need the repo clone here
    BUILD_CACHE_POLICY: push
    CACHE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - rm -rf .ccache
    - mkdir -p .ccache
    # upload an empty cache
    - touch .ccache/.keep
  cache:
    - !reference [build-cta-rpms, cache]

# Documentation export
export-docs:
  stage: build
  needs:
    - job: check-merge-train-duplicate
      optional: true
  rules:
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "Exporting man pages (Markdown)"
    - mkdir docs
    - /usr/bin/find . -path ./docs -prune -o -name '*cta.md' -exec cp {} docs/ \;
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - docs/
