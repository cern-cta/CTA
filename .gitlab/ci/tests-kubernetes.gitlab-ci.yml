spec:
  inputs:
    analysis:
      description: "C/C++ analysis mode: Valgrind or compiler sanitizers."
      type: string
      options: ["none", "valgrind", "address", "undefined", "address,undefined", "thread"]
      default: "none"
    custom-cta-image-tag:
      type: string
    admin-api-authentication:
      type: string
    workflow-api-authentication:
      type: string
    enable-dcache-tests:
      type: boolean
    keep-stress-test-namespace:
      type: boolean
    enable-opportunistic-batching:
      type: boolean
      default: false
    use-stress-drives:
      type: boolean
    num-stress-drives:
      type: number
      default: 2
    use-pgbouncer:
      type: boolean
      default: false
---
# All of the below tests use only the docker image generated in the build:image stage.
# They should not rely on any other generated artifacts.
# These are also the only tests executed on our personal runners instead of the GitLab runners.

.cta-system-test-image-targets: &cta-system-test-image-targets
  - cta-taped
  - cta-rmcd
  - cta-maintd
  - cta-admin-api
  - cta-workflow-api
  - cta-tools

.setup-k8s-test-variables: &setup-k8s-test-variables
  - | # Construct the deployment profiles used by Kubernetes tests
    CTA_VALUES_CHAIN="presets/dev-cta-common.yaml,presets/frontend-wfe/auth-$[[ inputs.workflow-api-authentication ]].yaml,presets/frontend-admin/auth-$[[ inputs.admin-api-authentication ]].yaml"
  - | # Which scheduler config to use
    if [[ "$SCHEDULER_TYPE" == "objectstore" ]]; then
      SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/ci-ceph-values.yaml
    else
      SCHEDULER_CONFIG=presets/dev-scheduler-postgres-values.yaml
    fi
  - | # Which catalogue config to use
    # Use ${VAR:-default} so a value set via GitLab UI "Rerun job with modified values" is preserved.
    if $ENABLE_ORACLE_SUPPORT; then
      CATALOGUE_CONFIG="${CATALOGUE_CONFIG:-/opt/kubernetes/CTA/catalogue/ci-oracle-values.yaml}"
    else
      CATALOGUE_CONFIG="${CATALOGUE_CONFIG:-presets/dev-catalogue-postgres-values.yaml}"
    fi
  - | # Opportunistic batching overlay (pgsched only)
    if [[ "$SCHEDULER_TYPE" == "pgsched" ]] && $[[ inputs.enable-opportunistic-batching ]]; then
      CTA_VALUES_CHAIN="${CTA_VALUES_CHAIN},presets/pgsched-opportunistic-batching-values.yaml"
    fi
  - | # Which image tag to use
    if [[ -n "$[[ inputs.custom-cta-image-tag ]]" ]]; then
      IMAGE_TAG="$[[ inputs.custom-cta-image-tag ]]"
    else
      IMAGE_TAG="${CTA_IMAGE_TAG:?Missing CTA_IMAGE_TAG}"
    fi
  - | # Virtual stress-drive mode: deploy fake tape library PVCs instead of mhvtl/SCSI hardware.
    # USE_STRESS_DRIVES CI variable overrides the pipeline input when replaying via GitLab "Play with variables".
    # create_instance.sh automatically disables rmcd when --no-hardware-drives is set.
    # setup_stress_drives_test.py is auto-collected by conftest.py (tests/setup/ scan) and auto-skips
    # when no stress-mode taped pods are found, so this is a no-op when use-stress-drives=false.
    if ${USE_STRESS_DRIVES:-$[[ inputs.use-stress-drives ]]}; then
      EXTRA_SPAWN_ARGS="${EXTRA_SPAWN_ARGS} --no-hardware-drives --max-drives $[[ inputs.num-stress-drives ]] --num-stress-libraries ${NUM_STRESS_LIBRARIES:-1}"
    fi
  # Export all variables here so that it is clear which ones are available
  - export SCHEDULER_CONFIG CATALOGUE_CONFIG IMAGE_TAG CTA_VALUES_CHAIN EXTRA_SPAWN_ARGS

.sanitizer-manual-rules:
  rules:
    # Valgrind doesn't change anything in the system tests, keep it automatic
    - if: '"$[[ inputs.analysis ]]" != "none" && "$[[ inputs.analysis ]]" != "valgrind"'
      when: manual
      allow_failure: true

.kubernetes-test:
  needs:
    - job: prepare-cta-version
      artifacts: true
      optional: true # Existing-image pipelines do not prepare a build version.
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
    # Image jobs are optional because we may want run with existing docker images
    - job: build-cta-images
      optional: true
      parallel:
        matrix:
          - TARGET_NAME: *cta-system-test-image-targets
  rules:
    - !reference [.sanitizer-manual-rules, rules]
    - when: on_success
  variables:
    TEST_REPORT_FILE: "${CI_PROJECT_DIR}/report.xml"
    METRICS_FILE: "${CI_PROJECT_DIR}/metrics.txt"
    # Which tests to run
    PYTESTS: ""
    # Passed to helm install of the CTA chart
    EXTRA_CTA_HELM_FLAGS: ""
    # Passed to the create_instance.sh script verbatim
    EXTRA_SPAWN_ARGS: ""
    # Passed to the pytest tests verbatim
    EXTRA_PYTEST_ARGS: ""
  before_script:
    - !reference [.merge-train-guard, before_script]
    - bash ./ci/checks/check_runner_healthy.sh
    - *setup-k8s-test-variables
    # This is not ideal, but since we are in a shell executor and not in a Docker image, we use a venv to do this without polluting the machine
    # Note that we use UV instead of pip as it is much faster
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r ci/system_tests/requirements.txt
  script:
    # Keep the namespace name under 64 characters;
    # Otherwise the eos mgm fqdn becomes too long and things start failing
    - NAMESPACE="${CI_JOB_NAME_SLUG:0:18}-${CI_JOB_ID}"
    - TEST_LOG_DIR="${CI_PROJECT_DIR}/test_logs/${NAMESPACE}"
    - mkdir -p "${TEST_LOG_DIR}"
    - cd ci/orchestration/
    - ./delete_old_namespaces.sh
    - create_start=$(date +%s)
    - |
      ./create_instance.sh \
        --namespace ${NAMESPACE} \
        --reset-catalogue \
        --reset-scheduler \
        --cta-image-tag ${IMAGE_TAG} \
        --cta-config ${CTA_VALUES_CHAIN} \
        --eos-config presets/eos/auth-$[[ inputs.workflow-api-authentication ]].yaml \
        --catalogue-config ${CATALOGUE_CONFIG} \
        --scheduler-config ${SCHEDULER_CONFIG} \
        --extra-cta-values "${EXTRA_CTA_HELM_FLAGS}" \
        ${EXTRA_SPAWN_ARGS}
    - create_end=$(date +%s)
    - echo "k8s_${CI_JOB_NAME_SLUG//-/_}_create_instance_duration_sec $((create_end - create_start))" >> $METRICS_FILE
    - cd ../system_tests
    # Note that we skip --teardown as the whole namespace will be deleted anyway
    # GitLab can reorder separate stdout and stderr streams: https://gitlab.com/gitlab-org/gitlab/-/issues/440824
    - |
      pytest ${PYTESTS} \
        --namespace ${NAMESPACE} \
        --setup \
        --verification \
        --color=yes \
        --showlocals \
        --junitxml=${TEST_REPORT_FILE} \
        ${EXTRA_PYTEST_ARGS} \
        2>&1 \
        | tee "${TEST_LOG_DIR}/pytest.log"
  after_script:
    # Repeat the namespace declaration here as the after_script does not have access to previously exported variables
    - NAMESPACE="${CI_JOB_NAME_SLUG:0:18}-${CI_JOB_ID}"
    - TEST_LOG_DIR="${CI_PROJECT_DIR}/test_logs/${NAMESPACE}"
    # This also gets called if the job is cancelled to ensure we properly clean up after ourselves
    - cd ci/orchestration/
    - delete_start=$(date +%s)
    # Successful MR jobs do not need diagnostic logs; failures and cancelled jobs still collect them.
    # Skipped for increased pipeline speed
    - |
      delete_args=(--namespace "${NAMESPACE}")
      if [[ -z "${CI_MERGE_REQUEST_ID}" || "${CI_JOB_STATUS}" != "success" ]]; then
        delete_args+=(--collect-logs "${TEST_LOG_DIR}/pods")
      fi
      ./delete_instance.sh "${delete_args[@]}"
    - delete_end=$(date +%s)
    - echo "k8s_${CI_JOB_NAME_SLUG//-/_}_delete_instance_duration_sec $((delete_end - delete_start))" >> $METRICS_FILE
  tags: # Used to indicate that these jobs should run on our own runners
    - kubernetes
    - mhvtl
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test_logs
    reports:
      metrics: $METRICS_FILE
      junit: $TEST_REPORT_FILE

# =========================================================================
#  Tests
# =========================================================================

test-client:
  extends:
    - .kubernetes-test
  stage: system-test
  variables:
    PYTESTS: "tests/tape_rest_api_test.py tests/client_test.py"

test-client-gfal2:
  extends:
    - .kubernetes-test
  stage: system-test
  variables:
    PYTESTS: "tests/client_gfal_test.py"
    # While the telemetry is not actually consumed, we need to ensure enabling it doesn't break anything
    EXTRA_SPAWN_ARGS: "--local-telemetry"

test-repack:
  extends:
    - .kubernetes-test
  stage: system-test
  variables:
    PYTESTS: "tests/repack_test.py"

test-cta-tools:
  extends:
    - .kubernetes-test
  stage: system-test
  rules:
    # Currently we only test cta-admin here, so this is not really doing anything with the disk side
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_BRANCH" || $PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
      when: never
    - !reference [.kubernetes-test, rules]
  variables:
    PYTESTS: "tests/cta_admin_test.py tests/tape_tools_test.py tests/eos_restore_files_test.py"
    # We want to test cta-admin's behaviour on repack requests; not the actual repack itself
    # See the note here on failing cta-admin tests: https://gitlab.cern.ch/cta/CTA/-/issues/1032#note_10458246
    EXTRA_CTA_HELM_FLAGS: "--set=maintd.routines.repackExpand.replicas=0 --set=maintd.routines.repackReport.replicas=0"

# =========================================================================
#  Manual tests
# =========================================================================

.manual-rules:
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_BRANCH" || $PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
      when: never
    - !reference [.sanitizer-manual-rules, rules]
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - when: manual
      allow_failure: true

test-catalogue-schema-update:
  extends:
    - .kubernetes-test
  stage: system-test
  rules:
    - !reference [.manual-rules, rules]
  variables:
    PYTESTS: "tests/catalogue_schema_update_test.py"
  before_script:
    - !reference [.kubernetes-test, before_script]
    - |
      if [[ "$(jq '.supportedCatalogueVersions | length' project.json)" -lt 2 ]]; then
        echo "We are not currently in a catalogue release. No update to test."
        echo "Update the project.json file to include both the new and the old CTA Catalogue version."
        exit 0
      fi
    # Not sure this is necessary. The from version should be the lowest version and the to version will be the current (highest) version
    # So even if we have 5 supported versions, the test should test that we can upgrade from the lowest to the highest supported version
    - |
      if [[ "$(jq '.supportedCatalogueVersions | length' project.json)" -gt 2 ]]; then
        echo "There are more than two supported CTA Catalogue versions."
        echo "The current CI test can only be performed between two versions."
        exit 1
      fi
    # The version we are upgrading from is the lowest supported version
    - FROM_CATALOGUE_VERSION=$(jq '.supportedCatalogueVersions | sort[]' project.json | head -1)
    # supportedCatalogueVersions are major versions. To spawn we need an exact version
    # As minor versions are by definition backward compatible, we must always be able to upgrade from a .0 version
    - export EXTRA_SPAWN_ARGS="--catalogue-version ${FROM_CATALOGUE_VERSION}.0"

test-lifecycle:
  extends:
    - .kubernetes-test
  stage: system-test
  rules:
    - !reference [.manual-rules, rules]
  variables:
    PYTESTS: "tests/lifecycle_test.py"

test-external-tape-formats:
  extends:
    - .kubernetes-test
  stage: system-test
  rules:
    - !reference [.manual-rules, rules]
  variables:
    PYTESTS: "tests/external_tape_formats_test.py"

test-dcache:
  extends:
    - .kubernetes-test
  stage: system-test
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_BRANCH" || $PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
      when: never
    - !reference [.sanitizer-manual-rules, rules]
    - if: '"$[[ inputs.enable-dcache-tests ]]" == "true"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    PYTESTS: "tests/dcache_test.py"
    EXTRA_SPAWN_ARGS: "--dcache-enabled true --eos-enabled false"

# =========================================================================
#  Stress Test
# =========================================================================

stress-test:
  allow_failure: true
  interruptible: false
  timeout: 12 hours
  stage: system-test
  needs:
    - job: prepare-cta-version
      artifacts: true
      optional: true # Existing-image pipelines do not prepare a build version.
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
    # Image jobs are optional because we may want run with existing docker images
    - job: build-cta-images
      optional: true
      parallel:
        matrix:
          - TARGET_NAME: *cta-system-test-image-targets
  rules:
    - !reference [.sanitizer-manual-rules, rules]
    - if: '$CI_COMMIT_TAG && $ENABLE_ORACLE_SUPPORT == "false"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG && $PIPELINE_TYPE == "DEFAULT"'
      when: on_success
    - when: manual
      allow_failure: true # Otherwise this blocks the pipeline
  variables:
    NAMESPACE: stress-${CI_JOB_ID}
    # Passed to the create_instance.sh script verbatim
    EXTRA_SPAWN_ARGS: ""
    # Passed to the pytest tests verbatim
    EXTRA_PYTEST_ARGS: ""
  before_script:
    - !reference [.merge-train-guard, before_script]
    - bash ./ci/checks/check_runner_healthy.sh
    # This is not ideal, but since we are in a shell executor and not in a Docker image, we use a venv to do this without polluting the machine
    # Note that we use UV instead of pip as it is much faster
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r ci/system_tests/requirements.txt
    - *setup-k8s-test-variables
  script:
    - |
      if [[ "$SCHEDULER_TYPE" == "pgsched" ]]; then
        SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-values.yaml
        # Default pgsched stress to the external DBOD postgres (higher max_connections).
        # Only override the generic dev-postgres default; preserve any value set via the GitLab UI.
        [[ "$CATALOGUE_CONFIG" == "presets/dev-catalogue-postgres-values.yaml" ]] && \
          CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-repack-values.yaml
        EXTRA_PYTEST_ARGS+=" --test-config config/test_pgsched_params.toml"
        EXTRA_SPAWN_ARGS+=" --one-logical-library"
        STRESS_CTA_VALUES_CHAIN="${CTA_VALUES_CHAIN},presets/stress-cta-pgsched-values.yaml"
        if ${USE_PGBOUNCER:-$[[ inputs.use-pgbouncer ]]}; then
          CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-pgbouncer-values.yaml
          SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-pgbouncer-values.yaml
        fi
      else
        STRESS_CTA_VALUES_CHAIN="${CTA_VALUES_CHAIN},presets/stress-cta-values.yaml"
      fi
      # File count and prequeue settings come from the test config TOML.
      # For pgsched, test_pgsched_params.toml has total_files=10M (scale test default);
      # hardcode 2M for the non-scale stress test.  objectstore uses test_params.toml (2M).
      # CI variables allow per-run overrides via "Play with variables".
      EXTRA_PYTEST_ARGS+=" --stress-total-files ${STRESS_TOTAL_FILES:-2000000}"
      [[ -n "${STRESS_PREQUEUE_ENABLED}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-enabled ${STRESS_PREQUEUE_ENABLED}"
      [[ -n "${STRESS_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-fraction ${STRESS_PREQUEUE_FRACTION}"
      [[ -n "${STRESS_RETRIEVE_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-retrieve-prequeue-fraction ${STRESS_RETRIEVE_PREQUEUE_FRACTION}"
    - |
      # Virtual stress-drive mode: no mhvtl or SCSI hardware needed.
      # --no-hardware-drives deploys the fake-tape-library PVC chart and generates
      # N virtual drives backed by VID.tape files on the PVC.
      # No node labelling, hostPath volumes, or tmpfs pre-mounting is required.
      # USE_STRESS_DRIVES, NUM_STRESS_DRIVES, NUM_STRESS_LIBRARIES CI variables
      # override the pipeline inputs when replaying via the GitLab "Play with variables" dialog.
      if ${USE_STRESS_DRIVES:-$[[ inputs.use-stress-drives ]]}; then
        # stress-scale-values.yaml works for all scheduler backends.
        STRESS_CTA_VALUES_CHAIN="${STRESS_CTA_VALUES_CHAIN},presets/stress-scale-values.yaml"
        EXTRA_SPAWN_ARGS+=" --no-hardware-drives --max-drives ${NUM_STRESS_DRIVES:-$[[ inputs.num-stress-drives ]]} --num-stress-libraries ${NUM_STRESS_LIBRARIES:-1}"
      fi
    # Set up stress test
    - cd ci/orchestration/
    # We don't clean up old namespace so this will fail (deliberately) when another namespace still exist
    # This is because we check for the libraries in use before we start
    - |
      ./create_instance.sh \
        --namespace ${NAMESPACE} \
        --reset-catalogue \
        --reset-scheduler \
        --publish-telemetry \
        --cta-image-tag ${IMAGE_TAG} \
        --cta-config ${STRESS_CTA_VALUES_CHAIN} \
        --eos-config presets/stress-eos-values.yaml \
        --catalogue-config ${CATALOGUE_CONFIG} \
        --scheduler-config ${SCHEDULER_CONFIG} \
        --chart-install-timeout 15 \
        --eos-deploy-timeout 10 \
        ${EXTRA_SPAWN_ARGS}
    # Run the actual stress test
    - cd ../system_tests
    - mkdir -p "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}"
    # GitLab can reorder separate stdout and stderr streams: https://gitlab.com/gitlab-org/gitlab/-/issues/440824
    - |
      pytest tests/stress_test.py \
        --namespace ${NAMESPACE} \
        --setup \
        --color=yes \
        ${EXTRA_PYTEST_ARGS} \
        2>&1 \
        | tee "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pytest.log"
  after_script:
    - |
      if $[[ inputs.keep-stress-test-namespace ]]; then
        echo "Skipping deletion of stress test namespace ${NAMESPACE}"
        exit 0
      fi
    # This also gets called if the job is cancelled to ensure we properly clean up after ourselves
    - cd ci/orchestration/
    - |
      ./delete_instance.sh \
        --namespace ${NAMESPACE} \
        --collect-logs "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pods" \
        --force-delete-cluster-resources
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        case "$CI_JOB_STATUS" in
          success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) completed successfully." ;;
          failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed." ;;
          *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
        esac
        python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"
      fi
  tags:
    - stress
  # As we only have 1 stress test machine, this resource group ensures only a single instance of this job can run at any given time
  resource_group: stress-test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test_logs

stress-scale-test:
  allow_failure: true
  interruptible: false
  timeout: 24 hours
  stage: system-test
  needs:
    - job: prepare-cta-version
      artifacts: true
      optional: true
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
    - job: build-cta-images
      optional: true
      parallel:
        matrix:
          - TARGET_NAME: *cta-system-test-image-targets
  rules:
    - when: manual
      allow_failure: true
  variables:
    NAMESPACE: stress-scale-${CI_JOB_ID}
    EXTRA_SPAWN_ARGS: ""
    EXTRA_PYTEST_ARGS: ""
  before_script:
    - !reference [.merge-train-guard, before_script]
    - bash ./ci/checks/check_runner_healthy.sh
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r ci/system_tests/requirements.txt
    - *setup-k8s-test-variables
  script:
    - |
      if [[ "$SCHEDULER_TYPE" != "pgsched" ]]; then
        echo "stress-scale-test requires SCHEDULER_TYPE=pgsched" >&2
        exit 1
      fi
      SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-values.yaml
      [[ "$CATALOGUE_CONFIG" == "presets/dev-catalogue-postgres-values.yaml" ]] && \
        CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-repack-values.yaml
      EXTRA_PYTEST_ARGS+=" --test-config config/test_pgsched_params.toml"
      STRESS_CTA_VALUES_CHAIN="${CTA_VALUES_CHAIN},presets/stress-cta-pgsched-values.yaml,presets/stress-scale-values.yaml"
      if ${USE_PGBOUNCER:-$[[ inputs.use-pgbouncer ]]}; then
        CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-pgbouncer-values.yaml
        SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-pgbouncer-values.yaml
      fi
      # Scale test always uses VtlDrives: 100 drives, 4 libraries.
      # Override per-run via NUM_STRESS_DRIVES / NUM_STRESS_LIBRARIES CI variables.
      EXTRA_SPAWN_ARGS+=" --no-hardware-drives --max-drives ${NUM_STRESS_DRIVES:-100} --num-stress-libraries ${NUM_STRESS_LIBRARIES:-4}"
      # 50 files/s per drive instead of the chart default of 1000: caps the aggregate ramp-up
      # (100 drives x 50 Hz = 5 kHz) once all drives are transferring, easing the startup burst on
      # the frontend/EOS MGM. Does not affect whether a drive ever fills a tape (see
      # STRESS_TOTAL_FILES/FILES_PER_TAPE below for that) - only how long a mount that does takes.
      # Override via STRESS_WRITE_RATE_HZ / STRESS_READ_RATE_HZ.
      EXTRA_SPAWN_ARGS+=" --stress-write-rate-hz ${STRESS_WRITE_RATE_HZ:-50}"
      EXTRA_SPAWN_ARGS+=" --stress-read-rate-hz ${STRESS_READ_RATE_HZ:-50}"
      # Widen the mount-delay jitter to [5s, 90s] (chart default [15s, 30s]) so 100 drives' dead
      # zones decorrelate instead of overlapping - what actually risks the harness's no-progress
      # detector (80s). Relies on having many drives; do not reuse for a low-drive-count job.
      # Override via STRESS_MOUNT_DELAY_MS / STRESS_MOUNT_DELAY_MAX_MS.
      EXTRA_SPAWN_ARGS+=" --stress-mount-delay-ms ${STRESS_MOUNT_DELAY_MS:-5000}"
      EXTRA_SPAWN_ARGS+=" --stress-mount-delay-max-ms ${STRESS_MOUNT_DELAY_MAX_MS:-90000}"
      # This job does not deliberately engineer failures (see stress-scale-fail-test for that):
      # failure injection defaults to 0 (off), and tape-boundary overflow isn't exposed here at
      # all (no STRESS_OVERFLOW_FRACTION) - this job avoids overflow by sizing capacity instead,
      # below. Override via STRESS_TRANSFER_FAILURE_RATE / STRESS_RETRIEVE_FAILURE_RATE.
      EXTRA_SPAWN_ARGS+=" --stress-transfer-failure-rate ${STRESS_TRANSFER_FAILURE_RATE:-0}"
      EXTRA_SPAWN_ARGS+=" --stress-retrieve-failure-rate ${STRESS_RETRIEVE_FAILURE_RATE:-0}"
      # Total files and tape capacity: sized together so a drive's tape essentially never reaches
      # its end. filesPerTape = 1.1 x each drive's expected fair share of total_files - comfortable
      # margin without an unrealistically large tape. Independent of fetchMaxFiles/rate: those
      # only matter for a crossing that this margin is meant to prevent happening at all (see
      # stress-scale-values.yaml's transfers.archive.fetchMaxFiles comment).
      STRESS_SCALE_TOTAL_FILES_DEFAULT=10000000
      FILES_PER_TAPE_FAIR_SHARE=$(( ${STRESS_TOTAL_FILES:-$STRESS_SCALE_TOTAL_FILES_DEFAULT} / ${NUM_STRESS_DRIVES:-100} ))
      FILES_PER_TAPE_DEFAULT=$(( FILES_PER_TAPE_FAIR_SHARE * 11 / 10 ))
      EXTRA_SPAWN_ARGS+=" --stress-files-per-tape ${STRESS_FILES_PER_TAPE:-${FILES_PER_TAPE_DEFAULT}}"
      # Defaults to 10M here (not test_pgsched_params.toml's 4M) to match the tape sizing above.
      # CI variables allow per-run overrides via "Play with variables".
      EXTRA_PYTEST_ARGS+=" --stress-total-files ${STRESS_TOTAL_FILES:-$STRESS_SCALE_TOTAL_FILES_DEFAULT}"
      [[ -n "${STRESS_PREQUEUE_ENABLED}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-enabled ${STRESS_PREQUEUE_ENABLED}"
      [[ -n "${STRESS_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-fraction ${STRESS_PREQUEUE_FRACTION}"
      [[ -n "${STRESS_RETRIEVE_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-retrieve-prequeue-fraction ${STRESS_RETRIEVE_PREQUEUE_FRACTION}"
    - cd ci/orchestration/
    - ./create_instance.sh --namespace ${NAMESPACE}
                           --reset-catalogue
                           --reset-scheduler
                           --publish-telemetry
                           --cta-image-tag ${IMAGE_TAG}
                           --cta-config ${STRESS_CTA_VALUES_CHAIN}
                           --eos-config presets/stress-eos-values.yaml
                           --catalogue-config ${CATALOGUE_CONFIG}
                           --scheduler-config ${SCHEDULER_CONFIG}
                           --chart-install-timeout 15
                           --eos-deploy-timeout 10
                           ${EXTRA_SPAWN_ARGS}
    - cd ../system_tests
    - mkdir -p "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}"
    - pytest tests/stress_test.py --namespace ${NAMESPACE}
                                  --setup
                                  --color=yes
                                  ${EXTRA_PYTEST_ARGS}
                                  2>&1
                                  | tee "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pytest.log"
  after_script:
    - |
      if $[[ inputs.keep-stress-test-namespace ]]; then
        echo "Skipping deletion of stress test namespace ${NAMESPACE}"
        exit 0
      fi
    - cd ci/orchestration/
    - ./delete_instance.sh --namespace ${NAMESPACE}
                           --collect-logs "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pods"
                           --force-delete-cluster-resources
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        case "$CI_JOB_STATUS" in
          success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) completed successfully." ;;
          failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed." ;;
          *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
        esac
        python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"
      fi
  tags:
    - stress
  resource_group: stress-test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test_logs

# Same scale as stress-scale-test, built to deliberately engineer failures instead of avoiding
# them - end-of-tape re-queuing (overflowFraction raised well above the base preset's rare-
# boundary target), VtlDrive's one-time transfer/retrieve fault injection, and mid-run pod kills
# of up to 10 taped mounts and 2 diskReportArchive/diskReportRetrieve batches at once - though the
# overflow/transfer/retrieve injections are OFF by default (see the job's own STRESS_* defaults
# below); set them via "Play with variables" to actually exercise those paths, the mid-run pod
# kills run either way. The point is proving maintd's cleanup routines actually recover that work
# - every file must still end up archived and retrieved (within the same loss tolerance as
# stress-scale-test) despite all of it. See presets/stress-scale-fail-values.yaml and
# tests/stress_scale_fail_test.py for the detailed design.
stress-scale-fail-test:
  allow_failure: true
  interruptible: false
  timeout: 24 hours
  stage: system-test
  needs:
    - job: prepare-cta-version
      artifacts: true
      optional: true
    - job: check-merge-train-duplicate
      optional: true
    - job: modify-project-json
      optional: true
    - job: build-cta-images
      optional: true
      parallel:
        matrix:
          - TARGET_NAME: *cta-system-test-image-targets
  rules:
    - when: manual
      allow_failure: true
  variables:
    NAMESPACE: stress-scale-fail-${CI_JOB_ID}
    EXTRA_SPAWN_ARGS: ""
    EXTRA_PYTEST_ARGS: ""
  before_script:
    - !reference [.merge-train-guard, before_script]
    - bash ./ci/checks/check_runner_healthy.sh
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r ci/system_tests/requirements.txt
    - *setup-k8s-test-variables
  script:
    - |
      if [[ "$SCHEDULER_TYPE" != "pgsched" ]]; then
        echo "stress-scale-fail-test requires SCHEDULER_TYPE=pgsched" >&2
        exit 1
      fi
      SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-values.yaml
      [[ "$CATALOGUE_CONFIG" == "presets/dev-catalogue-postgres-values.yaml" ]] && \
        CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-repack-values.yaml
      EXTRA_PYTEST_ARGS+=" --test-config config/test_pgsched_params.toml"
      # stress-scale-fail-values.yaml ONLY overrides maintd's dead-mount-reclaim age (see that
      # file's own comment for why); every other scale-test tuning (rates, fetch/flush sizes,
      # reporting throughput, DNS, etc.) is inherited unchanged from stress-scale-values.yaml.
      STRESS_CTA_VALUES_CHAIN="${CTA_VALUES_CHAIN},presets/stress-cta-pgsched-values.yaml,presets/stress-scale-values.yaml,presets/stress-scale-fail-values.yaml"
      if ${USE_PGBOUNCER:-$[[ inputs.use-pgbouncer ]]}; then
        CATALOGUE_CONFIG=/opt/kubernetes/CTA/catalogue/ci-postgres-pgbouncer-values.yaml
        SCHEDULER_CONFIG=/opt/kubernetes/CTA/scheduler/stresstest-scheduler-postgres-pgbouncer-values.yaml
      fi
      # Same drive/library topology as stress-scale-test: 100 drives, 4 libraries.
      # Override per-run via NUM_STRESS_DRIVES / NUM_STRESS_LIBRARIES CI variables.
      EXTRA_SPAWN_ARGS+=" --no-hardware-drives --max-drives ${NUM_STRESS_DRIVES:-100} --num-stress-libraries ${NUM_STRESS_LIBRARIES:-4}"
      # Same per-drive rate ceiling as stress-scale-test (see that job's comment for the full
      # rationale) - this test is about failure RECOVERY at the same throughput, not about
      # throughput itself. Override per-run via STRESS_WRITE_RATE_HZ / STRESS_READ_RATE_HZ.
      EXTRA_SPAWN_ARGS+=" --stress-write-rate-hz ${STRESS_WRITE_RATE_HZ:-50}"
      EXTRA_SPAWN_ARGS+=" --stress-read-rate-hz ${STRESS_READ_RATE_HZ:-50}"
      EXTRA_SPAWN_ARGS+=" --stress-mount-delay-ms ${STRESS_MOUNT_DELAY_MS:-5000}"
      EXTRA_SPAWN_ARGS+=" --stress-mount-delay-max-ms ${STRESS_MOUNT_DELAY_MAX_MS:-90000}"
      # The three deliberate failure injections this job exists to test - OFF by default.
      # Deliberately not pre-armed: a run with no "Play with variables" overrides exercises only
      # the mid-run pod kills (test_disrupt_archive_mount/test_disrupt_report_batch), not these
      # three - set them explicitly to exercise tape-boundary overflow and/or transfer/retrieve
      # faults. transfer/retrieve-failure-rate: 2% injects a one-time synthetic fault (AT MOST
      # ONCE per file for its whole lifetime - VtlDrive::maybeInjectFault()'s atomic marker), so
      # it costs a file exactly one of its 2 retries, never all of them.
      EXTRA_SPAWN_ARGS+=" --stress-transfer-failure-rate ${STRESS_TRANSFER_FAILURE_RATE:-0}"
      EXTRA_SPAWN_ARGS+=" --stress-retrieve-failure-rate ${STRESS_RETRIEVE_FAILURE_RATE:-0}"
      # Tape-boundary overflow: same filesPerTapeOverride mechanism as stress-scale-test (see
      # that job's comment), but deliberately sized BELOW each drive's fair share instead of
      # above it, by STRESS_OVERFLOW_FRACTION percent:
      #   filesPerTape = fair_share x (1 - STRESS_OVERFLOW_FRACTION/100)
      # A drive getting exactly its fair share is then guaranteed to need a second tape - the
      # whole point of this job. Only computed when STRESS_OVERFLOW_FRACTION is explicitly set
      # (unset = off, same as the two failure rates above); the chart's own overflowFraction
      # fallback (0.01) applies otherwise, same as any caller that sets no capacity override.
      #
      # The resulting mount cycle (filesPerTape / rate) and the maintd ageForCollectionSecs
      # margin over it (presets/stress-scale-fail-values.yaml - keep FAIL_AGE_FOR_COLLECTION_SECS
      # below in sync with that file's ageForCollectionSecs by hand, bash cannot read the YAML
      # here) are NOT re-derived here: unlike stress-scale-test's single validated default, this
      # fraction is meant to be varied per run, so the margin must be checked for whatever
      # total_files/drives/fraction is actually used - a fraction large enough to shrink the
      # cycle close to that age risks reclaiming a still-healthy mount (the exact failure mode
      # already seen once with too thin a margin on this job).
      if [[ -n "${STRESS_OVERFLOW_FRACTION}" ]]; then
        FAIL_AGE_FOR_COLLECTION_SECS=900
        FAIL_FAIR_SHARE=$(( ${STRESS_TOTAL_FILES:-4000000} / ${NUM_STRESS_DRIVES:-100} ))
        FILES_PER_TAPE_FAIL_DEFAULT=$(( FAIL_FAIR_SHARE * (100 - STRESS_OVERFLOW_FRACTION) / 100 ))
        FAIL_MOUNT_CYCLE_SECS=$(( FILES_PER_TAPE_FAIL_DEFAULT / ${STRESS_WRITE_RATE_HZ:-50} ))
        # Warn loudly if THIS run's cycle makes the static age margin unsafe (>80% of cycle),
        # rather than silently risking the false-positive-reclaim failure mode already hit once
        # on this job (age too close to the mount cycle reclaims a still-healthy mount mid-batch).
        if (( FAIL_MOUNT_CYCLE_SECS > 0 && FAIL_AGE_FOR_COLLECTION_SECS * 100 / FAIL_MOUNT_CYCLE_SECS > 80 )); then
          FAIL_AGE_PCT_OF_CYCLE=$(( FAIL_AGE_FOR_COLLECTION_SECS * 100 / FAIL_MOUNT_CYCLE_SECS ))
          echo "WARNING: fail-test tape capacity ${FILES_PER_TAPE_FAIL_DEFAULT} files/tape gives a ~${FAIL_MOUNT_CYCLE_SECS}s mount cycle -" >&2
          echo "ageForCollectionSecs=${FAIL_AGE_FOR_COLLECTION_SECS}s is ${FAIL_AGE_PCT_OF_CYCLE}% of it (>80%). Lower STRESS_OVERFLOW_FRACTION," >&2
          echo "raise STRESS_TOTAL_FILES, or lower ageForCollectionSecs in presets/stress-scale-fail-values.yaml before trusting this run." >&2
        else
          echo "Fail-test tape capacity: ${FILES_PER_TAPE_FAIL_DEFAULT} files/tape (fair share ${FAIL_FAIR_SHARE}, ${STRESS_OVERFLOW_FRACTION}% below); mount cycle ~${FAIL_MOUNT_CYCLE_SECS}s."
        fi
        EXTRA_SPAWN_ARGS+=" --stress-files-per-tape ${STRESS_FILES_PER_TAPE:-${FILES_PER_TAPE_FAIL_DEFAULT}}"
      elif [[ -n "${STRESS_FILES_PER_TAPE}" ]]; then
        EXTRA_SPAWN_ARGS+=" --stress-files-per-tape ${STRESS_FILES_PER_TAPE}"
      fi
      # File count and prequeue settings come from test_pgsched_params.toml, same as
      # stress-scale-test. CI variables allow per-run overrides via "Play with variables".
      [[ -n "${STRESS_TOTAL_FILES}" ]] && EXTRA_PYTEST_ARGS+=" --stress-total-files ${STRESS_TOTAL_FILES}"
      [[ -n "${STRESS_PREQUEUE_ENABLED}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-enabled ${STRESS_PREQUEUE_ENABLED}"
      [[ -n "${STRESS_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-prequeue-fraction ${STRESS_PREQUEUE_FRACTION}"
      [[ -n "${STRESS_RETRIEVE_PREQUEUE_FRACTION}" ]] && EXTRA_PYTEST_ARGS+=" --stress-retrieve-prequeue-fraction ${STRESS_RETRIEVE_PREQUEUE_FRACTION}"
    - cd ci/orchestration/
    - ./create_instance.sh --namespace ${NAMESPACE}
                           --reset-catalogue
                           --reset-scheduler
                           --publish-telemetry
                           --cta-image-tag ${IMAGE_TAG}
                           --cta-config ${STRESS_CTA_VALUES_CHAIN}
                           --eos-config presets/stress-eos-values.yaml
                           --catalogue-config ${CATALOGUE_CONFIG}
                           --scheduler-config ${SCHEDULER_CONFIG}
                           --chart-install-timeout 15
                           --eos-deploy-timeout 10
                           ${EXTRA_SPAWN_ARGS}
    - cd ../system_tests
    - mkdir -p "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}"
    - pytest tests/stress_scale_fail_test.py --namespace ${NAMESPACE}
                                             --setup
                                             --color=yes
                                             ${EXTRA_PYTEST_ARGS}
                                             2>&1
                                             | tee "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pytest.log"
  after_script:
    - |
      if $[[ inputs.keep-stress-test-namespace ]]; then
        echo "Skipping deletion of stress test namespace ${NAMESPACE}"
        exit 0
      fi
    - cd ci/orchestration/
    - ./delete_instance.sh --namespace ${NAMESPACE}
                           --collect-logs "${CI_PROJECT_DIR}/test_logs/${NAMESPACE}/pods"
                           --force-delete-cluster-resources
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        case "$CI_JOB_STATUS" in
          success) NOTE="✅ [${CI_JOB_NAME}](${CI_JOB_URL}) completed successfully." ;;
          failed) NOTE="❌ [${CI_JOB_NAME}](${CI_JOB_URL}) failed." ;;
          *) NOTE="⏹️ [${CI_JOB_NAME}](${CI_JOB_URL}) was canceled." ;;
        esac
        python3 "$CI_PROJECT_DIR/ci/release/add_release_note.py" --api-token "$CI_API_TOKEN" "$NOTE"
      fi
  tags:
    - stress
  resource_group: stress-test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test_logs
