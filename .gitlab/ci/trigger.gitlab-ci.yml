spec:
  inputs:
    pipeline-type:
      type: string
    custom-eos-image-tag:
      type: string
    custom-xrootd-version:
      type: string
    platform:
      type: string
    enable-internal-repos:
      type: boolean
    build-generator:
      type: string
    cmake-build-type:
      type: string
    analysis:
      description: "C/C++ analysis mode: Valgrind or compiler sanitizers."
      type: string
      options: ["none", "valgrind", "address", "undefined", "address,undefined", "thread"]
      default: "none"
    enable-sbom-generation:
      type: boolean
    compile-with-extra-telemetry:
      type: boolean
    scheduler-type:
      type: string
    enable-oracle-support:
      type: boolean
    admin-api-authentication:
      type: string
    workflow-api-authentication:
      type: string
    enable-dcache-tests:
      type: boolean
    keep-stress-test-namespace:
      type: boolean
    use-stress-drives:
      type: boolean
---

.trigger-child-pipeline:
  allow_failure: true
  stage: trigger
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"
      when: manual
  trigger:
    forward:
      # Keep disabled so the child pipeline derives its development version from its own CI_PIPELINE_ID
      yaml_variables: false
    include:
      - local: .gitlab-ci.yml
        inputs: &child-pipeline-inputs
          # Child variants use the default pipeline
          platform: $[[ inputs.platform ]]
          enable-internal-repos: $[[ inputs.enable-internal-repos ]]
          build-generator: $[[ inputs.build-generator ]]
          cmake-build-type: $[[ inputs.cmake-build-type ]]
          analysis: $[[ inputs.analysis ]]
          enable-sbom-generation: $[[ inputs.enable-sbom-generation ]]
          # Forward the typed pipeline inputs, not the runtime CI/CD variables. Values
          # overridden by workflow rules in commit pipelines are intentionally not
          # forwarded to these child pipelines as they break the input type validation
          scheduler-type: $[[ inputs.scheduler-type ]]
          enable-oracle-support: $[[ inputs.enable-oracle-support ]]
          compile-with-extra-telemetry: $[[ inputs.compile-with-extra-telemetry ]]
          admin-api-authentication: $[[ inputs.admin-api-authentication ]]
          workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
          enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
          keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
          use-stress-drives: $[[ inputs.use-stress-drives ]]
    strategy: mirror

# Only EL9 pgsched with Oracle is automatic on tags; other variants are optional.
.build-variant:
  extends: .trigger-child-pipeline
  allow_failure: false
  rules:
    # Variant jobs disable variable inheritance, so use the input rather than PIPELINE_TYPE.
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" || "$[[ inputs.pipeline-type ]]" != "DEFAULT"'
      when: never
    # Only build pgsched el9 automatically on tags
    - if: '$CI_COMMIT_TAG && $BUILD_PLATFORM == "el9" && $SCHEDULER_TYPE == "pgsched" && $ENABLE_ORACLE_SUPPORT == "true"'
      when: on_success
      needs:
        - job: prepare-cta-version
          artifacts: false
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
      needs:
        - job: prepare-cta-version
          artifacts: false
    - if: '$CI_MERGE_REQUEST_ID || $CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  trigger:
    forward:
      # Forward the job backend settings without parent defaults.
      yaml_variables: true
    strategy: mirror
  inherit:
    variables: false

# Platform inputs must be literal: GitLab validates options before expanding job variables.

.build-variant-el9:
  extends: .build-variant
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          platform: "el9"
  variables:
    BUILD_PLATFORM: "el9"

.build-variant-el10:
  extends: .build-variant
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          platform: "el10"
  variables:
    BUILD_PLATFORM: "el10"

.build-variant-debian13:
  extends: .build-variant
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          platform: "debian13"
  variables:
    BUILD_PLATFORM: "debian13"

# The main pipeline already builds EL9/objectstore with Oracle.

"EL10: objectstore":
  extends: .build-variant-el10
  variables:
    SCHEDULER_TYPE: "objectstore"
    ENABLE_ORACLE_SUPPORT: "true"

"EL9: pgcat":
  extends: .build-variant-el9
  variables:
    SCHEDULER_TYPE: "objectstore"
    ENABLE_ORACLE_SUPPORT: "false"

"EL10: pgcat":
  extends: .build-variant-el10
  variables:
    SCHEDULER_TYPE: "objectstore"
    ENABLE_ORACLE_SUPPORT: "false"

"EL9: pgsched":
  extends: .build-variant-el9
  variables:
    SCHEDULER_TYPE: "pgsched"
    ENABLE_ORACLE_SUPPORT: "true"

"EL10: pgsched":
  extends: .build-variant-el10
  variables:
    SCHEDULER_TYPE: "pgsched"
    ENABLE_ORACLE_SUPPORT: "true"

"EL9: pgall":
  extends: .build-variant-el9
  variables:
    SCHEDULER_TYPE: "pgsched"
    ENABLE_ORACLE_SUPPORT: "false"

"EL10: pgall":
  extends: .build-variant-el10
  variables:
    SCHEDULER_TYPE: "pgsched"
    ENABLE_ORACLE_SUPPORT: "false"

"Debian13: pgall":
  extends: .build-variant-debian13
  variables:
    SCHEDULER_TYPE: "pgsched"
    ENABLE_ORACLE_SUPPORT: "false"

"Analysis: ASan + UBSan":
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          analysis: "address,undefined"
    strategy: mirror

"Analysis: TSan":
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          analysis: "thread"
    strategy: mirror

"Telemetry: pgsched":
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          scheduler-type: "pgsched"
          compile-with-extra-telemetry: true

"Analysis: SonarCloud":
  allow_failure: true
  stage: trigger
  needs: []  # Ensure no artifacts are downloaded
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      variables:
        # Branch pipelines do not have a merge-request source branch.
        BRANCH_NAME: $CI_COMMIT_BRANCH
  image: $IMAGE_LINT
  variables:
    GIT_STRATEGY: "none"  # Don't need anything from the repo for this job
    TARGET_URL: https://api.github.com/repos/cern-cta/CTA/actions/workflows/sonar-source.yml/dispatches
    BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  script:
    - |
      curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_API_TOKEN" \
        $TARGET_URL \
        -d "{\"ref\":\"${BRANCH_NAME}\"}"
    - echo "Please visit https://github.com/cern-cta/CTA/actions to see the progress of the analysis"
