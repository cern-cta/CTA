spec:
  inputs:
    custom-eos-image-tag:
      type: string
    custom-xrootd-version:
      type: string
    platform:
      type: string
    enable-internal-repos:
      type: boolean
    build-generator:
      type: string
    cmake-build-type:
      type: string
    enable-address-sanitizer:
      type: boolean
    enable-sbom-generation:
      type: boolean
    compile-with-extra-telemetry:
      type: boolean
    scheduler-type:
      type: string
    enable-oracle-support:
      type: boolean
    admin-api-authentication:
      type: string
    workflow-api-authentication:
      type: string
    enable-valgrind:
      type: boolean
    enable-dcache-tests:
      type: boolean
    keep-stress-test-namespace:
      type: boolean
---

# GitLab's trigger:project only supports a different downstream project. Use the trigger API because this pipeline must
# start the same CTA project at another ref. CI_JOB_TOKEN keeps the pipeline linked in the UI, while polling its status
# makes this job provide the same result propagation that strategy: mirror would provide.
# Basically, this job is a hack because GitLab doesn't support what we need here...
trigger-cta-version-regression-pipeline:
  stage: trigger
  needs:
    - job: prepare-cta-version-regression
      artifacts: true
  rules:
    - if: '$PIPELINE_TYPE == "REGR_AGAINST_CTA_VERSION"'
  variables:
    GIT_STRATEGY: none
  script:
    - response_file="$(mktemp)"
    - |
      http_status="$(
        curl --silent --show-error \
          --output "$response_file" \
          --write-out '%{http_code}' \
          --request POST \
          --form "token=$CI_JOB_TOKEN" \
          --form "ref=$RESOLVED_CTA_GIT_TAG" \
          --form "inputs[pipeline-type]=REGR_AGAINST_CTA_BRANCH" \
          --form "inputs[custom-cta-image-tag]=$RESOLVED_CTA_IMAGE_TAG" \
          --form "inputs[custom-eos-image-tag]=$[[ inputs.custom-eos-image-tag ]]" \
          --form "inputs[custom-xrootd-version]=$[[ inputs.custom-xrootd-version ]]" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/trigger/pipeline"
      )"
    - |
      if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
        echo "Failed to create the CTA version-regression pipeline (HTTP $http_status):" >&2
        cat "$response_file" >&2
        exit 1
      fi
    - downstream_pipeline_id="$(jq --exit-status --raw-output '.id' "$response_file")"
    - downstream_pipeline_url="$(jq --exit-status --raw-output '.web_url' "$response_file")"
    - echo "Created downstream pipeline $downstream_pipeline_url"

    # As we can't mirror the pipeline status natively anymore, just poll
    - |
      while true; do
        if ! pipeline_response="$(
          curl --fail-with-body --silent --show-error \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$downstream_pipeline_id"
        )"; then
          echo "Could not read downstream pipeline status. Check the CI_JOB_TOKEN READ_PIPELINES permission." >&2
          exit 1
        fi

        downstream_status="$(jq --exit-status --raw-output '.status' <<< "$pipeline_response")"
        echo "Downstream pipeline status: $downstream_status"

        case "$downstream_status" in
          created|waiting_for_resource|preparing|pending|running|scheduled)
            sleep 15
            ;;
          success)
            exit 0
            ;;
          failed|canceled|skipped|manual)
            exit 1
            ;;
          *)
            echo "Unexpected downstream pipeline status: $downstream_status" >&2
            exit 1
            ;;
        esac
      done

.trigger-child-pipeline:
  allow_failure: true
  stage: trigger
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$PIPELINE_TYPE != "DEFAULT"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"
      when: manual
  trigger:
    forward:
      # Keep disabled so the child pipeline derives CTA_BUILD_ID from its own CI_PIPELINE_ID
      yaml_variables: false
    include:
      - local: .gitlab-ci.yml
        inputs: &child-pipeline-inputs
          # Child variants use the default pipeline
          platform: $[[ inputs.platform ]]
          enable-internal-repos: $[[ inputs.enable-internal-repos ]]
          build-generator: $[[ inputs.build-generator ]]
          cmake-build-type: $[[ inputs.cmake-build-type ]]
          enable-address-sanitizer: $[[ inputs.enable-address-sanitizer ]]
          enable-sbom-generation: $[[ inputs.enable-sbom-generation ]]
          # Forward the typed pipeline inputs, not the runtime CI/CD variables. Values
          # overridden by workflow rules in commit pipelines are intentionally not
          # forwarded to these child pipelines as they break the input type validation
          scheduler-type: $[[ inputs.scheduler-type ]]
          enable-oracle-support: $[[ inputs.enable-oracle-support ]]
          compile-with-extra-telemetry: $[[ inputs.compile-with-extra-telemetry ]]
          admin-api-authentication: $[[ inputs.admin-api-authentication ]]
          workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
          enable-valgrind: $[[ inputs.enable-valgrind ]]
          enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
          keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
    strategy: mirror

trigger-postgres-scheduler-pipeline:
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          scheduler-type: "pgsched"
    strategy: mirror

trigger-postgres-scheduler-with-extra-telemetry-pipeline:
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          scheduler-type: "pgsched"
          compile-with-extra-telemetry: true

trigger-oracle-disabled-pipeline:
  extends:
    - .trigger-child-pipeline
  trigger:
    include:
      - local: .gitlab-ci.yml
        inputs:
          <<: *child-pipeline-inputs
          enable-oracle-support: false
    strategy: mirror

trigger-sonarcloud-pipeline:
  allow_failure: true
  stage: trigger
  needs: []  # Ensure no artifacts are downloaded
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  image: $IMAGE_LINT
  variables:
    GIT_STRATEGY: "none" # Don't need anything from the repo for this job
    TARGET_URL: https://api.github.com/repos/cern-cta/CTA/actions/workflows/sonar-source.yml/dispatches
    BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  script:
    - |
      curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_API_TOKEN" \
        $TARGET_URL \
        -d "{\"ref\":\"${BRANCH_NAME}\"}"
    - echo "Please visit https://github.com/cern-cta/CTA/actions to see the progress of the analysis"
