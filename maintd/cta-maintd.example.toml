# CTA Maintd Service Configuration

# Recommended starting configuration. Replace deployment-specific values before use.
# With --config-strict, set values explicitly rather than relying on defaults.

# Optional features to enable. Remove a feature and its section to disable it.
# Type: array of strings; default: [].
# Allowed: "health_server" (no duplicates).
enabled_features = ["health_server"]

# Experimental features to enable. These may change or be removed in future releases.
# Type: array of strings; default: [].
# Allowed: "telemetry" (no duplicates).
enabled_experimental_features = ["telemetry"]

# Run each enabled routine in turn, then sleep before starting the next cycle.
# To use different schedules, run separate maintd processes with different routine selections.
# All routines are enabled by default; an empty list disables maintenance.
[routines]
  # Routines to enable; include matching sections below.
  # "garbage_collect" cleans up stale agents and objects in the objectstore and has no settings section.
  # "mount_decision_loop" handles the Mount Decision loop and has no settings section.
  # Type: array of strings; default: all routines listed below.
  # Allowed: "disk_report_archive", "disk_report_retrieve", "repack_expand", "repack_report",
  # "mount_decision_loop", "queue_cleanup", "garbage_collect" (no duplicates).
  enabled_routines = [
    "disk_report_archive",
    "disk_report_retrieve",
    "repack_expand",
    "repack_report",
    "mount_decision_loop",
    "garbage_collect",
    "queue_cleanup",
  ]

  # Seconds to wait after each cycle of maintenance routines.
  # Type: integer; default: 10.
  cycle_sleep_interval_secs = 10

  # Maximum cycle duration in seconds before the health endpoint reports the process as unhealthy.
  # A slow cycle continues running; this timeout does not interrupt it.
  # Type: integer; default: 900.
  max_cycle_duration_secs = 900

  # Report archive successes and failures to the disk system.
  [routines.disk_report_archive]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 30.
    soft_timeout_secs = 30

    # Pause in milliseconds between iterations; 0 means no pause.
    # Type: integer; default: 0.
    iter_sleep_ms = 0

  # Report retrieve successes and failures to the disk system.
  [routines.disk_report_retrieve]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 30.
    soft_timeout_secs = 30

    # Pause in milliseconds between iterations; 0 means no pause.
    # Type: integer; default: 0.
    iter_sleep_ms = 0

  # Expand repack requests into individual archive and retrieve jobs.
  [routines.repack_expand]
    # Maximum number of repack requests expanded per cycle.
    # Type: integer; default: 2.
    max_to_expand = 2

  # Process transfer reports for repack requests.
  [routines.repack_report]
    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 900.
    soft_timeout_secs = 900

  # Objectstore routine that finds queues marked for cleanup, takes ownership of these queues and moves the requests
  # to other queues.
  [routines.queue_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

[catalogue]
  # Path to the file containing the catalogue database connection string.
  # Examples:
  #   postgresql:postgresql://username:password@hostname/database
  #   oracle:username/password@database
  # See /usr/share/doc/cta-lib-catalogue/examples/cta-catalogue.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-catalogue.conf".
  config_file = "/etc/cta/cta-catalogue.conf"

[mount_decision]
  # Path to the file containing the Mount Decision DB connection string, which must select postgresql.
  # Type: string; default: "/etc/cta/cta-mount-decision.conf".
  config_file = "/etc/cta/cta-mount-decision.conf"

  # Number of database connections in the Mount Decision DB pool.
  # Type: integer; default: 1.
  number_of_connections = 1

[scheduler]
  # Name identifying this scheduler backend in logs and scheduler resources, such as "cephUser" or "postgresUser".
  # Type: string; default: none; required.
  backend_name = "cephUser"

  # Path to the file containing the scheduler backend connection string.
  # Examples:
  #   rados://user@pool:namespace
  #   file:///path/to/objectstore
  # See /usr/share/doc/cta-lib-scheduler/examples/cta-scheduler.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-scheduler.conf".
  config_file = "/etc/cta/cta-scheduler.conf"

  # Maximum age, in seconds, of cached tape statistics used when deciding whether work warrants a mount.
  # Lower values reflect scheduler changes sooner but increase backend queries; 0 disables the cache.
  # Type: integer; default: 600.
  tape_cache_max_age_secs = 600

  # Maximum age, in seconds, of cached retrieve-queue statistics. Lower values reflect newly queued
  # retrieves sooner but increase backend queries; 0 disables the cache.
  # Type: integer; default: 10.
  retrieve_queue_cache_max_age_secs = 10

[xrootd]
  # Overrides the XrdSecPROTOCOL environment variable used for connections to the disk system.
  # Valid values depend on the installed XRootD security plugins.
  # Type: string; default: "sss".
  security_protocol = "sss"

  # Overrides the XrdSecSSSKT environment variable with the path to the XRootD SSS keytab. The file must
  # be readable by cta-maintd when the "sss" protocol is selected. This setting is required for SSS.
  # Type: string; default: "etc/cta/sss.keytab".
  sss_keytab_path = "/etc/cta/cta.sss.keytab"

[logging]
  # Lowest severity to log. DEBUG produces the most output.
  # Type: string; default: "INFO".
  # Allowed: "EMERG", "ALERT", "CRIT", "ERR", "WARNING", "NOTICE", "USERERR", "INFO", "DEBUG".
  level = "INFO"

  # Log format: structured JSON or key-value pairs.
  # Type: string; default: "json".
  # Allowed: "json", "kv".
  format = "json"

  # Custom string labels added to every log line for filtering and monitoring.
  # Keys are freely chosen and optional; they do not change service behaviour.
  # Type: table of strings; default: {}.
  [logging.attributes]
    # CTA catalogue instance served by this process, for example "production" or "preproduction".
    # Use the same label across services sharing that catalogue; omit it if unused.
    instance = "production"

# Telemetry (experimental). Recommended for monitoring.
[telemetry]
  # Path to the OpenTelemetry SDK declarative configuration file.
  # Type: string; default: none; required.
  config_file = "/etc/cta/cta-otel.yaml"

  # What to do if telemetry cannot start.
  # Type: string; default: "warn".
  # Allowed: "warn" (continue without telemetry), "fatal" (abort startup).
  on_init_failure = "warn"

# Health endpoints. Recommended for monitoring.
[health_server]
  # Use "unix" for <runtime-dir>/health.sock; start the service with --runtime-dir.
  # For Unix sockets, remove the entire [health_server.tcp] section.
  # Type: string; default: "tcp".
  # Allowed: "tcp", "unix".
  transport = "tcp"

  [health_server.tcp]
    # Use 127.0.0.1 for local probes, or 0.0.0.0 to listen on all IPv4 interfaces.
    # Type: string; default: "127.0.0.1".
    host = "127.0.0.1"

    # TCP port for the health endpoints.
    # Type: integer; default: 8080.
    port = 8080
