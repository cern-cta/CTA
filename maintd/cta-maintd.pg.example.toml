####################################################################################################
#
# CTA Maintd Service Configuration
#
####################################################################################################

# This is an example, not a ready-to-run configuration. Copy it to
# /etc/cta/cta-maintd.toml, replace all deployment-specific values, and run:
#   cta-maintd --config=/etc/cta/cta-maintd.toml --config-strict --config-check
# before enabling or starting the service.


# Maintd runs all routines sequentially: A -> B -> C -> sleep -> A -> B -> C -> sleep ...
# Here [A -> B -> C] is a single cycle of routine execution.
# A full cycle of routine execution refers to executing all enabled routines once and excludes the sleep interval.
# Due to this operating model, it is not possible to define different sleep intervals per routine.
# If this behaviour is desired, it is recommended to run several maintd processes, each with only one routine enabled.
# At that point, a cycle consists of a single routine and cycle_sleep_interval_secs effectively becomes a per-routine sleep interval.

# Defaults documented below apply only in non-strict mode.
# Strict mode requires all applicable settings except genuinely optional values.
# Optional sections must match this list. Disabled features are shown as commented examples below.
enabled_features = []

[routines]
  enabled_features = ["disk_report_archive", "disk_report_retrieve", "repack_expand", "repack_report", "user_active_queue_cleanup", "repack_active_queue_cleanup", "user_pending_queue_cleanup", "repack_pending_queue_cleanup", "scheduler_maintenance_cleanup"]
  # The sleep duration in between cycles of routine executions.
  # If omitted, 10 is used.
  cycle_sleep_interval_secs = 10

  # The maximum duration in seconds a single cycle of routine execution is allowed to take.
  # If a cycle takes longer than this value, it will not be interrupted.
  # Instead, the process will no longer be considered alive by the health server.
  # If omitted, 900 is used (15 minutes).
  max_cycle_duration_secs = 900

  # Routine that reports archive transfer success/failures to the disk system.
  disk_report_archive  = { batch_size = 500, soft_timeout_secs = 30, iter_sleep_ms = 500 }
  # Routine that reports retrieve transfer success/failures to the disk system.
  disk_report_retrieve = { batch_size = 500, soft_timeout_secs = 30, iter_sleep_ms = 500 }
  # Routine that expands repack requests.
  repack_expand        = { max_to_expand = 2 }
  # Routine that handles the reporting of the requests created by repack requests.
  repack_report        = { soft_timeout_secs = 30 }

  user_active_queue_cleanup   = { batch_size = 1000, age_for_collection_secs = 900 }
  repack_active_queue_cleanup = { batch_size = 1000, age_for_collection_secs = 900 }
  user_pending_queue_cleanup   = { batch_size = 1000, age_for_collection_secs = 900 }
  repack_pending_queue_cleanup = { batch_size = 1000, age_for_collection_secs = 900 }
  # Also removes the disk system sleep entries whose sleep time has elapsed (no age/batch size of
  # its own: an entry expires by the sleep time and the timestamp it holds itself, and there is at
  # most one entry per disk system). This is housekeeping only: an expired entry is already ignored
  # when the mounts are decided, and a disk system which runs out of space again takes its expired
  # entry over. How often this cleanup runs therefore only affects how long the collected rows linger.
  scheduler_maintenance_cleanup = { batch_size = 1000, age_for_deletion_secs = 1209600 }


[catalogue]
  # Path to the CTA Catalogue configuration file. The file contains a single connection string that
  # specifies how to connect to the Catalogue DB.
  # Examples:
  #   postgresql:postgresql://username:password@hostname/database
  #   oracle:username/password@database
  # See /usr/share/doc/cta-lib-scheduler/examples/cta-scheduler.example.conf for further details.
  # This setting is required.
  config_file = "/etc/cta/cta-catalogue.conf"


[scheduler]
  # Unique name used to identify this scheduler backend in logs and scheduler resources. A conventional
  # format is "[ceph|postgres|vfs][User|Repack]", for example "cephUser". This setting is required.
  backend_name = "cephUser"
  # Path to the CTA Scheduler backend configuration file. The file contains a single connection string that
  # specifies how to connect to the scheduler backend.
  # Example:
  #   postgresql:postgresql://username:password@hostname/database
  # See /usr/share/doc/cta-lib-scheduler/examples/cta-scheduler.example.conf for further details.
  # This setting is required.
  config_file = "/etc/cta/cta-scheduler.conf"
  # Number of connections to the scheduler database. If omitted, 3 is used.
  number_of_connections = 3
  # Maximum age, in seconds, of cached tape statistics used when deciding whether work warrants a mount.
  # Lower values reflect scheduler changes sooner but increase backend queries. If omitted, 600 is used.
  tape_cache_max_age_secs = 600
  # Maximum age, in seconds, of cached retrieve-queue statistics. Lower values reflect newly queued
  # retrieves sooner but increase backend queries. If omitted, 10 is used.
  retrieve_queue_cache_max_age_secs = 10

[logging]
  # Minimum severity written to the log. Messages below this level are masked. Valid values are EMERG,
  # ALERT, CRIT, ERR, WARNING, NOTICE (USERERR), INFO, and DEBUG. More verbose levels increase log volume.
  # If omitted, INFO is used.
  level = "INFO"

  # Log format. Possible values are "json" and "kv" (key-value).
  # If omitted json is used.
  format = "json"

  # The following key-value pairs are added to all log lines.
  # All keys are optional as this is purely for monitoring purposes.
  [logging.attributes]
    # Monitoring-only label identifying the CTA instance served by this process, such as "production" or
    # "preproduction". It should identify the catalogue instance consistently across CTA services.
    # This attribute is optional and has no behavioral effect.
    instance = "production"
    # Monitoring-only label identifying the scheduler backend. It should normally match scheduler.backend_name.
    # This attribute is optional and has no behavioral effect.
    sched_backend = "postgresUser"


[xrootd]
  # Overrides the XrdSecPROTOCOL environment variable used for connections to the disk system.
  # Valid values depend on the installed XRootD security plugins. If omitted, "sss" is used.
  security_protocol = "sss"
  # Overrides the XrdSecSSSKT environment variable with the path to the XRootD SSS keytab. The file must
  # be readable by cta-maintd when the "sss" protocol is selected. This setting is required for SSS.
  sss_keytab_path = "/etc/cta/cta.sss.keytab"


# Telemetry (experimental)
# Add "telemetry" to the root enabled_features list, then uncomment this section.
# [telemetry]
#   # Path to the OpenTelemetry SDK declarative configuration file.
#   config_file = "/etc/cta/cta-otel.yaml"
#   # "warn" continues without telemetry if initialization fails; "fatal" aborts startup.
#   on_init_failure = "warn"


# Health endpoints
# Add "health_server" to the root enabled_features list, then uncomment the TCP example below.
# [health_server]
#   # Use "unix" for <runtime-dir>/health.sock; start the service with --runtime-dir.
#   # For Unix sockets, leave the entire [health_server.tcp] section commented out.
#   transport = "tcp"
#
# [health_server.tcp]
#   # Use 127.0.0.1 for local probes, or 0.0.0.0 to listen on all IPv4 interfaces.
#   host = "127.0.0.1"
#   port = 8080
