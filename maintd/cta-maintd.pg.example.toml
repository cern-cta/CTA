# CTA Maintd Service Configuration

# Copy this example and replace deployment-specific names, endpoints and credential paths.
# Defaults apply only in non-strict mode; strict mode requires all settings unless marked optional.
# Include feature sections only when enabled, with all their required settings.

# Maintd runs all routines sequentially: A -> B -> C -> sleep -> A -> B -> C -> sleep ...
# Here [A -> B -> C] is a single cycle of routine execution.
# A full cycle of routine execution refers to executing all enabled routines once and excludes the sleep interval.
# Due to this operating model, it is not possible to define different sleep intervals per routine.
# If this behaviour is desired, it is recommended to run several maintd processes, each with only one routine enabled.
# At that point, a cycle consists of a single routine and cycle_sleep_interval_secs effectively becomes a per-routine
# sleep interval.

# Optional features to enable; include the matching sections below.
# Type: array of strings; default: [].
# Allowed: "health_server" (no duplicates).
enabled_features = []

# Experimental features to enable; their interfaces may change or be removed.
# Type: array of strings; default: [].
# Allowed: "telemetry" (no duplicates).
enabled_experimental_features = []

# All supported routines are enabled by default; an empty list performs no maintenance work.
[routines]
  # Optional features to enable; include the matching sections below.
  # Type: array of strings; default: all routines listed below.
  # Allowed: "disk_report_archive", "disk_report_retrieve", "repack_expand", "repack_report",
  # "user_active_queue_cleanup", "repack_active_queue_cleanup", "user_pending_queue_cleanup",
  # "repack_pending_queue_cleanup", "scheduler_maintenance_cleanup" (no duplicates).
  enabled_routines = [
    "disk_report_archive",
    "disk_report_retrieve",
    "repack_expand",
    "repack_report",
    "user_active_queue_cleanup",
    "repack_active_queue_cleanup",
    "user_pending_queue_cleanup",
    "repack_pending_queue_cleanup",
    "scheduler_maintenance_cleanup",
  ]

  # Sleep duration in seconds between cycles of routine executions.
  # Type: integer; default: 10.
  cycle_sleep_interval_secs = 10

  # The maximum duration in seconds a single cycle of routine execution is allowed to take.
  # If a cycle takes longer than this value, it will not be interrupted.
  # Instead, the process will no longer be considered alive by the health server.
  # Type: integer; default: 900.
  max_cycle_duration_secs = 900

  # Routine that reports archive transfer success/failures to the disk system.
  [routines.disk_report_archive]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 30.
    soft_timeout_secs = 30

    # Pause in milliseconds between iterations; 0 means no pause.
    # Type: integer; default: 0.
    iter_sleep_ms = 0

  # Routine that reports retrieve transfer success/failures to the disk system.
  [routines.disk_report_retrieve]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 30.
    soft_timeout_secs = 30

    # Pause in milliseconds between iterations; 0 means no pause.
    # Type: integer; default: 0.
    iter_sleep_ms = 0

  # Routine that expands repack requests.
  [routines.repack_expand]
    # Maximum number of repack requests expanded per cycle.
    # Type: integer; default: 2.
    max_to_expand = 2

  # Routine that handles the reporting of the requests created by repack requests.
  [routines.repack_report]
    # Soft time limit in seconds for this routine; checked between batches.
    # Type: integer; default: 900.
    soft_timeout_secs = 900
  [routines.user_active_queue_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Minimum queue-entry age in seconds before collection.
    # Type: integer; default: 900.
    age_for_collection_secs = 900
  [routines.repack_active_queue_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Minimum queue-entry age in seconds before collection.
    # Type: integer; default: 900.
    age_for_collection_secs = 900
  [routines.user_pending_queue_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Minimum queue-entry age in seconds before collection.
    # Type: integer; default: 900.
    age_for_collection_secs = 900
  [routines.repack_pending_queue_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Minimum queue-entry age in seconds before collection.
    # Type: integer; default: 900.
    age_for_collection_secs = 900

  # Removes stale scheduler maintenance entries and expired disk-system sleep entries.
  # Disk-system sleep entries expire according to their own timestamps, independent of age_for_deletion_secs.
  [routines.scheduler_maintenance_cleanup]
    # Maximum number of entries processed per batch.
    # Type: integer; default: 500.
    batch_size = 500

    # Minimum maintenance-entry age in seconds before deletion.
    # Type: integer; default: 1209600.
    age_for_deletion_secs = 1209600


[catalogue]
  # Path to the CTA Catalogue configuration file. The file contains a single connection string that
  # specifies how to connect to the Catalogue DB.
  # Examples:
  #   postgresql:postgresql://username:password@hostname/database
  #   oracle:username/password@database
  # See /usr/share/doc/cta-lib-catalogue/examples/cta-catalogue.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-catalogue.conf".
  config_file = "/etc/cta/cta-catalogue.conf"

[scheduler]
  # Unique name used to identify this scheduler backend in logs and scheduler resources. A conventional
  # format is "[ceph|postgres|vfs][User|Repack]", for example "cephUser".
  # Type: string; default: none; required.
  backend_name = "cephUser"

  # Path to the CTA Scheduler backend configuration file. The file contains a single connection string that
  # specifies how to connect to the scheduler backend.
  # Example:
  #   postgresql:postgresql://username:password@hostname/database
  # See /usr/share/doc/cta-lib-scheduler/examples/cta-scheduler.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-scheduler.conf".
  config_file = "/etc/cta/cta-scheduler.conf"

  # Number of connections to the scheduler database.
  # Type: integer; default: 3.
  number_of_connections = 3

  # Maximum age, in seconds, of cached tape statistics used when deciding whether work warrants a mount.
  # Lower values reflect scheduler changes sooner but increase backend queries.
  # Type: integer; default: 600.
  tape_cache_max_age_secs = 600

  # Maximum age, in seconds, of cached retrieve-queue statistics. Lower values reflect newly queued
  # retrieves sooner but increase backend queries.
  # Type: integer; default: 10.
  retrieve_queue_cache_max_age_secs = 10

[logging]
  # Minimum severity written to the log. More verbose levels increase log volume.
  # Type: string; default: "INFO".
  # Allowed: "EMERG", "ALERT", "CRIT", "ERR", "WARNING", "NOTICE", "USERERR", "INFO", "DEBUG".
  level = "INFO"

  # Log format: structured JSON or key-value pairs.
  # Type: string; default: "json".
  # Allowed: "json", "kv".
  format = "json"

  # Arbitrary string labels added to every log line; no effect on service behaviour.
  # Type: table of strings; default: {}.
  [logging.attributes]
    # Monitoring-only label identifying the CTA instance served by this process, such as "production" or
    # "preproduction". It should identify the catalogue instance consistently across CTA services.
    # This attribute is optional and has no behavioral effect.
    # Type: string; default: none; optional.
    # instance = "production"

    # Monitoring-only label identifying the scheduler backend. It should normally match scheduler.backend_name.
    # This attribute is optional and has no behavioral effect.
    # Type: string; default: none; optional.
    # sched_backend = "postgresUser"

[xrootd]
  # Overrides the XrdSecPROTOCOL environment variable used for connections to the disk system.
  # Valid values depend on the installed XRootD security plugins.
  # Type: string; default: "sss".
  security_protocol = "sss"

  # Overrides the XrdSecSSSKT environment variable with the path to the XRootD SSS keytab. The file must
  # be readable by cta-maintd when the "sss" protocol is selected. This setting is required for SSS.
  # Type: string; default: "etc/cta/sss.keytab".
  sss_keytab_path = "/etc/cta/cta.sss.keytab"

  # Telemetry (experimental)
  # Add "telemetry" to the root enabled_experimental_features list, then uncomment this section.
  # [telemetry]
  #   # Path to the OpenTelemetry SDK declarative configuration file.
  #   # Type: string; default: none; required.
  #   config_file = "/etc/cta/cta-otel.yaml"

  #   # Behaviour when telemetry initialization fails.
  #   # Type: string; default: "warn".
  #   # Allowed: "warn" (continue without telemetry), "fatal" (abort startup).
  #   on_init_failure = "warn"

  # Health endpoints
  # Add "health_server" to the root enabled_features list, then uncomment the TCP example below.
  # [health_server]
  #   # Use "unix" for <runtime-dir>/health.sock; start the service with --runtime-dir.
  #   # For Unix sockets, leave the entire [health_server.tcp] section commented out.
  #   # Type: string; default: "tcp".
  #   # Allowed: "tcp", "unix".
  #   transport = "tcp"

  # [health_server.tcp]
  #   # Use 127.0.0.1 for local probes, or 0.0.0.0 to listen on all IPv4 interfaces.
  #   # Type: string; default: "127.0.0.1".
  #   host = "127.0.0.1"

  #   # TCP port for the health endpoints.
  #   # Type: integer; default: 8080.
  #   port = 8080
