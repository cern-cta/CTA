# The repository is a workspace, not an installable Python distribution.
[tool.uv.workspace]
  members = ["lib/python/cta*", "tools/cta-cli"]

[tool.uv]
  # Cooldown period of 14 days
  exclude-newer = "14 days"
  # Build-time requirements are not covered by uv.lock. Pin the protobuf generator to the locked runtime
  # version so that the generated gRPC stubs never require a newer grpcio than the one installed.
  build-constraint-dependencies = ["grpcio-tools==1.84.1"]

  # Explicit exceptions for the requested Zensical release and matching UI package.
  # Remove after November 24, 2026, once all selected artifacts have cleared the 14-day cooldown.
  [tool.uv.exclude-newer-package]
    zensical    = "2026-11-11T00:00:00Z"
    zensical-ui = "2026-11-11T00:00:00Z"

  [tool.uv.dependency-groups]
    docs = { requires-python = ">=3.12" }

  # Zensical-compatible mike; uv.lock records the exact revision.
  [tool.uv.sources]
    mike = { git = "https://github.com/squidfunk/mike" }

[dependency-groups]
  dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "source-checks" },
    { include-group = "unit-tests" },
    { include-group = "system-tests" },
    { include-group = "type-check" },
    "pre-commit>=4.3.0",
  ]
  lint = ["ruff==0.17.3"]
  source-checks = [
    "reuse[charset-normalizer]==6.2.0",
    "clang-format==20.1.8",
    "cppcheck-codequality",
    "detect-secrets==1.5.0",
    "yamllint==1.37.1",
    "PyYAML",
  ]
  unit-tests = [
    { include-group = "scripts" },
    "hatchling>=1.27.0",
    "pytest>=8",
    "pytest-cov",
    "cattrs",
    "grpcio-tools==1.84.1",
  ]
  # These scripts also run independently in existing pipeline environments.
  scripts = ["PyYAML", "jsonschema", "packaging>=24", "pyjwt", "cryptography"]
  type-check = [
    "pyright[nodejs]",
    { include-group = "unit-tests" },
    { include-group = "system-tests" },
  ]
  system-tests = [
    "kubernetes>=35.0.0,<36",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.2.0",
    "oauthlib>=3.2.2",
    "fastjsonschema>=2.21.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "packaging>=24.0",
  ]
  docs = [
    "zensical==0.1.1",
    "mike",
    "mkdocstrings-python==1.18.2",
    "mkdocstrings==0.30.1",
    "mkdocs-autorefs==1.4.2",
    "markdown==3.9",
    "pymdown-extensions==11.0.2",
  ]

[tool.pytest.ini_options]
  addopts = "-ra --ignore=ci/system_tests --ignore=docs/tests"
  testpaths = [
    "ci",
    "lib/python",
    "tools/cta-cli/tests",
    "tools/cta-udev/tests",
  ]

# Keep XML filenames relative to the repository root for GitLab diff annotations.
[tool.coverage.run]
  source = ["."]
  relative_files = true
  omit = [
    "ci/system_tests/*",
    "*/tests/*",
    "*/test_*.py",
    "*/*_test.py",
    "*/conftest.py",
    "*/protobuf_generated/*",
    "build/*",
    "tmp/*",
    ".venv/*",
    "**/venv/*",
    "lib/protobuf/external/*",
  ]

[tool.coverage.report]
  include_namespace_packages = true
  include = [
    "ci/*",
    "lib/python/*/src/*",
    "tools/cta-cli/src/*",
    "tools/cta-udev/src/*",
  ]

[tool.ruff]
  line-length    = 120
  target-version = "py315"
  # Exclude Markdown until Ruff's handling of partial Python examples has been reviewed.
  # TODO: Check findings and formatting changes in docs before enabling Markdown discovery.
  include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]
  extend-exclude = [
    "tmp",
    "**/protobuf_generated",
    "lib/protobuf/external",
    "catalogue/cta-catalogue-schema",
    "common/jwt-cpp",
  ]

  # Keep these helpers compatible with the Python installed in their runtime environments.
  [tool.ruff.per-file-target-version]
    # Installed cta-udev and cta-versionlock use /usr/bin/python3 (Python 3.9 on EL9).
    "tools/cta-udev/**/*.py"    = "py39"
    "tools/cta-release/**/*.py" = "py39"
    # Native builds and the host-side launcher use distribution Python.
    "ci/project-json/**/*.py"                 = "py39"
    "ci/build/**/*.py"                        = "py39"
    "ci/sbom/**/*.py"                         = "py39"
    "ci/system_tests/tests/remote_scripts/**" = "py39"


  [tool.ruff.lint]
    select = [
      'E',      # pycodestyle (errors)
      'W',      # pycodestyle (warnings)
      'F',      # pyflakes
      'I',      # isort (import sorting)
      'N',      # pep8-naming
      'Q',      # flake8-quotes
      'RUF',    # ruff
      'UP',     # pyupgrade
      'D',      # pydocstyle
      'S',      # flake8-bandit
      'C4',     # flake8-comprehensions
      'INT',    # flake8-gettext
      'LOG',    # flake8-logging
      'G',      # flake8-logging-format
      'B',      # flake8-bugbear
      'A001',   # flake8-builtins
      'COM',    # flake8-commas
      'T10',    # flake8-debugger
      'EXE',    # flake8-executable
      'ISC',    # flake8-implicit-str-concat
      'PIE',    # flake8-pie
      'PT',     # flake8-pytest-style
      'RSE',    # flake8-raise
      'RET504', # flake8-return
      'SIM',    # flake8-simplify
      'TID',    # flake8-tidy-imports
      'PGH',    # pygrep-hooks
      'PL',     # pylint
      'TRY',    # tryceratops
      'PERF',   # perflint
      'FURB',   # refurb
    ]
    ignore = [
      'TRY002',  # Built-in exceptions are sufficient here.
      'TRY003',  # Inline exception messages are easier to follow.
      'PLR2004', # Numeric literals are often clearer than named constants.
      'D1',      # The existing scripts do not consistently use docstrings.
      'S101',    # Pytest tests rely on assertions.
      'COM812',  # This rule conflicts with the formatter.
      'PLR0913', # Test fixtures and CLI helpers naturally have many arguments.
      'PLC0415', # Some dependencies require delayed or optional imports.
      'PLR0917', # Very noisy
    ]

    [tool.ruff.lint.pydocstyle]
      convention = 'pep257'

    [tool.ruff.lint.per-file-ignores]
      # Release helpers invoke trusted tools and validated HTTPS endpoints.
      'ci/release/src/git_repo.py'   = ['S603', 'S607']
      'ci/release/src/gitlab_api.py' = ['S310']

      # Release tests use fixed temporary paths and nested mock contexts.
      'ci/release/tests/test_*.py' = ['S108', 'SIM117']

      # This custom loader inherits from yaml.SafeLoader.
      'ci/checks/check_gitlab_ci_key_order.py' = ['S506']

      # The Kubernetes API URL always uses HTTPS.
      'ci/orchestration/helm/ci-setup/scripts/create_k8s_secrets.py' = ['S310']

      # These wrappers invoke fixed, trusted executables.
      'ci/system_tests/helpers/connections/k8s_connection.py' = ['S603']
      'ci/system_tests/helpers/connections/ssh_connection.py' = ['S603']
      'ci/system_tests/helpers/test_env.py'                   = ['S603']

      # Integration tests favor readable scenarios over complexity limits.
      'ci/system_tests/tests/**/*_test.py' = ['PLR0915', 'PT012', 'PLR0912']

      # System tests intentionally use temporary paths.
      'ci/system_tests/**/*.py' = ['S108']

      # These remote scripts invoke a trusted executable from PATH.
      'ci/system_tests/tests/remote_scripts/eos_client/count_files.py' = [
        'S603',
        'S607',
      ]
      'ci/system_tests/tests/remote_scripts/eos_client/xrootd_retrieve.py' = [
        'S603',
        'S607',
      ]

      # This worker is intentionally complex and invokes a trusted executable.
      'ci/system_tests/tests/remote_scripts/eos_client/xrootd_archive.py' = [
        'PLR0915',
        'PLR0912',
        'S603',
        'S607',
      ]

[tool.pyright]
  pythonVersion = "3.15"
  # Match Ruff's compatibility boundaries; build and system helpers use distribution Python.
  # Pyright selects the first matching directory, so keep the repository fallback last.
  executionEnvironments = [
    { root = "tools/cta-udev", pythonVersion = "3.9" },
    { root = "tools/cta-release", pythonVersion = "3.9" },
    { root = "ci/project-json", pythonVersion = "3.9" },
    { root = "ci/build", pythonVersion = "3.9" },
    { root = "ci/sbom", pythonVersion = "3.9" },
    { root = "ci/system_tests/tests/remote_scripts", pythonVersion = "3.9" },
    { root = "." },
  ]
  typeCheckingMode = "strict"
  extraPaths = ["ci/release/src", "."]
  exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "build",
    "tmp",
    "**/protobuf_generated",
    "lib/protobuf/external",
    "catalogue/cta-catalogue-schema",
    "common/jwt-cpp",
  ]
  reportImplicitOverride = "error"
  reportMissingTypeArgument = "error"
  reportUnknownVariableType = "none"
  reportUnknownMemberType = "none"
  reportUnknownParameterType = "none"
  reportUnknownArgumentType = "none"
  reportMissingTypeStubs = "none"
