[package]
name = "cta-restore-files"
version = "0.1.0"
edition = "2024"

[dependencies]
cta-lib = { path = "../cta-lib-rs" }
eos-protobuf = { path = "../eos-protobuf-rs" }
cta-protobuf = { path = "../cta-protobuf-rs" }

tonic = { version = "^0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-prost = "^0.14"
prost = "^0.14"
tokio = { version = "^1.0", features = ["macros", "rt-multi-thread"] }
thiserror = "^2.0"
anyhow = "^1.0"
clap = { version = "^4.6", features = ["env", "derive"] }
url = "^2.5"
log = "^0.4"
env_logger = "^0.11"
tokio-stream = "0.1.19"
serde_json = "1.0.151"
