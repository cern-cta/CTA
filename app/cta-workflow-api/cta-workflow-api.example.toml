# CTA Workflow API Service Configuration

# Recommended starting configuration. Replace deployment-specific values before use.
# With --config-strict, set values explicitly rather than relying on defaults.

# CTA instance name used for authentication and included in gRPC responses.
# Type: string; default: none; required.
instance_name = "production"

# Optional features to enable. Remove a feature and its section to disable it.
# Type: array of strings; default: [].
# Allowed: none (use []).
enabled_features = []

# Experimental features to enable. These may change or be removed in future releases.
# Type: array of strings; default: [].
# Allowed: "telemetry" (no duplicates).
enabled_experimental_features = ["telemetry"]

[grpc]
  # TCP port the gRPC server listens on.
  # Type: integer; default: 50051.
  port = 50051

  # Maximum number of worker threads used by the gRPC server.
  # Set to 0 for automatic sizing: eight times the detected CPU count.
  # Type: integer; default: 0.
  number_of_threads = 0

  [grpc.tls]
    # Filesystem path to the server private key (PEM).
    # Type: string; default: none; required.
    server_key_path = "/path/to/your/private-key.pem"

    # Filesystem path to the server certificate (PEM).
    # Type: string; default: none; required.
    server_cert_path = "/path/to/your/certificate.pem"

    # Additional CA certificates (PEM) used to verify client certificates for mTLS.
    # Omit for JWT authentication; set this to the client CA file when using mTLS.
    # Type: string; default: none; optional.
    # chain_cert_path = "/etc/cta/ca-chain.pem"

# Authentication: enable exactly one of JWT or mTLS, and include its matching section.
[auth]
  # Authentication methods to enable; include the matching sections below.
  # Type: array of strings; default: ["jwt"].
  # Allowed: "jwt", "mtls" (exactly one).
  enabled_methods = ["jwt"]

  [auth.jwt]
    # URI of the JWKS document used to verify JWT signatures; supports file:// and https://.
    # Type: string; default: none; required.
    jwks_uri = "file:///etc/cta/jwks.json"

    # Expected issuer (iss claim); tokens with a different issuer are rejected.
    # Type: string; default: none; required.
    expected_issuer = "cta"

    # Expected audience (aud claim); use a distinct audience for each service.
    # Type: string; default: none; required.
    expected_audience = "cta-workflow-api"

    # Minimum accepted token generation (gen claim); raise it to invalidate older tokens.
    # Type: integer; default: 0.
    min_generation = 0

    # JWKS refresh interval in seconds; shorter intervals detect key rotations sooner.
    # Type: integer; default: 600.
    cache_refresh_interval = 600

    # HTTP timeout in seconds when retrieving the JWKS document.
    # Type: integer; default: 60.
    jwks_total_timeout = 60

    # Cached public-key lifetime in seconds; 0 means never expires.
    # Type: integer; default: 0.
    pub_key_timeout = 0

    # Path to a file listing revoked tokens. Omit if no additional revocation list is used.
    # Type: string; default: none; optional.
    # revoke_list_path = "/etc/cta/jwt-revoke-list.toml"

    # Mutual TLS authentication
    # Set auth.enabled_methods to ["mtls"], comment out [auth.jwt], and uncomment this section.
    # Configure grpc.tls.chain_cert_path with the CA used to verify client certificates.
    # [auth.mtls]
    #   # Match certificate identities to the disk instance named in the request.
    #   # Type: table of arrays of strings; default: {}.
    # [auth.mtls.aliases]
    #   # Keys are disk-instance identities; values are accepted certificate hostnames.
    #   ctaeos = ["eos-mgm.example.org"]

[requests]
  [requests.archive]
    # Whether 0-length files are rejected.
    # Type: boolean; default: true.
    zero_length_files_forbidden = true

    # VOs which are exempt from the 0-length file restriction.
    # Type: array of strings; default: [].
    zero_length_vo_exceptions = []

  [requests.prepare]
    # Name of the mount policy used for verification requests; an empty string rejects verification requests.
    # Type: string; default: "".
    verification_mount_policy = ""

[catalogue]
  # Path to the file containing the catalogue database connection string.
  # Examples:
  #   postgresql:postgresql://username:password@hostname/database
  #   oracle:username/password@database
  # See /usr/share/doc/cta/cta-catalogue.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-catalogue.conf".
  config_file = "/etc/cta/cta-catalogue.conf"

  [catalogue.client]
    # Number of connections in the catalogue connection pool. Must be greater than zero.
    # Type: integer; default: 10.
    number_of_connections = 10

[scheduler]
  # Name identifying this scheduler backend in logs and scheduler resources, such as "cephUser" or "postgresUser".
  # Type: string; default: none; required.
  backend_name = "cephUser"

  # Path to the file containing the scheduler backend connection string.
  # Examples:
  #   rados://user@pool:namespace
  #   file:///path/to/objectstore
  # See /usr/share/doc/cta/cta-scheduler.example.conf for further details.
  # Type: string; default: "/etc/cta/cta-scheduler.conf".
  config_file = "/etc/cta/cta-scheduler.conf"

  # Maximum age, in seconds, of cached tape statistics used when deciding whether work warrants a mount.
  # Lower values reflect scheduler changes sooner but increase backend queries. Must be greater than zero.
  # Type: integer; default: 600.
  tape_cache_max_age_secs = 600

  # Maximum age, in seconds, of cached retrieve-queue statistics. Lower values reflect newly queued
  # retrieves sooner but increase backend queries. Must be greater than zero.
  # Type: integer; default: 10.
  retrieve_queue_cache_max_age_secs = 10

  # Object store-specific scheduler options
  [scheduler.client]
    # Size of the scheduler DB thread pool. Must be greater than zero.
    # Choose for expected scheduler concurrency; 500 is an illustrative deployment value.
    # Type: integer; default: none; required.
    number_of_threads = 500

    # Stack size of each scheduler DB thread, in MiB.
    # Set to 0 to use the system's thread-stack size.
    # Type: integer; default: 0.
    thread_stack_size_mb = 0

[logging]
  # Lowest severity to log. DEBUG produces the most output.
  # Type: string; default: "INFO".
  # Allowed: "EMERG", "ALERT", "CRIT", "ERR", "WARNING", "NOTICE", "USERERR", "INFO", "DEBUG".
  level = "INFO"

  # Log format: structured JSON or key-value pairs.
  # Type: string; default: "json".
  # Allowed: "json", "kv".
  format = "json"

  # Custom string labels added to every log line for filtering and monitoring.
  # Keys are freely chosen and optional; they do not change service behaviour.
  # Type: table of strings; default: {}.
  [logging.attributes]
    # CTA catalogue instance served by this process, for example "production" or "preproduction".
    # Use the same label across services sharing that catalogue; omit it if unused.
    instance = "production"

# Telemetry (experimental). Recommended for monitoring.
[telemetry]
  # Path to the OpenTelemetry SDK declarative configuration file.
  # Type: string; default: none; required.
  config_file = "/etc/cta/cta-otel.yaml"

  # What to do if telemetry cannot start.
  # Type: string; default: "warn".
  # Allowed: "warn" (continue without telemetry), "fatal" (abort startup).
  on_init_failure = "warn"
