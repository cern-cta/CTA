spec:
  inputs:
    # =========================================================================
    # Pipeline execution and regression overrides
    # =========================================================================
    pipeline-type:
      description: "What kind of pipeline to run"
      type: string
      options:
        - "DEFAULT"
        - "REGR_AGAINST_CTA_BRANCH"
        - "REGR_AGAINST_CTA_VERSION"
        - "UPDATE_PIPELINE_IMAGES"
      default: "DEFAULT"

    custom-cta-image-tag:
      description: "Custom CTA image tag."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    custom-eos-image-tag:
      description: "Custom EOS image tag for regression pipelines."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    custom-xrootd-version:
      description: "Custom XRootD version for regression pipelines."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    # =========================================================================
    # Build and architecture
    # =========================================================================
    platform:
      description: "Platform to build, test, and release on."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["el9"]
          default: "el9"

    scheduler-type:
      description: "Scheduler implementation to build and test."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["pgsched", "objectstore"]
          default: "objectstore"

    enable-oracle-support:
      description: "Enable Oracle support."
    # Boolean values cannot be conditionally hidden yet. See https://gitlab.com/gitlab-org/gitlab/-/issues/587643
      type: boolean
      default: true

    enable-address-sanitizer:
      description: "Compile with Address Sanitizer."
      type: boolean
      default: false

    cmake-build-type:
      description: "CMake build type for pipelines that compile CTA RPMs."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "DEFAULT" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH"'
          options: ["Release", "Debug", "RelWithDebInfo", "MinSizeRel"]
          default: "RelWithDebInfo"

    enable-internal-repos:
      description: "Use internal yum repositories."
      type: boolean
      default: true

    build-generator:
      description: "Build generator for pipelines that compile CTA RPMs."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "DEFAULT" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH"'
          options: ["Unix Makefiles", "Ninja"]
          default: "Unix Makefiles"

    enable-sbom-generation:
      description: "Generate an SBOM per image."
      type: boolean
      default: false

    # =========================================================================
    # Deployment
    # =========================================================================
    workflow-api-authentication:
      description: "Workflow API authentication used by CTA and EOS."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["jwt", "mtls"]
          default: "jwt"

    # =========================================================================
    # Testing
    # =========================================================================
    enable-valgrind:
      description: "Run unit tests with Valgrind."
      type: boolean
      default: false

    enable-dcache-tests:
      description: "Run dCache regression tests automatically."
      type: boolean
      default: false

    keep-stress-test-namespace:
      description: "Keep stress-test namespace for debugging."
      type: boolean
      default: false
---

stages:
  - .pre
  - trigger
  - validate
  - lint
  - build
  - build:image
  - test
  - system-test
  - sbom
  - release
  - report
  - .post

# User-facing settings are defined as inputs. Internal variables expose their effective values to included templates
# when workflow rules may override the selected input.
variables:
  # Pipeline images
  # Updated by the weekly UPDATE_PIPELINE_IMAGES pipeline after every image has been built successfully
  PIPELINE_IMAGE_VERSION: "2026-08-17-15549541"
  DOCKER_IMAGE_PROXY: "registry.cern.ch"
  # Platform-specific images are tagged with the platform name to allow for multiple platforms to be built and tested in parallel
  IMAGE_BUILD: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-build:${PIPELINE_IMAGE_VERSION}.$[[ inputs.platform ]]"
  IMAGE_TEST: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-test:${PIPELINE_IMAGE_VERSION}.$[[ inputs.platform ]]"
  # Remaining images are shared across all platforms and do not have a platform suffix
  IMAGE_DEFAULT: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-default:${PIPELINE_IMAGE_VERSION}"
  IMAGE_LINT: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-lint:${PIPELINE_IMAGE_VERSION}"
  IMAGE_RELEASE: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-release:${PIPELINE_IMAGE_VERSION}"
  IMAGE_DANGER: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-danger:${PIPELINE_IMAGE_VERSION}"
  # External images
  IMAGE_DOCKER_IMAGE_BUILDER: "${DOCKER_IMAGE_PROXY}/quay.io/buildah/stable:v1.43-immutable"
  IMAGE_DOCKER_LINT: "${DOCKER_IMAGE_PROXY}/docker.io/hadolint/hadolint:v2.12.0-alpine"
  IMAGE_LICENSE_CHECK: "${DOCKER_IMAGE_PROXY}/docker.io/fsfe/reuse:6.2"
  IMAGE_TRIVY: "${DOCKER_IMAGE_PROXY}/docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c" # 0.69.3
  IMAGE_SBOM_HELPER: "registry.cern.ch/code-scanners/sbom-helper:latest"
  IMAGE_SBOMQS: "${DOCKER_IMAGE_PROXY}/ghcr.io/interlynk-io/sbomqs@sha256:500d5eca9fe4ce3616fdfaed67d877d638b3d52d31ad30bcba6b6cfd4c435767" # v2.0.11

  # Should be removed as soon as EOS triggers the CTA pipeline with the new inputs instead of legacy variables.
  PIPELINE_TYPE: "$[[ inputs.pipeline-type ]]"
  CUSTOM_EOS_IMAGE_TAG: "$[[ inputs.custom-eos-image-tag ]]"

  # Release tag selectors
  TAG_PGSCHED_REGEX: '/(^|\.)pgsched($|\.)/' # Postgres scheduler
  TAG_PGCAT_REGEX: '/(^|\.)pgcat($|\.)/' # Postgres catalogue (no Oracle)
  TAG_PGALL_REGEX: '/(^|\.)pgall($|\.)/' # Postgres scheduler + Postgres catalogue

  # Build and runtime defaults
  ENABLE_SBOM_GENERATION: "$[[ inputs.enable-sbom-generation ]]"
  SCHEDULER_TYPE: "$[[ inputs.scheduler-type ]]"
  ENABLE_ORACLE_SUPPORT: "$[[ inputs.enable-oracle-support ]]"
  BUILD_CTA_VERSION: "5"
  ENABLE_CCACHE: "false"
  BUILD_CACHE_POLICY: "pull"

  # Registry publishing configuration and credentials
  DOCKER_IMAGE_REGISTRY: "gitlab-registry.cern.ch"
  DOCKER_PRIVATE_REGISTRY_PREFIX: "cta/ctageneric"
  DOCKER_PUBLIC_REGISTRY_PREFIX: "cta/public_registry"
  DOCKER_PRIVATE_LOGIN_USERNAME: $DOCKER_LOGIN_USERNAME
  DOCKER_PRIVATE_LOGIN_PASSWORD: $DOCKER_LOGIN_PASSWORD
  DOCKER_PUBLIC_LOGIN_USERNAME: "nonempty" # Tokens don't require a username, but GitLab requires a non-empty value for this variable to be set
  DOCKER_PUBLIC_LOGIN_PASSWORD: $REGISTRYTOKEN_publicpush

  # Git checkout
  GIT_STRATEGY: "fetch"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GIT_DEPTH: "10"
  GIT_SUBMODULE_DEPTH: "1"

  # Artifact and cache performance
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_LEVEL: "fastest"

  # Runner and test reports
  FF_TIMESTAMPS: "true"
  TERM: "xterm-color"
  GTEST_COLOR: "yes"
  GTEST_REPORT_FILE: "$CI_PROJECT_DIR/test_report.xml"
  GTEST_OUTPUT: ""

default:
  image: $IMAGE_DEFAULT
  interruptible: true

workflow:
  name: '$CI_PIPELINE_SOURCE - $CI_COMMIT_SHORT_SHA - $[[ inputs.platform ]] - $PIPELINE_TYPE - $SCHEDULER_TYPE - Oracle:$ENABLE_ORACLE_SUPPORT'
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # PostgreSQL release variants
    - if: '$CI_COMMIT_TAG =~ $TAG_PGALL_REGEX'
      auto_cancel:
        on_new_commit: none
      variables:
        SCHEDULER_TYPE: "pgsched"
        ENABLE_ORACLE_SUPPORT: "false"
        ENABLE_SBOM_GENERATION: "true"
    - if: '$CI_COMMIT_TAG =~ $TAG_PGSCHED_REGEX'
      auto_cancel:
        on_new_commit: none
      variables:
        SCHEDULER_TYPE: "pgsched"
        ENABLE_SBOM_GENERATION: "true"
    - if: '$CI_COMMIT_TAG =~ $TAG_PGCAT_REGEX'
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_ORACLE_SUPPORT: "false"
        ENABLE_SBOM_GENERATION: "true"
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_SBOM_GENERATION: "true"
    # Allow scheduled, manual, and API-triggered pipeline-image refreshes on the selected ref.
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      auto_cancel:
        on_new_commit: none
    # Merge-request pipelines use a branch cache and publish test reports for comparison.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_MERGE_REQUEST_ID)
      changes:
        compare_to: "refs/heads/$CI_DEFAULT_BRANCH"
        paths:
          - '**/*'
      variables:
        ENABLE_CCACHE: "true"
        BUILD_CACHE_POLICY: "pull-push"
        CACHE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
        GTEST_OUTPUT: "xml:$GTEST_REPORT_FILE"
    # Default-branch push pipelines provide the target-branch test-report baseline.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "parent_pipeline")
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_CCACHE: "true"
        BUILD_CACHE_POLICY: "push"  # Ensure clean build and we only rebuild the cache for push events to prevent other pipeline types from screwing with it
        CACHE_BRANCH: '$CI_COMMIT_BRANCH'
        ENABLE_SBOM_GENERATION: "true"
        GTEST_OUTPUT: "xml:$GTEST_REPORT_FILE"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "trigger"
      auto_cancel:
        on_new_commit: none
    # Push events to main will still trigger the pipeline as per the previous rule
    # But we want to prevent dual pipelines on MRs
    - if: $CI_PIPELINE_SOURCE != "push"

include:
  - local: .gitlab/ci/.pre.gitlab-ci.yml
    inputs:
      custom-cta-image-tag: $[[ inputs.custom-cta-image-tag ]]
      custom-xrootd-version: $[[ inputs.custom-xrootd-version ]]
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/trigger.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      build-generator: $[[ inputs.build-generator ]]
      cmake-build-type: $[[ inputs.cmake-build-type ]]
      enable-address-sanitizer: $[[ inputs.enable-address-sanitizer ]]
      enable-sbom-generation: $[[ inputs.enable-sbom-generation ]]
      scheduler-type: $[[ inputs.scheduler-type ]]
      enable-oracle-support: $[[ inputs.enable-oracle-support ]]
      workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
      enable-valgrind: $[[ inputs.enable-valgrind ]]
      enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
      keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
  - local: .gitlab/ci/validate.gitlab-ci.yml
  - local: .gitlab/ci/lint.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/build.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      build-generator: $[[ inputs.build-generator ]]
      cmake-build-type: $[[ inputs.cmake-build-type ]]
      enable-address-sanitizer: $[[ inputs.enable-address-sanitizer ]]
  - local: .gitlab/ci/build-image.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
  - local: .gitlab/ci/tests.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      enable-valgrind: $[[ inputs.enable-valgrind ]]
  - local: .gitlab/ci/tests-kubernetes.gitlab-ci.yml
    inputs:
      custom-cta-image-tag: $[[ inputs.custom-cta-image-tag ]]
      workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
      enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
      keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
  - local: .gitlab/ci/sbom.gitlab-ci.yml
  - local: .gitlab/ci/release.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/report.gitlab-ci.yml
  - local: .gitlab/ci/.post.gitlab-ci.yml
