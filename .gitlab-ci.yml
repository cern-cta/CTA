spec:
  inputs:
    # =========================================================================
    # Pipeline execution and regression overrides
    # =========================================================================
    pipeline-type:
      description: "What kind of pipeline to run"
      type: string
      options:
        - "DEFAULT"
        - "REGR_AGAINST_CTA_BRANCH"
        - "REGR_AGAINST_CTA_VERSION"
        - "UPDATE_PIPELINE_IMAGES"
      default: "DEFAULT"

    # REGR_AGAINST_CTA_VERSION is retained as a backwards-compatible alias for REGR_AGAINST_CTA_BRANCH.
    custom-cta-image-tag:
      description: |-
        Existing CTA image tag to test instead of building CTA from the selected ref.

        Pipeline build example: `6-123456gitabcdef12.pgall.el9`.
        Published release example: `6.1.0-1.pgall.el9`.
        Existing image tags, including historical formats, are used verbatim.

        Leave empty to build the selected ref for the regression.
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    custom-eos-image-tag:
      description: |-
        Existing EOS image tag for regression pipelines.

        Pipeline build format: `COMMIT.PLATFORM`.
        Release format: `VERSION.PLATFORM`.

        Leave empty to use the latest EOS release selected by CTA.
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    custom-xrootd-version:
      description: |-
        XRootD RPM versionlock value for regression pipelines.

        Include the epoch, package release, and platform when applicable: `1:5.8.4-1.PLATFORM`.
        Leave empty to use the version declared by the selected CTA ref.
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_BRANCH" || $[[ inputs.pipeline-type ]] == "REGR_AGAINST_CTA_VERSION"'
          default: ""

    # =========================================================================
    # Build and architecture
    # =========================================================================
    platform:
      description: "Platform to build, test, and release on."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["el9", "el10", "debian13"]
          default: "el9"

    scheduler-type:
      description: "Scheduler implementation to build and test."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["pgsched", "objectstore"]
          default: "objectstore"

    compile-with-extra-telemetry:
      description: "Compile with telemetry instrumentation for stress test performance measurements."
      type: boolean
      default: false

    enable-oracle-support:
      description: "Enable Oracle support."
      # Boolean values cannot be conditionally hidden yet. See https://gitlab.com/gitlab-org/gitlab/-/issues/587643
      type: boolean
      default: true

    analysis:
      description: "C/C++ analysis mode: Valgrind or compiler sanitizers."
      type: string
      options: ["none", "valgrind", "address", "undefined", "address,undefined", "thread"]
      default: "none"

    cmake-build-type:
      description: "CMake build type for pipelines that compile CTA packages."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["Release", "Debug", "RelWithDebInfo", "MinSizeRel"]
          default: "RelWithDebInfo"

    enable-internal-repos:
      description: "Use internal yum repositories."
      type: boolean
      default: true

    build-generator:
      description: "Build generator for pipelines that compile CTA packages."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["Ninja", "Unix Makefiles"]
          default: "Ninja"

    enable-sbom-generation:
      description: "Generate an SBOM per image."
      type: boolean
      default: false

    # =========================================================================
    # Deployment
    # =========================================================================
    admin-api-authentication:
      description: "Admin API authentication used by CTA and EOS."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["jwt", "kerberos"]
          default: "jwt"

    workflow-api-authentication:
      description: "Workflow API authentication used by CTA and EOS."
      type: string
      rules:
        - if: '$[[ inputs.pipeline-type ]] != "UPDATE_PIPELINE_IMAGES"'
          options: ["jwt", "mtls"]
          default: "jwt"

    # =========================================================================
    # Testing
    # =========================================================================
    enable-dcache-tests:
      description: "Run dCache regression tests automatically."
      type: boolean
      default: false

    keep-stress-test-namespace:
      description: "Keep stress-test namespace for debugging."
      type: boolean
      default: false

    enable-opportunistic-batching:
      description: "pgsched only: opportunistically batch concurrent queueing requests into a single bulk DB insert instead of queueing them one at a time."
      type: boolean
      default: false

    use-stress-drives:
      description: |-
        Run the stress test with virtual StressDrives instead of mhvtl tape hardware.
        Drives are pure in-process software objects backed by a shared PVC directory;
        no SCSI devices, kernel modules, or rmcd are needed.
      type: boolean
      default: false

    num-stress-drives:
      description: |-
        Number of virtual drives for the stress-test job (use-stress-drives=true).
        Has no effect when use-stress-drives is false.
      type: number
      default: 2

    num-stress-libraries:
      description: |-
        Number of independent logical libraries for the stress-test job.
        Drives are split evenly across libraries; each library gets its own PVC.
        Has no effect when use-stress-drives is false.
      type: number
      default: 1

    num-stress-files:
      description: |-
        Total number of files to archive in the stress-test job.
        Can also be overridden per job run via the STRESS_TOTAL_FILES CI variable.
      type: number
      default: 2000000

    num-scale-drives:
      description: |-
        Number of virtual drives for the stress-scale-test job (always uses StressDrives).
        Can also be overridden per job run via the NUM_STRESS_DRIVES CI variable.
      type: number
      default: 100

    num-scale-libraries:
      description: |-
        Number of independent logical libraries for the stress-scale-test job.
        Can also be overridden per job run via the NUM_STRESS_LIBRARIES CI variable.
      type: number
      default: 4

    num-scale-files:
      description: |-
        Total number of files to archive in the stress-scale-test job.
        Can also be overridden per job run via the STRESS_TOTAL_FILES CI variable.
        If you substantially increase this value, verify the tape count
        (library.mediaTypes[0].count in fake-tape-library/values.yaml) is sufficient
        to hold all files (60 000 files/tape with the default capacity).
      type: number
      default: 10000000

    stress-prequeue-enabled:
      description: |-
        Whether to hold drives down until enough files are queued before starting transfers.
        Overrides the prequeue.enabled key in the test config TOML.
        Can also be overridden per job run via the STRESS_PREQUEUE_ENABLED CI variable (true/false).
      type: boolean
      default: true

    stress-prequeue-fraction:
      description: |-
        Fraction of total files that must be archive-queued before drives come up (e.g. 0.9).
        Overrides the prequeue.prequeue_fraction key in the test config TOML.
        Can also be overridden per job run via the STRESS_PREQUEUE_FRACTION CI variable.
      type: number
      default: 0.9

    stress-retrieve-prequeue-fraction:
      description: |-
        Fraction of total files that must be retrieve-queued before drives come up (e.g. 0.1).
        Keep low to bound the EOS WFE leaf directory and avoid scanner throughput collapse.
        Overrides the prequeue.retrieve_prequeue_fraction key in the test config TOML.
        Can also be overridden per job run via the STRESS_RETRIEVE_PREQUEUE_FRACTION CI variable.
      type: number
      default: 0.1

    use-pgbouncer:
      description: |-
        Route catalogue and scheduler DB connections through PgBouncer.
        Uses the pgbouncer-specific config files for both catalogue and scheduler.
        Has no effect when scheduler-type is not pgsched.
      type: boolean
      default: false
---

stages:
  - .pre
  - trigger
  - validate
  - lint
  - build
  - build:image
  - test
  - system-test
  - sbom
  - release
  - report
  - .post

# User-facing settings are defined as inputs. Internal variables expose their effective values to included templates
# when workflow rules may override the selected input.
variables:

  # Pipeline images
  # Updated by the weekly UPDATE_PIPELINE_IMAGES pipeline after every image has been built successfully
  PIPELINE_IMAGE_VERSION: "2026-10-26-16163779"
  DOCKER_IMAGE_PROXY: "registry.cern.ch"
  # Platform-specific images are tagged with the platform name to allow for multiple platforms to be built and tested in parallel
  IMAGE_BUILD: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-build:${PIPELINE_IMAGE_VERSION}.$[[ inputs.platform ]]"
  IMAGE_TEST: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-test:${PIPELINE_IMAGE_VERSION}.$[[ inputs.platform ]]"
  # Remaining images are shared across all platforms and do not have a platform suffix
  IMAGE_DEFAULT: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-default:${PIPELINE_IMAGE_VERSION}"
  IMAGE_LINT: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-lint:${PIPELINE_IMAGE_VERSION}"
  IMAGE_LINTIAN: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-lintian:${PIPELINE_IMAGE_VERSION}"
  IMAGE_RELEASE: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-release:${PIPELINE_IMAGE_VERSION}"
  IMAGE_DANGER: "gitlab-registry.cern.ch/cta/public_registry/container_registry/cta-ci-danger:${PIPELINE_IMAGE_VERSION}"
  # External images
  IMAGE_DOCKER_IMAGE_BUILDER: "${DOCKER_IMAGE_PROXY}/quay.io/buildah/stable:v1.43-immutable"
  IMAGE_DOCKER_LINT: "${DOCKER_IMAGE_PROXY}/docker.io/hadolint/hadolint:v2.12.0-alpine"
  IMAGE_LICENSE_CHECK: "${DOCKER_IMAGE_PROXY}/docker.io/fsfe/reuse:6.2"
  # Trivy does not use the proxy on purpose as registries.conf takes care of that during image building
  IMAGE_TRIVY: "docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"  # 0.69.3
  IMAGE_SBOM_HELPER: "registry.cern.ch/code-scanners/sbom-helper:latest"
  IMAGE_SBOMQS: "${DOCKER_IMAGE_PROXY}/ghcr.io/interlynk-io/sbomqs@sha256:500d5eca9fe4ce3616fdfaed67d877d638b3d52d31ad30bcba6b6cfd4c435767"  # v2.0.11

  # Should be removed as soon as EOS triggers the CTA pipeline with the new inputs instead of legacy variables.
  PIPELINE_TYPE: "$[[ inputs.pipeline-type ]]"
  CUSTOM_CTA_IMAGE_TAG: "$[[ inputs.custom-cta-image-tag ]]"
  CUSTOM_EOS_IMAGE_TAG: "$[[ inputs.custom-eos-image-tag ]]"

  # Build and runtime defaults
  ENABLE_SBOM_GENERATION: "$[[ inputs.enable-sbom-generation ]]"
  # Variant jobs forward scheduler/Oracle settings as variables, avoiding variable-to-boolean input validation.
  # Default to the inputs here, and let child variants override these effective build settings.
  SCHEDULER_TYPE: "$[[ inputs.scheduler-type ]]"
  ENABLE_ORACLE_SUPPORT: "$[[ inputs.enable-oracle-support ]]"
  ENABLE_SCCACHE: "false"
  BUILD_CACHE_POLICY: "pull"

  # Registry publishing configuration and credentials
  DOCKER_IMAGE_REGISTRY: "gitlab-registry.cern.ch"
  DOCKER_PIPELINE_REGISTRY_PREFIX: "cta/ctageneric"
  DOCKER_RELEASE_REGISTRY_PREFIX: "cta/eoscta-operations/registry/container_registry"
  # DOCKER_RELEASE_LOGIN_USERNAME/PASSWORD are dedicated GitLab CI secrets.
  DOCKER_PUBLIC_REGISTRY_PREFIX: "cta/public_registry"
  DOCKER_PIPELINE_LOGIN_USERNAME: $DOCKER_LOGIN_USERNAME
  DOCKER_PIPELINE_LOGIN_PASSWORD: $DOCKER_LOGIN_PASSWORD
  DOCKER_RELEASE_LOGIN_USERNAME: "nonempty"
  DOCKER_RELEASE_LOGIN_PASSWORD: $REGISTRY_TOKEN_OPERATIONS_PUSH
  DOCKER_PUBLIC_LOGIN_USERNAME: "nonempty"  # Tokens don't require a username, but GitLab requires a non-empty value for this variable to be set
  DOCKER_PUBLIC_LOGIN_PASSWORD: $REGISTRYTOKEN_publicpush

  # Git checkout
  GIT_STRATEGY: "fetch"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GIT_DEPTH: "10"
  GIT_SUBMODULE_DEPTH: "1"

  # Artifact and cache performance
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_LEVEL: "fastest"

  # Runner and test reports
  FF_TIMESTAMPS: "true"
  TERM: "xterm-color"
  # Include stack traces in UBSan diagnostics; compiler flags make findings fatal.
  UBSAN_OPTIONS: "print_stacktrace=1"
  GTEST_COLOR: "yes"
  GTEST_REPORT_FILE: "$CI_PROJECT_DIR/test_report.xml"
  GTEST_OUTPUT: ""

# Quick check that should run in every job so that we can easily skip a pipeline
.merge-train-guard:
  before_script:
    - |
      if [[ "$MERGE_TRAIN_DUPLICATE" == "true" ]]; then
        echo "Skipping duplicate merge-train workload."
        exit 0
      fi

default:
  image: $IMAGE_DEFAULT
  interruptible: true
  before_script:
    - !reference [.merge-train-guard, before_script]

workflow:
  name: '$CI_PIPELINE_SOURCE - $CI_COMMIT_SHORT_SHA - $[[ inputs.platform ]] - $PIPELINE_TYPE - $SCHEDULER_TYPE - Oracle:$ENABLE_ORACLE_SUPPORT - Analysis:$[[ inputs.analysis ]]'
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Generated documentation is published by the release job itself.
    - if: '$CI_COMMIT_BRANCH == "gl-pages"'
      when: never
    # Preserve push filtering for Debian while selecting its supported build variant.
    - if: '"$[[ inputs.platform ]]" == "debian13" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH !~ /^release\//'
      when: never
    # Debian currently supports package builds with the PostgreSQL scheduler only.
    - if: '"$[[ inputs.platform ]]" == "debian13" && $PIPELINE_TYPE == "DEFAULT"'
      variables:
        SCHEDULER_TYPE: "pgsched"
        ENABLE_ORACLE_SUPPORT: "false"
    - if: '"$[[ inputs.platform ]]" == "debian13"'
      when: never
    # Variant children forward their effective scheduler/Oracle configuration.
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_SBOM_GENERATION: "true"
    # Allow scheduled, manual, and API-triggered pipeline-image refreshes on the selected ref.
    - if: '$PIPELINE_TYPE == "UPDATE_PIPELINE_IMAGES"'
      auto_cancel:
        on_new_commit: none
    # Merge-request pipelines use a branch cache and publish test reports for comparison.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_MERGE_REQUEST_ID)
      changes:
        compare_to: "refs/heads/$CI_DEFAULT_BRANCH"
        paths:
          - '**/*'
      variables:
        ENABLE_SCCACHE: "true"
        BUILD_CACHE_POLICY: "pull-push"
        CACHE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
        GTEST_OUTPUT: "xml:$GTEST_REPORT_FILE"
    # Default-branch push pipelines provide the target-branch test-report baseline.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "parent_pipeline")
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_SCCACHE: "true"
        BUILD_CACHE_POLICY: "push"  # Ensure clean build and we only rebuild the cache for push events to prevent other pipeline types from screwing with it
        CACHE_BRANCH: '$CI_COMMIT_BRANCH'
        ENABLE_SBOM_GENERATION: "true"
        GTEST_OUTPUT: "xml:$GTEST_REPORT_FILE"
    # Maintenance commits need an exact-commit pipeline before RC/final tagging.
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "parent_pipeline")'
      auto_cancel:
        on_new_commit: none
      variables:
        ENABLE_SBOM_GENERATION: "true"
        GTEST_OUTPUT: "xml:$GTEST_REPORT_FILE"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "trigger"
      auto_cancel:
        on_new_commit: none
    # Other feature-branch pushes use merge-request pipelines instead.
    - if: $CI_PIPELINE_SOURCE != "push"

# Whether a job runs is controlled by two things:
# - The conditional file include below? The conditional includes are useful for skipping entire stages at once
# - The rules: section of the job
include:
  - local: .gitlab/ci/templates/common.gitlab-ci.yml
  - local: .gitlab/ci/.pre.gitlab-ci.yml
    inputs:
      custom-xrootd-version: $[[ inputs.custom-xrootd-version ]]
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/trigger.gitlab-ci.yml
    rules:
      - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE != "parent_pipeline"'
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
        when: never
      - when: always
    inputs:
      pipeline-type: $[[ inputs.pipeline-type ]]
      custom-eos-image-tag: $[[ inputs.custom-eos-image-tag ]]
      custom-xrootd-version: $[[ inputs.custom-xrootd-version ]]
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      build-generator: $[[ inputs.build-generator ]]
      cmake-build-type: $[[ inputs.cmake-build-type ]]
      analysis: $[[ inputs.analysis ]]
      enable-sbom-generation: $[[ inputs.enable-sbom-generation ]]
      scheduler-type: $[[ inputs.scheduler-type ]]
      enable-oracle-support: $[[ inputs.enable-oracle-support ]]
      compile-with-extra-telemetry: $[[ inputs.compile-with-extra-telemetry ]]
      admin-api-authentication: $[[ inputs.admin-api-authentication ]]
      workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
      enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
      keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
      use-stress-drives: $[[ inputs.use-stress-drives ]]
      num-stress-drives: $[[ inputs.num-stress-drives ]]
      num-stress-libraries: $[[ inputs.num-stress-libraries ]]
      num-scale-drives: $[[ inputs.num-scale-drives ]]
      num-scale-libraries: $[[ inputs.num-scale-libraries ]]
      num-scale-files: $[[ inputs.num-scale-files ]]
  - local: .gitlab/ci/validate.gitlab-ci.yml
    rules:
      - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "parent_pipeline"'
        when: never
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - if: '"$[[ inputs.pipeline-type ]]" != "UPDATE_PIPELINE_IMAGES"'
  - local: .gitlab/ci/lint.gitlab-ci.yml
    rules:
      - if: '$CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "parent_pipeline"'
        when: never
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      # Only lint in the default pipeline
      - if: '"$[[ inputs.pipeline-type ]]" == "DEFAULT"'
    inputs:
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/build.gitlab-ci.yml
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      build-generator: $[[ inputs.build-generator ]]
      cmake-build-type: $[[ inputs.cmake-build-type ]]
      analysis: $[[ inputs.analysis ]]
      compile-with-extra-telemetry: $[[ inputs.compile-with-extra-telemetry ]]
  - local: .gitlab/ci/build-image.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - when: always
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
  - local: .gitlab/ci/tests.gitlab-ci.yml
    rules:
      # Only run tests in the default pipeline
      - if: '"$[[ inputs.pipeline-type ]]" == "DEFAULT"'
    inputs:
      platform: $[[ inputs.platform ]]
      enable-internal-repos: $[[ inputs.enable-internal-repos ]]
      analysis: $[[ inputs.analysis ]]
  - local: .gitlab/ci/tests-kubernetes.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - if: '"$[[ inputs.pipeline-type ]]" != "UPDATE_PIPELINE_IMAGES"'
    inputs:
      custom-cta-image-tag: $[[ inputs.custom-cta-image-tag ]]
      admin-api-authentication: $[[ inputs.admin-api-authentication ]]
      workflow-api-authentication: $[[ inputs.workflow-api-authentication ]]
      enable-dcache-tests: $[[ inputs.enable-dcache-tests ]]
      keep-stress-test-namespace: $[[ inputs.keep-stress-test-namespace ]]
      enable-opportunistic-batching: $[[ inputs.enable-opportunistic-batching ]]
      use-stress-drives: $[[ inputs.use-stress-drives ]]
      num-stress-drives: $[[ inputs.num-stress-drives ]]
      num-stress-libraries: $[[ inputs.num-stress-libraries ]]
      num-stress-files: $[[ inputs.num-stress-files ]]
      num-scale-drives: $[[ inputs.num-scale-drives ]]
      num-scale-libraries: $[[ inputs.num-scale-libraries ]]
      num-scale-files: $[[ inputs.num-scale-files ]]
      stress-prequeue-enabled: $[[ inputs.stress-prequeue-enabled ]]
      stress-prequeue-fraction: $[[ inputs.stress-prequeue-fraction ]]
      stress-retrieve-prequeue-fraction: $[[ inputs.stress-retrieve-prequeue-fraction ]]
      use-pgbouncer: $[[ inputs.use-pgbouncer ]]
  - local: .gitlab/ci/sbom.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      # SBOMs are only relevant in the default pipeline
      - if: '"$[[ inputs.pipeline-type ]]" == "DEFAULT"'
  - local: .gitlab/ci/release.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
        when: never
      # Release stage only relevant in default pipeline
      - if: '"$[[ inputs.pipeline-type ]]" == "DEFAULT"'
    inputs:
      platform: $[[ inputs.platform ]]
  - local: .gitlab/ci/report.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
        when: never
      # Reporting is selected by pipeline source rather than pipeline type, so keep it available to regressions.
      - when: always
  - local: .gitlab/ci/.post.gitlab-ci.yml
    rules:
      - if: '"$[[ inputs.platform ]]" == "debian13"'
        when: never
      - when: always
