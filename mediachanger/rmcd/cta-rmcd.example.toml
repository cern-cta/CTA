####################################################################################################
#
# CTA Remote Media Changer Daemon Configuration
#
####################################################################################################


# Defaults documented below apply only in non-strict mode.
# Strict mode requires all applicable settings except genuinely optional values.
# Optional sections must match this list; unused sections are omitted.
enabled_features = []
# To enable telemetry, add "telemetry" above and supply [telemetry] with config_file and on_init_failure.
# Services supporting health checks can similarly enable "health_server" and configure its transport.

[media_changer]
  # The SCSI-compatible media changer device used by rmcd to control the tape library.
  # Set this to the operating-system path of the device.
  # If omitted, "/dev/smc" is used
  device = "/dev/smc"


# Configuration for the RMC protocol endpoint used by clients such as cta-taped.
# This is separate from the optional health server configured below.
[rmc_server]

  # TCP port on which rmcd listens for RMC client connections.
  # If omitted, 5014 is used.
  port = 5014

  # Network scope from which rmcd accepts RMC client connections.
  # Use "loopback" to accept connections only from localhost, or "any" to accept connections
  # from other hosts. The RMC protocol provides no authentication, so use "any" with extreme
  # caution in production environments.
  # If omitted, "loopback" is used
  listen_scope = "loopback"


[logging]
  # Logs with a level lower than the LogMask value will be masked. Possible values are EMERG, ALERT,
  # CRIT, ERR, WARNING, NOTICE (USERERR), INFO, DEBUG.
  # If omitted INFO is used.
  level = "INFO"

  # Log format. Possible values are "json" and "kv" (key-value).
  # If omitted json is used.
  format = "json"

  # The following key-value pairs are added to all log lines.
  # All keys are optional as this is purely for monitoring purposes.
  [logging.attributes]
    # Unique string to identify CTA's instance the rmcd process is serving (i.e: production, preproduction).
    instance = "production"
